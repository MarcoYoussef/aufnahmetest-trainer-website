function stepsExam(only){
  const steps=[];const used=new Set();
  for(const [area,list] of EXAM_PLAN){
    if(only&&!only.has(area))continue;
    let sec=[];
    for(const [cat,n] of list){
      if(n==='blk'){const m=genMemo(2);if(m){steps.push(...[]);sec.push({blk:[{k:'memo',html:m.memo,secs:m.secs,tid:m.tid,area}].concat(m.qs.map(q=>({k:'q',q:prep(Object.assign({lv:2},q,{tid:m.tid})),ctx:{type:'memo'},area})))});}}
      else if(n==='blk2'){for(const p of pickPassages(2,2,used))sec.push({blk:[{k:'read',title:p.title,text:p.text,n:p.qs.length,area}].concat(p.qs.map(q=>({k:'q',q:prep(q),ctx:{type:'text',title:p.title,text:p.text,hid:1},area})))});}
      else{
        const lvs=Array.from({length:n},rlv);
        const qs=GEN[cat]?lvs.map(lv=>genItem(cat,lv)).filter(Boolean):pickBank(cat,lvs,used);
        for(const q of qs)sec.push({one:{k:'q',q:prep(q),ctx:null,area}});
      }
    }
    steps.push({k:'intro',area});
    const singles=shuffle(sec.filter(x=>x.one));const blocks=sec.filter(x=>x.blk);
    for(const s of singles)steps.push(s.one);
    for(const b of blocks)steps.push(...b.blk);
  }
  return steps;
}

 ['Über dich','Warum haben Sie Ihre Lehre bzw. Ihren letzten Job beendet?','Ehrlich und sachlich, ohne über frühere Chefs zu schimpfen. Zeige, dass du bewusst entschieden hast und Verantwortung übernimmst.'],
 ['Über dich','Was sind Ihre Stärken?','Zwei bis drei Stärken, die zur Polizei passen (z. B. Ruhe unter Druck, Teamarbeit, Zuverlässigkeit), jeweils mit einem echten Beispiel aus Arbeit, Bundesheer oder Alltag.'],
 ['Über dich','Was sind Ihre Schwächen?','Eine echte, aber nicht berufsgefährdende Schwäche nennen und sagen, was du konkret dagegen tust. Keine Schein-Schwäche wie „Ich bin zu perfektionistisch“.'],
 ['Über dich','Wie würden Ihre Freunde Sie beschreiben?','Drei Eigenschaften mit kurzer Begründung. Passt idealerweise zu deinen genannten Stärken.'],
 ['Über dich','Was machen Sie in Ihrer Freizeit?','Sport, Vereine, Ehrenamt, Familie: zeige Ausgleich, Teamgeist und körperliche Fitness. Nur nennen, was stimmt, Nachfragen kommen.'],
 ['Über dich','Wie halten Sie sich körperlich fit?','Konkret werden: wie oft, was (Kraft, Ausdauer). Bei der ärztlichen Untersuchung gibt es eine Fahrradergometrie, Ausdauer ist also wichtig.'],
 ['Über dich','Erzählen Sie von einer Situation, in der Sie Verantwortung übernommen haben.','Aufbau: Situation – Aufgabe – was DU getan hast – Ergebnis. Ein echtes Beispiel, z. B. Erste Hilfe, Arbeit, Bundesheer.'],
 ['Motivation','Warum wollen Sie Polizist bzw. Polizistin werden?','Persönlicher Grund statt Floskel. Verbinde ein Erlebnis mit dem Beruf (helfen, Sicherheit, Verantwortung, Abwechslung). Keine Antwort wie „wegen der Waffe“ oder nur „sicherer Job“.'],
 ['Motivation','Warum gerade bei der Landespolizeidirektion Steiermark?','Heimatbezug, Kenntnis der Region, Bereitschaft, mindestens fünf Jahre im Bereich der LPD Steiermark Dienst zu machen. Zeige, dass du das weißt.'],
 ['Motivation','Was wissen Sie über die Ausbildung?','Grundausbildung dauert zwei Jahre im Bildungszentrum mit Praxisphasen, danach Dienst in einer Polizeiinspektion. Lies vorher die aktuelle Beschreibung auf polizeikarriere.gv.at.'],
 ['Motivation','Was machen Sie, wenn Sie nicht aufgenommen werden?','Zeige Ausdauer: Ursachen analysieren, gezielt üben und wieder bewerben (nicht bestandene Testteile kann man nach sechs Monaten wiederholen). Plan B nennen, ohne das Ziel aufzugeben.'],
 ['Motivation','Wo sehen Sie sich in zehn Jahren?','Realistisch: erfahrene Polizistin bzw. erfahrener Polizist in der Inspektion, Interesse an Weiterbildung oder Spezialisierung. Nicht schon den Posten der Kommission wollen.'],
 ['Motivation','Haben Sie sich auch woanders beworben?','Ehrlich bleiben. Wenn ja: Polizei ist erste Wahl, mit Begründung.'],
 ['Polizeiberuf','Welche Aufgaben hat die Polizei?','Gefahren abwehren, Straftaten aufklären, Verkehrsüberwachung, Hilfe leisten, Streitschlichtung, Prävention. Mit Beispielen aus dem Alltag einer Inspektion.'],
 ['Polizeiberuf','Was sind für Sie die Schattenseiten des Berufs?','Schicht- und Wochenenddienst, Belastung durch Unfälle und Gewalt, Kritik in der Öffentlichkeit, Gefahr. Zeige, dass du das realistisch siehst und wie du damit umgehst.'],
 ['Polizeiberuf','Wie gehen Sie mit Nacht- und Wochenenddiensten um?','Bewusst gewählt, Familie und Freunde wissen Bescheid, Schlaf und Sport planen. Kein Jammern, kein Schönreden.'],
 ['Polizeiberuf','Wie gehen Sie mit belastenden Erlebnissen um?','Darüber reden (Kollegen, Familie), Sport als Ausgleich, Hilfe annehmen. Hilfe zu holen ist Stärke, nicht Schwäche.'],
 ['Polizeiberuf','Was bedeutet für Sie Teamarbeit im Streifendienst?','Aufeinander verlassen, Absprachen, Eigensicherung, Fehler offen ansprechen. Beispiel aus Arbeit oder Bundesheer.'],
 ['Polizeiberuf','Was erwarten Sie sich von Ihren Vorgesetzten?','Klare Aufträge, Rückmeldung, Fairness. Und was du selbst einbringst: Zuverlässigkeit, Lernbereitschaft.'],
 ['Situationen','Ein Kollege nimmt bei einer Amtshandlung Geld an. Was tun Sie?','Klar: nicht wegschauen, Vorfall melden. Korruption zerstört Vertrauen in die Polizei. Kein Herumdrucksen.'],
 ['Situationen','Sie werden bei einer Kontrolle beschimpft. Wie reagieren Sie?','Ruhig und sachlich bleiben, nicht persönlich nehmen, deeskalieren, professionell weiterarbeiten. Eigene Emotionen kontrollieren.'],
 ['Situationen','Ein guter Freund begeht vor Ihren Augen eine Straftat. Was machen Sie?','Als Polizist gilt das Gesetz für alle. Zeige, dass Freundschaft keine Ausnahme rechtfertigt.'],
 ['Situationen','Sie kommen als Erste bzw. Erster zu einem Verkehrsunfall mit Verletzten. Was tun Sie?','Ablauf: Eigenschutz und Absichern, Notruf, Erste Hilfe, Überblick behalten, Zeugen sichern. Ruhig strukturiert aufzählen.'],
 ['Situationen','Ein Vorgesetzter gibt eine Anweisung, die Sie für falsch halten. Was tun Sie?','Bedenken sachlich ansprechen, bei klar rechtswidrigen Anweisungen nicht befolgen und melden. Sonst Entscheidung respektieren.'],
 ['Situationen','Zwei Personen streiten lautstark auf der Straße. Wie gehen Sie vor?','Eigensicherung, ruhig ansprechen, Parteien trennen, beide anhören, beruhigen, Sachverhalt klären. Deeskalation vor Zwang.'],
 ['Situationen','Ein Bürger beschwert sich unfreundlich über die Polizei. Was sagen Sie?','Zuhören, ernst nehmen, sachlich erklären, auf Beschwerdemöglichkeiten hinweisen. Freundlich bleiben.'],
 ['Situationen','Sie haben im Dienst einen Fehler gemacht. Was tun Sie?','Sofort zugeben und melden, Schaden begrenzen, daraus lernen. Ehrlichkeit ist im Polizeidienst Pflicht.'],
 ['Werte und Haltung','Was bedeutet für Sie Gerechtigkeit?','Gleiche Regeln für alle, Menschen respektvoll und ohne Vorurteile behandeln. Bezug zum Gleichheitsgrundsatz.'],
 ['Werte und Haltung','Wie gehen Sie mit Menschen aus anderen Kulturen um?','Respekt, Offenheit, gleiche Behandlung. Österreich ist vielfältig, Vorurteile haben im Dienst keinen Platz. Eigenes Beispiel bringt Punkte.'],
 ['Werte und Haltung','Was halten Sie von Social Media im Zusammenhang mit dem Polizeiberuf?','Zurückhaltung: keine Einsatzfotos, keine Details aus dem Dienst, Amtsverschwiegenheit. Auch privat auf das Bild der Polizei achten.'],
 ['Werte und Haltung','Wie stehen Sie zu Alkohol und Drogen?','Klar und ehrlich: verantwortungsvoller Umgang, keine Drogen, kein Alkohol am Steuer. Polizei ist Vorbild.'],
 ['Werte und Haltung','Was bedeutet Gewaltmonopol des Staates?','Nur der Staat darf unter gesetzlichen Bedingungen Zwang ausüben. Die Polizei setzt ihn verhältnismäßig ein, so wenig wie möglich, so viel wie nötig.'],
 ['Werte und Haltung','Was verstehen Sie unter Verhältnismäßigkeit?','Das gelindeste noch zum Ziel führende Mittel wählen. Beispiel: erst ansprechen, dann auffordern, erst dann Zwang.'],
 ['Region und Wissen','Was wissen Sie über die Steiermark?','Landeshauptstadt Graz, Bezirke, Regionen (z. B. Obersteiermark, Südsteiermark), Wirtschaft, Tourismus. Nutze dafür den Bereich „Steiermark“ in dieser App.'],
 ['Region und Wissen','Welche aktuellen Themen beschäftigen die Polizei Ihrer Meinung nach?','Vorher Nachrichten lesen (z. B. Cybercrime, Verkehrssicherheit, Prävention). Sachlich bleiben, keine Parteipolitik.'],
 ['Region und Wissen','Wie ist die Polizei in Österreich organisiert?','Innenministerium, Landespolizeidirektionen in jedem Bundesland, Bezirks- und Stadtpolizeikommanden, Polizeiinspektionen. Nutze den Bereich „Polizei, Recht, Verkehr“.'],
 ['Abschluss','Haben Sie noch Fragen an uns?','Immer ein bis zwei vorbereitete Fragen haben, z. B. zum Ablauf der Grundausbildung oder zur Einteilung danach. Nicht nach Gehalt als einzige Frage.'],
 ['Abschluss','Warum sollten wir gerade Sie nehmen?','Kurz zusammenfassen: Motivation, passende Stärken mit Beleg, Belastbarkeit, Bindung an die Region. Selbstbewusst, nicht überheblich.']
];

  <div class="card"><b>Bewerbung</b><p class="sub" style="margin:4px 0 0">Nur online über die <b>Jobbörse der Republik Österreich</b>, auf eine konkrete Ausschreibung der Landespolizeidirektion Steiermark. Ist gerade keine offen, gib eine <b>Interessensbekundung</b> ab, dann wirst du per E-Mail verständigt. Hochladen: Lebenslauf und gegebenenfalls Fotos von Tätowierungen. Nur eine Landespolizeidirektion pro Bewerbung.</p></div>
  <div class="card"><b>Zeitplan (offizielles Schema)</b><table class="t tl" style="margin-top:6px"><tr><td>Monat 1</td><td>Online-Bewerbung</td></tr><tr><td>Monat 1–4</td><td>Testtag 1 und Testtag 2</td></tr><tr><td>Ende Monat 4</td><td>Einberufung (spätestens 1 Monat vor Beginn)</td></tr><tr><td>Monat 6</td><td>Beginn der 24-monatigen Grundausbildung</td></tr></table>
  <p class="sub small" style="margin:8px 0 0">Typischer Rhythmus (nicht verbindlich): Bewerbung Oktober → Aufnahme März, Jänner → Juni, April → September, Juli → Dezember. Konkrete Termine stehen in der jeweiligen Ausschreibung.</p></div>

  <p class="sub" style="margin:6px 0 0"><b>Klinisch-psychiatrisches Verfahren</b> am Computer: bildet Persönlichkeitsmerkmale und Risikoverhalten ab. Antworte ehrlich und spontan. Dieser Teil lässt sich nicht üben.</p></div>
  <div class="card"><b>Testtag 2</b><p class="sub" style="margin:4px 0 0"><b>Ärztliche Untersuchung:</b> Harn, Seh- und Hörtest, Größe und Gewicht, EKG, Spirometrie, Fahrradergometrie, klinische Untersuchung. Tipp: Ausdauer trainieren, ausgeschlafen kommen.</p>

  <div class="card"><b>Fristen und Wiederholung</b><ul class="sub" style="margin:6px 0 0;padding-left:18px"><li>Testergebnisse gelten 12 Monate ab dem ersten Testtag, bundesweit.</li><li>Nicht bestandene Teile der psychologischen Eignungsdiagnostik: einmalig nach 6 Monaten wiederholbar.</li><li>Aufnahmegespräch negativ: neue Bewerbung nach 12 Monaten.</li><li>Fehlende oder falsche Angaben in der Sicherheitserklärung: 12 Monate Sperre.</li><li>Nach der Grundausbildung mindestens 5 Jahre Dienst im Bereich der aufnehmenden Landespolizeidirektion.</li></ul></div>

  <p class="note">Stand: polizeikarriere.gv.at, November 2026. Regeln können sich ändern, maßgeblich ist immer die offizielle Seite und die Ausschreibung. Es gibt dort keinen eigenen Sporttest, die Fitness wird bei der Fahrradergometrie geprüft.</p>`;

function daysLeft(){if(!ST.tdate)return null;const t=new Date(ST.tdate+'T00:00:00');const n=new Date();n.setHours(0,0,0,0);return Math.round((t-n)/DAY);}
/* ===================== Fehleranalyse, Wochenbericht, Lernmethoden ===================== */
const PRACT_MODES=['practice','daily','wrong','bm','focus'];
const TIDTIP={'Zahlenreihe fortsetzen':'Schreibe die Abstände zwischen den Zahlen auf. Prüfe, ob sie gleich bleiben, wachsen oder sich zwei Regeln abwechseln.','Lücke in Zahlenreihe':'Bestimme die Regel aus den Gliedern links und rechts der Lücke und prüfe sie an der ganzen Reihe.','Buchstabenreihen':'Ersetze Buchstaben durch ihre Position im Alphabet (A=1, B=2 …) und rechne wie bei Zahlenreihen.','Figurenreihen':'Verfolge jedes Merkmal einzeln: Position, Füllung, Form.','Zahlenmatrizen':'Prüfe die Regel in den vollständigen Zeilen und Spalten, bevor du die Lücke füllst.','Drehen und Spiegeln':'Verfolge ein einzelnes Feld (z. B. die Ecke oben links) Schritt für Schritt durch Spiegeln und Drehen.','Würfelnetze':'Gegenüberliegende Flächen liegen im Netz nie direkt nebeneinander. Ein Netz hat genau 6 Felder.','Himmelsrichtungen drehen':'Rechts = im Uhrzeigersinn: N → O → S → W. 90° ist eine Richtung weiter, 45° eine Zwischenrichtung.','Wege und Himmelsrichtungen':'Rechne Nord-Süd und Ost-West getrennt zusammen, dann kehre die Richtung um.','Kennzeichen-Fahndung':'Erst den Bezirk vergleichen, dann die Zahl, dann die Buchstaben. Achte auf vertauschte Ziffern.','Zeichenfolgen vergleichen':'Vergleiche Zeichen für Zeichen von links nach rechts, nicht das ganze Wortbild.','Buchstaben zählen':'Gehe Zeile für Zeile mit dem Finger mit und zähle leise mit.','Zahlen mit Bedingung zählen':'Prüfe jede Zahl einzeln gegen die Bedingung, nicht schätzen.','Einsatzmeldung merken':'Merke dir die Meldung als kleine Geschichte: wer, wann, wo, wie geflüchtet.','Zahlenfolgen merken':'Teile lange Zahlen in Zweier- oder Dreiergruppen.','Wortlisten merken':'Verbinde die Wörter zu einer Geschichte oder einem Weg durch deine Wohnung.','Personen, Orte, Zahlen merken':'Bilde für jede Person ein Bild mit Ort und Zahl.'};
function logOf(days){const L=ST.log||[];if(!days)return L;const t0=Date.now()-days*DAY;return L.filter(e=>e.t>=t0);}
const accOf=a=>a.length?a.reduce((s,e)=>s+e.o,0)/a.length:null;
const median=a=>{if(!a.length)return 0;const b=a.slice().sort((x,y)=>x-y);return b[Math.floor(b.length/2)];};
function weakTopics(){
  const L=(ST.log||[]).filter(e=>e.m!=='retry').slice(-800);const g={};
  for(const e of L){const k=e.c+'|'+e.g;const x=g[k]||(g[k]={c:e.c,g:e.g,n:0,w:0,last:null});x.n++;if(!e.o){x.w++;x.last=e;}}
  return Object.values(g).filter(x=>x.w>=2&&x.w/x.n>=.25).sort((a,b)=>(b.w*b.w/b.n)-(a.w*a.w/a.n)).slice(0,5);
}
function topicRule(x){
  if(x.last&&x.last.i&&QBYID[x.last.i])return {src:'Erklärung zu deiner letzten falschen Aufgabe',txt:QBYID[x.last.i].e};
  return {src:'So gehst du vor',txt:TIDTIP[x.g]||TIPS[x.c]||''};
}
function patterns(){
  const L=(ST.log||[]).filter(e=>e.m!=='retry'),out=[];
  const fast=L.filter(e=>e.m==='exam'||e.m==='blitz'),calm=L.filter(e=>PRACT_MODES.includes(e.m));
  if(fast.length>=10&&calm.length>=10){const a=accOf(fast),b=accOf(calm),d=Math.round(100*(b-a));
    out.push(d>=10?{t:'Unter Zeitdruck schwächer',d:`Unter Zeitdruck ${pct(a)} % richtig, beim normalen Üben ${pct(b)} %. Übe öfter mit der Blitzrunde und der Probeprüfung.`,bad:1}:{t:'Zeitdruck macht dir wenig aus',d:`Unter Zeitdruck ${pct(a)} %, beim Üben ${pct(b)} % richtig.`});}
  else out.push({t:'Zeitdruck',d:'Noch zu wenig Daten. Mach mindestens 10 Aufgaben in Blitzrunde oder Probeprüfung und 10 beim normalen Üben.',nd:1});
  const W=L.filter(e=>!e.o&&e.d>0&&e.d<600000).map(e=>e.d),R=L.filter(e=>e.o&&e.d>0&&e.d<600000).map(e=>e.d);
  if(W.length>=8&&R.length>=8){const mw=median(W),mr=median(R),f=s=>Math.round(s/1000)+' s';
    if(mw<mr*.6)out.push({t:'Zu schnell bei Fehlern',d:`Bei falschen Antworten brauchst du im Mittel ${f(mw)}, bei richtigen ${f(mr)}. Viele Fehler sind wohl Flüchtigkeitsfehler: Aufgabe ganz lesen, dann antworten.`,bad:1});
    else if(mw>mr*1.6)out.push({t:'Viel Zeit bei schweren Aufgaben',d:`Bei falschen Antworten brauchst du im Mittel ${f(mw)}, bei richtigen ${f(mr)}. Im Test gilt: Wenn du nach etwa einer Minute nicht weiterkommst, triff eine Wahl und mach weiter.`,bad:1});
    else out.push({t:'Tempo passt',d:`Richtige Antworten im Mittel ${f(mr)}, falsche ${f(mw)}. Kein auffälliges Muster.`});}
  else out.push({t:'Tempo',d:'Noch zu wenig Daten (mindestens 8 richtige und 8 falsche Antworten).',nd:1});
  const C=L.filter(e=>e.f===2),G=L.filter(e=>e.f===0);
  if(C.length>=8){const w=C.filter(e=>!e.o).length/C.length;

function stepsFocus(cat,g){
  const out=[];const L=curLevel(cat);
  if(cat==='tv'){const ps=PASS.filter(p=>p.qs.some(q=>q.tag===g)).sort(()=>Math.random()-.5).slice(0,2);
    for(const p of ps)for(const q of p.qs)out.push({k:'q',q:prep(q),ctx:{type:'text',title:p.title,text:p.text}});return out;}
  if(cat==='me'){for(let i=0;i<300;i++){const m=genME(L);if(m&&TIDN[m.tid]===g){out.push({k:'memo',html:m.memo,secs:m.secs,tid:m.tid});for(const q of m.qs)out.push({k:'q',q:prep(Object.assign({lv:L},q,{tid:m.tid})),ctx:{type:'memo'}});break;}}return out;}
  if(GEN[cat]){const lvs=levelMix(L,10);for(let i=0;i<600&&out.length<10;i++){const q=genItem(cat,lvs[out.length]);if(q&&tagOf(q)===g)out.push({k:'q',q:prep(q),ctx:null});}return out;}
  const pool=(BANKBY[cat]||[]).filter(q=>q.tag===g);
  const sc=q=>{const b=ST.box[q.id];return (!b?1:isWrong(q.id)?3:b[1]<=Date.now()?2:0)+Math.random();};
  return pool.slice().sort((a,b)=>sc(b)-sc(a)).slice(0,10).map(q=>({k:'q',q:prep(q),ctx:null}));
}

  const W=weakTopics().slice(0,3),R=readiness(),dl=daysLeft();

  return h;
}

/* ---------- Navigation ---------- */
function go(v,arg){stopTimers();S=null;view=v;viewArg=arg||null;notice='';confirmReset=false;confirmImport=false;render();window.scrollTo(0,0);}
function renderNav(){
    const tab=S?null:({home:'home',learn:'learn',cat:'learn',exam:'exam',more:'more',stats:'more',backup:'more',settings:'more',info:'more',interview:'more',ablauf:'more',analyse:'home',woche:'home',methoden:'more',karten:'learn',notizen:'more'})[view];
  if(S){$nav.style.display='none';document.querySelector('.wrap').classList.add('nonav');return;}
  $nav.style.display='flex';document.querySelector('.wrap').classList.remove('nonav');
  const items=[['home','Start'],['learn','Üben'],['exam','Prüfung'],['more','Mehr']];
  $nav.innerHTML=items.map(([id,l])=>`<button data-go="${id}" class="${tab===id?'on':''}" ${tab===id?'aria-current="page"':''}>${ICON[id]}<span>${l}</span></button>`).join('');
}
function render(){
  renderNav();
  let h='';

  else if(view==='cat')h=viewCat(viewArg);
  else if(view==='exam')h=viewExam();
  else if(view==='more')h=viewMore();
  else if(view==='stats')h=viewStats();
  else if(view==='backup')h=viewBackup();
  else if(view==='settings')h=viewSettings();
  else if(view==='info')h=viewInfo();
  else if(view==='interview')h=viewInterview();
  else if(view==='ablauf')h=viewAblauf();
  else if(view==='analyse')h=viewAnalyse();
  else if(view==='woche')h=viewWoche();
  else if(view==='methoden')h=viewMethoden();
  else if(view==='karten')h=viewKarten();
  else if(view==='notizen')h=viewNotizen();
  if(notice&&!S)h=`<div class="warnbox" role="status">${esc(notice)}</div>`+h;
  $app.innerHTML=h;syncTop();
  if(S&&!S.done&&S.steps[S.i]&&S.steps[S.i].k==='q'&&S.qIdx!==S.i){S.qIdx=S.i;S.qT0=Date.now();}
  if(S&&!S.done&&!S.confirmExit){const a=document.getElementById('ans');if(a)setTimeout(()=>{try{a.focus({preventScroll:true});}catch(e){}},30);}
}

/* ---------- Start ---------- */
function areaBlock(r){
  const a=AREA[r.id];
  const has=r.n>=MINN;
  return `<div class="area"><span>${esc(a.t)}</span><b>${has?pct(r.score)+' %':'<span class="sub">'+r.n+' / '+MINN+' Aufgaben</span>'}</b><div class="bar ${has?barCls(r.score):''}" role="img" aria-label="${esc(a.t)}"><i style="width:${has?pct(r.score):Math.round(100*r.n/MINN)}%${has?'':';background:var(--mute)'}"></i></div></div>`;
}
function ring(frac,big,small){
  const r=38,c=2*Math.PI*r,f=Math.max(0,Math.min(1,frac));
  return `<div class="ring" role="img" aria-label="${esc(big+' '+small)}"><svg viewBox="0 0 92 92" aria-hidden="true"><circle cx="46" cy="46" r="${r}" fill="none" stroke="var(--track)" stroke-width="10"/>${f>0?`<circle cx="46" cy="46" r="${r}" fill="none" class="pr" stroke="${f>=1?'var(--ok)':'var(--tint)'}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${(c*f).toFixed(1)} ${c.toFixed(1)}"/>`:''}</svg><div class="rv" aria-hidden="true">${big}<small>${small}</small></div></div>`;
}

function catCard(c){
  const r=catScore(c.id),L=curLevel(c.id),cnt=c.gen?'unbegrenzt':bankCount(c.id)+' Fragen';

  <div class="st"><span>${r.n?r.n+' beantwortet · '+pct(r.acc||0)+' % richtig':'noch nicht geübt'}</span><span>${cnt}</span></div></button>`;
}

  let h='<h1 class="lt">Üben</h1><p class="sub" style="margin-top:2px">Die Schwierigkeit passt sich automatisch an dich an.</p>';

function viewCat(id){
  const c=CAT[id],r=catScore(id),L=curLevel(id),man=isManual(id),lw=(ST.lvl[id]&&ST.lvl[id].win)||[];
  let mastered=0,seen=0,total=bankCount(id);
  if(!c.gen){const list=id==='tv'?PASS.flatMap(p=>p.qs):(BANKBY[id]||[]);for(const q of list){const b=ST.box[q.id];if(b){seen++;if(b[0]>=4)mastered++;}}}

  <p class="sub small" style="margin:4px 0 0">${man?'Feste Stufe: Es wird nichts automatisch angepasst.':`Automatisch: Bei 8 von 10 richtig auf der aktuellen Stufe geht es hinauf, bei höchstens 4 von 10 hinunter. Aktuell: ${lw.length?lw.reduce((a,b)=>a+b,0)+' von '+lw.length+' richtig':'noch keine Aufgabe auf dieser Stufe'}.`}</p></div>`;
  h+=`<div class="card"><b>Deine Zahlen</b><table class="t" style="margin-top:6px"><tr><td>Beantwortet</td><td>${r.n}</td></tr><tr><td>Trefferquote (letzte 40)</td><td>${r.acc==null?'–':pct(r.acc)+' %'}</td></tr>${c.gen?'':`<tr><td>Fragen gesehen</td><td>${seen} von ${total}</td></tr><tr><td>Sicher gelernt</td><td>${mastered} von ${total}</td></tr>`}</table></div>`;

  return h;
}

function viewStats(){
  let h='<button class="back" data-go="more">Mehr</button><h1 class="lt">Statistik</h1>';
  h+=`<div class="card flat"><table class="t"><tr><th>Bereich</th><th>Antw.</th><th>Quote</th><th>Stufe</th></tr>`+CATS.map(c=>{const r=catScore(c.id);return `<tr><td>${esc(c.t)}</td><td>${r.n}</td><td>${r.acc==null?'–':pct(r.acc)+' %'}</td><td>${curLevel(c.id)}</td></tr>`;}).join('')+`</table></div>`;
  const days=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);days.push([d,ST.days[dkey(d)]||0]);}
  const mx=Math.max(10,...days.map(x=>x[1]));
  h+=`<div class="card"><b>Letzte 7 Tage</b><div style="display:flex;gap:6px;align-items:flex-end;height:90px;margin-top:8px">`+days.map(([d,n])=>`<div style="flex:1;text-align:center;font-size:12px"><div style="height:${Math.round(60*n/mx)}px;background:${n>=STREAK_MIN?'var(--ok)':'var(--navy)'};border-radius:4px 4px 0 0;min-height:${n?3:0}px"></div><div class="sub" style="font-size:11px">${n}</div><div class="sub" style="font-size:11px">${['So','Mo','Di','Mi','Do','Fr','Sa'][d.getDay()]}</div></div>`).join('')+`</div></div>`;
  if(ST.blitz&&ST.blitz.length){const best=ST.blitz.reduce((a,b)=>b.ok>a.ok?b:a);h+=`<div class="card"><b>Blitzrunde</b><p class="sub" style="margin:4px 0 0">Bestwert: ${best.ok} richtige in 3 Minuten (${best.n} beantwortet). Letzte Runde: ${ST.blitz[ST.blitz.length-1].ok} richtige.</p></div>`;}
  const all=Object.values(ST.box).length,safe=Object.values(ST.box).filter(b=>b[0]>=4).length;
  h+=`<div class="card"><b>Fragenbank</b><p class="sub" style="margin:4px 0 0">Gesehen: ${all} von ${Object.keys(QBYID).length}. Sicher gelernt (Box 5 erreicht): ${safe}.</p></div>`;

  return h;

/* ---------- Sitzung ---------- */
function withReads(steps){
  const out=[];
  for(let i=0;i<steps.length;i++){
    const st=steps[i],c=st&&st.k==='q'&&st.ctx&&st.ctx.type==='text'?st.ctx:null;
    if(c){const pv=out[out.length-1];const cont=pv&&((pv.k==='read'&&pv.title===c.title)||(pv.k==='q'&&pv.ctx&&pv.ctx.type==='text'&&pv.ctx.title===c.title));
      if(!cont){let n=0;while(i+n<steps.length&&steps[i+n].k==='q'&&steps[i+n].ctx&&steps[i+n].ctx.type==='text'&&steps[i+n].ctx.title===c.title)n++;
        out.push({k:'read',title:c.title,text:c.text,n,area:st.area});}}
    out.push(st);
  }
  return out;
}
function startSession(mode,label,steps,extra){
  stopTimers();if(steps&&steps.length)steps=withReads(steps);
  if(!steps||!steps.length){notice='Dafür sind gerade keine Aufgaben verfügbar.';render();return;}
  S=Object.assign({mode,label,steps,i:0,res:[],cur:null,sel:null,t0:Date.now(),memoLeft:0,events:[],done:false,confirmExit:false,back:view,backArg:viewArg},extra||{});
  if(mode==='exam'||mode==='blitz'){S.endAt=S.t0+(mode==='exam'?(S.perArea?(Object.values(AREA_MIN).reduce((a,b)=>a+b,0)+10):EXAM_MIN)*60:BLITZ_SEC)*1000;timers.push(setInterval(examTick,1000));examTick();}
  enterStep();render();window.scrollTo(0,0);
}
function examTick(){
  if(!S||!S.endAt||S.done){return;}
  if(S.perArea){
    const st=S.steps[S.i];
    if(!S.areaEnd||(st&&st.k==='intro')){$clock.textContent=S.areaEnd?'':fmtT(AREA_MIN[st&&st.area||'logik']*60);$clock.classList.remove('low');return;}
    const al=(S.areaEnd-Date.now())/1000;$clock.textContent=fmtT(al);$clock.classList.toggle('low',al<=60);
    if(al<=0){S.areaEnd=0;let j=S.i+1;while(j<S.steps.length&&S.steps[j].k!=='intro')j++;S.skipped=(S.skipped||0)+S.steps.slice(S.i,j).filter(x=>x.k==='q').length;if(j>=S.steps.length){finishSession(true);return;}S.cur=null;S.sel=null;S.i=j;enterStep();render();window.scrollTo(0,0);}
    return;
  }
  const left=(S.endAt-Date.now())/1000;
  $clock.textContent=fmtT(left);$clock.classList.toggle('low',left<=(S.mode==='blitz'?30:300));
  if(left<=0){finishSession(true);}
}
function enterStep(){
  const st=S.steps[S.i];
  if(st&&st.k==='memo'){
    S.memoLeft=st.secs;
    const id=setInterval(()=>{
      if(!S||S.done){clearInterval(id);return;}
      S.memoLeft--;
      const el=document.getElementById('mleft');if(el)el.textContent=S.memoLeft+' s';
      if(S.memoLeft<=0){clearInterval(id);advance();}
    },1000);
    timers.push(id);
  }
}
function advance(){
  ttsStop();if(S)S.noteOpen=false;
  if(S.perArea&&S.steps[S.i]&&S.steps[S.i].k==='intro'){S.areaEnd=Date.now()+AREA_MIN[S.steps[S.i].area]*60000;}
  if(S.perArea&&S.steps[S.i+1]&&S.steps[S.i+1].k==='intro')S.areaEnd=0;
  S.cur=null;S.sel=null;S.i++;
  if(S.i>=S.steps.length){finishSession(false);return;}
  enterStep();render();window.scrollTo(0,0);
}
function skipMemo(){timers.filter((t,i)=>i>0||S.mode!=='exam').forEach(()=>{});advance();}
const fastMode=()=>S&&(S.mode==='exam'||S.mode==='blitz');
const askConf=()=>!fastMode()&&!!(ST.set&&ST.set.conf);
function submit(given,conf){
  if(S.cur||S.done)return;
  const st=S.steps[S.i];if(!st||st.k!=='q')return;
  const q=st.q;
  if(q.t!=='mc'&&!Array.isArray(given)&&String(given).trim()==='')return;
  const ok=checkAnswer(q,given);
  const ms=Math.min(600000,Date.now()-(S.qT0||Date.now()));
  const help=(S.help&&S.help[S.i])||0,err=ok?'':errType(q,given,conf,ms);
  const ch=recordAnswer(q,ok,S.mode,{ms,conf,retry:!!st.re,pos:qIndex(),help,err});
  S.res.push({q,given,ok,area:st.area||CAT[q.cat].area||null,ctx:st.ctx,retry:!!st.re,conf,help,err});
  if(ch)S.events.push({cat:q.cat,dir:ch.dir,lv:ch.lv});
  if(fastMode()){advance();return;}
  /* Abrufübung: falsch beantwortete Aufgabe kommt in dieser Runde nach ein paar anderen noch einmal */
  if(!ok&&!st.re){const pos=Math.min(S.steps.length,S.i+4);S.steps.splice(pos,0,Object.assign({},st,{q:prep(q),re:1}));}
  feedback(ok);
  S.cur={given,ok,ch,conf,err};S.hist=S.hist||{};S.hist[S.i]={cur:S.cur,hid50:S.hid50,kz:S.kz};render();
}
/* Ton als Rückmeldung (Vibration gibt es in Webseiten auf dem iPhone nicht) */
let AC=null;
let HL=null;
function haptic(n){
  try{if(!HL){HL=document.createElement('label');HL.setAttribute('aria-hidden','true');HL.style.cssText='position:absolute;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none;left:-9999px';const i=document.createElement('input');i.type='checkbox';i.setAttribute('switch','');i.tabIndex=-1;HL.appendChild(i);document.body.appendChild(HL);}
    HL.click();if(n>1)setTimeout(()=>{try{HL.click();}catch(e){}},130);}catch(e){}
}
function feedback(ok){
  if(ST.set&&ST.set.hapt)haptic(ok?1:2);
  if(!(ST.set&&ST.set.sound))return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
    const t=AC.currentTime,notes=ok?[[660,0],[880,.09]]:[[220,0]];
    for(const [f,d] of notes){const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t+d);g.gain.linearRampToValueAtTime(.12,t+d+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d+(ok?.12:.22));o.connect(g);g.connect(AC.destination);o.start(t+d);o.stop(t+d+.25);}
  }catch(e){}
}
function finishSession(timeout){
  stopTimers();
  S.done=true;S.timeout=!!timeout;S.secs=Math.round((Date.now()-S.t0)/1000);
  if(S.mode==='exam'){
    const areas={};
    for(const a of AREAS)areas[a.id]={n:0,ok:0};
    for(const st of S.steps)if(st.k==='q'){const a=st.area||CAT[st.q.cat].area;areas[a].n++;}
    for(const r of S.res){const a=r.area||CAT[r.q.cat].area;if(r.ok)areas[a].ok++;}
    const apct={};let tot=0,totn=0,allok=true;
    for(const a of AREAS){const x=areas[a.id];apct[a.id]=x.n?Math.round(100*x.ok/x.n):0;tot+=x.ok;totn+=x.n;if(x.n&&apct[a.id]<60)allok=false;}
    const total=totn?Math.round(100*tot/totn):0;
    const P=sessPoints();
    S.exam={areas,apct,total,totn,tot,pass:allok&&total>=70,unanswered:totn-S.res.length,pts:P};
    ST.exams.push({ts:Date.now(),total,areas:apct,pass:S.exam.pass,secs:S.secs,pts:P.got,ptsMax:P.max});
    if(ST.exams.length>20)ST.exams.shift();save();
  }
  if(S.mode==='blitz'){ST.blitz=ST.blitz||[];ST.blitz.push({ts:Date.now(),ok:S.res.filter(r=>r.ok).length,n:S.res.length});if(ST.blitz.length>30)ST.blitz.shift();save();}
  render();window.scrollTo(0,0);
}
function leaveSession(){
  const b=S?S.back:'home',a=S?S.backArg:null;
  stopTimers();const bk=S&&S.backTo;S=null;view=bk||(['cat','learn','exam','home','analyse','rep','themen','marked','kartei','suche','rhythmus'].includes(b)?b:'home');viewArg=a;render();window.scrollTo(0,0);
}

function reviewList(items){
  if(!items.length)return '';
  return `<div class="card"><h3>Zum Nachlesen (${items.length})</h3>`+items.map(r=>{
    const q=r.q;let mine='',right='';
    if(q.t==='mc'){mine=r.given==null?'–':optHtml(q,q.o[r.given]);right=optHtml(q,q.o[q.ci]);}
    else{mine=Array.isArray(r.given)?r.given.length+' Kennzeichen markiert':(r.given==null||r.given===''?'–':esc(String(r.given)));right=esc(showAns(q));}
    return `<div class="rv">${r.ctx&&r.ctx.type==='text'?`<div class="sub small">Text: ${esc(r.ctx.title)}</div>`:''}${q.fig?`<div class="fig">${q.fig}</div>`:''}<div class="qq">${esc(q.q)}</div>
    <div class="sub small" style="margin-top:4px">Deine Antwort: ${q.oh?'<span class="fig">'+mine+'</span>':mine}</div><div class="small" style="color:var(--ok);font-weight:700">Richtig: ${q.oh?'<span class="fig">'+right+'</span>':right}</div><div class="exp" style="font-size:15px">${esc(q.e)}</div>${markHtml(q)}</div>`;
  }).join('')+`</div>`;
}
function viewResult(){
  const first=S.res.filter(r=>!r.retry),rt=S.res.filter(r=>r.retry);
  const ok=first.filter(r=>r.ok).length,n=first.length;
  let h='';
  if(S.mode==='exam'){
    const E=S.exam,v=E.pass;
    h+=`<div class="card pop"><h2>Ergebnis Probeprüfung</h2><div class="big">${E.total} %</div><div class="verd" style="color:var(--${v?'ok':'bad'})">${v?'Bestanden nach unserer Messlatte':'Noch nicht bestanden nach unserer Messlatte'}</div>
    <div class="sub"><b>${E.pts.got} von ${E.pts.max} Punkten</b> · ${E.tot} von ${E.totn} richtig · Zeit ${fmtT(S.secs)}${S.timeout?' (Zeit abgelaufen)':''}${E.unanswered?' · '+E.unanswered+' nicht beantwortet':''}</div>
    <div style="margin-top:8px">${AREAS.map(a=>{const x=E.areas[a.id],p=E.apct[a.id];return `<div class="area"><span>${esc(a.t)}</span><b>${x.n?p+' %':'–'}</b><div class="bar ${x.n?barCls(p/100):''}"><i style="width:${p}%"></i></div></div>`;}).join('')}</div>
    <p class="sub small" style="margin:8px 0 0">Bestanden heißt hier: jeder Bereich mindestens 60 % und insgesamt mindestens 70 %. Die echten Grenzwerte sind nicht öffentlich.</p></div>`;
  }else{
    h+=`<div class="card pop"><h2>${esc(S.label)}</h2><div class="big">${ok} / ${n}</div><div class="sub">${n?pct(ok/n):0} % beim ersten Versuch richtig · ${(()=>{const P=sessPoints();return P.got+' von '+P.max+' Punkten';})()} · Zeit ${fmtT(S.secs)}</div>`;
    if(rt.length)h+=`<p class="sub" style="margin:6px 0 0">Noch einmal gefragt: ${rt.length}, davon ${rt.filter(r=>r.ok).length} jetzt richtig.</p>`;
    const sure=first.filter(r=>r.conf===2),sw=sure.filter(r=>!r.ok).length;
    if(sure.length>=3)h+=`<p class="sub" style="margin:6px 0 0">Bei „Sicher“ falsch: ${sw} von ${sure.length}.${sw?' Hier überschätzt du dich.':' Deine Selbsteinschätzung passt.'}</p>`;
    if(S.mode==='blitz'){const best=(ST.blitz||[]).reduce((a,b)=>Math.max(a,b.ok),0);h+=`<p class="sub" style="margin:6px 0 0">${ok>=best?'Neuer Bestwert!':'Dein Bestwert: '+best+' richtige.'} Ziel: schnell UND genau. Falsche Antworten bringen nichts.</p>`;}
    for(const e of S.events)h+=`<div class="toast pop ${e.dir==='down'?'dn':''}">${esc(CAT[e.cat].t)}: ${e.dir==='up'?'Aufgestiegen auf Stufe '+e.lv:'Zurück auf Stufe '+e.lv}</div>`;
    const hp=first.filter(r=>r.help).length;if(hp)h+=`<p class="sub small" style="margin:6px 0 0">Mit Hilfe gelöst: ${hp}. Diese zählen nicht für die Prüfungsreife.</p>`;
    h+=resultCoach(first)+`</div>`;
  }
  h+=`<div class="row">${S.mode!=='exam'&&S.again?`<button class="btn" data-act="again">Noch einmal</button>`:''}<button class="btn alt" data-act="leave">Zur Übersicht</button></div>`;
  h+=reviewList(first.filter(r=>!r.ok));
  return h;
}

Object.assign(VT,{home:'Lernweg',learn:'Üben',exam:'Prüfungssimulation',rep:'Wiederholung',themen:'Üben nach Themen',marked:'Markierte Fragen',kartei:'Lernkartei',suche:'Fragensuche',fragenstand:'Fragenstand',rhythmus:'Fehler-Rhythmus',analyse:'Meine Schwächen'});
const TEST_CATS=AREAS.flatMap(a=>a.cats);
const WISS_CATS=CATS.filter(c=>c.wissen).map(c=>c.id);
const PRACTICE_LIKE=['practice','daily','smart','wrong','bm','focus','rep'];

/* ---------- Fehlerarten: erkennt, WIE ein Fehler entstanden ist ---------- */
const ERRT={
 near:{t:'Knapp daneben',tip:'Beim Zählen oder Rechnen um wenig verschätzt. Zähle zweimal (einmal von links, einmal von rechts) oder fasse in Zweier- und Dreiergruppen zusammen.'},
 case:{t:'Groß- und Kleinschreibung',tip:'Inhaltlich richtig, aber die Schreibung stimmt nicht. Frage dich: Steht hier ein Nomen (Artikel davor möglich)? Dann groß.'},
 fast:{t:'Zu schnell geantwortet',tip:'Viel schneller als bei deinen richtigen Antworten. Lies die Frage bis zum Ende, prüfe die Antwort einmal, dann erst bestätigen.'},
 sure:{t:'Sicher, aber falsch',tip:'Hier hast du dich überschätzt. Genau diese Regel lohnt sich: Schreib sie dir ins Fehler-Tagebuch.'},
 other:{t:'Regel noch nicht sicher',tip:'Lies Lösungsweg und Markierung genau und übe das Thema gezielt.'}
};
function errType(q,given,conf,ms){
  if(Array.isArray(given)&&q.mk&&q.mk.k==='kz'){const want=q.mk.list.map((s,i)=>s===q.mk.t?i:-1).filter(i=>i>=0);const d=want.filter(i=>!given.includes(i)).length+given.filter(i=>!want.includes(i)).length;if(d===1)return 'near';}
  else   if(q.t==='text'&&norm(String(given)).toLowerCase()===norm(showAns(q)).toLowerCase())return 'case';
  if(q.t==='num'){const v=parseNum(given);if(Number.isFinite(v)&&v!==q.ans){const d=Math.abs(v-q.ans);if(d<=1||d<=.1*Math.abs(q.ans))return 'near';}}
  const g=tagOf(q),ok=(ST.log||[]).slice(-400).filter(e=>e.o&&e.g===g&&e.d>0&&e.d<600000).map(e=>e.d);
  if(ok.length>=5&&ms<.45*median(ok))return 'fast';
  if(conf===2)return 'sure';
  return 'other';
}

/* ---------- Lösungshilfe in drei Stufen ---------- */
const helpOK=()=>!!S&&PRACTICE_LIKE.includes(S.mode)&&!(ST.set&&ST.set.tips===0);
function hint1(q){return TIDTIP[tagOf(q)]||TIPS[q.cat]||'Lies die Aufgabe ganz und überlege, welche Regel gefragt ist.';}
function hint2(q){
  const m=q.mk;
  if(m){
    if(m.k==='cnt'){const n=[...m.rows[0]].filter(c=>c===m.t).length;return `In der ersten Zeile steht „${m.t}“ ${n}-mal. Zähle jede weitere Zeile genauso und addiere am Ende.`;}
    if(m.k==='num'){const n=m.hit.slice(0,5).filter(Boolean).length;return `Von den ersten 5 Zahlen erfüllen ${n} die Bedingung. Geh so in Fünfergruppen weiter.`;}
    if(m.k==='pair'){const [a,b]=m.rows[0];const d=diffPos(a,b);return `Zeile 1 ist ${d.length?'ungleich (Stelle '+(d[0]+1)+')':'gleich'}. Vergleiche jede Zeile Zeichen für Zeichen.`;}
    if(m.k==='kz'){const t=m.t.split(' ')[0];const n=m.list.filter(s=>s.split(' ')[0]===t).length;return `${n} Einträge haben den Bezirk „${t}“. Nur diese musst du bei Zahl und Buchstaben genauer prüfen.`;}
    if(m.k==='zr'){const s=m.steps[0];return `Der erste Rechenschritt lautet ${stepLabel(s,m.seq)}. Prüfe, wie sich die Schritte danach verändern.`;}
    if(m.k==='mat'){const r=m.rows[0];return `Erste Zeile: Aus ${r[0]} und ${r[1]} wird ${r[2]}. Probiere +, −, · und Kombinationen, bis die Regel auch in Zeile 2 passt.`;}
  }
  if(q.t==='mc')return null;
  if(q.t==='text'){const a=showAns(q);return `Das gesuchte Wort hat ${[...a].length} Zeichen und beginnt mit „${[...a][0]}“.`;}
  if(q.t==='num'){const a=q.ans,w=Math.max(2,Math.round(Math.abs(a)*.3));const lo=a-Math.floor(Math.random()*w)-1,hi=lo+w+1;return `Die Lösung liegt zwischen ${fmt(lo)} und ${fmt(hi)}.`;}
  return null;
}
function hint3(q){const ev=q.ev&&q.ev.length?` Im Text steht: „${q.ev.join(' … ')}“.`:'';return q.e+ev;}
function tipsHtml(q,st){
  S.help=S.help||{};S.tip=S.tip||{};const lv=S.help[S.i]||0;let tp=S.tip[S.i];
  if(!tp){tp=S.tip[S.i]={h2:hint2(q)};}
  let h=`<div class="tips" role="group" aria-label="Lösungshilfe">`;
  if(lv>=1)h+=`<div class="tipx"><b>Tipp 1</b><span>${esc(hint1(q))}</span></div>`;
  if(lv>=2)h+=tp.h2?`<div class="tipx"><b>Tipp 2</b><span>${esc(tp.h2)}</span></div>`:`<div class="tipx"><b>Tipp 2</b><span>Zwei falsche Antworten sind jetzt ausgeblendet.</span></div>`;
  if(lv>=3)h+=`<div class="tipx sol"><b>Lösungsweg</b><span>${esc(hint3(q))}</span></div>`;
  const nx=[[1,'Tipp 1'],[2,'Tipp 2'],[3,'Lösungsweg']].find(x=>x[0]===lv+1);
  if(nx)h+=`<button class="btn alt sm tipb" data-act="tip" data-v="${nx[0]}">${nx[1]} zeigen</button>`;
  return h+`</div>`;
}
function takeTip(v){
  const st=S.steps[S.i];if(!st||st.k!=='q'||S.cur)return;
  S.help=S.help||{};S.help[S.i]=Math.max(S.help[S.i]||0,v);
  const q=st.q;
  if(v>=2&&q.t==='mc'&&!(S.tip&&S.tip[S.i]&&S.tip[S.i].h2)&&!(S.hid50&&S.hid50.i===S.i)){const w=shuffle(q.o.map((x,i)=>i).filter(i=>i!==q.ci)).slice(0,2);S.hid50={i:S.i,o:w};if(w.includes(S.sel))S.sel=null;}
  render();
}
/* Kennzeichen-Listen als Raster (bleibt auch bei großer Schrift und 320 px lesbar) */
function qHtml(q){
  if(q.mk&&q.mk.k==='kz'){const i=q.q.indexOf('\n\n');const head=(i>=0?q.q.slice(0,i):q.q);const done=!!S&&!!S.cur;const sel=kzGiven();
    if(done)return `<div class="q">${esc(head)}</div>`;
    return `<div class="q">${esc(head)}</div><p class="sub small" style="margin:6px 0 0">Tippe alle Kennzeichen an, die genau gleich sind.</p><div class="kzg kzq" role="group" aria-label="Kennzeichen-Liste">${q.mk.list.map((s,k)=>`<button class="kzc kzt ${sel.includes(k)?'on':''}" data-act="kzt" data-k="${k}" aria-pressed="${sel.includes(k)}">${esc(s)}</button>`).join('')}</div>`;}
  return `<div class="q${q.mono?' mono':''}">${esc(q.q)}</div>`;
}
/* Fundstellen im Lesetext markieren */
function evText(text,ev){
  let h=esc(text);if(!ev||!ev.length)return h+`<p class="sub small" style="margin:8px 0 0">Bei dieser Frage war gerade das Fehlen der Angabe im Text entscheidend.</p>`;
  for(const e of ev){const x=esc(e);const i=h.indexOf(x);if(i>=0)h=h.slice(0,i)+`<mark class="hit">${x}</mark>`+h.slice(i+x.length);}
  return h;
}

/* ---------- KI-Hilfe (nur in der Claude-App, wenn verfügbar) ---------- */
let KI=null;const kiSt={};
(async()=>{try{if(typeof window.claude!=='undefined'&&window.claude&&typeof window.claude.use==='function'){const s=await window.claude.use('sample');if(s){KI=s;if(!S||S.cur)render();}}}catch(e){}})();
function kiBlock(q,c){
  if(!KI||q.oh||S._rv)return '';
  const k=S.i+'|'+S.res.length,x=kiSt[k];
  if(!x)return `<div class="row" style="margin:8px 0 0"><button class="btn alt sm" data-act="ki" data-k="${k}">Erklär mir das (KI)</button></div>`;
  return `<div class="kibox" role="status"><b>KI-Erklärung</b><div id="kiout">${esc(x.text||(x.err?'':'Denkt nach …'))}</div>${x.err?`<p class="sub small">${esc(x.err)}</p>`:''}<p class="sub small" style="margin:6px 0 0">KI-Antworten können Fehler enthalten. Maßgeblich sind Lösung und Erklärung oben.</p></div>`;
}
async function kiAsk(k){
  if(!KI||kiSt[k])return;const st=S.steps[S.i],q=st.q,c=S.cur;if(!c)return;
  const x=kiSt[k]={text:'',err:''};render();
  const opts=q.t==='mc'?'\nAntwortmöglichkeiten: '+q.o.map((o,i)=>String.fromCharCode(65+i)+') '+o).join(' | '):'';
  const mine=q.t==='mc'?(c.given==null?'keine':q.o[c.given]):Array.isArray(c.given)?(c.given.map(i=>q.mk.list[i]).join(', ')||'keines markiert'):String(c.given);
  const right=q.t==='mc'?q.o[q.ci]:showAns(q);
  const ctx=st.ctx&&st.ctx.type==='text'?'\nLesetext: '+st.ctx.text:'';
  const prompt=`Du bist ein geduldiger Lerncoach für den Aufnahmetest der Polizei Österreich (Computertest). Erkläre in einfachem Deutsch (österreichische Standardsprache), höchstens 110 Wörter, ohne Überschriften: 1. warum die richtige Antwort stimmt, 2. welcher Denkfehler hinter der gegebenen Antwort stecken könnte (falls sie falsch ist), 3. ein kurzer Merksatz. Erfinde keine Fakten; wenn du dir unsicher bist, sag das.${ctx}\nAufgabe: ${q.q}${opts}\nGegebene Antwort: ${mine}\nRichtige Antwort: ${right}\nErklärung der App: ${q.e}`;
  try{const r=await KI(prompt,{onText:({text})=>{x.text=text;const el=document.getElementById('kiout');if(el)el.textContent=text;}});x.text=r&&r.text||x.text;}
  catch(e){const cd=e&&e.code;if(cd==='not_granted'){KI=null;x.err='Die KI-Hilfe ist hier nicht freigegeben.';}else if(cd==='bad_key')x.err=AI_BADKEY;else if(cd==='offline')x.err=AI_OFF;else if(cd==='rate_limited')x.err='Gerade zu viele Anfragen. Bitte in ein paar Minuten noch einmal.';else x.err='Die KI-Hilfe ist gerade nicht erreichbar.';}
  if(S&&!S.done)render();
}
let kiCoach={text:'',err:'',busy:false};
async function kiCoachAsk(){
  if(!KI||kiCoach.busy)return;kiCoach={text:'',err:'',busy:true};render();
  const R=readiness(),wt=weakTopics(),ec=errCounts(),rh=rhythm();
  const data=`Bereiche (Schätzwert 0–100, Anzahl Aufgaben): ${R.ar.map(a=>AREA[a.id].t+' '+pct(a.score)+' ('+a.n+')').join('; ')}. Schwache Unterthemen: ${wt.map(x=>x.g+' '+x.w+'/'+x.n+' falsch').join('; ')||'keine'}. Fehlerarten: ${Object.entries(ec).map(([k,v])=>ERRT[k].t+' '+v).join('; ')||'keine'}. Muster: ${rh.pats.map(p=>p.t).join('; ')||'keine'}. Tage bis Testtag 1: ${daysLeft()==null?'unbekannt':daysLeft()}.`;

function errCounts(days){const L=logOf(days||30).filter(e=>!e.o&&e.x&&e.m!=='retry');const c={};for(const e of L)c[e.x]=(c[e.x]||0)+1;return c;}
function coach(){
  const R=readiness(),n=(ST.log||[]).length,d=daysLeft(),due=dueCount(),wr=wrongIds().length,wt=weakTopics(),ec=errCounts(),rh=rhythm();
  const why=[],tips=[];
  let phase='';
  if(d!=null&&d>=0)phase=d>56?'Grundlagen aufbauen':d>28?'Schwächen schließen':d>7?'Prüfungsnah trainieren':d>0?'Festigen, nichts Neues':'Testtag';
  if(n<30)why.push('Einstufung: alle sechs Testbereiche kennenlernen');
  const miss=R.ar.filter(a=>a.n<MINN);if(miss.length&&n>=30)why.push('Noch wenig geübt: '+miss.slice(0,2).map(a=>AREA[a.id].t).join(', '));
  if(due)why.push(due+' fällige Wiederholung'+(due===1?'':'en'));
  if(wr)why.push(wr+' offene'+(wr===1?'r Fehler':' Fehler'));
  if(wt.length)why.push('Schwerpunkt: '+wt[0].g+' ('+wt[0].w+' von '+wt[0].n+' falsch)');
  if(R.enough)why.push('Schwächster Bereich: '+AREA[R.weakest.id].t+' ('+pct(R.weakest.score)+' %)');
  const top=Object.entries(ec).filter(([k])=>k!=='other').sort((a,b)=>b[1]-a[1])[0];
  if(top&&top[1]>=3)tips.push({t:ERRT[top[0]].t+' ('+top[1]+'× in 30 Tagen)',d:ERRT[top[0]].tip});
  for(const p of patterns().filter(p=>p.bad).slice(0,1))tips.push({t:p.t,d:p.d});
  for(const p of rh.pats.slice(0,1))tips.push({t:p.t,d:p.tip});
  if(d!=null&&d>=0&&d<=7)tips.push({t:'Letzte Woche vor dem Test',d:'Nur noch bekannte Aufgaben festigen (Prüfungstag-Modus), jeden zweiten Tag eine Probeprüfung, früh schlafen.'});
  if(!tips.length)tips.push({t:'So nutzt du den Trainer',d:'Starte täglich das Smart-Training. Es mischt fällige Wiederholungen, deine Fehler und schwache Themen und passt die Schwierigkeit an dich an.'});
  return {why,tips,phase};
}

function stepsSmart(){
  const now=Date.now(),seen=new Set(),out=[];
  const add=st=>{if(!st||st.k!=='q')return;const id=st.q.id;if(id){if(seen.has(id))return;seen.add(id);}out.push(st);};
  const ids=Object.keys(ST.box).filter(id=>QBYID[id]&&QBYID[id].cat!=='tv');
  shuffle(ids.filter(id=>ST.box[id][0]>0&&ST.box[id][1]<=now)).slice(0,4).forEach(id=>add(stepFromId(id)));
  shuffle(ids.filter(isWrong)).slice(0,3).forEach(id=>add(stepFromId(id)));
  for(const w of weakTopics().filter(x=>!CAT[x.c].block).slice(0,2))stepsFocus(w.c,w.g).slice(0,3).forEach(add);
  for(const a of AREAS){const r=areaScore(a);if(r.n<MINN){const c=a.cats.find(x=>!CAT[x].block);if(c)stepsForCat(c,3).forEach(add);}}
  const singles=CATS.filter(c=>!c.block&&!c.wissen&&(GEN[c.id]||(BANKBY[c.id]||[]).length));
  const w=singles.map(c=>{const r=catScore(c.id);return {c:c.id,w:Math.max(.15,1.05-r.score)+(r.n<10?.4:0)};});const tot=w.reduce((a,x)=>a+x.w,0);
  let guard=0;while(out.length<14&&guard++<60){let r=Math.random()*tot;for(const x of w){r-=x.w;if(r<=0){stepsForCat(x.c,1).forEach(add);break;}}}
  const singlesSteps=shuffle(out.slice(0,16));
  const bl=(!PASS.length||catScore('me').score<catScore('tv').score)?'me':'tv';
  return singlesSteps.concat(stepsFromBlock(bl,curLevel(bl)));
}
function resultCoach(first){

  const g={};for(const r of bad){const k=r.q.cat+'|'+tagOf(r.q);g[k]=(g[k]||0)+1;}
  const top=Object.entries(g).sort((a,b)=>b[1]-a[1])[0];const [c,t]=top[0].split('|');

  return h;
}

/* ---------- Fehler-Rhythmus ---------- */
const RH_MIN=20,RH_DIFF=.15;
function rhythm(){
  const L=(ST.log||[]).filter(e=>e.m!=='retry'&&!e.h&&e.m!=='card');
  const dims={tod:{t:'Tageszeit',f:e=>{const h=new Date(e.t).getHours();return h>=5&&h<11?'Morgen':h>=11&&h<17?'Mittag':h>=17&&h<22?'Abend':'Nacht';},o:['Morgen','Mittag','Abend','Nacht']},
    wd:{t:'Wochentag',f:e=>['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'][new Date(e.t).getDay()],o:['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag']},
    pos:{t:'Position in der Runde',f:e=>!e.p?null:e.p<=5?'Aufgabe 1–5':e.p<=10?'Aufgabe 6–10':e.p<=15?'Aufgabe 11–15':'Aufgabe 16+',o:['Aufgabe 1–5','Aufgabe 6–10','Aufgabe 11–15','Aufgabe 16+']}};
  const res={},pats=[];
  for(const k in dims){const D=dims[k],g={};for(const e of L){const x=D.f(e);if(!x)continue;const y=g[x]||(g[x]={n:0,w:0});y.n++;if(!e.o)y.w++;}
    const rows=D.o.map(x=>({k:x,n:(g[x]||{n:0}).n,w:(g[x]||{w:0}).w,r:g[x]&&g[x].n?g[x].w/g[x].n:null}));
    const el=rows.filter(r=>r.n>=RH_MIN);let pat=null;
    if(el.length>=2){const worst=el.reduce((a,b)=>b.r>a.r?b:a),best=el.reduce((a,b)=>b.r<a.r?b:a);
      if(worst.r-best.r>=RH_DIFF-1e-9){const d=Math.round(100*(worst.r-best.r));let tip='';
        if(k==='tod')tip=`Am ${worst.k} machst du ${pct(worst.r)} % Fehler, am ${best.k} nur ${pct(best.r)} %. Lege neue und schwere Themen auf den ${best.k} und mach am ${worst.k} eher Wiederholung.`;
        else if(k==='wd')tip=`Am ${worst.k} machst du ${pct(worst.r)} % Fehler, am ${best.k} nur ${pct(best.r)} %. Plane am ${worst.k} leichtere Wiederholung statt Probeprüfungen.`;
        else tip=worst.k==='Aufgabe 1–5'?`Am Anfang einer Runde machst du ${pct(worst.r)} % Fehler, bei ${best.k} nur ${pct(best.r)} %. Du brauchst Anlauf: Lies die Anleitung ganz und starte ruhig. Im Test gibt es vor jeder Aufgabengruppe Übungsbeispiele, nutze sie.`:`Bei ${worst.k} steigen deine Fehler auf ${pct(worst.r)} % (bei ${best.k} ${pct(best.r)} %). Die Konzentration lässt nach: Der echte Computertest dauert 2–3 Stunden, trainiere Ausdauer mit der Probeprüfung und atme zwischen den Aufgaben kurz durch.`;
        pat={k,t:D.t+': '+worst.k+' schwächer (+'+d+' Prozentpunkte Fehler)',tip,worst:worst.k,best:best.k,d};pats.push(pat);}}
    res[k]={t:D.t,rows,pat,el:el.length};}
  let run=0,mx=0;for(const e of L){if(!e.o){run++;mx=Math.max(mx,run);}else run=0;}
  return {res,pats,streak:mx,n:L.length};
}
function viewRhythmus(){
  const R=rhythm();
  let h=`<button class="back" data-go="analyse">Meine Schwächen</button><h1 class="lt">Fehler-Rhythmus</h1><p class="sub">Wann passieren deine Fehler? Ein Muster wird erst angezeigt, wenn jede verglichene Gruppe mindestens ${RH_MIN} Antworten hat und der Unterschied mindestens ${Math.round(RH_DIFF*100)} Prozentpunkte beträgt.</p>`;
  if(R.pats.length)h+=R.pats.map(p=>`<div class="card pat"><b>${esc(p.t)}</b><p class="sub" style="margin:4px 0 0">${esc(p.tip)}</p></div>`).join('');
  else h+=`<div class="card empty"><b>Noch kein klares Muster</b><p class="sub" style="margin:4px 0 0">${R.n<RH_MIN*2?`Bisher ${R.n} Antworten ausgewertet. Für einen Vergleich braucht es mindestens ${RH_MIN} Antworten in zwei Gruppen, also zum Beispiel an zwei verschiedenen Tageszeiten.`:'Deine Fehlerquote ist über Tageszeit, Wochentag und Position in der Runde gleichmäßig. Das ist gut.'}</p></div>`;
  for(const k in R.res){const x=R.res[k];h+=`<div class="card flat"><table class="t"><tr><th>${esc(x.t)}</th><th>Antw.</th><th>Fehler</th></tr>${x.rows.map(r=>`<tr${x.pat&&x.pat.worst===r.k?' class="hl"':''}><td>${esc(r.k)}${x.pat&&x.pat.worst===r.k?' <span aria-hidden="true">▲</span><span class="sr"> (schwächste Gruppe)</span>':''}</td><td class="n">${r.n}</td><td class="n">${r.n>=RH_MIN?pct(r.r)+' %':(r.n?'zu wenig':'–')}</td></tr>`).join('')}</table></div>`;}
  h+=`<div class="card"><b>Längste Fehlerserie</b><p class="sub" style="margin:4px 0 0">${R.streak?R.streak+' falsche Antworten in Folge.':'Noch keine.'}${R.streak>=4?' Tipp: Nach zwei Fehlern in Folge kurz durchatmen und die Anleitung neu lesen. Im Test zählt jede Aufgabe einzeln.':''}</p></div>`;
  const ec=errCounts(60),tot=Object.values(ec).reduce((a,b)=>a+b,0);
  h+=`<div class="card"><b>Deine Fehlerarten (60 Tage)</b>${tot?Object.entries(ec).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="ctip"><b>${esc(ERRT[k].t)}: ${v}×</b><span>${esc(ERRT[k].tip)}</span></div>`).join(''):`<p class="sub" style="margin:4px 0 0">Noch keine Fehler mit Fehlerart erfasst.</p>`}</div>`;
  if(KI)h+=`<div class="card kibox"><b>KI-Lerncoach</b><p class="sub small" style="margin:2px 0 8px">Erstellt aus deinen Lerndaten (nur Zahlen, keine persönlichen Angaben) einen 7-Tage-Plan.</p>${kiCoach.text||kiCoach.busy?`<div id="kicout">${esc(kiCoach.text||'Denkt nach …')}</div>`:''}${kiCoach.err?`<p class="sub small">${esc(kiCoach.err)}</p>`:''}<div class="row" style="margin:8px 0 0"><button class="btn alt sm" data-act="kicoach" ${kiCoach.busy?'disabled':''}>${kiCoach.text?'Neuen Plan erstellen':'Plan erstellen'}</button></div><p class="sub small" style="margin:6px 0 0">KI-Antworten können Fehler enthalten.</p></div>`;
  return h;
}

let VOICES=[];
function loadVoices(){try{VOICES=speechSynthesis.getVoices().filter(v=>/^de([-_]|$)/i.test(v.lang));}catch(e){VOICES=[];}}

function voiceScore(v){const n=(v.name||'').toLowerCase();let s=0;
  if(/premium/.test(n))s+=60;if(/enhanced|erweitert|verbessert|neural|natural|online/.test(n))s+=45;if(/siri/.test(n))s+=35;if(/google/.test(n))s+=15;
  if(/de[-_]at/i.test(v.lang))s+=8;else if(/de[-_]de/i.test(v.lang))s+=5;if(/compact|eloquence|grandma|grandpa|rocko|shelley|flo|reed|sandy/.test(n))s-=30;return s;}
function bestVoice(){if(ST.voice){const v=VOICES.find(x=>x.voiceURI===ST.voice);if(v)return v;}return VOICES.slice().sort((a,b)=>voiceScore(b)-voiceScore(a))[0]||null;}

/* ---------- Diktat: Satz anhören, eintippen, Fehler werden Wort für Wort markiert ---------- */
let DK=null;
function dkTok(s){return norm(String(s).replace(/[‚‘’`´]/g,"'").replace(/[„“”«»]/g,'"')).split(' ').filter(Boolean);}
function dkDiff(target,given){
  const a=dkTok(target),b=dkTok(given),n=a.length,m=b.length;const L=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)L[i][j]=a[i]===b[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
  const okA=new Array(n).fill(false),okB=new Array(m).fill(false);let i=0,j=0;
  while(i<n&&j<m){if(a[i]===b[j]){okA[i]=okB[j]=true;i++;j++;}else if(L[i+1][j]>=L[i][j+1])i++;else j++;}
  const err=Math.max(okA.filter(x=>!x).length,okB.filter(x=>!x).length);
  return {a,b,okA,okB,err};
}
function dkStart(n){
  const done=ST.dkd||{};const idx=DIKTAT.map((x,i)=>i).sort((x,y)=>((done[x]||0)-(done[y]||0))||Math.random()-.5).slice(0,n||8);

}

  const el=document.getElementById('dkin');if(!el||!el.value.trim())return;
  const s=DIKTAT[DK.list[DK.i]][0];const d=dkDiff(s,el.value);DK.check={given:el.value,d};DK.res.push({i:DK.list[DK.i],err:d.err});
  ST.dkd=ST.dkd||{};ST.dkd[DK.list[DK.i]]=(ST.dkd[DK.list[DK.i]]||0)+1;save();

}

/* ---------- Vor und zurück: wischen, Pfeiltasten, Knöpfe ---------- */
const navOK=()=>!!S&&!S.done&&!S.confirmExit;

function prevQ(from){const L=qSteps().filter(i=>i<from);return L.length?L[L.length-1]:null;}

function slide(dir){const a=document.getElementById('app');if(!a||!(ST.set&&ST.set.anim))return;a.classList.remove('swl','swr');void a.offsetWidth;a.classList.add(dir<0?'swl':'swr');}
function navBack(){if(!navOK())return;const base=S.rv!=null?S.rv:S.i;const j=prevQ(base);if(j==null)return;ttsStop();S.rv=j;slide(1);render();window.scrollTo(0,0);}
function skipItem(){
  ttsStop();const st=S.steps[S.i];if(!st)return;
  const a=S.i;let b=a+1;
  if(st.k==='read'){while(b<S.steps.length&&S.steps[b].k==='q'&&S.steps[b].ctx&&S.steps[b].ctx.title===st.title)b++;}
  const nq=S.steps.slice(a,b).filter(x=>x.k==='q').length;
  S.skipped=(S.skipped||0)+nq;S.sel=null;S.kz=null;S.noteOpen=false;S.cur=null;
  if(fastMode()){S.i=b-1;advance();return;}/* Prüfung: bleibt unbeantwortet und zählt als nicht gelöst */
  const blk=S.steps.splice(a,b-a);
  const again=blk.every(x=>x.sk);
  if(!again&&S.steps.length>a){blk.forEach(x=>{x.sk=1;});S.steps.push(...blk);
    S.flashMsg=nq>1?'Text übersprungen. Er kommt am Ende der Runde noch einmal. Überspringst du ihn dann wieder, entfällt er.':'Übersprungen. Die Frage kommt am Ende der Runde noch einmal. Überspringst du sie dann wieder, entfällt sie.';}
  else S.flashMsg='Übersprungen. Das zählt nicht als Antwort.';
  S.flashSkip=true;
  if(S.i>=S.steps.length){if(S.res.length)finishSession(false);else leaveSession();return;}
  enterStep();render();window.scrollTo(0,0);
}
function navFwd(){

}

let TS=null;

/* Rendern mit Rückblick-Modus (eine bereits beantwortete Frage nur ansehen) */

function stepsBox(n){

/* Am Ende einer Box-Runde: falsch beantwortete Fragen, die noch in der Box liegen, kommen sofort noch einmal.
   Die Sitzung endet erst, wenn die Box durch ist (oder du selbst aufhörst). */
function boxRefill(){
  if(!S||!S.boxN||S.done)return;
  const last={};for(const r of S.res)if(r.q&&r.q.id)last[r.q.id]=r.ok;
  const queued=new Set(S.steps.slice(S.i+1).map(s=>s.q&&s.q.id));
  const more=karteiIds().filter(id=>boxOf(id)===S.boxN&&!queued.has(id)&&(last[id]===false||!(id in last)));
  if(!more.length)return;
  S.round=(S.round||1)+1;S.label='Lernkartei Box '+S.boxN+' · Runde '+S.round;
  for(const id of shuffle(more))S.steps.push(stepFromId(id));
}

/* Prüfungsreife zu einem früheren Zeitpunkt: aus dem Antwortprotokoll nachgebaut (gleiche Regeln wie die Statistik) */
function readinessAt(T){const st0=ST.stat,stat={};
  for(const e of ST.log||[]){if(e.t>T||e.m==='retry'||e.h)continue;const s=stat[e.c]||(stat[e.c]={n:0,ok:0,h:[]});s.n++;s.ok+=e.o;s.h.push([e.l||1,e.o]);if(s.h.length>60)s.h.shift();}
  try{ST.stat=stat;return readiness();}finally{ST.stat=st0;}}
function prognose(){
  const R=readiness();if(!R.enough)return {state:'data',R};
  if(R.total>=READY)return {state:'ready',R};
  const N=readinessAt(Date.now());
  for(const back of [14,7]){
    const P=readinessAt(Date.now()-back*DAY);if(!P.enough)continue;
    const slope=(N.total-P.total)/back;
    if(slope<=.0005)return {state:'flat',R,back};
    const d=Math.ceil((READY-R.total)/slope);if(d>365)return {state:'flat',R,back};
    return {state:'trend',R,back,days:d,date:Date.now()+d*DAY};
  }
  return {state:'young',R};
}
function weakestCat(){const R=readiness(),a=AREA[R.weakest.id];let best=null;for(const c of a.cats){const s=catScore(c);if(!best||s.score<best.s)best={c,s:s.score};}return best&&best.c;}
function progCard(){
  const P=prognose(),dl=daysLeft();let t='';
  if(P.state==='data')t=`Für eine Prognose brauche ich in jedem Bereich mindestens ${MINN} Antworten. Es fehlen noch: ${esc(P.R.missing.join(', '))}.`;
  else if(P.state==='ready')t=`Du bist schon auf dem Niveau „Sehr gut vorbereitet“ (${pct(P.R.total)} %). Jetzt heißt es halten: täglich ein Smart-Training und einmal pro Woche eine Probeprüfung.`;
  else if(P.state==='young')t=`Prüfungsreife jetzt ${pct(P.R.total)} %. Eine Prognose ist möglich, sobald du seit einer Woche genug Antworten hast.`;
  else if(P.state==='flat')t=`Prüfungsreife jetzt ${pct(P.R.total)} %. In den letzten ${P.back} Tagen ist sie kaum gestiegen. Mehr Wiederholung der Fehler und täglich lernen bringt den Aufwärtstrend zurück.`;
  else{const ok=dl==null?null:P.days<=dl;
    t=`Prüfungsreife jetzt ${pct(P.R.total)} %. Bei deinem Tempo der letzten ${P.back} Tage erreichst du ${pct(READY)} % voraussichtlich am <b>${fmtD(P.date)}</b> (in ${P.days} Tagen).`+(dl==null?' Trag unter Einstellungen deinen Testtag ein, dann vergleiche ich mit dem Termin.':ok?` Das ist vor deinem Testtag (in ${dl} Tagen). Bleib in diesem Tempo.`:` Dein Testtag ist schon in ${dl} Tagen. Erhöhe dein Pensum: täglich zwei Smart-Trainings und den schwächsten Bereich extra.`);}
  const wc=P.state==='data'?null:weakestCat();
  return `<div class="card" id="progcard"><b>Prognose bis zum Testtag</b><p class="sub" style="margin:4px 0 0">${t}</p>
  ${P.state==='data'?'':`<p class="sub small" style="margin:6px 0 0"><b>Plan für heute:</b> 1 Smart-Training und 10 Aufgaben in deinem schwächsten Bereich (${esc(AREA[P.R.weakest.id].t)}).</p>`}
  <div class="row" style="margin:8px 0 0">${wc?`<button class="btn alt sm" data-act="weakgo" data-v="${wc}">Schwächsten Bereich üben</button>`:''}</div>
  <p class="sub small" style="margin:6px 0 0">Schätzung aus deinem bisherigen Fortschritt, keine Garantie.</p></div>`;
}

let SNAPS=[],SNAPCONF='',_mt=null,_idb=null,SNAP_DAY='';
function idbDb(){
  if(_idb)return _idb;
  _idb=new Promise((res,rej)=>{try{const r=indexedDB.open('aufnahmetest-sicher',1);r.onupgradeneeded=()=>{r.result.createObjectStore('kv');};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}catch(e){rej(e);}});
  _idb.catch(()=>{_idb=null;});
  return _idb;
}
function idbDo(mode,fn){return idbDb().then(db=>new Promise((res,rej)=>{const t=db.transaction('kv',mode);const rq=fn(t.objectStore('kv'));t.oncomplete=()=>res(rq&&rq.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);}));}
const idbSet=(k,v)=>idbDo('readwrite',st=>st.put(v,k)).catch(()=>{});
const idbGet=k=>idbDo('readonly',st=>st.get(k)).catch(()=>null);
const idbDel=k=>idbDo('readwrite',st=>st.delete(k)).catch(()=>{});
const idbAll=()=>idbDo('readonly',st=>st.getAllKeys()).catch(()=>[]);
function mirrorNow(){
  _mt=null;let json;try{json=JSON.stringify(ST);}catch(e){return;}
  idbSet('state',{at:ST.at||Date.now(),json});
  const d=dkey();
  if(ST.at&&SNAP_DAY!==d){SNAP_DAY=d;idbSet('snapday',d);idbSet('snap-'+Date.now()+'-Tag',{ts:Date.now(),tag:'Tag',n:(ST.log||[]).length,json}).then(pruneSnaps);}
}
function mirrorSoon(){if(_mt)return;_mt=setTimeout(mirrorNow,1200);}
function snapNow(tag){
  let json;try{json=JSON.stringify(ST);}catch(e){return;}
  if(!ST.at)return;
  idbSet('snap-'+Date.now()+'-'+tag,{ts:Date.now(),tag,n:(ST.log||[]).length,json}).then(pruneSnaps);
}
function snapKeys(){return idbAll().then(ks=>ks.filter(k=>String(k).startsWith('snap-')).sort());}
function pruneSnaps(){return snapKeys().then(sn=>Promise.all(sn.slice(0,Math.max(0,sn.length-20)).map(idbDel))).then(refreshSnaps);}
function refreshSnaps(){
  return snapKeys().then(sn=>Promise.all(sn.slice(-20).reverse().map(k=>idbGet(k).then(v=>v?{k,ts:v.ts,tag:v.tag,n:v.n}:null)))).then(a=>{SNAPS=a.filter(Boolean);if(!S&&view==='backup')render();}).catch(()=>{});
}
function restoreFromMirror(){
  idbGet('snapday').then(v=>{if(v)SNAP_DAY=v;});
  idbGet('state').then(m=>{
    if(!m||!m.json){mirrorSoon();return;}
    let p;try{p=JSON.parse(m.json);}catch(e){return;}
    if(!p||p.v!==2||typeof p.stat!=='object'||typeof p.box!=='object')return;
    if((p.at||0)>(ST.at||0)+1500&&!S){
      snapNow('vor-Wiederherstellung');

      try{localStorage.setItem(KEY,JSON.stringify(ST));storageOK=true;}catch(e){}
      applyTheme();notice='Dein Fortschritt wurde aus dem zweiten, sicheren Speicher wiederhergestellt.';render();
    }
  });

}

/* ---------- Sprachausgabe: natürlicher (Pausen, Aussprache, beste Stimme des Geräts) ---------- */
function voiceScore(v){const n=((v.name||'')+' '+(v.voiceURI||'')).toLowerCase();let s=0;
  if(/premium/.test(n))s+=80;else if(/enhanced|erweitert|verbessert/.test(n))s+=55;
  if(/neural|natural|online/.test(n))s+=50;if(/siri/.test(n))s+=40;if(/google/.test(n))s+=20;
  if(/anna|helena|petra|markus|yannick|viktor|martin|katja|hedda|stefan|conrad|amala|florian|seraphina|vicki|steffi/.test(n))s+=6;
  if(/de[-_]at/i.test(v.lang))s+=6;else if(/de[-_]de/i.test(v.lang))s+=4;
  if(/compact|eloquence|grandma|grandpa|rocko|shelley|\bflo\b|reed|sandy|eddy|bubbles|bad news|good news|whisper|zarvox|trinoids|albert|organ|jester|boing|bells|cellos|superstar|wobble/.test(n))s-=60;
  return s;}
function voiceLevel(v){const s=v?voiceScore(v):0;return s>=75?'Premium':s>=45?'Erweitert':'Standard';}
function bestVoice(){if(ST.voice){const v=VOICES.find(x=>x.voiceURI===ST.voice);if(v)return v;}return VOICES.slice().sort((a,b)=>voiceScore(b)-voiceScore(a))[0]||null;}
function speechClean(t){
  let s=String(t).replace(/[*_#`]/g,'');
  const R=[[/\bz\.\s?B\./g,'zum Beispiel'],[/\bd\.\s?h\./g,'das heißt'],[/\bbzw\./g,'beziehungsweise'],[/\busw\./g,'und so weiter'],[/\bu\.\s?a\./g,'unter anderem'],[/\bca\./g,'circa'],[/\bggf\./g,'gegebenenfalls'],[/\bvgl\./g,'vergleiche'],[/\bz\.\s?T\./g,'zum Teil'],[/\bNr\./g,'Nummer'],[/\bDr\./g,'Doktor'],
    [/\bStVO\b/g,'S T V O'],[/\bKFG\b/g,'K F G'],[/\bBMI\b/g,'B M I'],[/\bPkw\b/g,'P K W'],[/\bLkw\b/g,'L K W'],[/\bkm\/h\b/g,'Kilometer pro Stunde'],[/\bm\/s\b/g,'Meter pro Sekunde'],
    [/(\d)\s?%/g,'$1 Prozent'],[/€/g,' Euro'],[/\bkg\b/g,'Kilogramm'],[/\bkm\b/g,'Kilometer'],[/−/g,'minus '],[/\s[–—]\s/g,', '],[/(\d)\.(\d{3})\b/g,'$1$2']];
  R.forEach(([a,b])=>{s=s.replace(a,b);});
  return s.replace(/\s+/g,' ').trim();
}
function speechChunks(t){
  const out=[];
  splitSent(t).forEach(sent=>{
    const x=sent.trim();if(!x)return;
    const end=x.slice(-1);const gapEnd=end==='?'?380:end==='!'?330:end==='…'?450:310;
    if(x.length>120){
      const bits=x.replace(/([,;:])\s+/g,'$1\u0001').split('\u0001');const groups=[];let cur='';
      bits.forEach(b=>{if(cur&&(cur+' '+b).length>110){groups.push(cur);cur=b;}else cur=cur?cur+' '+b:b;});
      if(cur)groups.push(cur);
      groups.forEach((g,i)=>out.push({t:g,gap:i===groups.length-1?gapEnd:160,q:i===groups.length-1&&end==='?'}));
    }else out.push({t:x,gap:gapEnd,q:end==='?'});
  });
  return out.length?out:[{t:String(t),gap:200,q:false}];
}
let SPK=0;
function speakList(parts,opt){
  opt=opt||{};if(!ttsOK()||!parts.length)return false;
  try{
    speechSynthesis.cancel();const v=bestVoice();TT.on=true;const my=++SPK;
    const jobs=[];parts.forEach((p,i)=>speechChunks(speechClean(p)).forEach(c=>jobs.push(Object.assign({part:i},c))));
    const rate=opt.rate||ttsRate();let n=0;
    const next=()=>{
      if(my!==SPK||!TT.on)return;
      if(n>=jobs.length){TT.on=false;if(opt.onEnd)opt.onEnd();return;}
      const j=jobs[n++];const u=new SpeechSynthesisUtterance(j.t);
      u.lang=v?v.lang:'de-AT';if(v)u.voice=v;u.rate=rate*(v&&voiceLevel(v)==='Standard'?.94:1);u.pitch=j.q?1.05:1;u.volume=1;
      u.onstart=()=>{if(my===SPK&&opt.onPart)opt.onPart(j.part);};
      const done=()=>{if(my===SPK)setTimeout(next,j.gap);};
      u.onend=done;u.onerror=e=>{if(e&&(e.error==='canceled'||e.error==='interrupted'))return;done();};
      speechSynthesis.speak(u);
    };
    next();return true;
  }catch(e){TT.on=false;return false;}
}

  return `<div class="card"><b>Vorlesen und Diktat</b><p class="sub small" style="margin:2px 0 8px">Die App wählt automatisch die beste deutsche Stimme deines Geräts und spricht mit natürlichen Pausen.</p>
  ${VOICES.length?`<label class="sub small" for="voicesel">Stimme</label><select class="pick" id="voicesel" style="margin-top:4px">${opts}</select>
  ${lvl==='Standard'?`<div class="warnbox">Deine beste Stimme ist nur „Standard“ und klingt deshalb noch nach Computer. Lade eine <b>Premium</b>- oder <b>Erweitert</b>-Stimme (Anleitung unten), das macht den größten Unterschied.</div>`:`<p class="sub small" style="margin:6px 0 0">Aktuelle Stimme: ${esc(cur.name)} (${lvl}).</p>`}`:'<p class="sub small">Stimmen werden geladen … Tippe auf „Probe hören“.</p>'}
  <div class="sub small" style="margin:10px 0 4px">Tempo</div><div class="seg">${[[.8,'Langsam'],[.95,'Normal'],[1.1,'Schnell']].map(([k,l])=>`<button data-act="rate" data-v="${k}" class="${ttsRate()===k?'on':''}">${l}</button>`).join('')}</div>
  <div class="row" style="margin:10px 0 0"><button class="btn alt sm" data-act="ttsprobe">Probe hören</button><button class="btn alt sm" data-act="vcmp">Stimmen vergleichen</button></div>

}

"Stelle zum Satzglied die passende Frage. Die Frage zeigt dir den Fall.",
