vember 1916. Die anderen Zeiträume betreffen Franz II./I., Maria Theresia und Karl I.","tag":"Habsburger","c":"Von 1848 bis 1916","w":["Von 1792 bis 1835","Von 1740 bis 1780","Von 1916 bis 1918"],"id":"b8f730e82"},{"cat":"at","lv":2,"q":"Welche Staatsform entstand 1867 durch den Ausgleich mit Ungarn?","e":"Mit dem Ausgleich von 1867 entstand die Doppelmonarchie Österreich-Ungarn. Der Kaiser von Österreich war zugleich König von Ungarn; Außenpolitik und Heer blieben gemeinsam.","tag":"Habsburger","c":"Die Doppelmonarchie Österreich-Ungarn","w":["Der Norddeutsche Bund","Das Heilige Römische Reich","Der Deutsche Zollverein"],"id":"b3eab6c23"},{"cat":"at","lv":2,"q":"Welches Ereignis am 28. Juni 1914 löste die Julikrise aus, die in den Ersten Weltkrieg mündete?","e":"Am 28. Juni 1914 wurden der österreichisch-ungarische Thronfolger Franz Ferdinand und seine Frau Sophie in Sarajevo erschossen. Daraufhin erklärte Österreich-Ungarn Serbien am 28. Juli den Krieg.","tag":"Erster Weltkrieg","c":"Die Ermordung des Thronfolgers Franz Ferdinand in Sarajevo","w":["Die Ermordung von Kaiser Franz Joseph in Wien","Die Kriegserklärung Deutschlands an Frankreich","Der Einmarsch österreichischer Truppen in Serbien"],"id":"bddbbff9a"},{"cat":"at","lv":3,"q":"Wie nannte sich der Staat, als am 12. November 1918 die Republik ausgerufen wurde?","e":"Die Provisorische Nationalversammlung beschloss am 12. November 1918 das „Gesetz über die Staats- und Regierungsform von Deutschösterreich“: „Deutschösterreich ist eine demokratische Republik.“ Die Bezeichnung „Republik Österreich“ setzte sich erst 1919 im Zuge des Friedensvertrags von Saint-Germain durch.","tag":"Erste Republik","c":"Deutschösterreich","w":["Republik Österreich","Österreich-Ungarn","Ostmark"],"id":"b6eed72e7"},{"cat":"at","lv":2,"q":"Welcher Rechtswissenschaftler wirkte 1920 als Experte maßgeblich an der Ausarbeitung des Bundes-Verfassungsgesetzes mit?","e":"Am 1. Oktober 1920 beschloss die Konstituierende Nationalversammlung das Bundes-Verfassungsgesetz. Der Rechtswissenschaftler Hans Kelsen wirkte dabei als Experte maßgeblich an der Ausarbeitung mit.","tag":"Erste Republik","c":"Hans Kelsen","w":["Engelbert Dollfuß","Leopold Figl","Bruno Kreisky"],"id":"bc2ec101f"},{"cat":"at","lv":2,"q":"In welchem Jahr durften Frauen in Österreich erstmals bei einer Wahl zu einer gesamtstaatlichen Vertretung ihre Stimme abgeben?","e":"Die Wahlordnung vom 18. Dezember 1918 gab den Frauen das Wahlrecht. Erstmals wählten sie am 16. Februar 1919 die Konstituierende Nationalversammlung. 1907 wurde nur das allgemeine Männerwahlrecht eingeführt.","tag":"Wahlrecht","c":"1919","w":["1907","1927","1945"],"id":"b50e6cae2"},{"cat":"at","lv":3,"q":"Wofür sprach sich die Mehrheit im Abstimmungsgebiet bei der Kärntner Volksabstimmung am 10. Oktober 1920 aus?","e":"Im Abstimmungsgebiet (Zone A) sprach sich eine Mehrheit für den Verbleib bei Österreich aus; die Alternative war der Anschluss an den südslawischen Staat. Der 10. Oktober ist in Kärnten Landesfeiertag.","tag":"Erste Republik","c":"Für den Verbleib bei Österreich","w":["Für den Anschluss an den südslawischen Staat","Für den Anschluss an das Deutsche Reich","Für die Unabhängigkeit Kärntens"],"id":"baed67093"},{"cat":"at","lv":3,"q":"Zwischen welchen Seiten kam es im Februar 1934 in Österreich zu bewaffneten Kämpfen?","e":"Die Februarkämpfe (12. bis 15. Februar 1934) waren ein Bürgerkrieg: Regierungstruppen, Bundesheer und Heimwehr gingen gegen den Republikanischen Schutzbund der Sozialdemokraten vor. Danach wurde die Sozialdemokratische Partei verboten.","tag":"Erste Republik","c":"Die Regierung samt Heimwehr gegen den sozialdemokratischen Schutzbund","w":["Die Nationalsozialisten gegen die Bundesregierung","Das Bundesheer gegen deutsche Truppen","Die Kommunisten gegen die Christlichsozialen"],"id":"b1de3fc76"},{"cat":"at","lv":1,"q":"In welchem Jahr verlor Österreich durch den „Anschluss“ an das Deutsche Reich seine Eigenstaatlichkeit?","e":"Am 12. März 1938 marschierten deutsche Truppen ein, am 13. März wurde der „Anschluss“ gesetzlich proklamiert. Österreich bestand bis 1945 nicht mehr als eigener Staat.","tag":"Zeitgeschichte","c":"1938","w":["1934","1933","1945"],"id":"b49811853"},{"cat":"at","lv":3,"q":"An welchem Tag wurde 1945 die Wiederherstellung der demokratischen Republik Österreich in einer Unabhängigkeitserklärung verkündet?","e":"Am 27. April 1945 proklamierte die von Karl Renner geführte Provisorische Staatsregierung die Wiederherstellung der demokratischen Republik Österreich. Die ersten freien Wahlen fanden am 25. November 1945 statt, der Staatsvertrag folgte 1955.","tag":"Zweite Republik","c":"Am 27. April 1945","w":["Am 8. Mai 1945","Am 25. November 1945","Am 15. Mai 1955"],"id":"bddac8ad5"},{"cat":"at","lv":1,"q":"In welchem Gebäude wurde der Staatsvertrag am 15. Mai 1955 feierlich unterzeichnet?","e":"Der Staatsvertrag betreffend die Wiederherstellung eines unabhängigen und demokratischen Österreich wurde am 15. Mai 1955 im Schloss Belvedere unterzeichnet und trat am 27. Juli 1955 in Kraft.","tag":"Zweite Republik","c":"Im Schloss Belvedere in Wien","w":["In der Hofburg in Wien","Im Schloss Schönbrunn","Im Parlamentsgebäude am Ring"],"id":"b5748fe78"},{"cat":"at","lv":3,"q":"Wie verhalten sich Staatsvertrag von 1955 und Neutralität Österreichs zueinander?","e":"Der Staatsvertrag enthält keine Neutralitätsbestimmung. Der Nationalrat beschloss die Neutralität am 26. Oktober 1955 als eigenes Bundesverfassungsgesetz, nachdem die Besatzungstruppen abgezogen waren.","tag":"Zweite Republik","c":"Die Neutralität steht nicht im Staatsvertrag, sondern in einem Verfassungsgesetz","w":["Die Neutralität ist als eigener Artikel im Staatsvertrag verankert","Die Neutralität wurde 1955 durch eine Volksabstimmung beschlossen","Die Neutralität wurde erst 1995 beim EU-Beitritt rechtlich festgelegt"],"id":"b59d25161"},{"cat":"at","lv":1,"q":"Welches Orchester spielt traditionell das Neujahrskonzert im Wiener Musikverein?","e":"Das Neujahrskonzert im Goldenen Saal des Wiener Musikvereins wird seit Jahrzehnten von den Wiener Philharmonikern gespielt und weltweit übertragen. Im Programm stehen vor allem Werke der Familie Strauss.","tag":"Kultur","c":"Die Wiener Philharmoniker","w":["Die Berliner Philharmoniker","Die Wiener Sängerknaben","Das Salzburger Festspielorchester"],"id":"bcb7de6eb"},{"cat":"at","lv":1,"q":"In welcher Stadt wurde Wolfgang Amadeus Mozart 1756 geboren?","e":"Mozart wurde am 27. Jänner 1756 in Salzburg geboren. Später lebte und arbeitete er vor allem in Wien, wo er 1791 starb.","tag":"Kultur","c":"Salzburg","w":["Wien","Graz","Linz"],"id":"bb2750a3c"},{"cat":"at","lv":3,"q":"In welchem Jahr fanden die ersten Salzburger Festspiele statt?","e":"Die Salzburger Festspiele wurden 1920 mit Hugo von Hofmannsthals „Jedermann“ auf dem Domplatz eröffnet. Zu den Gründern zählten Max Reinhardt, Hugo von Hofmannsthal und Richard Strauss.","tag":"Kultur","c":"1920","w":["1895","1945","1960"],"id":"b119cc8a8"},{"cat":"at","lv":1,"q":"Welcher in Wien wirkende Arzt gilt als Begründer der Psychoanalyse?","e":"Sigmund Freud entwickelte die Psychoanalyse und lebte und arbeitete lange in Wien. Landsteiner entdeckte die Blutgruppen, Frankl begründete die Logotherapie, Semmelweis führte die Händedesinfektion ein.","tag":"Wissenschaft","c":"Sigmund Freud","w":["Karl Landsteiner","Viktor Frankl","Ignaz Semmelweis"],"id":"ba45636ea"},{"cat":"at","lv":3,"q":"Welcher österreichische Mediziner entdeckte 1901 das AB0-Blutgruppensystem und erhielt dafür 1930 den Nobelpreis?","e":"Karl Landsteiner entdeckte 1901 die Blutgruppen A, B und 0 und erhielt 1930 den Nobelpreis für Physiologie oder Medizin. Wagner-Jauregg wurde für die Malariatherapie ausgezeichnet (1927), Freud erhielt keinen Nobelpreis.","tag":"Wissenschaft","c":"Karl Landsteiner","w":["Sigmund Freud","Julius Wagner-Jauregg","Clemens von Pirquet"],"id":"bf33c36db"},{"cat":"at","lv":2,"q":"Welche Österreicherin erhielt 1905 als erste Frau den Friedensnobelpreis?","e":"Bertha von Suttner, Autorin des Romans „Die Waffen nieder!“, erhielt 1905 den Friedensnobelpreis. Lise Meitner und Marie von Ebner-Eschenbach erhielten keinen Nobelpreis.","tag":"Wissenschaft","c":"Bertha von Suttner","w":["Marie von Ebner-Eschenbach","Maria Theresia","Lise Meitner"],"id":"b7fd53664"},{"cat":"at","lv":3,"q":"Welches im Zweiten Weltkrieg zerstörte Wiener Haus wurde am 5. November 1955 mit Beethovens „Fidelio“ wiedereröffnet?","e":"Die Wiener Staatsoper wurde am 5. November 1955 mit „Fidelio“ wiedereröffnet. Das Burgtheater hatte schon im Oktober 1955 wieder eröffnet; Konzerthaus und Musikverein standen weiter.","tag":"Kultur","c":"Die Wiener Staatsoper","w":["Das Burgtheater","Das Wiener Konzerthaus","Der Wiener Musikverein"],"id":"b7881883d"},{"cat":"at","lv":2,"q":"Welcher der folgenden Tage ist in Österreich kein gesetzlicher Feiertag?","e":"Gesetzliche Feiertage sind unter anderem der 6. Jänner, der 15. August und der 8. Dezember. Der 24. Dezember und der 31. Dezember sind keine gesetzlichen Feiertage, auch wenn viele Betriebe an diesen Tagen früher schließen.","tag":"Feiertage","c":"Der 24. Dezember (Heiliger Abend)","w":["Der 6. Jänner (Heilige Drei Könige)","Der 15. August (Mariä Himmelfahrt)","Der 8. Dezember (Mariä Empfängnis)"],"id":"b36606e12"},{"cat":"at","lv":1,"q":"An welchem Tag wird in Österreich traditionell der Nikolaus gefeiert, den vielerorts der Krampus begleitet?","e":"Der Nikolaustag ist der 6. Dezember. Am Vorabend ziehen vielerorts Krampusse durch die Orte, eine alte Brauchtumsfigur im Alpenraum.","tag":"Bräuche","c":"Am 6. Dezember","w":["Am 24. Dezember","Am 1. November","Am 11. November"],"id":"b3af7bdd2"},{"cat":"at","lv":1,"q":"Zu welchem Anlass ziehen in Österreich Kinder als Sternsinger von Haus zu Haus?","e":"Die Sternsinger sind als Heilige Drei Könige verkleidete Kinder. Sie sammeln rund um den 6. Jänner Spenden für Hilfsprojekte und schreiben den Segen über die Haustür.","tag":"Bräuche","c":"Zum Dreikönigsfest am 6. Jänner","w":["Zum Osterfest im Frühling","Zu Allerheiligen am 1. November","Zum Nationalfeiertag am 26. Oktober"],"id":"b7be4e963"},{"cat":"av","lv":1,"q":"An wie vielen Testtagen findet das Auswahlverfahren für den Polizeidienst statt?","e":"Das Auswahlverfahren besteht aus zwei Testtagen: Tag 1 Computertestung, Tag 2 ärztliche Untersuchung und Aufnahmegespräch.","tag":"Testtage","t":"num","ans":2,"id":"b901808cc"},{"cat":"av","lv":1,"q":"Was findet am ersten Testtag statt?","e":"Am ersten Testtag wird am Computer getestet: psychologische Eignungsdiagnostik und klinisch-psychiatrisches Verfahren.","tag":"Testtage","c":"Psychologische Eignungsdiagnostik und ein klinisch-psychiatrisches Verfahren am Computer","w":["Sporttest und Diktat","Ärztliche Untersuchung und Aufnahmegespräch","Schwimmtest und Erste-Hilfe-Prüfung"],"id":"bba692d07"},{"cat":"av","lv":1,"q":"Was findet am zweiten Testtag statt?","e":"Am zweiten Testtag folgen die polizeiärztliche Untersuchung und das Aufnahmegespräch vor einer Kommission.","tag":"Testtage","c":"Ärztliche Untersuchung und Aufnahmegespräch","w":["Computertest und Diktat","Sporttest und Schwimmtest","Nur ein schriftlicher Allgemeinwissenstest"],"id":"b28e0413c"},{"cat":"av","lv":1,"q":"Gibt es im aktuellen Aufnahmeverfahren (Stand 2026) einen eigenen Sporttest?","e":"Das Verfahren hat nur zwei Testtage ohne Sporttest. Die Fahrradergometrie gehört zur ärztlichen Untersuchung. Ein Fitness-Check mit Limits folgt erst in der Grundausbildung.","tag":"Testtage","c":"Nein, die körperliche Leistungsfähigkeit wird bei der ärztlichen Untersuchung mit Fahrradergometrie geprüft","w":["Ja, mit Liegestützen und 3.000-m-Lauf am ersten Testtag","Ja, mit einem Hindernisparcours am zweiten Testtag","Ja, aber nur für Bewerber über 30 Jahre"],"id":"be7faec9b"},{"cat":"av","lv":1,"q":"Wie lange dauert die Computertestung am ersten Testtag ungefähr?","e":"Die psychologische Eignungsdiagnostik am Computer dauert laut den offiziellen Angaben etwa 2 bis 3 Stunden.","tag":"Testtag 1","c":"Etwa 2 bis 3 Stunden","w":["Etwa 20 Minuten","Etwa 8 Stunden","Zwei volle Tage"],"id":"bfbc05893"},{"cat":"av","lv":1,"q":"Welcher dieser Bereiche wird in der Computertestung geprüft?","e":"Geprüft werden logisches Denken, räumliches Vorstellen, Aufmerksamkeit, Merkfähigkeit, Textverständnis, Rechtschreibung und Grammatik sowie Persönlichkeit.","tag":"Testtag 1","c":"Merkfähigkeit","w":["Liegestütze","300 m Schwimmen","Schießen"],"id":"b57f0ea9f"},{"cat":"av","lv":2,"q":"Welche Bereichsgruppe beschreibt die psychologische Eignungsdiagnostik vollständig richtig?","e":"Diese sieben Bereiche nennt die offizielle Beschreibung der Computertestung.","tag":"Testtag 1","c":"Logisches Denken, räumliches Vorstellen, Aufmerksamkeit, Merkfähigkeit, Textverständnis, Rechtschreibung/Grammatik, Persönlichkeit","w":["Nur Rechtschreibung und Allgemeinwissen","Mathematik, Physik und Englisch","Sport, Erste Hilfe und Verkehrsrecht"],"id":"b1539cf35"},{"cat":"av","lv":1,"q":"Wie werden Rechtschreibung und Grammatik im Aufnahmeverfahren geprüft?","e":"Rechtschreibung und Grammatik sind Teil der Computertestung im Multiple-Choice-Format. Ein Diktat gibt es nicht.","tag":"Testtag 1","c":"Im Multiple-Choice-Format am Computer, ohne Diktat","w":["Mit einem Diktat auf Papier","Mit einem Aufsatz über den Polizeiberuf","Gar nicht"],"id":"b7f686a2e"},{"cat":"av","lv":2,"q":"Was gilt laut den offiziellen Fragen und Antworten für Mathematik?","e":"Laut FAQ werden mathematische Kenntnisse nicht eigens geprüft, Grundrechnungsarten sollte man aber beherrschen, etwa für Zahlenreihen.","tag":"Testtag 1","c":"Es gibt keine Prüfung mathematischer Kenntnisse, die Grundrechnungsarten werden aber vorausgesetzt","w":["Es gibt einen eigenen Mathematiktest mit Gleichungen","Mathematik wird mündlich im Aufnahmegespräch geprüft","Ein Taschenrechner ist beim Test vorgeschrieben"],"id":"b14be994e"},{"cat":"av","lv":2,"q":"Was passiert vor jeder Aufgabengruppe in der Computertestung?","e":"Vor jeder Aufgabengruppe gibt es Erklärungen und ungewertete Übungsbeispiele. Nutze sie, um die Aufgabenart sicher zu verstehen.","tag":"Testtag 1","c":"Es gibt Erklärungen und Übungsbeispiele, die nicht gewertet werden","w":["Man muss einen Zusatztest bestehen, um weitermachen zu dürfen","Die Aufgaben werden laut vorgelesen und sofort gewertet","Man bekommt die Lösungen der echten Aufgaben gezeigt"],"id":"bc8f59e58"},{"cat":"av","lv":2,"q":"Wie werden die Antworten in der Computertestung gegeben?","e":"Laut den offiziellen Angaben wird teils per Multiple Choice und teils über Textfelder geantwortet. Darum übt diese App auch Eingaben.","tag":"Testtag 1","c":"Teils per Multiple Choice, teils über Textfelder","w":["Nur mündlich","Nur handschriftlich auf Papier","Nur per Sprachaufnahme"],"id":"bc265bc22"},{"cat":"av","lv":2,"q":"Was untersucht das klinisch-psychiatrische Verfahren am ersten Testtag?","e":"Das klinisch-psychiatrische Verfahren am Computer erfasst Persönlichkeitsmerkmale und Risikoverhalten. Bei Auffälligkeiten folgt ein vertiefendes Gutachten.","tag":"Testtag 1","c":"Persönlichkeitsmerkmale und Risikoverhalten","w":["Die Sehschärfe","Die Ausdauer am Fahrrad","Rechtskenntnisse"],"id":"b9d43d860"},{"cat":"av","lv":2,"q":"Welches Dokument lädt man nach dem ersten Testtag hoch?","e":"Nach dem ersten Testtag ist die Sicherheitserklärung hochzuladen. Sie muss vollständig und wahrheitsgemäß sein.","tag":"Unterlagen","c":"Die Sicherheitserklärung","w":["Das Maturazeugnis","Den Reisepass","Ein Schwimmabzeichen"],"id":"b5a6705f9"},{"cat":"av","lv":2,"q":"Wie viele Monate Sperre drohen bei fehlenden oder falschen Angaben in der Sicherheitserklärung?","e":"Fehlende oder falsche Angaben in der Sicherheitserklärung führen zu einer Sperre von 12 Monaten.","tag":"Unterlagen","t":"num","ans":12,"id":"bf0d0d89a"},{"cat":"av","lv":1,"q":"Womit wird bei der ärztlichen Untersuchung die körperliche Belastbarkeit geprüft?","e":"Zur polizeiärztlichen Untersuchung gehören u. a. EKG, Spirometrie und eine Fahrradergometrie.","tag":"Testtag 2","c":"Mit einer Fahrradergometrie","w":["Mit einem 3.000-m-Lauf","Mit einem Klimmzugtest","Mit einem Schwimmtest"],"id":"bea07fba1"},{"cat":"av","lv":2,"q":"Wie viele Monate dürfen die Laborbefunde für die ärztliche Untersuchung höchstens alt sein?","e":"Laborbefunde und Lungenröntgen dürfen nicht älter als 3 Monate sein. Mach sie also erst nach der Einladung zum zweiten Testtag.","tag":"Testtag 2","t":"num","ans":3,"id":"bfdda4f14"},{"cat":"av","lv":2,"q":"Welcher Befund ist zur polizeiärztlichen Untersuchung mitzubringen?","e":"Mitzubringen sind u. a. Laborbefunde, Lungenröntgen p. a. und seitlich (je höchstens 3 Monate alt), der polizeiärztliche Fragebogen und das Formular zur Ergometrie.","tag":"Testtag 2","c":"Lungenröntgen (p. a. und seitlich), nicht älter als 3 Monate","w":["MRT beider Knie","Ein Schwimmabzeichen","Eine Bestätigung des Fitnesscenters"],"id":"b3f24ab08"},{"cat":"av","lv":1,"q":"Wie lange dauert das Aufnahmegespräch ungefähr?","e":"Das Aufnahmegespräch vor einer Kommission dauert rund 45 Minuten.","tag":"Testtag 2","c":"Etwa 45 Minuten","w":["Etwa 5 Minuten","Etwa 3 Stunden","Einen ganzen Tag"],"id":"b3c8e70ca"},{"cat":"av","lv":1,"q":"Wer führt das Aufnahmegespräch?","e":"Das Gespräch führt eine Kommission. Es geht um Kommunikation, Auftreten und darum, wie gut man sich mit dem Beruf befasst hat.","tag":"Testtag 2","c":"Eine Kommission","w":["Ein Computerprogramm","Die eigene Fahrschule","Eine Mitbewerberin oder ein Mitbewerber"],"id":"b17eb1d1e"},{"cat":"av","lv":2,"q":"Worauf achtet die Kommission im Aufnahmegespräch laut offizieller Beschreibung?","e":"Bewertet werden u. a. Kommunikation, Auftreten und wie sehr man sich mit dem Beruf auseinandergesetzt hat.","tag":"Testtag 2","c":"Kommunikation, Auftreten und Auseinandersetzung mit dem Polizeiberuf","w":["Nur auf Schulnoten","Nur auf die Körpergröße","Nur auf Fremdsprachenkenntnisse"],"id":"b4d97a597"},{"cat":"av","lv":1,"q":"Welche Unterlage soll man zum Aufnahmegespräch mitnehmen?","e":"Laut den offiziellen Angaben ist der Lebenslauf zum Aufnahmegespräch mitzubringen.","tag":"Testtag 2","c":"Den Lebenslauf","w":["Das Jahreszeugnis der Volksschule","Ein Empfehlungsschreiben eines Polizisten","Nichts, Unterlagen sind verboten"],"id":"b56d4330d"},{"cat":"av","lv":2,"q":"Wann gilt das Auswahlverfahren als bestanden?","e":"Wer in einem Teilbereich die Mindestkriterien nicht erreicht, bekommt den Punktewert Null. Die Mindestwerte werden nicht veröffentlicht.","tag":"Bewertung","c":"Wenn in allen Teilbereichen die Mindestkriterien erreicht werden","w":["Wenn die Hälfte der Teilbereiche bestanden ist","Wenn das Aufnahmegespräch gut verläuft, egal wie der Rest ausfällt","Wenn man am Computertest schneller als der Durchschnitt ist"],"id":"bf7b31c7d"},{"cat":"av","lv":2,"q":"Wer wird nach bestandenem Verfahren in den Lehrgang aufgenommen?","e":"Die Bestandenen werden nach Gesamtpunktwert gereiht. Darum zählt jeder Punkt in der Computertestung.","tag":"Bewertung","c":"Die Bestgereihten nach dem Gesamtpunktwert im jeweiligen Ausschreibungszeitraum","w":["Alle, die bestanden haben, ohne Reihung","Wer sich zuerst beworben hat","Wer im Bundesland wohnt, unabhängig von den Punkten"],"id":"bc36ff664"},{"cat":"av","lv":2,"q":"Wie viele Monate gelten die Testergebnisse ab dem ersten Testtag?","e":"Positive und negative Ergebnisse gelten 12 Monate ab dem ersten Testtag, bundesweit.","tag":"Bewertung","t":"num","ans":12,"id":"b7cd49b50"},{"cat":"av","lv":3,"q":"Wie oft kann man nicht bestandene Teilbereiche der psychologischen Eignungsdiagnostik wiederholen?","e":"Nicht bestandene Teilbereiche der psychologischen Diagnostik können einmalig nach sechs Monaten wiederholt werden.","tag":"Bewertung","c":"Einmalig, nach sechs Monaten","w":["Beliebig oft, jeden Monat","Nie","Zweimal, jeweils nach einer Woche"],"id":"bca37858f"},{"cat":"av","lv":3,"q":"Nach wie vielen Monaten kann man sich nach einem negativen Aufnahmegespräch neu bewerben?","e":"Bei negativem Aufnahmegespräch ist eine neue Bewerbung erst nach 12 Monaten möglich.","tag":"Bewertung","t":"num","ans":12,"id":"b576da62a"},{"cat":"av","lv":3,"q":"Was gilt, wenn ein Gutachten eine Auffälligkeit aus dem klinisch-psychiatrischen Verfahren bestätigt?","e":"Eine durch Gutachten bestätigte Auffälligkeit ist laut FAQ ein dauerhafter Ausschließungsgrund.","tag":"Bewertung","c":"Es ist ein dauerhafter Ausschließungsgrund","w":["Man darf nach einer Woche wiederholen","Es hat keine Folgen","Man muss nur einen Sporttest nachholen"],"id":"b8efc79d3"},{"cat":"av","lv":1,"q":"Wie bewirbt man sich für den Polizeidienst?","e":"Die Bewerbung erfolgt ausschließlich online über die Jobbörse der Republik Österreich.","tag":"Bewerbung","c":"Online über die Jobbörse der Republik Österreich auf eine konkrete Ausschreibung","w":["Mit einem Brief an die nächste Polizeiinspektion","Persönlich am Gemeindeamt","Über eine private Vermittlungsagentur"],"id":"b9d0f5e22"},{"cat":"av","lv":2,"q":"Was kann man abgeben, wenn gerade keine Ausschreibung für das gewünschte Bundesland offen ist?","e":"Laut FAQ kann man eine Interessensbekundung abgeben und wird verständigt, sobald eine Ausschreibung offen ist.","tag":"Bewerbung","c":"Eine Interessensbekundung, dann wird man per E-Mail verständigt","w":["Nichts, man muss jede Woche anrufen","Eine Bewerbung per Fax","Eine Bewerbung bei einem anderen Bundesland, die automatisch übertragen wird"],"id":"b81c97e9c"},{"cat":"av","lv":2,"q":"Darf man sich gleichzeitig bei mehreren Landespolizeidirektionen bewerben?","e":"Mehrfachbewerbungen bei mehreren Landespolizeidirektionen sind laut FAQ nicht möglich.","tag":"Bewerbung","c":"Nein, Mehrfachbewerbungen sind nicht möglich","w":["Ja, bei höchstens drei","Ja, bei allen neun","Ja, aber nur in Nachbarbundesländern"],"id":"b7c98afb7"},{"cat":"av","lv":1,"q":"Welche Staatsbürgerschaft ist Voraussetzung für die Aufnahme in den Polizeidienst?","e":"Die österreichische Staatsbürgerschaft ist Aufnahmevoraussetzung.","tag":"Voraussetzungen","c":"Die österreichische","w":["Jede EU-Staatsbürgerschaft","Keine bestimmte","Die österreichische oder die deutsche"],"id":"b6402f440"},{"cat":"av","lv":2,"q":"Bis wann muss der Führerschein B laut FAQ erlangt und nachgewiesen sein?","e":"Man kann sich ohne Führerschein bewerben. Er muss aber bis zum Beginn der Grundausbildung vorliegen, ohne Auflagen außer Sehbehelf.","tag":"Voraussetzungen","c":"Bis zum Beginn der Grundausbildung","w":["Bereits bei der Online-Bewerbung","Bis zum Ende der Grundausbildung","Gar nicht, er ist keine Voraussetzung"],"id":"b6d930318"},{"cat":"av","lv":1,"q":"Braucht man für die Bewerbung ein Schwimmabzeichen?","e":"Ein Abzeichen ist nicht nötig. Schwimmen können muss man trotzdem, es wird in der Ausbildung geprüft.","tag":"Voraussetzungen","c":"Nein, die Schwimmfähigkeit wird in der Grundausbildung überprüft","w":["Ja, mindestens das Freischwimmerabzeichen","Ja, das Helferschein-Abzeichen","Ja, ein Rettungsschwimmerabzeichen"],"id":"bdc06966e"},{"cat":"av","lv":2,"q":"Was gilt für Tätowierungen?","e":"Tattoos werden einzeln geprüft, Fotos davon lädt man bei der Bewerbung hoch.","tag":"Voraussetzungen","c":"Sie sind grundsätzlich möglich und werden im Einzelfall geprüft; extremistische, entwürdigende, sexistische oder gewaltverherrlichende Motive schließen aus","w":["Jede Tätowierung schließt die Aufnahme aus","Nur Tätowierungen am Rücken sind erlaubt","Tätowierungen spielen keinerlei Rolle und werden nie geprüft"],"id":"b15453a49"},{"cat":"av","lv":3,"q":"Was gilt laut den Bewerbungsinformationen für sichtbare Flesh Tunnels oder Plugs?","e":"Sichtbare subdermale oder transdermale Implantate, Flesh Tunnels und Plugs sind laut Bewerbungsseite nicht mit dem Polizeiberuf vereinbar.","tag":"Voraussetzungen","c":"Sie sind nicht mit dem Polizeiberuf vereinbar","w":["Sie sind ausdrücklich erlaubt","Sie sind nur in der Ausbildung verboten","Sie müssen nur bei der Bewerbung fotografiert werden"],"id":"b58bcb901"},{"cat":"av","lv":3,"q":"Wie viele Monate nach einer Augenlaser-Operation ist eine Bewerbung frühestens möglich?","e":"Nach einer Augenlaser-OP ist eine Bewerbung laut FAQ frühestens nach 3 Monaten möglich.","tag":"Voraussetzungen","t":"num","ans":3,"id":"b2ce33f88"},{"cat":"av","lv":1,"q":"Braucht man für die Bewerbung einen eigenen Deutsch-Sprachnachweis?","e":"Einen eigenen Sprachnachweis verlangt die FAQ nicht. Deutsch wird im Test im Multiple-Choice-Format geprüft.","tag":"Voraussetzungen","c":"Nein, Rechtschreibung und Grammatik werden in der Computertestung geprüft","w":["Ja, mindestens Niveau C2","Ja, die Matura in Deutsch","Ja, ein Diktat beim Gemeindeamt"],"id":"b10d1198b"},{"cat":"av","lv":1,"q":"Wie viele Monate dauert die Polizeigrundausbildung insgesamt?","e":"Die Grundausbildung dauert 24 Monate: 12 Monate Basisausbildung, 3 Monate Berufspraktikum I, 5 Monate Vertiefung mit Dienstprüfung, 4 Monate Berufspraktikum II.","tag":"Grundausbildung","t":"num","ans":24,"id":"b29e1b035"},{"cat":"av","lv":2,"q":"Wie viele Monate dauert die Basisausbildung am Anfang der Grundausbildung?","e":"Am Anfang stehen 12 Monate Basisausbildung, danach folgen Praktikum, Vertiefung mit Dienstprüfung und ein zweites Praktikum.","tag":"Grundausbildung","t":"num","ans":12,"id":"b6c1f71c5"},{"cat":"av","lv":2,"q":"Was folgt in der Grundausbildung direkt auf die zwölfmonatige Basisausbildung?","e":"Reihenfolge: Basisausbildung (12 Monate), Berufspraktikum I (3), Vertiefung mit Dienstprüfung (5), Berufspraktikum II (4).","tag":"Grundausbildung","c":"Berufspraktikum I (3 Monate)","w":["Die Dienstprüfung","Berufspraktikum II (4 Monate)","Die Ernennung zum Inspektor"],"id":"b00ffe441"},{"cat":"av","lv":2,"q":"In welcher Stadt liegt das Bildungszentrum der Sicherheitsakademie für die Steiermark?","e":"Das Bildungszentrum der Sicherheitsakademie (SIAK) für die Steiermark befindet sich in Graz.","tag":"Grundausbildung","c":"Graz","w":["Leoben","Murau","Bruck an der Mur"],"id":"b328c096d"},{"cat":"av","lv":2,"q":"Wie viele Liegestütze verlangt die Grundstufe des Fitness-Checks in der Ausbildung für Männer von 18 bis 29 Jahren?","e":"Grundstufe Männer 18–29: 15 Liegestütze, Leistungsstufe 21. Dazu kommt eine Ausdauerdisziplin nach Wahl. Der Check ist Teil der Ausbildung, nicht des Aufnahmeverfahrens.","tag":"Grundausbildung","t":"num","ans":15,"id":"b6929de57"},{"cat":"av","lv":3,"q":"Welche Zeit verlangt die Grundstufe beim 3.000-m-Lauf im Fitness-Check der Ausbildung (Männer 18–29)?","e":"Grundstufe 15:15 min, Leistungsstufe 13:45 min. Statt Laufen sind auch 20 km Radfahren oder 300 m Schwimmen wählbar.","tag":"Grundausbildung","c":"15:15 Minuten","w":["11:00 Minuten","13:45 Minuten","18:30 Minuten"],"id":"b8eb66629"},{"cat":"av","lv":2,"q":"Welchen Amtstitel trägt man nach erfolgreicher Grundausbildung und Dienstprüfung?","e":"Nach der Dienstprüfung folgt die Ernennung in die Verwendungsgruppe E2b mit dem Amtstitel Inspektor.","tag":"Grundausbildung","c":"Inspektor bzw. Inspektorin","w":["Revierinspektor","Chefinspektor","Gruppeninspektor"],"id":"b6a124cf4"},{"cat":"av","lv":2,"q":"Welcher Rhythmus gilt laut der Übersicht der Stichtage typischerweise (nicht verbindlich)? Bei einer Bewerbung im Jänner erfolgt die Aufnahme im …","e":"Typischer Rhythmus: Bewerbung Oktober → Aufnahme März, Jänner → Juni, April → September, Juli → Dezember. Die Termine sind nicht verbindlich.","tag":"Bewerbung","c":"Juni","w":["Februar","September","Dezember"],"id":"be4a1075d"},{"cat":"av","lv":1,"q":"Sind kostenpflichtige Vorbereitungskurse laut Innenministerium notwendig?","e":"Laut BMI sind Vorbereitungskurse nicht notwendig. Empfohlen werden Übung in Rechtschreibung und Grammatik, ein sicherer Umgang mit Maus und Tastatur und ein ausgeruhtes Erscheinen zum Test.","tag":"Vorbereitung","c":"Nein, sie sind nicht notwendig","w":["Ja, ohne Kurs ist keine Bewerbung möglich","Ja, ein Kurs bei der Polizei ist Pflicht","Ja, aber nur für die Steiermark"],"id":"b3d82c140"},{"cat":"av","lv":1,"q":"Wie heißt der offizielle Selbsttest des Innenministeriums zur Vorbereitung?","e":"Den Selbsttest „Fit für die Polizei“ gibt es auf polizeikarriere.gv.at unter „Specials“.","tag":"Vorbereitung","c":"Fit für die Polizei","w":["Polizei-Check 3000","Blaulicht-Quiz","Exekutiv-Fit"],"id":"b40587411"},{"cat":"gr","lv":1,"q":"Welche Zeitform liegt im Satz „Wir haben gestern Fußball gespielt.“ vor?","e":"Das Prädikat besteht aus dem Hilfsverb „haben“ im Präsens und dem Partizip II „gespielt“. Diese Verbindung bildet das Perfekt.","tag":"Zeitformen","c":"Perfekt","w":["Präteritum","Plusquamperfekt","Futur I"],"id":"bc090576d"},{"cat":"gr","lv":1,"q":"Mit welcher Frage ermittelt man den Akkusativ?","e":"Der Akkusativ antwortet auf „Wen oder was?“. Nominativ: „Wer oder was?“, Dativ: „Wem?“, Genitiv: „Wessen?“.","tag":"Fälle","c":"Wen oder was?","w":["Wer oder was?","Wem?","Wessen?"],"id":"b42afc9d6"},{"cat":"gr","lv":1,"q":"Welches Wort bildet den Plural mit einem Umlaut?","e":"Vater – Väter (Umlaut). Lehrer, Schüler und Onkel bleiben im Plural unverändert.","tag":"Pluralbildung","c":"der Vater","w":["der Lehrer","der Schüler","der Onkel"],"id":"b597d9398"},{"cat":"gr","lv":1,"q":"Ergänze die Lücke: Wir fahren mit ___ Bus zur Schule.","e":"Die Präposition „mit“ verlangt immer den Dativ. Dativ Singular maskulin: „dem Bus“.","tag":"Präpositionen","c":"dem","w":["den","der","des"],"id":"b98ccbf58"},{"cat":"gr","lv":1,"q":"Welches Wort bildet im Satz „Die Kinder spielen im Garten.“ das Prädikat?","e":"Das Prädikat ist die Satzaussage und besteht hier aus dem gebeugten Verb „spielen“.","tag":"Satzglieder","c":"spielen","w":["Kinder","Garten","im"],"id":"b049627ce"},{"cat":"gr","lv":1,"q":"Ergänze das Adjektiv in der richtigen Form: Der ___ (alt) Hund schläft im Korb.","e":"Nach dem bestimmten Artikel steht im Nominativ Singular maskulin die Endung -e: der alte Hund.","tag":"Adjektivendungen","t":"text","ans":["alte"],"id":"b74b1554b"},{"cat":"gr","lv":2,"q":"Welcher Satz drückt einen Wunsch im Konjunktiv II aus?","e":"„hätte“ ist Konjunktiv II und drückt einen unerfüllten Wunsch aus. Die anderen Sätze stehen im Indikativ bzw. im Konjunktiv I.","tag":"Konjunktiv","c":"Wenn ich doch nur Urlaub hätte!","w":["Ich bekomme morgen sicher Urlaub.","Hoffentlich hat er schon Urlaub.","Er sagt, er habe noch Urlaub."],"id":"b7eccd1e0"},{"cat":"gr","lv":2,"q":"Welcher Satz enthält ein Dativobjekt?","e":"„danken“ verlangt den Dativ (Wem dankt der Trainer? – den Spielern). Die anderen Verben haben ein Akkusativobjekt.","tag":"Fälle","c":"Der Trainer dankt den Spielern.","w":["Der Trainer ruft die Spieler.","Der Trainer lobt die Spieler.","Der Trainer besucht die Spieler."],"id":"b85b82ead"},{"cat":"gr","lv":1,"q":"Welches Wort ist ein Verb?","e":"„laufen“ ist ein Verb. „Läufer“ und „Lauf“ sind Nomen, „läufig“ ist ein Adjektiv.","tag":"Wortarten","c":"laufen","w":["Läufer","läufig","Lauf"],"id":"be4a2096e"},{"cat":"gr","lv":3,"q":"Welche Zeitform hat das Prädikat im Satz „Bis morgen Abend wird er das Buch gelesen haben.“?","e":"„wird gelesen haben“ besteht aus „werden“ im Präsens, dem Partizip II und dem Infinitiv „haben“. Das ist das Futur II (vollendete Zukunft).","tag":"Zeitformen","c":"Futur II","w":["Futur I","Plusquamperfekt","Perfekt"],"id":"bb9bb1b04"},{"cat":"gr","lv":1,"q":"Welche Form ist richtig? Von allen Sängern singt sie am ___.","e":"„gut“ wird unregelmäßig gesteigert: gut – besser – am besten.","tag":"Steigerung","c":"besten","w":["gutesten","bessersten","gütesten"],"id":"bad373c70"},{"cat":"gr","lv":1,"q":"Welcher Satz mit Nebensatz hat die richtige Wortstellung?","e":"Im Nebensatz mit „dass“ steht das gebeugte Verb am Ende.","tag":"Satzbau","c":"Ich glaube, dass er heute nicht kommt.","w":["Ich glaube, dass er kommt heute nicht.","Ich glaube, dass kommt er heute nicht.","Ich glaube, dass er heute kommt nicht."],"id":"b3194ec9e"},{"cat":"gr","lv":1,"q":"Ergänze das Hilfsverb: Er ___ den ganzen Tag zu Hause geblieben.","e":"„bleiben“ bildet das Perfekt mit „sein“: er ist geblieben.","tag":"Hilfsverben","c":"ist","w":["hat","wird","wurde"],"id":"baf2fc683"},{"cat":"gr","lv":2,"q":"Wie lautet der Satz „Der Hund beißt den Briefträger.“ im Vorgangspassiv (Präsens)?","e":"Passiv Präsens = „werden“ im Präsens + Partizip II. Das Akkusativobjekt wird zum Subjekt, das bisherige Subjekt zur Angabe mit „von“.","tag":"Passiv","c":"Der Briefträger wird vom Hund gebissen.","w":["Der Briefträger wurde vom Hund gebissen.","Der Hund wird vom Briefträger gebissen.","Der Hund wird den Briefträger gebissen."],"id":"b508d319f"},{"cat":"gr","lv":3,"q":"Welcher Satz enthält ein Genitivobjekt?","e":"„gedenken“ verlangt den Genitiv (Wessen gedenkt die Gemeinde? – der Opfer). „helfen“ und „danken“ verlangen den Dativ, „unterstützen“ den Akkusativ.","tag":"Fälle","c":"Die Gemeinde gedenkt der Opfer.","w":["Die Gemeinde hilft den Opfern.","Die Gemeinde dankt den Opfern.","Die Gemeinde unterstützt die Opfer."],"id":"bf194b859"},{"cat":"gr","lv":1,"q":"Welches Verb ist ein starkes Verb?","e":"Starke Verben ändern den Stammvokal (singen – sang – gesungen). Lachen, spielen und machen sind schwache Verben (lachte, spielte, machte).","tag":"Verbformen","c":"singen","w":["lachen","spielen","machen"],"id":"b05da40ed"},{"cat":"gr","lv":2,"q":"Welche Endung ist richtig? Sie trägt heute ein rot___ Kleid.","e":"Nach dem unbestimmten Artikel „ein“ erhält ein Adjektiv im Akkusativ Neutrum die Endung -es: ein rotes Kleid.","tag":"Adjektivendungen","c":"-es","w":["-e","-en","-er"],"id":"bfbfca08a"},{"cat":"gr","lv":2,"q":"Welche der folgenden Präpositionen ist keine Wechselpräposition?","e":"„bei“ verlangt immer den Dativ. „neben“, „zwischen“ und „hinter“ stehen je nach Frage (Wo? – Dativ, Wohin? – Akkusativ) mit beiden Fällen.","tag":"Präpositionen","c":"bei","w":["neben","zwischen","hinter"],"id":"b4e29c914"},{"cat":"gr","lv":2,"q":"Welches Wort ist im Satz „Das rote Auto steht vor der Garage.“ ein Attribut?","e":"Ein Attribut ist eine Beifügung zu einem Nomen: „rote“ beschreibt das „Auto“ näher. „steht“ ist das Prädikat, „Auto“ der Kern des Subjekts.","tag":"Satzglieder","c":"rote","w":["steht","Auto","Garage"],"id":"b77d5dcaf"},{"cat":"gr","lv":2,"q":"Ergänze das Präteritum von „fahren“: Gestern ___ er mit dem Rad zur Arbeit.","e":"fahren – fuhr – gefahren (starkes Verb mit Ablaut a – u – a).","tag":"Verbformen","t":"text","ans":["fuhr"],"id":"b2d6ad0cc"},{"cat":"gr","lv":2,"q":"Welche Pluralform ist richtig?","e":"Der Plural von „Museum“ lautet „Museen“. Die anderen Formen sind keine Standardformen.","tag":"Pluralbildung","c":"die Museen","w":["die Museume","die Musea","die Museums"],"id":"b6caec584"},{"cat":"gr","lv":1,"q":"Im Satz „Sie hilft ihrem Bruder.“ steht „ihrem Bruder“ im …","e":"„helfen“ verlangt den Dativ (Wem hilft sie? – ihrem Bruder). „ihrem“ ist eine typische Dativform (maskulin).","tag":"Fälle","c":"Dativ","w":["Nominativ","Akkusativ","Genitiv"],"id":"bb8361b9c"},{"cat":"gr","lv":3,"q":"Wann wird in der indirekten Rede statt des Konjunktivs I der Konjunktiv II verwendet?","e":"Ist die Konjunktiv-I-Form mit dem Indikativ identisch (z. B. „sie haben“), wird die Konjunktiv-II-Form („sie hätten“) als Ersatzform gebraucht, damit die indirekte Rede erkennbar bleibt.","tag":"Indirekte Rede","c":"Wenn der Konjunktiv I mit dem Indikativ gleich lautet","w":["Wenn die direkte Rede eine Frage oder Bitte enthält","Wenn die direkte Rede im Futur formuliert worden war","Wenn das Verb zusammen mit einem Modalverb steht"],"id":"ba716d390"},{"cat":"gr","lv":2,"q":"Setze das Nomen in den richtigen Fall: Ich habe den ___ (Mensch) nach dem Weg gefragt.","e":"„Mensch“ wird nach der n-Deklination gebeugt: Im Akkusativ Singular lautet die Form „den Menschen“.","tag":"Deklination","t":"text","ans":["Menschen"],"id":"b3151b2e9"},{"cat":"gr","lv":3,"q":"Welches Satzglied ist das Subjekt im Satz „Seit gestern gehört dem Nachbarn das Fahrrad.“?","e":"Das Subjekt steht im Nominativ und stimmt mit dem Verb überein (Was gehört dem Nachbarn? – das Fahrrad). „dem Nachbarn“ ist das Dativobjekt, „seit gestern“ eine Zeitangabe, „gehört“ das Prädikat.","tag":"Satzglieder","c":"das Fahrrad","w":["dem Nachbarn","seit gestern","gehört"],"id":"bda3489ac"},{"cat":"gr","lv":3,"q":"Welcher Satz ist grammatisch richtig?","e":"Mit einem Akkusativobjekt („das Auto“) bildet „fahren“ das Perfekt mit „haben“; mit „sein“ steht es nur ohne Objekt (sie ist in die Garage gefahren). Das Partizip II lautet „gefahren“.","tag":"Hilfsverben","c":"Sie hat das Auto in die Garage gefahren.","w":["Sie ist das Auto in die Garage gefahren.","Sie hat das Auto in die Garage gefahrt.","Sie ist das Auto in die Garage gefahrt."],"id":"b4612536a"},{"cat":"gr","lv":3,"q":"Welche Form passt in die Lücke? Bei ___ Wetter bleiben wir zu Hause. (schlecht)","e":"Ohne Artikel hat das Adjektiv im Dativ Singular Neutrum die Endung -em: bei schlechtem Wetter.","tag":"Adjektivendungen","c":"schlechtem","w":["schlechtes","schlechten","schlechter"],"id":"b9dbf6886"},{"cat":"gr","lv":2,"q":"Welche Steigerung von „gern“ ist richtig?","e":"„gern“ wird unregelmäßig gesteigert: gern – lieber – am liebsten.","tag":"Steigerung","c":"gern – lieber – am liebsten","w":["gern – gerner – am gernsten","gern – mehr gern – am meisten gern","gern – liebster – am lieber"],"id":"bb98c52e0"},{"cat":"gr","lv":1,"q":"Welcher Satz ist ein Aufforderungssatz?","e":"Ein Aufforderungssatz fordert zu einer Handlung auf und steht meist im Imperativ. Die anderen Sätze sind Aussage-, Frage- und Ausrufesatz.","tag":"Satzbau","c":"Öffne bitte das Fenster.","w":["Das Fenster ist offen.","Ist das Fenster offen?","Was für ein schönes Fenster!"],"id":"bfc330d21"},{"cat":"gr","lv":2,"q":"In welcher Zeitform steht „gegessen hatte“ im Satz „Nachdem er gegessen hatte, ging er spazieren.“?","e":"Hilfsverb „haben“ im Präteritum + Partizip II ergibt das Plusquamperfekt (Vorvergangenheit).","tag":"Zeitformen","c":"Plusquamperfekt","w":["Perfekt","Präteritum","Futur II"],"id":"b7789767d"},{"cat":"gr","lv":2,"q":"Das Präteritum von „ich muss“ lautet …","e":"Modalverben bilden das Präteritum mit der Endung -te und meist ohne Umlaut: muss – musste. „müsste“ ist der Konjunktiv II.","tag":"Modalverben","c":"ich musste","w":["ich müsste","ich mussde","ich gemusst"],"id":"b16a361bc"},{"cat":"gr","lv":2,"q":"Welches Verb verlangt den Dativ?","e":"Man gratuliert jemandem (Wem? – Dativ). Besuchen, unterstützen und begleiten haben ein Akkusativobjekt.","tag":"Fälle","c":"gratulieren","w":["besuchen","unterstützen","begleiten"],"id":"bf4f468cf"},{"cat":"gr","lv":2,"q":"Bilde den Plural: die Stadt – die ___","e":"Stadt – Städte (Umlaut und Endung -e).","tag":"Pluralbildung","t":"text","ans":["Städte"],"id":"b081af214"},{"cat":"gr","lv":3,"q":"Welcher Satz steht im Perfekt Passiv?","e":"Perfekt Passiv = „sein“ im Präsens + Partizip II + „worden“. „wurde geöffnet“ ist Präteritum, „wird geöffnet“ Präsens, „war geöffnet worden“ Plusquamperfekt Passiv.","tag":"Passiv","c":"Die Tür ist geöffnet worden.","w":["Die Tür wurde geöffnet.","Die Tür wird geöffnet.","Die Tür war geöffnet worden."],"id":"bc9541d5a"},{"cat":"gr","lv":3,"q":"Welche Wortart hat „während“ im Satz „Während des Films schlief er ein.“?","e":"Hier steht „während“ mit dem Genitiv („des Films“) vor einem Nomen: Präposition. Leitet es einen Nebensatz ein, ist es eine Konjunktion.","tag":"Wortarten","c":"Präposition","w":["Konjunktion","Adverb","Pronomen"],"id":"bccd33efb"},{"cat":"gr","lv":2,"q":"Welche Reihe zeigt die richtigen Stammformen von „trinken“?","e":"„trinken“ ist ein starkes Verb mit Ablaut: i – a – u.","tag":"Verbformen","c":"trinken – trank – getrunken","w":["trinken – trinkte – getrinkt","trinken – trunk – getrunken","trinken – trank – getrank"],"id":"b2521aaf1"},{"cat":"gr","lv":3,"q":"Ergänze: Nachdem sie die Prüfung bestanden ___, feierte sie mit ihren Freunden.","e":"Die vorzeitige Handlung steht im Plusquamperfekt, wenn der Hauptsatz im Präteritum steht: „hatte bestanden“ („bestehen“ bildet das Perfekt mit „haben“).","tag":"Zeitformen","c":"hatte","w":["war","wurde","wäre"],"id":"bb6d74b13"},{"cat":"gr","lv":2,"q":"Wie lautet der Konjunktiv I von „sein“ in der 3. Person Singular?","e":"Konjunktiv I: er sei. „wäre“ ist Konjunktiv II, „ist“ Indikativ Präsens, „war“ Indikativ Präteritum.","tag":"Konjunktiv","c":"er sei","w":["er wäre","er ist","er war"],"id":"ba615830d"},{"cat":"gr","lv":2,"q":"Welche Aufgabe hat „am Abend“ im Satz „Wir gehen am Abend ins Kino.“?","e":"„am Abend“ antwortet auf die Frage „Wann?“ und ist daher eine adverbiale Bestimmung der Zeit.","tag":"Satzglieder","c":"adverbiale Bestimmung der Zeit","w":["adverbiale Bestimmung des Ortes","Akkusativobjekt","Subjekt"],"id":"b9b1534f6"},{"cat":"gr","lv":1,"q":"Im Satz „Der Lehrer lobt den Schüler.“ steht „den Schüler“ im …","e":"„loben“ verlangt den Akkusativ (Wen lobt der Lehrer? – den Schüler). Im Nominativ hieße es „der Schüler“.","tag":"Fälle","c":"Akkusativ","w":["Nominativ","Dativ","Genitiv"],"id":"bfd8486fb"},{"cat":"gr","lv":2,"q":"Ergänze die Konjunktiv-II-Form von „haben“: Wenn ich mehr Zeit ___, würde ich öfter ins Kino gehen.","e":"Der irreale Bedingungssatz steht im Konjunktiv II: haben – ich hätte.","tag":"Konjunktiv","t":"text","ans":["hätte"],"id":"b6945e712"},{"cat":"gr","lv":2,"q":"Welcher Satz ist ein Satzgefüge (Hauptsatz und Nebensatz)?","e":"Ein Satzgefüge besteht aus Hauptsatz und Nebensatz („obwohl er müde ist“). Die Sätze mit „und sie weint“ und „sie weint, wir schweigen“ sind Satzreihen, „Er lacht laut und lange.“ ist ein einfacher Satz.","tag":"Satzbau","c":"Er lacht, obwohl er müde ist.","w":["Er lacht, und sie weint.","Er lacht laut und lange.","Er lacht, sie weint, wir schweigen."],"id":"b81d49cd8"},{"cat":"gr","lv":3,"q":"Welche Form passt in die Lücke? Trotz ___ Wetters fand das Fest statt. (schlecht)","e":"Im Genitiv Singular Neutrum ohne Artikel endet das Adjektiv auf -en: trotz schlechten Wetters.","tag":"Adjektivendungen","c":"schlechten","w":["schlechtem","schlechtes","schlechter"],"id":"b948647f2"},{"cat":"gr","lv":1,"q":"Welche Pluralform von „das Kind“ ist richtig?","e":"Plural: die Kinder. „Kindern“ wäre der Dativ Plural (mit den Kindern).","tag":"Pluralbildung","c":"die Kinder","w":["die Kinde","die Kinds","die Kindern"],"id":"b899ae601"},{"cat":"gr","lv":3,"q":"Welches Verb ist ein Mischverb (Vokalwechsel und schwache Endungen)?","e":"kennen – kannte – gekannt: Der Stammvokal wechselt, die Endungen sind aber schwach (-te, -t). Singen und geben sind starke Verben (sang, gab), lernen ist schwach ohne Vokalwechsel (lernte, gelernt).","tag":"Verbformen","c":"kennen","w":["singen","lernen","geben"],"id":"b978aa089"},{"cat":"gr","lv":1,"q":"Welches Satzglied erfragt man mit „Wer oder was?“?","e":"Nach dem Subjekt fragt man mit „Wer oder was?“; es steht im Nominativ.","tag":"Satzglieder","c":"Subjekt","w":["Prädikat","Dativobjekt","Attribut"],"id":"be2688f18"},{"cat":"gr","lv":2,"q":"Wie lautet das Präteritum von „bringen“ (er/sie/es)?","e":"bringen – brachte – gebracht: unregelmäßiges Verb mit Vokal- und Konsonantenwechsel und der Endung -te.","tag":"Verbformen","c":"brachte","w":["bringte","brang","gebracht"],"id":"bccd9e374"},{"cat":"gr","lv":3,"q":"Im Satz „Das Buch, das du suchst, liegt hier.“ steht „das“ nach dem Komma. Welche Wortart ist dieses „das“?","e":"Dieses „das“ bezieht sich auf „Buch“ und leitet den Relativsatz ein; es lässt sich durch „welches“ ersetzen. Eine Konjunktion wäre „dass“.","tag":"Wortarten","c":"Relativpronomen","w":["bestimmter Artikel","Konjunktion","Demonstrativpronomen"],"id":"b265a69dd"},{"cat":"gr","lv":2,"q":"Welches Adjektiv lässt sich nicht steigern?","e":"„tot“ bezeichnet einen Zustand ohne Abstufung. Kalt, klug und leise haben Komparativ und Superlativ (kälter, klüger, leiser).","tag":"Steigerung","c":"tot","w":["kalt","klug","leise"],"id":"b7e7c80b0"},{"cat":"gr","lv":1,"q":"Welche Form passt? Ich gehe heute Nachmittag ___ Arzt.","e":"Auf die Frage „Wohin?“ steht „zu dem“ = „zum“. „beim“ (bei dem) gibt an, wo man sich befindet.","tag":"Präpositionen","c":"zum","w":["beim","im","am"],"id":"be19b220c"},{"cat":"gr","lv":3,"q":"Welche Konjunktion passt? ___ ich gestern nach Hause kam, brannte im Wohnzimmer noch Licht.","e":"Für ein einmaliges Ereignis in der Vergangenheit steht „als“. „wenn“ steht bei Wiederholung („immer wenn“) oder in Gegenwart und Zukunft, „wann“ und „ob“ leiten Fragen ein.","tag":"Satzbau","c":"Als","w":["Wenn","Wann","Ob"],"id":"b8a7478e4"},{"cat":"gr","lv":2,"q":"Welche Verbform ist richtig? Meine Schwester und ich ___ gern Eis.","e":"„meine Schwester und ich“ entspricht „wir“; das Verb steht in der 1. Person Plural: wir essen.","tag":"Kongruenz","c":"essen","w":["isst","esst","esse"],"id":"b12851901"},{"cat":"gr","lv":1,"q":"Welches Wort hat den Artikel „das“?","e":"Es heißt das Fenster, aber der Sessel, die Gabel und die Wand.","tag":"Artikel","c":"Fenster","w":["Sessel","Gabel","Wand"],"id":"b6a87bdef"},{"cat":"gr","lv":3,"q":"In welchem Fall steht „einen Lügner“ im Satz „Sie nannte ihn einen Lügner.“?","e":"„nennen“ verlangt zwei Akkusative: „ihn“ (Objekt) und „einen Lügner“ (Gleichsetzung). Der Nominativ wäre „ein Lügner“.","tag":"Fälle","c":"Akkusativ","w":["Nominativ","Dativ","Genitiv"],"id":"b1b17cd55"},{"cat":"gr","lv":1,"q":"Ergänze den Komparativ von „viel“: Er hat ___ Geld als sein Bruder.","e":"viel – mehr – am meisten.","tag":"Steigerung","t":"text","ans":["mehr"],"id":"ba9965764"},{"cat":"gr","lv":1,"q":"Ergänze die Lücke: Sie hat große Angst ___ Hunden.","e":"Man hat Angst vor jemandem oder etwas; „vor“ steht hier mit dem Dativ.","tag":"Präpositionen","c":"vor","w":["an","bei","auf"],"id":"bf3f32050"},{"cat":"gr","lv":2,"q":"Wie lautet der Genitiv Singular von „der Student“?","e":"„Student“ gehört zur n-Deklination: Alle Fälle außer dem Nominativ Singular enden auf -en. Genitiv Singular: „des Studenten“.","tag":"Deklination","c":"des Studenten","w":["des Student","des Studentes","der Studenten"],"id":"be548f898"},{"cat":"gr","lv":3,"q":"Welche Form fehlt? Ich habe gestern leider nicht kommen ___.","e":"Steht ein Modalverb im Perfekt zusammen mit einem Infinitiv, tritt der Ersatzinfinitiv an die Stelle des Partizips II: ich habe nicht kommen können.","tag":"Modalverben","c":"können","w":["gekonnt","konnte","könnte"],"id":"b515eba8a"},{"cat":"gr","lv":1,"q":"Welcher Aussagesatz hat die richtige Wortstellung?","e":"Im Aussagesatz steht das gebeugte Verb an zweiter Stelle. Vor dem Verb steht genau ein Satzglied („Morgen“), danach folgt das Subjekt.","tag":"Satzbau","c":"Morgen besuche ich meine Tante.","w":["Morgen ich besuche meine Tante.","Morgen ich meine Tante besuche.","Besuche morgen ich meine Tante."],"id":"b588b3699"},{"cat":"gr","lv":2,"q":"Welches Wort leitet einen Nebensatz ein?","e":"„weil“ ist unterordnend: Das Verb steht am Satzende. „denn“, „aber“ und „und“ verbinden Hauptsätze.","tag":"Wortarten","c":"weil","w":["denn","aber","und"],"id":"b2ca8abd5"},{"cat":"gr","lv":2,"q":"Welche Form passt? Die ___ Kinder spielen im Park. (klein)","e":"Nach dem bestimmten Artikel im Plural endet das Adjektiv im Nominativ auf -en: die kleinen Kinder.","tag":"Adjektivendungen","c":"kleinen","w":["kleine","kleiner","kleines"],"id":"b7918bc10"},{"cat":"gr","lv":3,"q":"Welcher Satz steht im Futur I (Aktiv)?","e":"Futur I = „werden“ + Infinitiv (wird anrufen). „wird angerufen“ ist Vorgangspassiv im Präsens (werden + Partizip II), „wurde angerufen“ Passiv Präteritum, „hat angerufen“ Perfekt Aktiv.","tag":"Zeitformen","c":"Sie wird morgen anrufen.","w":["Sie wird morgen angerufen.","Sie wurde gestern angerufen.","Sie hat gestern angerufen."],"id":"b17388218"},{"cat":"gr","lv":1,"q":"Ergänze die Verbform im Präsens: Sie ___ jeden Abend ein Buch. (lesen)","e":"lesen – du liest – er/sie/es liest (Wechsel von e zu ie).","tag":"Verbformen","t":"text","ans":["liest"],"id":"badb048d2"},{"cat":"gr","lv":2,"q":"Ergänze das Relativpronomen: Das ist der Mann, ___ mir geholfen hat.","e":"Das Relativpronomen ist Subjekt des Relativsatzes (Wer hat geholfen?) und steht daher im Nominativ maskulin: der.","tag":"Satzbau","c":"der","w":["den","dem","dessen"],"id":"b396129df"},{"cat":"gr","lv":3,"q":"Welche Steigerung von „alt“ ist richtig?","e":"alt – älter – am ältesten: Der Vokal erhält einen Umlaut, und nach -t wird im Superlativ ein -e- eingefügt (-esten).","tag":"Steigerung","c":"alt – älter – am ältesten","w":["alt – alter – am altesten","alt – älter – am ältsten","alt – älter – am ältestem"],"id":"b837be37d"},{"cat":"gr","lv":2,"q":"Welche Wörter bilden das Prädikat im Satz „Der Zug ist pünktlich angekommen.“?","e":"Das Prädikat besteht aus dem Hilfsverb „ist“ und dem Partizip II „angekommen“ (Verbklammer). „pünktlich“ ist eine adverbiale Bestimmung.","tag":"Satzglieder","c":"ist angekommen","w":["Zug ist","ist pünktlich","pünktlich angekommen"],"id":"b121d4f69"},{"cat":"gr","lv":3,"q":"Ergänze: Wenn ich früher aufgestanden ___, hätte ich den Zug erreicht.","e":"Irrealer Bedingungssatz der Vergangenheit: Konjunktiv II von „sein“ + Partizip II. „aufstehen“ bildet das Perfekt mit „sein“: wäre aufgestanden.","tag":"Konjunktiv","c":"wäre","w":["hätte","war","würde"],"id":"b8f7efeca"},{"cat":"gr","lv":1,"q":"Welche Form passt in die Lücke? Ich habe einen ___ Bruder. (groß)","e":"Im Akkusativ Singular maskulin endet das Adjektiv nach „einen“ auf -en: einen großen Bruder.","tag":"Adjektivendungen","c":"großen","w":["großer","großes","große"],"id":"bc9d86afd"},{"cat":"gr","lv":3,"q":"Welche Funktion hat das Futur I im Satz „Er wird jetzt wohl zu Hause sein.“?","e":"Zusammen mit „jetzt“ und „wohl“ drückt das Futur I hier eine Vermutung über die Gegenwart aus, nicht ein künftiges Geschehen.","tag":"Zeitformen","c":"Vermutung über die Gegenwart","w":["Befehl an eine andere Person","Bericht über ein früheres Ereignis","feste Planung für morgen"],"id":"b722e5fe2"},{"cat":"gr","lv":2,"q":"Welche Pluralform von „Virus“ ist richtig?","e":"Der Plural von „Virus“ lautet „Viren“.","tag":"Pluralbildung","c":"Viren","w":["Virusse","Virusen","Virus"],"id":"b3648b1f1"},{"cat":"gr","lv":3,"q":"Ergänze das Partizip II von „nachdenken“: Ich habe lange darüber ___.","e":"denken – dachte – gedacht; bei der trennbaren Vorsilbe „nach-“ steht „-ge-“ dazwischen: nachgedacht.","tag":"Verbformen","t":"text","ans":["nachgedacht"],"id":"b2139945c"},{"cat":"gr","lv":2,"q":"Ergänze die Lücke: Er legt das Heft auf ___ Tisch.","e":"„legen“ fragt nach der Richtung (Wohin?): Die Wechselpräposition „auf“ steht dann mit dem Akkusativ – auf den Tisch.","tag":"Präpositionen","c":"den","w":["der","des","die"],"id":"ba73d7235"},{"cat":"gr","lv":1,"q":"Im Satz „Das Fahrrad meines Bruders ist neu.“ steht „meines Bruders“ im …","e":"Das Genitivattribut gibt den Besitzer an (Wessen Fahrrad? – das Fahrrad meines Bruders). „meines“ und die Endung -s sind typische Genitivformen.","tag":"Fälle","c":"Genitiv","w":["Nominativ","Dativ","Akkusativ"],"id":"bbc8ffd10"},{"cat":"gr","lv":3,"q":"Welche Wortart hat „Laufen“ im Satz „Das Laufen macht mir Spaß.“?","e":"Der Infinitiv ist hier nominalisiert (Artikel „das“, Großschreibung) und steht als Subjekt im Satz: Er wird als Nomen gebraucht.","tag":"Wortarten","c":"Nomen","w":["Verb","Adjektiv","Adverb"],"id":"b6eb6613b"},{"cat":"gr","lv":1,"q":"Welches Modalverb passt? Du ___ im Auto den Sicherheitsgurt anlegen. (Pflicht)","e":"Eine Pflicht bzw. Notwendigkeit drückt das Modalverb „müssen“ aus: du musst.","tag":"Modalverben","c":"musst","w":["darfst","kannst","willst"],"id":"bc162b5a1"},{"cat":"gr","lv":2,"q":"Welcher Satz ist richtig?","e":"Bei trennbaren Verben steht „zu“ zwischen Vorsilbe und Verbstamm, und das Wort wird zusammengeschrieben: aufzuräumen.","tag":"Satzbau","c":"Er hat vergessen, das Zimmer aufzuräumen.","w":["Er hat vergessen, das Zimmer zu aufräumen.","Er hat vergessen, das Zimmer auf zu räumen.","Er hat vergessen, das Zimmer aufräumen."],"id":"b2136b00e"},{"cat":"gr","lv":3,"q":"Wie lautet der Genitiv Singular von „der Name“?","e":"„Name“ hat im Genitiv die Endung -ns: des Namens (ebenso: des Gedankens, des Willens).","tag":"Deklination","c":"des Namens","w":["des Names","des Namen","der Namens"],"id":"bcdc11128"},{"cat":"gr","lv":1,"q":"Welcher Satz steht im Passiv?","e":"Passiv = „werden“ + Partizip II („wurde repariert“). Die anderen Sätze stehen im Aktiv.","tag":"Passiv","c":"Das Fenster wurde gestern repariert.","w":["Der Handwerker hat das Fenster repariert.","Das Fenster klemmt seit gestern.","Der Handwerker repariert das Fenster."],"id":"b24d2121b"},{"cat":"gr","lv":2,"q":"Welche Präposition wird in der Standardsprache mit dem Genitiv verbunden?","e":"„trotz“ steht standardsprachlich mit dem Genitiv (trotz des Regens). Seit, nach und bei verlangen immer den Dativ.","tag":"Präpositionen","c":"trotz","w":["seit","nach","bei"],"id":"b3be7ccd4"},{"cat":"gr","lv":3,"q":"Ergänze den Artikel: Wir haben mit Herrn Huber, ___ Leiter der Abteilung, gesprochen.","e":"Eine Apposition steht im selben Fall wie ihr Bezugswort: „mit Herrn Huber“ steht im Dativ, also auch „dem Leiter der Abteilung“.","tag":"Bezüge","c":"dem","w":["der","den","des"],"id":"b96e20caa"},{"cat":"gr","lv":2,"q":"Ergänze den Imperativ Singular von „geben“: ___ mir bitte das Salz!","e":"geben – gib! Starke Verben mit e-i-Wechsel bilden den Imperativ Singular ohne Endung.","tag":"Verbformen","t":"text","ans":["Gib"],"id":"b1f1d2f4f"},{"cat":"gr","lv":3,"q":"Wie viele Satzglieder hat der Satz „Am Samstag fährt meine Schwester mit dem Zug nach Wien.“?","e":"Umstellprobe: [Am Samstag] [fährt] [meine Schwester] [mit dem Zug] [nach Wien] = 5 Satzglieder (der Satz hat 10 Wörter).","tag":"Satzglieder","t":"num","ans":5,"id":"bc694a5a6"},{"cat":"gr","lv":1,"q":"Welcher Satz steht im Futur I?","e":"Futur I = „werden“ + Infinitiv: wird regnen. Die anderen Sätze stehen im Perfekt, Präteritum und Plusquamperfekt.","tag":"Zeitformen","c":"Morgen wird es regnen.","w":["Gestern hat es geregnet.","Gestern regnete es.","Gestern hatte es geregnet."],"id":"b7454145b"},{"cat":"gr","lv":2,"q":"In welchem Fall steht „ein guter Arzt“ im Satz „Er ist ein guter Arzt.“?","e":"Nach „sein“ steht das Prädikatsnomen im Nominativ wie das Subjekt (er = ein guter Arzt).","tag":"Fälle","c":"Nominativ","w":["Akkusativ","Dativ","Genitiv"],"id":"bc5d4ee0c"},{"cat":"gr","lv":2,"q":"Tom sagt: „Ich habe mein Handy verloren.“ Welcher Satz gibt das richtig in indirekter Rede wieder?","e":"In der indirekten Rede ändern sich die Pronomen (ich – er, mein – sein), und das Verb steht meist im Konjunktiv I: er habe verloren.","tag":"Indirekte Rede","c":"Tom sagt, er habe sein Handy verloren.","w":["Tom sagt, ich habe mein Handy verloren.","Tom sagt, er habe mein Handy verloren.","Tom sagt, er habe sein Handy verlieren."],"id":"b589bf236"},{"cat":"gr","lv":3,"q":"Wie lautet der Satz „Der Arzt hilft dem Kind.“ im Passiv (Präsens)?","e":"„helfen“ verlangt den Dativ. Im Passiv bleibt das Dativobjekt erhalten und wird nicht zum Subjekt: Dem Kind wird geholfen.","tag":"Passiv","c":"Dem Kind wird vom Arzt geholfen.","w":["Das Kind wird vom Arzt geholfen.","Der Arzt wird vom Kind geholfen.","Dem Kind wurde vom Arzt geholfen."],"id":"b4b087993"},{"cat":"gr","lv":2,"q":"Ergänze das Adjektiv in der richtigen Form: Sie wohnt in einem ___ (klein) Haus am Stadtrand.","e":"Im Dativ Singular Neutrum nach „einem“ endet das Adjektiv auf -en: in einem kleinen Haus.","tag":"Adjektivendungen","t":"text","ans":["kleinen"],"id":"bc6c7cea6"},{"cat":"gr","lv":3,"q":"Ergänze das Relativpronomen: Das ist die Frau, ___ Tochter Ärztin ist.","e":"Das Relativpronomen steht im Genitiv, weil es Zugehörigkeit angibt (die Tochter der Frau). Bezogen auf das Femininum „die Frau“ lautet es „deren“; „dessen“ bezieht sich auf Maskulina und Neutra.","tag":"Bezüge","c":"deren","w":["dessen","der","die"],"id":"bc71463df"},{"cat":"gr","lv":2,"q":"Welche Verbform ist richtig? Jeder von uns ___ einen Ausweis.","e":"Das Subjekt ist „jeder“ (3. Person Singular); „von uns“ ist nur eine nähere Bestimmung. Deshalb: jeder hat.","tag":"Kongruenz","c":"hat","w":["haben","habt","hast"],"id":"be0bd0d6f"},{"cat":"gr","lv":3,"q":"Wie viele Teilsätze (Haupt- und Nebensätze) enthält der Satz „Als er nach Hause kam, aß er, was seine Mutter gekocht hatte.“?","e":"1. „Als er nach Hause kam“ (Nebensatz), 2. „aß er“ (Hauptsatz), 3. „was seine Mutter gekocht hatte“ (Nebensatz).","tag":"Satzbau","t":"num","ans":3,"id":"b46b5e123"},{"cat":"gr","lv":1,"q":"Welches Gemüse nennt man in Österreich „Paradeiser“?","e":"„Paradeiser“ ist die österreichische Bezeichnung für die Tomate.","tag":"Austriazismen","c":"Tomate","w":["Paprika","Gurke","Radieschen"],"id":"b7fe8677a"},{"cat":"gr","lv":1,"q":"Welches Wort bedeutet ungefähr dasselbe wie „beginnen“?","e":"„Beginnen“ und „anfangen“ sind Synonyme. „Aufhören“ ist das Gegenteil, „zögern“ und „wiederholen“ bedeuten etwas anderes.","tag":"Synonyme","c":"anfangen","w":["aufhören","zögern","wiederholen"],"id":"be2ee5c30"},{"cat":"gr","lv":1,"q":"Was ist im Zusammenhang mit einer Straftat ein „Alibi“?","e":"Ein Alibi belegt, dass sich jemand zur Tatzeit nicht am Tatort aufgehalten hat. Damit soll ein Verdacht entkräftet werden.","tag":"Amtssprache","c":"der Nachweis, zur Tatzeit an einem anderen Ort gewesen zu sein","w":["ein Gegenstand, der am Tatort gefunden wurde","eine Aussage, die einen Verdächtigen belastet","das Geständnis einer Tat vor Gericht"],"id":"b45dd20a7"},{"cat":"gr","lv":1,"q":"Welche Konjunktion passt in die Lücke? „Die Streife fuhr mit Blaulicht, ___ ein Notruf eingegangen war.“","e":"Der eingegangene Notruf ist der Grund für die Fahrt mit Blaulicht, daher passt die begründende Konjunktion „weil“.","tag":"Konjunktionen","c":"weil","w":["obwohl","damit","sodass"],"id":"bdc9ab0fe"},{"cat":"gr","lv":1,"q":"Was bedeutet die Redewendung „das Handtuch werfen“?","e":"Die Wendung stammt aus dem Boxsport: Wirft der Betreuer das Handtuch in den Ring, gibt der Boxer den Kampf auf.","tag":"Redewendungen","c":"einen Kampf oder ein Vorhaben aufgeben","w":["sich nach einer Anstrengung erholen","einen Streit zwischen zwei Personen schlichten","sich mit ganzer Kraft für ein Ziel einsetzen"],"id":"b12463cda"},{"cat":"gr","lv":2,"q":"Welches Wort ist das Gegenteil von „absichtlich“?","e":"Wer etwas absichtlich tut, tut es mit Willen; das Gegenteil ist „versehentlich“, also ohne Absicht. „Wissentlich“ und „gezielt“ sind sinnverwandt mit „absichtlich“.","tag":"Antonyme","c":"versehentlich","w":["ausdrücklich","wissentlich","gezielt"],"id":"b18dce981"},{"cat":"gr","lv":2,"q":"Welcher Begriff ist der passende Oberbegriff für Diebstahl, Raub, Betrug und Sachbeschädigung?","e":"Alle vier Beispiele sind nach dem Strafgesetzbuch strafbare Handlungen, also Straftaten.","tag":"Oberbegriffe","c":"Straftaten","w":["Verwaltungsübertretungen","Zivilklagen","Unglücksfälle"],"id":"bb5b2ac6d"},{"cat":"gr","lv":2,"q":"Welcher Satz hat dieselbe Bedeutung wie „Obwohl es regnete, fand die Kontrolle statt“?","e":"„Obwohl“ drückt einen Gegengrund aus, ebenso die Präposition „trotz“. „Wegen“ und „dank“ nennen dagegen einen Grund, außerdem fällt die Kontrolle in zwei Sätzen aus.","tag":"Umformulieren","c":"Trotz des Regens fand die Kontrolle statt.","w":["Wegen des Regens fand die Kontrolle statt.","Dank des Regens fiel die Kontrolle aus.","Nach dem Regen fiel die Kontrolle aus."],"id":"b6838843d"},{"cat":"gr","lv":1,"q":"Welcher Monatsname entspricht in Deutschland dem österreichischen „Jänner“? Schreibe das Wort.","e":"In Österreich heißt der erste Monat des Jahres „Jänner“, in Deutschland „Januar“.","tag":"Austriazismen","t":"text","ans":["Januar"],"id":"bbba079be"},{"cat":"gr","lv":1,"q":"Welches Wort bezeichnet sowohl eine Sitzgelegenheit im Park als auch ein Geldinstitut?","e":"Das Wort „Bank“ hat mehrere Bedeutungen (Homonym): Sitzgelegenheit und Geldinstitut. Die anderen Wörter passen höchstens zu einer der beiden Bedeutungen.","tag":"Homonyme","c":"Bank","w":["Schalter","Sessel","Tresor"],"id":"b579de076"},{"cat":"gr","lv":2,"q":"Was ist ein „Dilemma“?","e":"Ein Dilemma ist eine Situation, in der man sich zwischen zwei ungünstigen Möglichkeiten entscheiden muss.","tag":"Fremdwörter","c":"eine Zwangslage mit zwei gleichermaßen unangenehmen Möglichkeiten","w":["eine Lage, in der man gar nichts mehr tun kann","ein Streit, der vor Gericht entschieden wird","eine Entscheidung, die alle Beteiligten zufriedenstellt"],"id":"bfb50bd10"},{"cat":"gr","lv":2,"q":"Was drückt die Nachsilbe „-bar“ im Wort „essbar“ aus?","e":"Die Nachsilbe „-bar“ bildet Adjektive und bedeutet „kann man …“, ähnlich wie in „trinkbar“ oder „lesbar“.","tag":"Wortbildung","c":"eine Möglichkeit: Man kann es essen.","w":["einen Mangel: Es gibt nichts zu essen.","eine Verkleinerung: Man isst nur ein wenig.","eine Wiederholung: Man isst es noch einmal."],"id":"b0a76761a"},{"cat":"gr","lv":2,"q":"In welchem Satz bleibt unklar, auf wen sich „er“ bezieht?","e":"Im richtigen Satz kommen mit „Beamter“ und „Zeuge“ zwei männliche Personen vor, „er“ kann also beide meinen. In den anderen Sätzen sorgen Geschlecht, Zahl oder nur eine genannte Person für Eindeutigkeit.","tag":"Pronomenbezug","c":"Der Beamte sprach mit dem Zeugen, bevor er die Wohnung verließ.","w":["Der Beamte sprach mit der Zeugin, bevor er die Wohnung verließ.","Der Beamte sprach lange, bevor er die Wohnung verließ.","Der Beamte sprach mit den Zeugen, bevor sie die Wohnung verließen."],"id":"b0660dee1"},{"cat":"gr","lv":2,"q":"Was ist ein „Indiz“?","e":"Ein Indiz ist ein Hinweis, der auf einen bestimmten Sachverhalt schließen lässt. Erst mehrere Indizien zusammen können eine Beweiskette ergeben.","tag":"Amtssprache","c":"ein Umstand, der auf eine Tatsache hindeutet, sie aber allein nicht beweist","w":["ein lückenloser Beweis, der keinen Zweifel mehr zulässt","die förmliche Anklage durch die Staatsanwaltschaft","die Aussage des Beschuldigten vor Gericht"],"id":"b7cd617fe"},{"cat":"gr","lv":2,"q":"Welche Formulierung passt am besten in einen sachlichen Polizeibericht?","e":"Ein Polizeibericht beschreibt nüchtern, was beobachtet wurde. Umgangssprache, persönliche Wertungen und Kommentare sind unpassend.","tag":"Stil","c":"Der Mann verließ gegen 22 Uhr das Lokal und ging in Richtung Bahnhof.","w":["Der komische Typ haute gegen 22 Uhr aus dem Lokal ab, Richtung Bahnhof.","Der Mann ist vermutlich ein Verbrecher und verließ gegen 22 Uhr das Lokal.","Der Mann verließ – man glaubt es kaum – gegen 22 Uhr das Lokal."],"id":"bbc00eca2"},{"cat":"gr","lv":2,"q":"Welche Wendung bedeutet ungefähr dasselbe wie „bändigen“?","e":"„Bändigen“ heißt, etwas Wildes oder Ungestümes unter Kontrolle zu bringen, etwa ein Tier oder die eigene Wut.","tag":"Synonyme","c":"unter Kontrolle bringen","w":["freien Lauf lassen","in Bewegung setzen","aus den Augen verlieren"],"id":"bc7fb2396"},{"cat":"gr","lv":2,"q":"Welches Lebensmittel heißt in Österreich „Topfen“?","e":"„Topfen“ ist die österreichische Bezeichnung für Quark, etwa in „Topfenstrudel“.","tag":"Austriazismen","c":"Quark","w":["Sauerrahm","Hartkäse","Buttermilch"],"id":"b4e459799"},{"cat":"gr","lv":2,"q":"Welches Verb bedeutet: etwas für eine bestimmte Zeit von jemandem nehmen und später zurückgeben?","e":"Wer etwas entleiht, bekommt es nur zeitweise. Wer etwas verleiht, gibt es zeitweise her.","tag":"Verwechselbare Wörter","c":"entleihen","w":["verleihen","verschenken","vererben"],"id":"b0dac1295"},{"cat":"gr","lv":3,"q":"Was bedeutet die Redewendung „das Kind mit dem Bade ausschütten“?","e":"Die Wendung warnt davor, beim Abschaffen von etwas Schlechtem auch das Wertvolle gleich mit wegzuwerfen.","tag":"Redewendungen","c":"aus Übereifer mit dem Schlechten auch das Gute verwerfen","w":["ein Problem durch gründliches Reinigen lösen","Kinder besonders streng erziehen","eine drohende Gefahr zu spät erkennen"],"id":"b24990eae"},{"cat":"gr","lv":3,"q":"Welches Wort gehört NICHT zur Wortfamilie von „schreiben“?","e":"„Schrift“, „Abschrift“ und „Beschreibung“ gehen auf „schreiben“ zurück. „Schreiner“ kommt von „Schrein“ (Kasten, Truhe) und hat sprachlich mit „schreiben“ nichts zu tun.","tag":"Wortfamilie","c":"Schreiner","w":["Schrift","Abschrift","Beschreibung"],"id":"b7e563444"},{"cat":"gr","lv":1,"q":"Welches Nahrungsmittel ist mit dem österreichischen Wort „Erdäpfel“ gemeint?","e":"„Erdäpfel“ ist in Österreich ein gebräuchliches Wort für Kartoffeln.","tag":"Austriazismen","c":"Kartoffeln","w":["Karotten","Rüben","Kastanien"],"id":"b42ed4ed5"},{"cat":"gr","lv":1,"q":"Welches Wort ist das Gegenteil von „sparsam“?","e":"Wer sparsam ist, geht mit Geld oder Vorräten haushälterisch um; wer verschwenderisch ist, gibt sie unnötig aus.","tag":"Antonyme","c":"verschwenderisch","w":["genügsam","bescheiden","sorgsam"],"id":"b150ed089"},{"cat":"gr","lv":2,"q":"Welches Wort gehört NICHT zur Wortfamilie von „fahren“?","e":"„Fahrer“, „Gefährt“ und „Abfahrt“ stammen von „fahren“ ab. „Fahne“ hat eine andere Herkunft (Tuch an einer Stange).","tag":"Wortfamilie","c":"Fahne","w":["Fahrer","Gefährt","Abfahrt"],"id":"b4a5a9364"},{"cat":"gr","lv":3,"q":"Welcher Satz ist im Verbalstil formuliert, kommt also ohne gehäufte Substantivierungen aus?","e":"Der Verbalstil drückt Handlungen durch Verben aus („eintraf“, „nahm auf“). Die anderen Sätze verwenden Nominalstil mit Substantiven wie „Eintreffen“ und „Aufnahme“.","tag":"Stil","c":"Als die Streife eintraf, nahm sie den Vorfall auf.","w":["Nach dem Eintreffen der Streife erfolgte die Aufnahme des Vorfalls.","Bei Eintreffen der Streife wurde die Aufnahme des Vorfalls vorgenommen.","Nach Eintreffen der Streife kam es zur Aufnahme des Vorfalls."],"id":"b19322f96"},{"cat":"gr","lv":1,"q":"Wer ist ein „Zeuge“?","e":"Ein Zeuge berichtet über das, was er selbst wahrgenommen hat. Verdächtige, Richter und Verteidiger haben andere Rollen.","tag":"Amtssprache","c":"eine Person, die zu einem Vorfall aus eigener Wahrnehmung aussagen kann","w":["eine Person, die einer Straftat verdächtigt wird","eine Person, die ein Verfahren leitet und entscheidet","eine Person, die einen Beschuldigten rechtlich vertritt"],"id":"b5d7494a7"},{"cat":"gr","lv":1,"q":"Ergänze die Analogie: Blatt verhält sich zu Baum wie Seite zu ___.","e":"Ein Blatt ist ein Teil des Baumes, eine Seite ist ein Teil eines Buches. Die Beziehung ist die von Teil und Ganzem.","tag":"Analogien","c":"Buch","w":["Schrift","Papier","Bibliothek"],"id":"b59014c39"},{"cat":"gr","lv":2,"q":"Welches Wort ist ein Synonym für „beharrlich“?","e":"Beharrlich ist, wer an einer Sache ausdauernd festhält; „hartnäckig“ meint dasselbe.","tag":"Synonyme","c":"hartnäckig","w":["gelegentlich","zögerlich","nachlässig"],"id":"bee10dcd8"},{"cat":"gr","lv":2,"q":"Was bedeutet die Redewendung „jemandem einen Bären aufbinden“?","e":"Wer jemandem einen Bären aufbindet, täuscht ihn mit einer unwahren Geschichte.","tag":"Redewendungen","c":"jemandem etwas Erfundenes als wahr erzählen","w":["jemandem eine schwere Last aufbürden","jemandem ein wertvolles Geschenk machen","jemanden vor einer Gefahr warnen"],"id":"b71b0dd77"},{"cat":"gr","lv":1,"q":"Welcher Begriff ist der passende Oberbegriff für Eiche, Buche, Fichte und Birke?","e":"Alle vier Pflanzen sind Bäume, also Gewächse mit einem holzigen Stamm.","tag":"Oberbegriffe","c":"Bäume","w":["Sträucher","Blumen","Gräser"],"id":"babad9442"},{"cat":"gr","lv":2,"q":"Welches Gegenteil von „legal“ ist richtig gebildet?","e":"Vor Wörtern, die mit „l“ beginnen, wird die lateinische Vorsilbe „in-“ zu „il-“ angeglichen: legal, illegal.","tag":"Wortbildung","c":"illegal","w":["inlegal","unlegal","irlegal"],"par":"§ 5","id":"ba8b782e8"},{"cat":"gr","lv":3,"q":"In welchem Satz ist „scheinbar“ im Sinne von „nur dem Schein nach, in Wirklichkeit aber nicht so“ verwendet?","e":"„Scheinbar“ bedeutet „nur dem Anschein nach“ (in Wirklichkeit ist es anders). In den anderen Sätzen ist „offenbar, wie es aussieht“ gemeint; dafür verwendet man besser „anscheinend“.","tag":"Verwechselbare Wörter","c":"Das Alibi des Mannes war scheinbar lückenlos, doch ein Zeuge widerlegte es.","w":["Es hat scheinbar die ganze Nacht geschneit, denn alle Dächer sind weiß.","Der Wagen steht scheinbar schon länger hier, wie das Laub auf dem Dach zeigt.","Die Straße ist scheinbar gesperrt, denn davor stehen Absperrgitter und ein Schild."],"id":"b43b26a12"},{"cat":"gr","lv":1,"q":"Welches Milchprodukt heißt in Österreich „Obers“?","e":"„Obers“ ist die österreichische Bezeichnung für Sahne, „Schlagobers“ für geschlagene Sahne.","tag":"Austriazismen","c":"Sahne","w":["Molke","Joghurt","Kefir"],"id":"b60ed5f27"},{"cat":"gr","lv":1,"q":"Welcher Satz hat dieselbe Bedeutung wie „Der Zeuge wurde vom Beamten befragt“?","e":"Im Passivsatz ist der Beamte der Handelnde. Im Aktivsatz steht er als Subjekt, der Zeuge als Objekt. Bei den anderen Sätzen sind die Rollen vertauscht oder es wird etwas anderes ausgesagt.","tag":"Umformulieren","c":"Der Beamte befragte den Zeugen.","w":["Der Zeuge befragte den Beamten.","Der Beamte wurde vom Zeugen befragt.","Der Beamte lud den Zeugen vor."],"id":"b188e9f38"},{"cat":"gr","lv":3,"q":"Was bedeutet das Fremdwort „redundant“?","e":"Redundant ist etwas, das mehrfach oder über das Nötige hinaus vorhanden ist, etwa eine doppelt gesagte Information.","tag":"Fremdwörter","c":"überflüssig, weil mehrfach oder im Übermaß vorhanden","w":["in sich widersprüchlich und unlogisch","für Fachfremde kaum verständlich","besonders knapp und genau formuliert"],"id":"ba90d471e"},{"cat":"gr","lv":2,"q":"Was bedeutet „Observation“ in der Polizeisprache?","e":"Observation (lateinisch observare, „beobachten“) bezeichnet das gezielte, meist verdeckte Beobachten. Befragung, Sicherstellung und öffentliche Suche (Fahndung) sind andere Maßnahmen.","tag":"Amtssprache","c":"das planmäßige, möglichst unauffällige Beobachten von Personen oder Orten","w":["die offene Befragung mehrerer Zeugen","die Sicherstellung von Beweisstücken","die öffentliche Suche nach einer Person mit Foto"],"id":"bbcdadc67"},{"cat":"gr","lv":2,"q":"Welches Verb ist das Gegenteil von „belasten“, wenn es um die Wirkung einer Aussage auf einen Beschuldigten geht?","e":"Eine Aussage kann einen Beschuldigten belasten (sie spricht gegen ihn) oder entlasten (sie spricht für ihn).","tag":"Antonyme","c":"entlasten","w":["befragen","überführen","verdächtigen"],"id":"b1d062547"},{"cat":"gr","lv":2,"q":"Welches Wort ist ein Synonym für „unverzüglich“?","e":"„Unverzüglich“ heißt ohne Verzögerung, ebenso „umgehend“. „Gelegentlich“, „vorläufig“ und „nachträglich“ bezeichnen andere zeitliche Verhältnisse.","tag":"Synonyme","c":"umgehend","w":["gelegentlich","vorläufig","nachträglich"],"id":"b35077e89"},{"cat":"gr","lv":2,"q":"Welches Gemüse heißt in Österreich „Karfiol“?","e":"„Karfiol“ ist die österreichische Bezeichnung für Blumenkohl.","tag":"Austriazismen","c":"Blumenkohl","w":["Brokkoli","Kohlrabi","Rosenkohl"],"id":"b0ae1fff8"},{"cat":"gr","lv":1,"q":"Was bezeichnet das österreichische Wort „Sackerl“?","e":"Ein „Sackerl“ ist eine kleine Tüte oder ein Beutel, zum Beispiel ein Einkaufssackerl.","tag":"Austriazismen","c":"eine Tüte aus Papier oder Plastik","w":["ein kleines Kopfkissen","eine kleine Reisetasche","ein feines Taschentuch"],"id":"b94ec7ecb"},{"cat":"gr","lv":1,"q":"Was ist ein „Verdächtiger“?","e":"Ein Verdächtiger wird verdächtigt, eine Tat begangen zu haben; bewiesen ist das noch nicht. Zeugen, Verurteilte und Anzeigeerstatter haben andere Rollen.","tag":"Amtssprache","c":"eine Person, die im Verdacht steht, eine Straftat begangen zu haben","w":["eine Person, die eine Straftat beobachtet hat","eine Person, die wegen einer Tat bereits verurteilt wurde","eine Person, die eine Anzeige erstattet hat"],"id":"b6952e37b"},{"cat":"gr","lv":1,"q":"Welche Konjunktion passt in die Lücke? „___ der Zeuge die Tat deutlich gesehen hatte, konnte er den Täter nicht beschreiben.“","e":"Der zweite Teil widerspricht der Erwartung (wer etwas gesehen hat, kann es meist beschreiben). Dafür braucht man die Konjunktion des Gegengrundes „obwohl“.","tag":"Konjunktionen","c":"Obwohl","w":["Weil","Damit","Sobald"],"id":"b50a1ae7f"},{"cat":"gr","lv":3,"q":"Was bedeutet das Wort „akribisch“?","e":"Akribisch (griechisch akribēs, „genau“) beschreibt eine sehr gründliche, bis ins Detail gehende Arbeitsweise.","tag":"Fremdwörter","c":"äußerst genau und sorgfältig","w":["flüchtig und oberflächlich","streng und unnachgiebig","langsam und umständlich"],"id":"ba58ac9bf"},{"cat":"gr","lv":1,"q":"Was bedeutet das Sprichwort „Wer andern eine Grube gräbt, fällt selbst hinein“?","e":"Das Sprichwort sagt, dass eine böse Absicht gegen andere oft auf den Urheber zurückfällt.","tag":"Redewendungen","c":"Wer anderen schaden will, schadet sich oft selbst.","w":["Wer andere anleitet, muss selbst mitarbeiten.","Wer gut plant, erreicht sein Ziel sicher.","Wer viel Erfahrung hat, macht keine Fehler."],"id":"bab668f6a"},{"cat":"gr","lv":2,"q":"Welcher Satz hat dieselbe Bedeutung wie „Der Täter flüchtete, bevor die Polizei eintraf“?","e":"„Bevor“ drückt aus, dass etwas früher geschieht. Das entspricht der Präposition „vor“. „Nach“ und „während“ nennen andere Zeitverhältnisse, „wegen“ einen Grund.","tag":"Umformulieren","c":"Der Täter flüchtete vor dem Eintreffen der Polizei.","w":["Der Täter flüchtete nach dem Eintreffen der Polizei.","Der Täter flüchtete während des Eintreffens der Polizei.","Der Täter flüchtete wegen des Eintreffens der Polizei."],"id":"b2ce6e6c6"},{"cat":"gr","lv":2,"q":"Welches Gemüse nennt man in Österreich „Fisolen“?","e":"„Fisolen“ sind in Österreich grüne Bohnen (Gartenbohnen).","tag":"Austriazismen","c":"grüne Bohnen","w":["grüne Erbsen","junger Spinat","Zuckermais"],"id":"b9ad6f7cb"},{"cat":"gr","lv":2,"q":"Welches Wort ist das Gegenteil von „oberflächlich“ im Sinne von „nicht gründlich“?","e":"Wer eingehend prüft, geht einer Sache genau auf den Grund. „Flüchtig“, „lässig“ und „beiläufig“ beschreiben eher ein ungenaues Vorgehen.","tag":"Antonyme","c":"eingehend","w":["flüchtig","lässig","beiläufig"],"id":"b9b7f25ce"},{"cat":"gr","lv":1,"q":"Welches Wort gehört zur Wortfamilie von „sprechen“?","e":"„Spruch“ ist von „sprechen“ abgeleitet. „Sprosse“, „Sprung“ und „Spreu“ gehören zu anderen Wortfamilien.","tag":"Wortfamilie","c":"Spruch","w":["Sprosse","Sprung","Spreu"],"id":"b28deefd7"},{"cat":"gr","lv":1,"q":"Welche Wortgruppe ist ein Pleonasmus, weil das Adjektiv nichts Neues sagt?","e":"Eine Glatze ist per Definition kahl; „kahle Glatze“ ist daher doppelt gesagt. Bei den anderen Wortgruppen liefert das Adjektiv eine zusätzliche Information.","tag":"Stil","c":"kahle Glatze","w":["kahler Baum","graue Haare","lange Narbe"],"id":"bf8505bfe"},{"cat":"gr","lv":3,"q":"Was bedeutet das österreichische Wort „Anrainer“?","e":"Ein Anrainer wohnt unmittelbar an einer Straße, einem Grundstück oder einem Gewässer; gleichbedeutend sind „Anwohner“ und „Anlieger“.","tag":"Austriazismen","c":"Anwohner","w":["Passant","Vermieter","Hausmeister"],"id":"bb1800e26"},{"cat":"gr","lv":2,"q":"Was meint man mit der Redewendung „Da liegt der Hund begraben“?","e":"Die Wendung weist auf den Kern oder die verborgene Ursache einer Schwierigkeit hin.","tag":"Redewendungen","c":"Hier liegt die eigentliche Ursache des Problems.","w":["Hier wurde etwas Wertvolles versteckt.","Hier ist die Lösung bereits gefunden.","Hier endet jede Möglichkeit zu helfen."],"id":"b1594130b"},{"cat":"gr","lv":1,"q":"Welcher Wortteil ist das Grundwort in „Zeugenaussage“?","e":"Bei zusammengesetzten Substantiven bestimmt das letzte Glied (Grundwort) die Grundbedeutung und den Artikel: die Aussage. „Zeugen“ ist das Bestimmungswort.","tag":"Wortbildung","c":"Aussage","w":["Zeuge","Zeugen","Zeug"],"id":"bf38ed6ac"},{"cat":"gr","lv":3,"q":"Was bedeutet das Wort „subsidiär“?","e":"„Subsidiär“ (lateinisch subsidium, „Hilfe“) bezeichnet etwas, das nur ergänzend oder ersatzweise gilt, wenn Vorrangiges nicht greift.","tag":"Fremdwörter","c":"hilfsweise eintretend und nachrangig","w":["vorrangig und rechtlich bindend","aus öffentlichen Geldern gefördert","nur für kurze Zeit gültig"],"id":"bde40f336"},{"cat":"gr","lv":2,"q":"Welches Wort bedeutet im Amtsverkehr dasselbe wie „Gesuch“?","e":"Ein Gesuch ist eine schriftliche Bitte an eine Behörde, also ein Antrag. Der Bescheid ist die Antwort der Behörde, die Vorladung eine Aufforderung zum Erscheinen.","tag":"Synonyme","c":"Antrag","w":["Bescheid","Vorladung","Quittung"],"id":"bd5b03858"},{"cat":"gr","lv":1,"q":"Was ist ein „Protokoll“ im amtlichen Sprachgebrauch?","e":"Ein Protokoll hält Inhalte, Aussagen oder den Ablauf schriftlich fest, zum Beispiel bei einer Vernehmung.","tag":"Amtssprache","c":"eine schriftliche Niederschrift über den Verlauf einer Befragung oder Sitzung","w":["eine mündliche Zusammenfassung ohne Aufzeichnung","eine Urkunde, mit der eine Strafe verhängt wird","eine Liste aller Mitarbeiter einer Dienststelle"],"id":"bfaa1a442"},{"cat":"gr","lv":3,"q":"Ergänze die Analogie: Prävention verhält sich zu Vorbeugung wie Intervention zu ___.","e":"Das Fremdwort „Prävention“ bedeutet Vorbeugung, das Fremdwort „Intervention“ bedeutet Eingreifen oder Einschreiten. Gesucht ist die deutsche Entsprechung des Fremdworts.","tag":"Analogien","c":"Eingreifen","w":["Verhinderung","Untersuchung","Bestrafung"],"id":"bf2bc388a"},{"cat":"gr","lv":1,"q":"Welches Gebäck ist mit dem österreichischen Wort „Semmel“ gemeint?","e":"Die „Semmel“ ist in Österreich das typische helle Brötchen.","tag":"Austriazismen","c":"ein Brötchen","w":["ein Krapfen","ein Zwieback","ein Lebkuchen"],"id":"b9ca5eb1a"},{"cat":"gr","lv":1,"q":"Was bedeutet die Redewendung „den Nagel auf den Kopf treffen“?","e":"Wer den Nagel auf den Kopf trifft, erfasst den Kern einer Sache genau.","tag":"Redewendungen","c":"eine Sache genau und treffend benennen","w":["sich beim Arbeiten verletzen","eine Behauptung stark übertreiben","ein Vorhaben endlich beginnen"],"id":"b95b0d37c"},{"cat":"gr","lv":2,"q":"Welches Wort bezeichnet sowohl ein Tier als auch eine Vorrichtung zum Öffnen und Schließen einer Wasserleitung?","e":"„Hahn“ ist das männliche Huhn und zugleich der Wasserhahn. „Ventil“ ist nur ein technisches Teil, „Falke“ und „Specht“ sind nur Tiere.","tag":"Homonyme","c":"Hahn","w":["Ventil","Falke","Specht"],"id":"bd6f90849"},{"cat":"gr","lv":2,"q":"Welches Wort kann „infolgedessen“ im Satz „Es hatte stark geschneit, infolgedessen kam der Zug zu spät“ ersetzen?","e":"„Infolgedessen“ nennt die Folge des vorher Gesagten und bedeutet „deshalb“ oder „daher“. „Trotzdem“ drückt einen Gegensatz aus, „außerdem“ eine Ergänzung, „nämlich“ eine Begründung des vorher Gesagten.","tag":"Synonyme","c":"deshalb","w":["trotzdem","außerdem","nämlich"],"id":"b42f1d6b9"},{"cat":"gr","lv":3,"q":"Welches Wort gehört zur Wortfamilie von „denken“?","e":"„Gedächtnis“ ist mit „denken“ und „gedenken“ verwandt. „Dichtung“, „Dachs“ und „Decke“ haben andere Wurzeln.","tag":"Wortfamilie","c":"Gedächtnis","w":["Dichtung","Dachs","Decke"],"id":"b33a28b0d"},{"cat":"gr","lv":3,"q":"Welcher Satz bedeutet dasselbe wie „Nicht jeder Zeuge hat die Tat gesehen“?","e":"„Nicht jeder“ verneint „jeder“: Es gibt mindestens einen, auf den es nicht zutrifft. Das schließt nicht aus, dass andere Zeugen die Tat gesehen haben; „kein einziger“ wäre eine stärkere Aussage.","tag":"Umformulieren","c":"Mindestens ein Zeuge hat die Tat nicht gesehen.","w":["Kein einziger Zeuge hat die Tat gesehen.","Jeder Zeuge hat die Tat gesehen.","Genau ein Zeuge hat die Tat gesehen."],"id":"b13596b51"},{"cat":"gr","lv":2,"q":"Was bedeutet das Wort „Stiege“ in Österreich, zum Beispiel im Satz „Die Stiege im Haus wurde frisch gereinigt“?","e":"„Stiege“ ist in Österreich und Süddeutschland die gebräuchliche Bezeichnung für eine Treppe.","tag":"Austriazismen","c":"Treppe","w":["Leiter","Rampe","Aufzug"],"id":"b18cb8855"},{"cat":"gr","lv":3,"q":"Was versteht
