man in der Behördensprache unter einer „Amtshandlung“?","e":"Eine Amtshandlung ist das dienstliche Tätigwerden einer Behörde oder ihrer Organe, etwa einer Streife bei einer Kontrolle.","tag":"Amtssprache","c":"eine dienstliche Tätigkeit einer Behörde oder ihrer Organe","w":["eine private Tätigkeit eines Beamten in seiner Freizeit","jeder Besuch einer Bürgerin oder eines Bürgers im Amtsgebäude","eine schriftliche Beschwerde gegen eine Behörde"],"id":"b5aef8f0c"},{"cat":"gr","lv":2,"q":"Welches Wort ist aus einem Verbstamm und einem Substantiv zusammengesetzt?","e":"„Schreibtisch“ besteht aus dem Verbstamm „schreib-“ und dem Substantiv „Tisch“. „Bücherregal“ und „Haustür“ sind Substantiv plus Substantiv, „Hochhaus“ ist Adjektiv plus Substantiv.","tag":"Wortbildung","c":"Schreibtisch","w":["Bücherregal","Hochhaus","Haustür"],"id":"bd327c863"},{"cat":"gr","lv":1,"q":"Welches Wort ist das Gegenteil von „mutig“?","e":"Wer mutig ist, stellt sich einer Gefahr; wer feige ist, weicht ihr aus Furcht aus.","tag":"Antonyme","c":"feige","w":["stolz","zornig","höflich"],"id":"b577eac27"},{"cat":"gr","lv":3,"q":"Welches Wort bedeutet im Satz „Das ist ein gewagtes Unterfangen“ dasselbe wie „Unterfangen“?","e":"Ein Unterfangen ist ein Vorhaben oder Unternehmen, das man in Angriff nimmt.","tag":"Synonyme","c":"Vorhaben","w":["Versehen","Zugeständnis","Hindernis"],"id":"bf60b7960"},{"cat":"gr","lv":1,"q":"Was versteht man im Strafrecht unter einer „Anzeige“?","e":"Mit einer Anzeige wird den Behörden ein möglicher strafbarer Sachverhalt gemeldet. Die anderen Antworten beschreiben andere Verfahrensschritte.","tag":"Amtssprache","c":"die Mitteilung eines Verdachts auf eine Straftat an Polizei oder Staatsanwaltschaft","w":["die Verkündung eines Urteils im Gerichtssaal","die vorläufige Festnahme einer verdächtigen Person","die Bestellung eines Verteidigers durch das Gericht"],"id":"b1cb06cfc"},{"cat":"gr","lv":2,"q":"Welcher Satz ist richtig geschrieben?","e":"„Seid“ ist die Form von „sein“ (ihr seid). „Seit“ ist die Präposition für einen Zeitraum (seit drei Stunden).","tag":"Verwechselbare Wörter","c":"Ihr seid seit drei Stunden unterwegs.","w":["Ihr seit seit drei Stunden unterwegs.","Ihr seid seid drei Stunden unterwegs.","Ihr seit seid drei Stunden unterwegs."],"id":"b44918784"},{"cat":"gr","lv":2,"q":"Was bedeutet das Wort „plausibel“?","e":"Eine plausible Erklärung klingt schlüssig und ist gut nachvollziehbar, muss aber noch nicht bewiesen sein.","tag":"Fremdwörter","c":"einleuchtend und nachvollziehbar","w":["zweifelsfrei bewiesen","zufällig entstanden","absichtlich verfälscht"],"id":"b1277ec3a"},{"cat":"gr","lv":2,"q":"Was bedeutet die Redewendung „ein Wolf im Schafspelz“?","e":"Das Bild geht auf ein Bibelwort (Matthäus 7,15) zurück und beschreibt jemanden, der seine schlechten Absichten hinter einer harmlosen Fassade verbirgt.","tag":"Redewendungen","c":"jemand, der sich harmlos gibt, aber Böses im Sinn hat","w":["jemand, der sich vor Gefahren gut zu schützen weiß","jemand, der am liebsten in einer großen Gruppe arbeitet","jemand, der nach außen streng wirkt, aber gutmütig ist"],"id":"b2416b83d"},{"cat":"gr","lv":2,"q":"Ergänze die Analogie: Zustimmung verhält sich zu Ablehnung wie Lob zu ___.","e":"Zustimmung und Ablehnung sind Gegensätze, ebenso Lob und Tadel. Ehre, Dank und Beifall sind eher sinnverwandt mit Lob.","tag":"Analogien","c":"Tadel","w":["Ehre","Dank","Beifall"],"id":"bace59b8f"},{"cat":"gr","lv":1,"q":"Worauf bezieht sich das zweite „das“ im Satz „Der Zeuge zeigte dem Polizisten das Foto, das er am Abend aufgenommen hatte“?","e":"Das zweite „das“ ist ein Relativpronomen. Es steht im Neutrum und bezieht sich daher auf „das Foto“. Zeuge, Polizist und Abend sind männliche Substantive.","tag":"Pronomenbezug","c":"auf das Foto","w":["auf den Zeugen","auf den Polizisten","auf den Abend"],"id":"b010a25d6"},{"cat":"gr","lv":3,"q":"Was bedeutet die Redewendung „Es fiel ihm wie Schuppen von den Augen“?","e":"Die Wendung beschreibt einen plötzlichen Moment der Einsicht, in dem man einen Zusammenhang erkennt.","tag":"Redewendungen","c":"Er durchschaute plötzlich, was ihm lange unklar war.","w":["Er bekam eine Augenkrankheit und sah schlechter.","Er wollte eine Wahrheit nicht länger wahrhaben.","Er wurde von einer Sache völlig geblendet."],"id":"b00675e2b"},{"cat":"gr","lv":3,"q":"Welches Wort ist durch Ableitung mit einer Nachsilbe entstanden und keine Zusammensetzung?","e":"„Freundschaft“ besteht aus dem Wortstamm „Freund“ und der Nachsilbe „-schaft“. „Freundeskreis“, „Handschuh“ und „Schreibblock“ verbinden jeweils zwei selbstständige Wörter.","tag":"Wortbildung","c":"Freundschaft","w":["Freundeskreis","Handschuh","Schreibblock"],"id":"be0a4f88d"},{"cat":"gr","lv":3,"q":"Welches Verb bedeutet ungefähr dasselbe wie „ahnden“, zum Beispiel in „ein Vergehen ahnden“?","e":"Ein Vergehen zu ahnden heißt, es mit einer Strafe oder Sanktion zu belegen. Nicht zu verwechseln mit „ahnen“ (vermuten).","tag":"Synonyme","c":"bestrafen","w":["verzeihen","verhindern","untersuchen"],"id":"bd2ccf111"},{"cat":"gr","lv":3,"q":"Welches Wort passt inhaltlich nicht zu den anderen dreien?","e":"Marille (Aprikose), Ribisel (Johannisbeere) und Zwetschke (Pflaume) sind Obstsorten. „Kren“ ist der österreichische Ausdruck für Meerrettich, eine scharfe Wurzel.","tag":"Oberbegriffe","c":"Kren","w":["Marille","Ribisel","Zwetschke"],"id":"b0bee0edb"},{"cat":"gr","lv":3,"q":"Welcher Satz bedeutet dasselbe wie „Der Fahrer darf nur weiterfahren, wenn die Kontrolle abgeschlossen ist“?","e":"„Nur wenn“ nennt die einzige Bedingung. „Es sei denn“ drückt dieselbe Ausnahme aus: nicht weiterfahren, außer die Kontrolle ist abgeschlossen. Die anderen Sätze ändern die Bedingung.","tag":"Konjunktionen","c":"Der Fahrer darf nicht weiterfahren, es sei denn, die Kontrolle ist abgeschlossen.","w":["Der Fahrer darf weiterfahren, solange die Kontrolle noch läuft.","Der Fahrer darf nicht weiterfahren, sobald die Kontrolle abgeschlossen ist.","Der Fahrer darf weiterfahren, auch wenn die Kontrolle nicht abgeschlossen ist."],"id":"b4c204d86"},{"cat":"gr","lv":2,"q":"Was bedeutet es, eine Aussage „sinngemäß“ wiederzugeben?","e":"Sinngemäß heißt: dem Sinn nach, mit eigenen Worten, aber ohne den Inhalt zu verändern. Wörtlich ist das Gegenteil.","tag":"Verwechselbare Wörter","c":"dem Inhalt nach, aber nicht Wort für Wort","w":["Wort für Wort in derselben Reihenfolge","mit eigenen Ergänzungen und Vermutungen","ohne die wichtigen Einzelheiten und stark verkürzt"],"id":"b9ddab7cd"},{"cat":"gr","lv":3,"q":"Welches Wort ist das Gegenteil von „pauschal“, zum Beispiel in „eine pauschale Beurteilung“?","e":"Pauschal heißt „ohne Unterschiede zu machen“, differenziert heißt „unter Beachtung der Unterschiede im Einzelnen“. „Allgemein“ und „vereinfacht“ sind eher sinnverwandt mit „pauschal“.","tag":"Antonyme","c":"differenziert","w":["allgemein","vereinfacht","umfassend"],"id":"b2e9a75e8"},{"cat":"gr","lv":3,"q":"Welche Zuordnung (österreichisches Wort – deutsche Standardentsprechung) ist richtig?","e":"Ribisel sind Johannisbeeren. Die Marille ist die Aprikose, die Fisole eine grüne Bohne und der Karfiol der Blumenkohl.","tag":"Austriazismen","c":"Ribisel – Johannisbeere","w":["Marille – Pflaume","Fisole – Erbse","Karfiol – Rosenkohl"],"id":"b9e098d12"},{"cat":"gr","lv":2,"q":"Was bedeutet die Abkürzung „i. A.“ vor der Unterschrift unter einem amtlichen Schreiben?","e":"„i. A.“ bedeutet „im Auftrag“: Die unterschreibende Person handelt für die Leitung. „In Vertretung“ wird dagegen mit „i. V.“ abgekürzt.","tag":"Abkürzungen","c":"im Auftrag","w":["im Amt","in Abwesenheit","im Allgemeinen"],"id":"b81c6979e"},{"cat":"gr","lv":3,"q":"Was bedeutet das Wort „ambivalent“?","e":"Ambivalent ist etwas, das zwei gegensätzliche Seiten hat, etwa gemischte Gefühle gegenüber einer Sache.","tag":"Fremdwörter","c":"in sich widersprüchlich, zwiespältig","w":["gleichgültig gegenüber allem","eindeutig in eine Richtung weisend","kaum wahrnehmbar vorhanden"],"id":"bb2ac51d4"},{"cat":"gr","lv":3,"q":"Welcher Satz bedeutet dasselbe wie „Ohne den Hinweis des Nachbarn hätte man den Dieb nicht gefasst“?","e":"Im Ausgangssatz war der Hinweis die Voraussetzung für die Festnahme. Das drückt der Konjunktiv II („hätte … gesagt, wäre … gefasst worden“) aus. Die anderen Sätze behaupten das Gegenteil oder ändern den Zusammenhang.","tag":"Umformulieren","c":"Hätte der Nachbar nichts gesagt, wäre der Dieb nicht gefasst worden.","w":["Obwohl der Nachbar nichts sagte, wurde der Dieb gefasst.","Da der Nachbar schwieg, wurde der Dieb gefasst.","Der Nachbar gab einen Hinweis, trotzdem wurde der Dieb nicht gefasst."],"id":"baf491230"},{"cat":"gr","lv":3,"q":"Was ist ein „Asservat“?","e":"Asservate (lateinisch asservare, „aufbewahren“) sind sichergestellte Gegenstände, die als Beweismittel aufbewahrt werden, zum Beispiel in der Asservatenkammer.","tag":"Amtssprache","c":"ein sichergestellter Gegenstand, der als Beweismittel verwahrt wird","w":["eine amtliche Abschrift einer Zeugenaussage","eine Bescheinigung über das Ende einer Haft","eine Liste aller am Tatort angetroffenen Personen"],"id":"b71c973a6"},{"cat":"gr","lv":3,"q":"Ergänze die Analogie: Marille verhält sich zu Steinobst wie Ribisel zu ___.","e":"Die Marille (Aprikose) hat einen Steinkern und gehört zum Steinobst. Die Ribisel (Johannisbeere) gehört zum Beerenobst.","tag":"Analogien","c":"Beerenobst","w":["Kernobst","Schalenobst","Südfrüchte"],"id":"b406eb711"},{"cat":"gr","lv":3,"q":"Was bedeutet das Wort „eruieren“?","e":"Eruieren (lateinisch eruere, „herausholen“) bedeutet, durch Nachforschungen etwas zu ermitteln, etwa die Ursache eines Unfalls.","tag":"Fremdwörter","c":"durch Nachforschen herausfinden","w":["vorsichtig andeuten","entschieden bestreiten","vorläufig festhalten"],"id":"bd959fa79"},{"cat":"gr","lv":3,"q":"Was bedeutet der Ausdruck „Gefahr im Verzug“?","e":"„Verzug“ meint hier die Verzögerung. Bei Gefahr im Verzug würde ein Zuwarten die Gefahr oder den Schaden vergrößern, daher ist rasches Handeln nötig.","tag":"Amtssprache","c":"Es muss sofort gehandelt werden, weil ein Aufschub den Schaden vergrößern würde.","w":["Eine Gefahr ist bereits vollständig beseitigt worden.","Der Einsatz verzögert sich wegen fehlender Fahrzeuge.","Eine Behörde hat die Zuständigkeit noch nicht geklärt."],"id":"bf12d21b9"},{"cat":"gr","lv":2,"q":"Welches Wort wird in Deutschland für die österreichische „Marille“ verwendet? Schreibe das Wort.","e":"„Marille“ ist die österreichische Bezeichnung für die Aprikose.","tag":"Austriazismen","t":"text","ans":["Aprikose","Aprikosen"],"id":"beee9b888"},{"cat":"gr","lv":3,"q":"Was bedeutet die Redewendung „Eulen nach Athen tragen“?","e":"Die Eule galt als Vogel der Stadtgöttin Athene und war in Athen allgegenwärtig. Eulen dorthin zu bringen, ist daher überflüssig.","tag":"Redewendungen","c":"etwas Überflüssiges tun, weil es dort längst reichlich vorhanden ist","w":["etwas Seltenes an einen weit entfernten Ort liefern","jemandem weise Ratschläge für seine Reise geben","etwas Wertvolles an Bedürftige verschenken"],"id":"b98b6285d"},{"cat":"lg","lv":1,"q":"Alle Streifenpolizisten dieser Dienststelle tragen ein Funkgerät. Herbert ist Streifenpolizist dieser Dienststelle. Welche Schlussfolgerung ist zwingend?","e":"Aus „Alle Streifenpolizisten tragen ein Funkgerät“ und „Herbert ist Streifenpolizist“ folgt, dass er eines trägt. Die Umkehrung (jeder mit Funkgerät ist Streifenpolizist) ist nicht gesichert.","tag":"Syllogismus","c":"Herbert trägt ein Funkgerät.","w":["Nur Herbert trägt ein Funkgerät.","Jeder mit Funkgerät ist Streifenpolizist.","Herbert trägt kein Funkgerät."],"id":"bf0256611"},{"cat":"lg","lv":1,"q":"Anna ist größer als Berta. Berta ist größer als Clara. Welche Aussage stimmt sicher?","e":"Es gilt Anna > Berta > Clara. Wegen der Transitivität ist Anna auch größer als Clara; die anderen Aussagen widersprechen dieser Reihenfolge.","tag":"Rangordnung","c":"Anna ist größer als Clara.","w":["Clara ist größer als Anna.","Berta ist die Größte der drei.","Berta und Clara sind gleich groß."],"id":"b05115f57"},{"cat":"lg","lv":1,"q":"Stift verhält sich zu schreiben wie Besen zu …?","e":"Ein Stift dient zum Schreiben, ein Besen zum Kehren (Fegen): Gerät und die damit ausgeführte Tätigkeit.","tag":"Analogie","c":"kehren","w":["bügeln","nähen","backen"],"id":"bb8be751c"},{"cat":"lg","lv":1,"q":"Welcher Begriff ist der passende Oberbegriff für Rose, Tulpe, Nelke und Lilie?","e":"Rose, Tulpe, Nelke und Lilie sind Blumen. Eine Tulpe ist zum Beispiel weder ein Strauch noch Gemüse noch Getreide.","tag":"Oberbegriff","c":"Blume","w":["Strauch","Gemüse","Getreide"],"id":"b0fe81eaf"},{"cat":"lg","lv":1,"q":"Karl ist der Sohn von Herrn Lang. Herr Lang hat eine Schwester, Frau Rot. Was ist Frau Rot für Karl?","e":"Die Schwester des Vaters ist die Tante.","tag":"Verwandtschaft","c":"Tante","w":["Cousine","Großmutter","Nichte"],"id":"b04060187"},{"cat":"lg","lv":2,"q":"Die Aussage „Alle Zeugen haben das Fahrzeug gesehen“ ist falsch. Was ist dann sicher richtig?","e":"Die Verneinung von „alle“ lautet „mindestens einer nicht“. Wie viele es sind, bleibt offen; „kein Zeuge“ oder „die meisten nicht“ lässt sich daher nicht ableiten.","tag":"Negation","c":"Mindestens ein Zeuge hat das Fahrzeug nicht gesehen.","w":["Kein Zeuge hat das Fahrzeug gesehen.","Mindestens ein Zeuge hat das Fahrzeug gesehen.","Die meisten Zeugen haben das Fahrzeug nicht gesehen."],"id":"bed850926"},{"cat":"lg","lv":2,"q":"Alle Teilnehmer des Lehrgangs haben die Abschlussprüfung abgelegt. Doris hat die Abschlussprüfung abgelegt. Wie ist die Aussage „Doris war Teilnehmerin des Lehrgangs“ zu beurteilen?","e":"Die Regel gilt nur in einer Richtung (Teilnehmer → Prüfung). Auch Personen, die nicht am Lehrgang teilnahmen, könnten die Prüfung abgelegt haben; Doris kann also Teilnehmerin sein, muss es aber nicht.","tag":"Syllogismus","c":"Sie ist möglich, aber nicht sicher.","w":["Sie ist sicher wahr.","Sie ist sicher falsch.","Die Angaben widersprechen sich."],"id":"baff2a4c9"},{"cat":"lg","lv":2,"q":"Vier Kollegen vergleichen ihre Dienstjahre. Paul hat weniger Dienstjahre als Olaf. Nina hat mehr Dienstjahre als Olaf, aber weniger als Max. Wer hat die zweitmeisten Dienstjahre?","e":"Aus den Angaben folgt die Reihenfolge Max > Nina > Olaf > Paul. Die zweitmeisten Dienstjahre hat Nina.","tag":"Rangordnung","c":"Nina","w":["Max","Olaf","Paul"],"id":"b5c48bf21"},{"cat":"lg","lv":2,"q":"In einer Warteschlange steht Frau Kern an 7. Stelle von vorne und an 12. Stelle von hinten gezählt. Wie viele Personen stehen insgesamt in der Schlange?","e":"Vor Frau Kern stehen 6 Personen, hinter ihr 11. Mit ihr selbst sind es 6 + 1 + 11 = 18 Personen (7 + 12 − 1).","tag":"Reihenfolge","t":"num","ans":18,"id":"b182706b5"},{"cat":"lg","lv":2,"q":"Zeuge verhält sich zu Aussage wie Sachverständiger zu …?","e":"Der Zeuge liefert eine Aussage, der Sachverständige ein Gutachten. Das Urteil stammt vom Gericht, die Anklage von der Staatsanwaltschaft.","tag":"Analogie","c":"Gutachten","w":["Urteil","Anklage","Verhandlung"],"id":"b66856b1c"},{"cat":"lg","lv":2,"q":"Ludwig ist der Vater von Maria. Maria ist die Mutter von Nora. Oskar ist der Sohn von Nora. Was ist Ludwig für Oskar?","e":"Maria ist die Mutter von Oskars Mutter Nora, also Oskars Großmutter. Ihr Vater Ludwig ist damit Oskars Urgroßvater.","tag":"Verwandtschaft","c":"Urgroßvater","w":["Großvater","Onkel","Vater"],"id":"b92bb66fc"},{"cat":"lg","lv":1,"q":"Wenn es regnet, ist die Straße nass. Die Straße ist nicht nass. Was lässt sich daraus mit Sicherheit schließen?","e":"Kontraposition: Aus „Regen → nasse Straße“ folgt „keine nasse Straße → kein Regen“. Über früheren oder späteren Regen sagt die Regel nichts.","tag":"Kontraposition","c":"Es regnet nicht.","w":["Es regnet.","Es hat vorhin geregnet.","Die Straße wird bald nass."],"id":"b657ae195"},{"cat":"lg","lv":2,"q":"Vier Personen sitzen nebeneinander auf einer Bank, die Plätze sind von links nach rechts mit 1 bis 4 nummeriert. Anton sitzt nicht auf einem Außenplatz. Berta sitzt unmittelbar links von Clemens. Dora sitzt auf Platz 4. Wer sitzt auf Platz 2?","e":"Dora sitzt auf Platz 4, Anton auf Platz 2 oder 3. Berta und Clemens belegen zwei benachbarte Plätze (Berta links): entweder 1 und 2 oder 2 und 3. Bei 2 und 3 bliebe für Anton nur Platz 1 (Außenplatz) – unmöglich. Also Berta 1, Clemens 2, Anton 3.","tag":"Sitzordnung","c":"Clemens","w":["Anton","Berta","Dora"],"id":"b3ddff3ae"},{"cat":"lg","lv":2,"q":"Welches Instrument gehört nicht zu den übrigen: Geige, Cello, Bratsche, Flöte?","e":"Geige, Cello und Bratsche sind Streichinstrumente, die Flöte ist ein Blasinstrument.","tag":"Ausreißer","c":"Flöte","w":["Geige","Cello","Bratsche"],"id":"bea9272a6"},{"cat":"lg","lv":2,"q":"Fünf Radfahrer erreichen das Ziel nacheinander, niemand gleichzeitig. Emil kommt vor Fritz, aber nach Gerda. Ida kommt vor Gerda. Hans kommt als Letzter an. Wer wird Zweiter?","e":"Ida kommt vor Gerda, Gerda vor Emil, Emil vor Fritz, Hans ist Letzter: Ida – Gerda – Emil – Fritz – Hans. Zweite ist Gerda.","tag":"Rangordnung","c":"Gerda","w":["Emil","Fritz","Ida"],"id":"b8b080144"},{"cat":"lg","lv":2,"q":"Gegeben ist die Aussage „Wenn jemand Beamter ist, dann hat er einen Dienstausweis.“ Welche Aussage entsteht, wenn man Voraussetzung und Folgerung vertauscht (Umkehrung)?","e":"Bei der Umkehrung von „A → B“ werden beide Teile vertauscht: „B → A“. Die erste falsche Antwort ist die Kontraposition (gleichwertig mit der Ausgangsaussage), die zweite die Inverse, die dritte eine Verneinung der Folgerung.","tag":"Umkehrung","c":"Wenn jemand einen Dienstausweis hat, dann ist er Beamter.","w":["Wenn jemand keinen Dienstausweis hat, dann ist er kein Beamter.","Wenn jemand kein Beamter ist, dann hat er keinen Dienstausweis.","Wenn jemand Beamter ist, dann hat er keinen Dienstausweis."],"id":"bc5d96de7"},{"cat":"lg","lv":3,"q":"Kein Dieb ist ehrlich. Manche ehrlichen Personen sind Zeugen. Welche Aussage lässt sich daraus sicher ableiten?","e":"Mindestens ein Zeuge ist ehrlich. Da kein Dieb ehrlich ist, ist dieser Zeuge kein Dieb. Über die übrigen Zeugen sagen die Angaben nichts, daher folgen die anderen Aussagen nicht.","tag":"Syllogismus","c":"Mindestens ein Zeuge ist kein Dieb.","w":["Kein Zeuge ist ein Dieb.","Mindestens ein Dieb ist ein Zeuge.","Alle Zeugen sind ehrlich."],"id":"bbb991a4d"},{"cat":"lg","lv":1,"q":"Seite verhält sich zu Buch wie Zimmer zu …?","e":"Eine Seite ist ein Teil eines Buches, ein Zimmer ist ein Teil einer Wohnung. Tür und Fenster sind Teile des Zimmers, nicht umgekehrt.","tag":"Analogie","c":"Wohnung","w":["Möbel","Tür","Fenster"],"id":"b3ad53ca5"},{"cat":"lg","lv":1,"q":"Herr Pichler hat einen Sohn namens Tom. Tom hat eine Tochter namens Lisa. Was ist Herr Pichler für Lisa?","e":"Herr Pichler ist der Vater von Lisas Vater Tom, also Lisas Großvater.","tag":"Verwandtschaft","c":"Großvater","w":["Vater","Onkel","Urgroßvater"],"id":"bb94fe468"},{"cat":"lg","lv":1,"q":"Welches Wort gehört nicht zu den übrigen: Mittwoch, Dienstag, Februar, Freitag?","e":"Mittwoch, Dienstag und Freitag sind Wochentage, der Februar ist ein Monat.","tag":"Ausreißer","c":"Februar","w":["Mittwoch","Dienstag","Freitag"],"id":"b538e5247"},{"cat":"lg","lv":1,"q":"Kein Fahrzeug im Hof ist rot. Der Wagen von Frau Berger steht im Hof. Was folgt daraus?","e":"Wenn kein Fahrzeug im Hof rot ist, gilt das auch für Frau Bergers Wagen. Welche Farbe er hat oder wie Fahrzeuge außerhalb des Hofs aussehen, ist nicht bekannt.","tag":"Syllogismus","c":"Der Wagen von Frau Berger ist nicht rot.","w":["Der Wagen von Frau Berger ist rot.","Der Wagen von Frau Berger ist blau.","Alle Fahrzeuge außerhalb des Hofs sind rot."],"id":"b9ff4695d"},{"cat":"lg","lv":1,"q":"Ein Streifenwagen ist schneller als ein Fahrrad. Ein Motorrad ist schneller als ein Streifenwagen. Ein Roller ist langsamer als ein Streifenwagen, aber schneller als ein Fahrrad. Welches der vier Fahrzeuge ist am langsamsten?","e":"Aus den Angaben ergibt sich die Reihenfolge Motorrad > Streifenwagen > Roller > Fahrrad. Das Fahrrad ist am langsamsten.","tag":"Rangordnung","c":"Das Fahrrad","w":["Der Roller","Der Streifenwagen","Das Motorrad"],"id":"bd6253f75"},{"cat":"lg","lv":1,"q":"Gestern war Freitag. Welcher Wochentag ist in drei Tagen?","e":"Wenn gestern Freitag war, ist heute Samstag. Drei Tage später: Sonntag (1), Montag (2), Dienstag (3).","tag":"Reihenfolge","c":"Dienstag","w":["Montag","Mittwoch","Sonntag"],"id":"bcc79670c"},{"cat":"lg","lv":2,"q":"Das Gegenteil (die logische Verneinung) der Aussage „Kein Fahrer war angeschnallt“ lautet:","e":"„Kein Fahrer war angeschnallt“ ist falsch, sobald auch nur ein einziger Fahrer angeschnallt war. Die Verneinung von „kein“ ist daher „mindestens einer“.","tag":"Negation","c":"Mindestens ein Fahrer war angeschnallt.","w":["Alle Fahrer waren angeschnallt.","Mindestens ein Fahrer war nicht angeschnallt.","Die meisten Fahrer waren angeschnallt."],"id":"b889d2580"},{"cat":"lg","lv":2,"q":"Jeder Kurs mit Schießübung ist ein Aufbaukurs. Jeder Aufbaukurs dauert mehrere Tage. Der Kurs „Taktik 3“ hat eine Schießübung. Welcher Schluss ist richtig?","e":"Schießübung → Aufbaukurs → mehrere Tage. „Taktik 3“ hat eine Schießübung, ist also ein Aufbaukurs und dauert mehrere Tage. Die genaue Dauer und die Umkehrung sind nicht gegeben.","tag":"Syllogismus","c":"Der Kurs „Taktik 3“ dauert mehrere Tage.","w":["Der Kurs „Taktik 3“ ist kein Aufbaukurs.","Jeder mehrtägige Kurs hat eine Schießübung.","Der Kurs „Taktik 3“ dauert genau drei Tage."],"id":"b31d6455b"},{"cat":"lg","lv":2,"q":"Anna hat zwei Kinder: den Sohn Ben und die Tochter Carla. Ben hat eine Tochter namens Dora. Was ist Carla für Dora?","e":"Carla ist die Schwester von Doras Vater Ben, also Doras Tante. Anna ist Doras Großmutter.","tag":"Verwandtschaft","c":"Tante","w":["Schwester","Cousine","Großmutter"],"id":"bb06058b6"},{"cat":"lg","lv":2,"q":"Anna, Bernd, Chris und Dora übernehmen vier verschiedene Aufgaben: Fahrer, Schreiber, Planer und Melder – jeder genau eine. Anna ist weder Fahrerin noch Melderin. Bernd ist weder Schreiber noch Fahrer. Chris ist weder Planer noch Melder noch Schreiber. Dora ist weder Schreiberin noch Planerin. Wer ist für die Planung zuständig?","e":"Chris bleibt nur Fahrer. Dora kann dann nur Melderin sein. Bernd bleibt damit nur Planer, Anna wird Schreiberin.","tag":"Zuordnung","c":"Bernd","w":["Anna","Chris","Dora"],"id":"bacc23097"},{"cat":"lg","lv":2,"q":"Drei Kartons A, B und C werden gewogen. A und B wiegen zusammen 12 kg, B und C zusammen 14 kg, A und C zusammen 10 kg. Wie viel wiegt Karton C in Kilogramm?","e":"Addiert man die drei Paargewichte, erhält man 36 kg, das ist das Doppelte von A + B + C. Also A + B + C = 18 kg und C = 18 − 12 = 6 kg (A = 4 kg, B = 8 kg).","tag":"Vergleich","t":"num","ans":6,"id":"bcd11084b"},{"cat":"lg","lv":2,"q":"Welcher Begriff ist der engste gemeinsame Oberbegriff zu Pkw, Lkw, Motorrad und Bus?","e":"Alle vier sind motorisch angetriebene Straßenfahrzeuge, also Kraftfahrzeuge. Schienenfahrzeug, Zugmaschine und Anhänger sind keine Oberbegriffe für alle vier.","tag":"Oberbegriff","c":"Kraftfahrzeug","w":["Schienenfahrzeug","Zugmaschine","Anhänger"],"id":"b82c00c75"},{"cat":"lg","lv":3,"q":"Einige Mitarbeiter sind Teilzeitkräfte. Keine Teilzeitkraft hat einen Schlüssel zum Archiv. Was lässt sich daraus mit Sicherheit schließen?","e":"Mindestens ein Mitarbeiter ist Teilzeitkraft. Teilzeitkräfte haben keinen Archivschlüssel, also hat dieser Mitarbeiter keinen. Über die übrigen Mitarbeiter ist nichts bekannt; Archivschlüssel-Besitzer können sogar keine Teilzeitkräfte sein.","tag":"Syllogismus","c":"Mindestens ein Mitarbeiter hat keinen Schlüssel zum Archiv.","w":["Kein Mitarbeiter hat einen Schlüssel zum Archiv.","Alle Mitarbeiter sind Teilzeitkräfte.","Alle Mitarbeiter mit Archivschlüssel sind Teilzeitkräfte."],"id":"b531ca00a"},{"cat":"lg","lv":2,"q":"Nur wer eine Eintrittskarte hat, darf das Gebäude betreten. Nina darf das Gebäude betreten. Welche Folgerung ist zwingend?","e":"„Nur wer eine Karte hat, darf eintreten“ heißt: Eintreten → Karte (die Karte ist notwendig). Nina tritt ein, also hat sie eine Karte. Dass die Karte allein genügt, ist damit nicht gesagt.","tag":"Bedingung","c":"Nina hat eine Eintrittskarte.","w":["Nina hat keine Eintrittskarte.","Jeder mit Eintrittskarte darf das Gebäude betreten.","Nina ist die Einzige mit Eintrittskarte."],"id":"b7ffa4dd3"},{"cat":"lg","lv":1,"q":"Fuß verhält sich zu Schuh wie Hand zu …?","e":"Der Schuh wird am Fuß getragen, der Handschuh an der Hand. Ärmel, Gürtel und Hut gehören zu anderen Körperteilen.","tag":"Analogie","c":"Handschuh","w":["Ärmel","Gürtel","Hut"],"id":"bcbc7aa18"},{"cat":"lg","lv":3,"q":"Vier Läufer – Rita, Sven, Tom und Ulla – erreichen das Ziel nacheinander, niemand gleichzeitig. Rita ist schneller als Sven. Tom ist langsamer als Sven. Ulla ist schneller als Tom, aber langsamer als Rita. Wie viele verschiedene Reihenfolgen im Ziel sind unter diesen Bedingungen möglich?","e":"Rita ist schneller als Sven und Ulla (und damit auch als Tom), liegt also auf Platz 1. Tom ist langsamer als Sven und Ulla, liegt also auf Platz 4. Sven und Ulla können die Plätze 2 und 3 in beiden Reihenfolgen belegen: 2 Möglichkeiten.","tag":"Rangordnung","t":"num","ans":2,"id":"b25cca426"},{"cat":"lg","lv":3,"q":"In einer Familie haben alle Kinder dieselben Eltern. Die Tochter Sandra sagt: „Ich habe dreimal so viele Brüder wie Schwestern.“ Ihr Bruder Tim sagt: „Ich habe genauso viele Brüder wie Schwestern.“ Wie viele Kinder hat die Familie?","e":"Es gibt m Mädchen und b Buben. Sandra: b = 3 · (m − 1). Tim: b − 1 = m. Einsetzen: m + 1 = 3m − 3, also m = 2 und b = 3. Probe: Sandra hat 3 Brüder und 1 Schwester, Tim hat 2 Brüder und 2 Schwestern. Insgesamt 5 Kinder.","tag":"Verwandtschaft","t":"num","ans":5,"id":"b8c5b0f6f"},{"cat":"lg","lv":3,"q":"Drei Verdächtige machen je eine Aussage. Alex: „Boris lügt.“ Boris: „Chris lügt.“ Chris: „Alex und Boris lügen beide.“ Jede der drei Aussagen ist entweder wahr oder falsch. Wer sagt die Wahrheit?","e":"Angenommen, Chris spricht die Wahrheit: Dann lügen Alex und Boris, also wäre Alex’ Aussage „Boris lügt“ wahr – Widerspruch. Also lügt Chris. Dann ist Boris’ Aussage „Chris lügt“ wahr. Weil Boris die Wahrheit sagt, ist Alex’ Aussage „Boris lügt“ falsch. Nur Boris sagt die Wahrheit.","tag":"Wahrheitsrätsel","c":"Nur Boris","w":["Nur Alex","Nur Chris","Alex und Chris"],"id":"b9f2b5874"},{"cat":"lg","lv":1,"q":"Mindestens einer der beiden Kollegen, Paul oder Quirin, hat die Akte gesehen. Paul hat die Akte nicht gesehen. Was folgt daraus zwingend?","e":"Mindestens einer von beiden hat die Akte gesehen. Paul nicht, also muss es Quirin gewesen sein.","tag":"Aussagenlogik","c":"Quirin hat die Akte gesehen.","w":["Quirin hat die Akte nicht gesehen.","Beide haben die Akte gesehen.","Niemand hat die Akte gesehen."],"id":"bc7140bf5"},{"cat":"lg","lv":2,"q":"Einige Beamte sind Läufer. Alle Läufer sind ausdauernd. Welche Folgerung ist zulässig?","e":"Mindestens ein Beamter ist Läufer, und jeder Läufer ist ausdauernd – also ist mindestens ein Beamter ausdauernd. Über die übrigen Beamten und über andere ausdauernde Personen sagen die Angaben nichts.","tag":"Syllogismus","c":"Mindestens ein Beamter ist ausdauernd.","w":["Alle Beamten sind ausdauernd.","Alle ausdauernden Personen sind Läufer.","Einige Beamte sind nicht ausdauernd."],"id":"bcee96c65"},{"cat":"lg","lv":2,"q":"Kilometer verhält sich zu Meter wie Tonne zu …?","e":"Ein Kilometer sind 1000 Meter, eine Tonne sind 1000 Kilogramm. Eine Tonne ist 1 000 000 Gramm bzw. 100 000 Dekagramm; ein Liter ist eine Volumeneinheit.","tag":"Analogie","c":"Kilogramm","w":["Gramm","Liter","Dekagramm"],"id":"b5cbb235f"},{"cat":"lg","lv":1,"q":"Hannes wiegt genauso viel wie Ida. Jakob wiegt mehr als Hannes. Katja wiegt weniger als Ida. Wer wiegt am meisten?","e":"Es gilt Jakob > Hannes = Ida > Katja. Am meisten wiegt Jakob.","tag":"Rangordnung","c":"Jakob","w":["Hannes","Ida","Katja"],"id":"be75f318b"},{"cat":"lg","lv":1,"q":"Erich ist mit Franziska verheiratet. Franziskas Bruder heißt Gustav. Was ist Gustav für Erich?","e":"Der Bruder der Ehefrau ist der Schwager.","tag":"Verwandtschaft","c":"Schwager","w":["Schwiegervater","Onkel","Cousin"],"id":"b5556a645"},{"cat":"lg","lv":3,"q":"Welche Aussage ist gleichbedeutend mit „Es ist nicht der Fall, dass jeder Beamte mindestens einen Fehler gemacht hat“?","e":"Die Verneinung von „jeder hat mindestens einen Fehler gemacht“ lautet „mindestens einer hat nicht mindestens einen Fehler gemacht“, also keinen. „Kein Beamter“ wäre eine stärkere Aussage, die beiden anderen haben mit der Verneinung nichts zu tun.","tag":"Negation","c":"Mindestens ein Beamter hat keinen Fehler gemacht.","w":["Kein Beamter hat einen Fehler gemacht.","Jeder Beamte hat mehr als einen Fehler gemacht.","Mindestens ein Beamter hat genau einen Fehler gemacht."],"id":"b8ad4913a"},{"cat":"lg","lv":3,"q":"Wenn Anna kommt, kommt auch Bernd. Wenn Bernd kommt, kommt Clara nicht. Clara ist gekommen. Welche Aussage ist sicher richtig?","e":"Clara ist gekommen, also ist Bernd nicht gekommen (Kontraposition der zweiten Aussage). Wäre Anna gekommen, wäre auch Bernd gekommen; da Bernd fehlt, ist Anna nicht gekommen (Kontraposition der ersten Aussage).","tag":"Kontraposition","c":"Anna ist nicht gekommen.","w":["Anna ist gekommen.","Bernd ist gekommen.","Es lässt sich nicht sagen, ob Anna gekommen ist."],"id":"bebc378bd"},{"cat":"lg","lv":2,"q":"Von 30 Bewerbern sprechen 18 Englisch und 14 Französisch. 6 Bewerber sprechen beide Sprachen. Wie viele Bewerber sprechen keine der beiden Sprachen?","e":"Die 6 Personen mit beiden Sprachen sind in 18 und 14 doppelt enthalten. Mindestens eine Sprache sprechen also 18 + 14 − 6 = 26 Bewerber. Keine der beiden Sprachen sprechen 30 − 26 = 4.","tag":"Mengen","t":"num","ans":4,"id":"b0d80083c"},{"cat":"lg","lv":2,"q":"Welches Wortpaar steht in der gleichen Beziehung zueinander wie „Richter : Urteil“?","e":"Der Richter erarbeitet als Ergebnis seiner Tätigkeit das Urteil, der Bäcker das Brot (Person – Ergebnis ihrer Arbeit). Die anderen Paare zeigen Institution – Person, Werkzeug – Gegenstand und Produkt – Gerät.","tag":"Analogie","c":"Bäcker : Brot","w":["Schule : Lehrer","Messer : Brot","Kuchen : Backofen"],"id":"b867324e1"},{"cat":"lg","lv":2,"q":"Welcher Begriff ist ein passender Oberbegriff für Eiche, Buche und Ahorn?","e":"Eiche, Buche und Ahorn sind Bäume mit Laubblättern, also Laubbäume. Sie sind weder Nadelbäume noch Obstbäume noch Sträucher.","tag":"Oberbegriff","c":"Laubbaum","w":["Nadelbaum","Obstbaum","Strauch"],"id":"bd1c9fb06"},{"cat":"lg","lv":3,"q":"Fünf Personen werden nach der Körpergröße verglichen, keine zwei sind gleich groß. Anna ist größer als Bernd. Bernd ist größer als Carla. David ist größer als Eva. Eva ist größer als Bernd. Welche Aussage ist sicher richtig?","e":"Aus Eva > Bernd und Bernd > Carla folgt Eva > Carla. Sicher ist nur David > Eva > Bernd > Carla und Anna > Bernd. Anna kann vor David, zwischen David und Eva oder nach Eva stehen; die drei anderen Aussagen sind daher nicht gesichert.","tag":"Rangordnung","c":"Eva ist größer als Carla.","w":["Anna ist größer als David.","Anna ist größer als Eva.","David ist größer als Anna."],"id":"be43572cf"},{"cat":"lg","lv":3,"q":"Fünf Kollegen – Hans, Ida, Jakob, Karin und Leo – haben in fünf aufeinanderfolgenden Wochen (Woche 1 bis 5) Urlaub, jeder genau eine Woche, keine zwei zugleich. Hans hat vor Ida Urlaub. Jakob hat weder in Woche 1 noch in Woche 5 Urlaub. Karin hat in der Woche unmittelbar nach Jakob Urlaub. Leo hat in der Woche unmittelbar vor Hans Urlaub. Ida hat nicht in Woche 5 Urlaub. Wer hat in Woche 3 Urlaub?","e":"Leo–Hans und Jakob–Karin bilden zwei Zweierblöcke, Ida steht einzeln. Von den 6 möglichen Anordnungen (Block, Block, Ida) scheiden aus: alle mit Ida in Woche 5, alle mit Ida vor Hans und die mit Jakob in Woche 1. Übrig bleibt Leo (1), Hans (2), Ida (3), Jakob (4), Karin (5). In Woche 3 hat Ida Urlaub.","tag":"Reihenfolge","c":"Ida","w":["Hans","Jakob","Karin"],"id":"bf7a1e9f9"},{"cat":"lg","lv":3,"q":"Franz hat keine Geschwister. Er zeigt auf das Foto einer Frau und sagt: „Der Vater dieser Frau ist der Sohn meines Vaters.“ Was ist die Frau für Franz?","e":"Der Sohn von Franz’ Vater ist – da Franz keine Geschwister hat – Franz selbst. Also ist Franz der Vater der Frau, sie ist seine Tochter.","tag":"Verwandtschaft","c":"Seine Tochter","w":["Seine Nichte","Seine Schwester","Seine Enkelin"],"id":"be9a025c2"},{"cat":"lg","lv":3,"q":"Es gilt: „Ein Fahrzeug darf nur dann in der Zone parken, wenn es eine Parkkarte besitzt.“ Das Fahrzeug von Frau Moser besitzt eine Parkkarte. Welche Aussage ist richtig?","e":"„Nur dann, wenn“ bedeutet: Parken erlaubt → Parkkarte vorhanden. Die Karte ist also notwendig, aber nicht ausreichend. Aus dem Besitz der Karte folgt weder, dass das Parken erlaubt ist, noch dass es verboten ist.","tag":"Bedingung","c":"Es lässt sich nicht sicher sagen, ob es in der Zone parken darf.","w":["Das Fahrzeug darf in der Zone parken.","Das Fahrzeug darf in der Zone nicht parken.","Das Fahrzeug muss in der Zone parken."],"id":"ba41b6046"},{"cat":"lg","lv":3,"q":"Kein Praktikant hat Zugang zum Tresorraum. Alle Revisoren haben Zugang zum Tresorraum. Welcher Schluss ist logisch zwingend?","e":"Wäre ein Revisor zugleich Praktikant, hätte er als Revisor Zugang und als Praktikant keinen – Widerspruch. Also ist kein Revisor Praktikant. Die übrigen Aussagen widersprechen den Angaben.","tag":"Syllogismus","c":"Kein Revisor ist Praktikant.","w":["Einige Praktikanten sind Revisoren.","Alle Revisoren sind Praktikanten.","Alle Praktikanten sind Revisoren."],"id":"b70967e3d"},{"cat":"lg","lv":1,"q":"Waage verhält sich zu Gewicht wie Thermometer zu …?","e":"Eine Waage misst das Gewicht, ein Thermometer die Temperatur. Luftdruck misst ein Barometer, Windstärke ein Anemometer, Niederschlag ein Regenmesser.","tag":"Analogie","c":"Temperatur","w":["Luftdruck","Windstärke","Niederschlag"],"id":"b0254deb0"},{"cat":"lg","lv":2,"q":"Es gilt: „Wenn die Ampel rot ist, halten alle Fahrzeuge an.“ Nun ist die Ampel grün. Welche Schlussfolgerung ist richtig?","e":"Die Regel sagt nur, was bei Rot geschieht. Aus der Verneinung der Voraussetzung (nicht rot) folgt nichts über die Folgerung; bei Grün können Fahrzeuge anhalten oder nicht. Die Regel wird dadurch nicht widerlegt.","tag":"Bedingung","c":"Ob die Fahrzeuge anhalten, lässt sich nicht sagen.","w":["Die Fahrzeuge halten nicht an.","Die Fahrzeuge halten an.","Die Regel ist damit widerlegt."],"id":"bbfc28504"},{"cat":"lg","lv":2,"q":"Fünf Personen werden nach der Körpergröße verglichen. Ina ist größer als Jan und größer als Kai. Lea ist größer als Ina. Max ist kleiner als Jan. Wie viele der fünf Personen sind kleiner als Ina?","e":"Kleiner als Ina sind Jan, Kai und Max (Max < Jan < Ina). Lea ist größer als Ina. Es sind 3 Personen.","tag":"Rangordnung","c":"3 Personen","w":["1 Person","2 Personen","4 Personen"],"id":"bc730c6d3"},{"cat":"lg","lv":2,"q":"Ein Ehepaar hat drei Kinder. Jedes Kind ist verheiratet und hat zwei eigene Kinder. Wie viele Personen umfasst die Familie insgesamt, wenn man das Ehepaar, seine Kinder, deren Ehepartner und alle Enkelkinder zählt?","e":"Ehepaar: 2, Kinder: 3, Schwiegerkinder (Ehepartner der Kinder): 3, Enkelkinder: 3 · 2 = 6. Insgesamt 2 + 3 + 3 + 6 = 14 Personen.","tag":"Verwandtschaft","t":"num","ans":14,"id":"bee0cbe35"},{"cat":"lg","lv":2,"q":"Alle Kommissare dieser Dienststelle sind älter als 30 Jahre. Herr Winter arbeitet in dieser Dienststelle und ist 28 Jahre alt. Wie ist die Aussage „Herr Winter ist Kommissar dieser Dienststelle“ zu beurteilen?","e":"Wäre Herr Winter Kommissar dieser Dienststelle, müsste er älter als 30 sein. Er ist 28, also ist er kein Kommissar (Kontraposition). Die Angaben sind widerspruchsfrei.","tag":"Syllogismus","c":"Sie ist sicher falsch.","w":["Sie ist sicher wahr.","Sie ist möglich, aber nicht sicher.","Die Angaben widersprechen sich."],"id":"bc50c13bc"},{"cat":"lg","lv":1,"q":"Ordnet man die Wörter Polizei, Kommissar, Streife und Einsatz alphabetisch, welches Wort steht an zweiter Stelle?","e":"Alphabetisch nach dem Anfangsbuchstaben: Einsatz (E), Kommissar (K), Polizei (P), Streife (S). An zweiter Stelle steht Kommissar.","tag":"Reihenfolge","c":"Kommissar","w":["Einsatz","Polizei","Streife"],"id":"b427cd374"},{"cat":"lg","lv":1,"q":"Welches Wort gehört nicht zu den übrigen: Hund, Katze, Pferd, Forelle?","e":"Hund, Katze und Pferd sind Säugetiere, die Forelle ist ein Fisch.","tag":"Ausreißer","c":"Forelle","w":["Hund","Katze","Pferd"],"id":"b2d209026"},{"cat":"lg","lv":2,"q":"Belohnung verhält sich zu Leistung wie Strafe zu …?","e":"Eine Belohnung folgt auf eine Leistung, eine Strafe folgt auf ein Vergehen (Folge – Anlass).","tag":"Analogie","c":"Vergehen","w":["Verbot","Gericht","Reue"],"id":"b4bb53bfd"},{"cat":"lg","lv":3,"q":"Bei einem Einbruch steht genau eine von vier Personen als Täter fest. Adam sagt: „Berta war es.“ Berta sagt: „Chris war es.“ Chris sagt: „Berta lügt.“ Dora sagt: „Ich war es nicht.“ Genau eine dieser vier Aussagen ist wahr. Wer war der Täter?","e":"Man prüft jeden möglichen Täter. Adam: Chris’ und Doras Aussage sind wahr (2 wahr) – unmöglich. Berta: Adams, Chris’ und Doras Aussage sind wahr (3 wahr) – unmöglich. Chris: Bertas und Doras Aussage sind wahr (2 wahr) – unmöglich. Dora: nur Chris’ Aussage „Berta lügt“ ist wahr, die drei anderen sind falsch – genau eine wahre Aussage. Täterin war Dora.","tag":"Wahrheitsrätsel","c":"Dora","w":["Adam","Berta","Chris"],"id":"b5fe524a1"},{"cat":"lg","lv":3,"q":"Alle Gutachter sind Juristen. Kein Jurist ist Mitglied im Verein Nord. Frau Kern ist Gutachterin. Was ergibt sich daraus zwingend?","e":"Frau Kern ist Gutachterin, also Juristin. Kein Jurist ist Mitglied im Verein Nord, also auch Frau Kern nicht. Dass jeder Jurist Gutachter sein muss („Nur Gutachter sind Juristen“), ist nicht gegeben; Mitglieder des Vereins wären keine Juristen und daher auch keine Gutachter.","tag":"Syllogismus","c":"Frau Kern ist nicht Mitglied im Verein Nord.","w":["Frau Kern ist Mitglied im Verein Nord.","Alle Mitglieder im Verein Nord sind Gutachter.","Nur Gutachter sind Juristen."],"id":"b9b75b5b5"},{"cat":"lg","lv":3,"q":"Welche Aussage ist gleichbedeutend mit „Wenn der Zeuge ehrlich ist, dann ist seine Aussage glaubwürdig“?","e":"Gleichbedeutend ist nur die Kontraposition: „A → B“ entspricht „nicht B → nicht A“. Die erste falsche Antwort ist die Umkehrung, die zweite die Inverse, die dritte widerspricht der Ausgangsaussage.","tag":"Kontraposition","c":"Wenn die Aussage nicht glaubwürdig ist, dann ist der Zeuge nicht ehrlich.","w":["Wenn die Aussage glaubwürdig ist, dann ist der Zeuge ehrlich.","Wenn der Zeuge nicht ehrlich ist, dann ist die Aussage nicht glaubwürdig.","Wenn der Zeuge ehrlich ist, dann ist die Aussage nicht glaubwürdig."],"id":"b46d2a194"},{"cat":"lg","lv":3,"q":"In einem Haus mit fünf Etagen (1 bis 5) wohnt in jeder Etage genau eine der Parteien Aigner, Bauer, Czerny, Dorfer und Eder. Czerny wohnt unmittelbar über Dorfer. Bauer wohnt höher als Czerny. Eder wohnt tiefer als Dorfer. Aigner wohnt genau eine Etage höher als Eder. Wer wohnt in Etage 3?","e":"Dorfer < Czerny < Bauer mit Czerny = Dorfer + 1: Dorfer wohnt höchstens in Etage 3. Eder wohnt tiefer als Dorfer, also wohnt Dorfer mindestens in Etage 2. Dorfer in 2: Czerny 3, Eder 1, Aigner 2 – doppelt belegt, unmöglich. Dorfer in 3: Czerny 4, Bauer 5; Eder 1 und Aigner 2 (Eder 2 und Aigner 3 wäre doppelt belegt). In Etage 3 wohnt Dorfer.","tag":"Reihenfolge","c":"Dorfer","w":["Aigner","Bauer","Czerny"],"id":"b4878c22f"},{"cat":"lg","lv":1,"q":"Lisa ist die Frau von Nico. Markus ist der Vater von Nico. Was ist Lisa für Markus?","e":"Die Ehefrau des Sohnes ist die Schwiegertochter.","tag":"Verwandtschaft","c":"Schwiegertochter","w":["Nichte","Stieftochter","Schwägerin"],"id":"b112d05f0"},{"cat":"lg","lv":1,"q":"Meter verhält sich zu Länge wie Liter zu …?","e":"Der Meter ist eine Einheit für die Länge, der Liter eine Einheit für das Volumen (den Rauminhalt).","tag":"Analogie","c":"Volumen","w":["Gewicht","Dauer","Fläche"],"id":"bab39de25"},{"cat":"lg","lv":2,"q":"Welches Wort gehört nicht zu den übrigen: Rentner, Pensionist, Lehrer, Ruheständler?","e":"Rentner, Pensionist und Ruheständler bezeichnen alle eine Person im Ruhestand. Lehrer ist eine Berufsbezeichnung.","tag":"Ausreißer","c":"Lehrer","w":["Rentner","Pensionist","Ruheständler"],"id":"bc38ba96a"},{"cat":"lg","lv":3,"q":"Eine Mutter ist heute viermal so alt wie ihre Tochter. In fünf Jahren wird sie dreimal so alt sein wie ihre Tochter. Wie alt ist die Mutter heute?","e":"Die Tochter ist heute d Jahre alt, die Mutter 4d. In fünf Jahren gilt 4d + 5 = 3 · (d + 5) = 3d + 15, also d = 10. Die Mutter ist heute 4 · 10 = 40 Jahre alt (Probe: in 5 Jahren 45 und 15, also dreimal so alt).","tag":"Altersrätsel","t":"num","ans":40,"id":"bd86d568c"},{"cat":"lg","lv":2,"q":"Alle Bewerber, die den Computertest bestehen, werden zum Gespräch eingeladen. Tobias ist Bewerber und wird nicht zum Gespräch eingeladen. Welche Folgerung ist zwingend?","e":"Kontraposition: Wer den Computertest besteht, wird eingeladen; Tobias wird nicht eingeladen, also hat er nicht bestanden. Ob er knapp oder deutlich scheiterte und was für andere Bewerber gilt, ist nicht bekannt.","tag":"Kontraposition","c":"Tobias hat den Computertest nicht bestanden.","w":["Tobias hat den Computertest bestanden.","Alle anderen Bewerber werden eingeladen.","Tobias hat den Computertest knapp verfehlt."],"id":"b7d5d4439"},{"cat":"lg","lv":3,"q":"Welche Aussage ist die genaue logische Verneinung von „Der Täter war groß und trug einen Hut“?","e":"Eine „und“-Aussage ist falsch, sobald mindestens einer der beiden Teile falsch ist. Die Verneinung lautet daher „nicht groß oder kein Hut“ (De Morgan). Die anderen Antworten verneinen nur Teilfälle.","tag":"Negation","c":"Der Täter war nicht groß oder er trug keinen Hut.","w":["Der Täter war nicht groß und er trug keinen Hut.","Der Täter war nicht groß, aber er trug einen Hut.","Der Täter war groß, aber er trug keinen Hut."],"id":"b3c928bf8"},{"cat":"lg","lv":2,"q":"Auf einer Balkenwaage halten 2 Ordner das Gleichgewicht mit 3 Heften. Ein Heft hält das Gleichgewicht mit 4 Stiften. Wie viele Stifte halten das Gleichgewicht mit einem Ordner?","e":"3 Hefte entsprechen 3 · 4 = 12 Stiften. Diese 12 Stifte halten das Gleichgewicht mit 2 Ordnern, ein Ordner entspricht also 6 Stiften.","tag":"Vergleich","c":"6 Stifte","w":["4 Stifte","5 Stifte","8 Stifte"],"id":"bbbbeffbb"},{"cat":"lg","lv":3,"q":"Auf einer Insel sagt jeder Bewohner entweder immer die Wahrheit oder lügt immer. Max und Nina wohnen dort. Max sagt: „Wir beide sind Lügner.“ Was trifft zu?","e":"Sagte Max die Wahrheit, wäre er selbst ein Lügner – Widerspruch. Also lügt Max, seine Aussage ist falsch: Es sind nicht beide Lügner. Da Max Lügner ist, muss Nina die Wahrheit sagen.","tag":"Wahrheitsrätsel","c":"Max lügt, Nina sagt die Wahrheit.","w":["Max sagt die Wahrheit, Nina lügt.","Beide lügen.","Beide sagen die Wahrheit."],"id":"b3382e0a0"},{"cat":"lg","lv":2,"q":"Sechs Kollegen begrüßen sich bei einem Treffen mit Handschlag. Jeder gibt jedem anderen genau einmal die Hand. Wie viele Handschläge gibt es insgesamt?","e":"Jeder gibt 5 anderen die Hand: 6 · 5 = 30. Dabei wird jeder Handschlag zweimal gezählt (einmal von jedem Beteiligten), also 30 : 2 = 15.","tag":"Kombinatorik","t":"num","ans":15,"id":"b073b49f8"},{"cat":"lg","lv":3,"q":"In einer Abteilung arbeiten 40 Personen. 30 davon haben einen Führerschein, 25 sprechen Englisch. Wie groß ist die kleinstmögliche Anzahl an Personen, die beides haben (Führerschein und Englisch)?","e":"Es gibt 30 + 25 = 55 Zuordnungen von Eigenschaften, aber nur 40 Personen. Hätte jede Person höchstens eine Eigenschaft, wären es höchstens 40 Zuordnungen. Die übrigen 55 − 40 = 15 Zuordnungen entstehen nur durch Personen mit beiden Eigenschaften. Mindestens 15 Personen haben also beides; genau 15 sind es, wenn jede Person mindestens eine der beiden Eigenschaften hat.","tag":"Mengen","t":"num","ans":15,"id":"bc4566509"},{"cat":"lg","lv":1,"q":"Welches Wort bedeutet das Gegenteil von „vorsichtig“?","e":"Vorsichtig bedeutet achtsam und besonnen. Das Gegenteil ist leichtsinnig (unachtsam, ohne an die Gefahr zu denken). Umsichtig ist bedeutungsähnlich, höflich und ruhig betreffen andere Eigenschaften.","tag":"Gegensatz","c":"leichtsinnig","w":["umsichtig","höflich","ruhig"],"id":"be397853c"},{"cat":"lg","lv":1,"q":"Wenn ein Antrag vollständig ist, wird er bearbeitet. Der Antrag von Herrn Aigner ist vollständig. Was folgt daraus?","e":"Die Voraussetzung („vollständig“) ist erfüllt, also gilt die Folgerung („wird bearbeitet“). Über unvollständige Anträge sagt die Regel nichts.","tag":"Aussagenlogik","c":"Der Antrag von Herrn Aigner wird bearbeitet.","w":["Der Antrag von Herrn Aigner wird abgelehnt.","Jeder Antrag wird bearbeitet.","Der Antrag von Herrn Aigner war zuvor unvollständig."],"id":"b773d729a"},{"cat":"lg","lv":1,"q":"Der 1. Jänner ist ein Mittwoch. Welcher Wochentag ist der 4. Jänner desselben Jahres?","e":"Mittwoch (1.), Donnerstag (2.), Freitag (3.), Samstag (4.). Der 4. Jänner ist ein Samstag.","tag":"Kalender","c":"Samstag","w":["Donnerstag","Freitag","Sonntag"],"id":"b33be93bf"},{"cat":"lg","lv":2,"q":"Die drei Beamten Aigner, Bauer und Czerny fahren je ein anderes Fahrzeug (Pkw, Motorrad, Fahrrad) und arbeiten an je einem anderen Dienstort (Graz, Leibnitz, Weiz). Der Motorradfahrer arbeitet nicht in Graz. Bauer arbeitet in Leibnitz. Czerny fährt nicht mit dem Fahrrad. Der Fahrradfahrer arbeitet in Weiz. Welche Aussage ist richtig?","e":"Der Fahrradfahrer arbeitet in Weiz, also weder Bauer (Leibnitz) noch Czerny (fährt kein Fahrrad): Aigner fährt Fahrrad und arbeitet in Weiz. Czerny bleibt Graz. Der Motorradfahrer arbeitet nicht in Graz, also fährt Czerny Pkw und Bauer Motorrad.","tag":"Zuordnung","c":"Czerny fährt Pkw und arbeitet in Graz.","w":["Aigner fährt Motorrad und arbeitet in Weiz.","Bauer fährt Pkw und arbeitet in Leibnitz.","Czerny fährt Motorrad und arbeitet in Graz."],"id":"bb6f3d3cc"},{"cat":"lg","lv":1,"q":"Ein Beamter hat 3 verschiedene Hemden und 2 verschiedene Hosen. Wie viele verschiedene Kombinationen aus je einem Hemd und einer Hose kann er zusammenstellen?","e":"Zu jedem der 3 Hemden passen 2 Hosen: 3 · 2 = 6 Kombinationen.","tag":"Kombinatorik","c":"6 Kombinationen","w":["5 Kombinationen","8 Kombinationen","9 Kombinationen"],"id":"b75ea03fe"},{"cat":"lg","lv":3,"q":"Die Aussage „Jedes Fahrzeug, das zu schnell fährt, wird angehalten“ ist falsch. Was muss dann zutreffen?","e":"Die Aussage „Jedes zu schnelle Fahrzeug wird angehalten“ ist genau dann falsch, wenn es mindestens ein zu schnelles Fahrzeug gibt, das nicht angehalten wird. „Kein zu schnelles Fahrzeug“ ist stärker als nötig, die anderen Antworten sind nicht ableitbar.","tag":"Negation","c":"Mindestens ein zu schnelles Fahrzeug wird nicht angehalten.","w":["Kein zu schnelles Fahrzeug wird angehalten.","Mindestens ein nicht zu schnelles Fahrzeug wird angehalten.","Alle angehaltenen Fahrzeuge waren nicht zu schnell."],"id":"bf650a12e"},{"cat":"lg","lv":2,"q":"Heute ist Dienstag. Welcher Wochentag war vor genau 100 Tagen?","e":"100 = 14 · 7 + 2. Vierzehn volle Wochen ändern den Wochentag nicht, es bleiben 2 Tage zurück: Zwei Tage vor Dienstag ist Sonntag.","tag":"Kalender","c":"Sonntag","w":["Montag","Samstag","Dienstag"],"id":"b9a1e661c"},{"cat":"lg","lv":3,"q":"Aus sechs Kollegen, darunter Anna und Bernd, soll ein Team aus drei Personen gebildet werden. Anna und Bernd sollen nicht beide im Team sein. Wie viele verschiedene Teams sind möglich?","e":"Ohne Einschränkung gibt es 6 · 5 · 4 : 6 = 20 Teams. Teams mit Anna und Bernd gemeinsam: Die dritte Person kommt aus den übrigen 4 Kollegen, das sind 4 Teams. Zulässig sind 20 − 4 = 16 Teams.","tag":"Kombinatorik","c":"16 Teams","w":["12 Teams","14 Teams","20 Teams"],"id":"b1c600b72"},{"cat":"lg","lv":2,"q":"Streife A hat jeden 4. Tag Nachtdienst, Streife B jeden 6. Tag. Heute (Tag 0) haben beide Nachtdienst. Nach wie vielen Tagen haben beide erstmals wieder am selben Tag Nachtdienst?","e":"Streife A hat an den Tagen 4, 8, 12, 16 … Dienst, Streife B an den Tagen 6, 12, 18 … Der erste gemeinsame Tag ist der 12. Tag (kleinstes gemeinsames Vielfaches von 4 und 6). Der 24. Tag ist erst der zweite gemeinsame Diensttag.","tag":"Kalender","c":"nach 12 Tagen","w":["nach 10 Tagen","nach 18 Tagen","nach 24 Tagen"],"id":"bb7c57d2d"},{"cat":"lg","lv":3,"q":"Der 17. Oktober eines Jahres ist ein Samstag. Welcher Wochentag ist der 3. Dezember desselben Jahres?","e":"Vom 17. Oktober bis 31. Oktober sind es 14 Tage, dazu kommen 30 Tage im November und 3 Tage im Dezember: 14 + 30 + 3 = 47 Tage. 47 = 6 · 7 + 5, also 5 Wochentage nach Samstag: Sonntag, Montag, Dienstag, Mittwoch, Donnerstag.","tag":"Kalender","c":"Donnerstag","w":["Mittwoch","Freitag","Dienstag"],"id":"b05f77a24"},{"cat":"lg","lv":2,"q":"Eine Streife hat alle 3 Tage Nachtdienst. Der erste Nachtdienst findet an einem Montag statt. An welchem Wochentag findet der vierte Nachtdienst statt?","e":"Zwischen dem ersten und dem vierten Nachtdienst liegen 3 · 3 = 9 Tage. 9 = 7 + 2, also liegt der vierte Dienst zwei Wochentage nach Montag: Mittwoch. (Die Dienste fallen auf Montag, Donnerstag, Sonntag und Mittwoch.)","tag":"Wochentage","c":"Mittwoch","w":["Samstag","Donnerstag","Sonntag"],"id":"ba214b396"},{"cat":"lg","lv":1,"q":"Eva, Franz und Gerti fahren jeweils mit einem anderen Verkehrsmittel zur Arbeit: mit dem Auto, mit dem Bus oder mit dem Fahrrad. Eva fährt weder mit dem Auto noch mit dem Bus. Gerti fährt nicht mit dem Auto. Welche Aussage stimmt?","e":"Eva bleibt nur das Fahrrad. Gerti fährt nicht mit dem Auto, und das Fahrrad ist vergeben, also fährt sie mit dem Bus. Für Franz bleibt das Auto.","tag":"Zuordnung","c":"Franz fährt mit dem Auto.","w":["Franz fährt mit dem Bus.","Gerti fährt mit dem Fahrrad.","Eva fährt mit dem Auto."],"id":"b855476e4"},{"cat":"lg","lv":1,"q":"Bei einem Sporttag kann man am Vormittag zwischen 5 Disziplinen wählen und am Nachmittag zwischen 3 anderen Disziplinen. Jede Person wählt am Vormittag genau eine und am Nachmittag genau eine Disziplin. Wie viele verschiedene Tagesprogramme sind möglich?","e":"Jede der 5 Vormittagsdisziplinen lässt sich mit jeder der 3 Nachmittagsdisziplinen kombinieren: 5 · 3 = 15.","tag":"Kombinatorik","t":"num","ans":15,"id":"b2318f5a0"},{"cat":"lg","lv":1,"q":"Welches der folgenden Wörter besteht aus genau denselben Buchstaben wie „NEBEL“?","e":"NEBEL und LEBEN enthalten beide die Buchstaben N, E, B, E, L. LESEN hat ein S statt des B, LEBER ein R statt des N und NEBEN ein zweites N statt des L.","tag":"Anagramme","c":"LEBEN","w":["LESEN","LEBER","NEBEN"],"id":"b61b917f8"},{"cat":"lg","lv":1,"q":"Ein Streifenwagen fährt nach Osten. An der nächsten Kreuzung biegt er nach links ab, an der übernächsten nach rechts. In welche Himmelsrichtung fährt er danach?","e":"Wer nach Osten fährt und links abbiegt, fährt nach Norden. Biegt er dann rechts ab, fährt er wieder nach Osten.","tag":"Richtungen","c":"Osten","w":["Norden","Süden","Westen"],"id":"bfaabbae3"},{"cat":"lg","lv":1,"q":"In einer Klasse mit 25 Schülern spielen 15 Fußball und 12 Tennis. 6 Schüler spielen beide Sportarten. Wie viele Schüler spielen weder Fußball noch Tennis?","e":"Mindestens eine der Sportarten spielen 15 + 12 − 6 = 21 Schüler (die 6 sind sonst doppelt gezählt). Weder noch: 25 − 21 = 4.","tag":"Mengenlogik","t":"num","ans":4,"id":"bcb8e44fb"},{"cat":"lg","lv":1,"q":"Eine Balkenwaage ist im Gleichgewicht. Auf der linken Schale liegen zwei Gewichte zu je 5 kg. Auf der rechten Schale liegen ein Gewicht zu 4 kg und ein Gewicht mit unbekannter Masse. Wie viele Kilogramm hat das unbekannte Gewicht?","e":"Links liegen 2 · 5 kg = 10 kg. Im Gleichgewicht gilt rechts 4 kg + x = 10 kg, also x = 6 kg.","tag":"Waage","t":"num","ans":6,"id":"bbefae743"},{"cat":"lg","lv":1,"q":"Ein Nachtdienst beginnt um 22:40 Uhr und endet um 6:10 Uhr des nächsten Tages. Wie viele Minuten dauert der Dienst?","e":"Von 22:40 Uhr bis Mitternacht sind es 80 Minuten, von Mitternacht bis 6:10 Uhr weitere 370 Minuten. 80 + 370 = 450 Minuten (7 Stunden 30 Minuten).","tag":"Dauer","t":"num","ans":450,"id":"bfe268b27"},{"cat":"lg","lv":1,"q":"Ein Zug fährt um 14:48 Uhr ab und kommt um 17:13 Uhr an. Wie lange dauert die Fahrt?","e":"Von 14:48 Uhr bis 17:00 Uhr sind es 2 Stunden 12 Minuten, bis 17:13 Uhr kommen noch 13 Minuten dazu: 2 Stunden 25 Minuten.","tag":"Dauer","c":"2 Stunden 25 Minuten","w":["2 Stunden 35 Minuten","2 Stunden 15 Minuten","3 Stunden 25 Minuten"],"id":"b90465e02"},{"cat":"lg","lv":1,"q":"Sechs Personen sitzen gleichmäßig verteilt an einem runden Tisch. Im Uhrzeigersinn sitzen nacheinander: Anna, Ben, Clara, Dora, Emil, Felix. Wer sitzt Clara direkt gegenüber?","e":"Bei sechs gleichmäßig verteilten Plätzen liegt das gegenüberliegende Paar jeweils 3 Plätze auseinander. Von Clara aus gezählt: Dora (1), Emil (2), Felix (3).","tag":"Sitzordnung","c":"Felix","w":["Dora","Emil","Anna"],"id":"bfbda4a84"},{"cat":"lg","lv":1,"q":"Ein Automat arbeitet nach folgender Regel: Bei einem Einwurf von mindestens 2 Euro gibt er Kaffee aus. Bei einem Einwurf von mindestens 3 Euro gibt er zusätzlich Kekse aus. Lara wirft 2,50 Euro ein. Was bekommt sie?","e":"2,50 Euro sind mindestens 2 Euro, also gibt es Kaffee. 2,50 Euro sind weniger als 3 Euro, also gibt es keine Kekse.","tag":"Wenn-dann","c":"Kaffee, aber keine Kekse","w":["Kaffee und Kekse","Kekse, aber keinen Kaffee","Weder Kaffee noch Kekse"],"id":"bf8e96fb8"},{"cat":"lg","lv":1,"q":"Welches der folgenden Wörter ergibt rückwärts gelesen ein anderes sinnvolles Wort?","e":"REGAL rückwärts gelesen ergibt LAGER. TISCH, BLUME und STUHL ergeben rückwärts gelesen kein Wort (HCSIT, EMULB, LHUTS).","tag":"Wortlogik","c":"REGAL","w":["TISCH","BLUME","STUHL"],"id":"b4d99007a"},{"cat":"lg","lv":1,"q":"Hubert, Ida, Jonas und Karin haben je ein Haustier: einen Hund, eine Katze, einen Hasen oder einen Wellensittich (jedes Tier gehört genau einer Person). Karin hat den Hund. Hubert hat weder die Katze noch den Hasen. Ida hat nicht die Katze. Wer hat die Katze?","e":"Karin hat den Hund. Hubert hat weder Katze noch Hase, bleibt der Wellensittich. Ida hat nicht die Katze, also den Hasen. Die Katze gehört Jonas.","tag":"Zuordnung","c":"Jonas","w":["Hubert","Ida","Karin"],"id":"b2908bafb"},{"cat":"lg","lv":1,"q":"Ein Zusteller geht von der Poststelle aus 5 Häuserblöcke nach Osten, dann 2 Blöcke nach Norden, dann 3 Blöcke nach Westen und schließlich 2 Blöcke nach Süden. Alle Blöcke sind gleich lang. Wie viele Blocklängen beträgt die Luftlinie zwischen dem Zusteller und der Poststelle jetzt?","e":"Ost-West: 5 − 3 = 2 Blöcke nach Osten. Nord-Süd: 2 − 2 = 0 Blöcke. Der Zusteller steht also genau 2 Blocklängen östlich der Poststelle.","tag":"Richtungen","t":"num","ans":2,"id":"b700ba548"},{"cat":"lg","lv":1,"q":"Wie oft kommt der Buchstabe E (groß oder klein) im Satz „Die Geschwindigkeit wurde gemessen“ vor?","e":"Die: 1, Geschwindigkeit: 2, wurde: 1, gemessen: 3. Zusammen 1 + 2 + 1 + 3 = 7.","tag":"Buchstaben zählen","t":"num","ans":7,"id":"b8c2d74f9"},{"cat":"lg","lv":1,"q":"Der 5. eines Monats ist ein Montag. Auf welchen Wochentag fällt der 26. desselben Monats?","e":"Zwischen dem 5. und dem 26. liegen 21 Tage, also genau 3 Wochen. Der Wochentag bleibt gleich: Montag.","tag":"Wochentage","c":"Montag","w":["Sonntag","Dienstag","Samstag"],"id":"be8874d58"},{"cat":"lg","lv":1,"q":"Auf wie viele verschiedene Arten können sich 4 Personen nebeneinander in einer Reihe aufstellen?","e":"Für den ersten Platz gibt es 4 Möglichkeiten, für den zweiten 3, für den dritten 2 und für den letzten 1: 4 · 3 · 2 · 1 = 24.","tag":"Kombinatorik","t":"num","ans":24,"id":"b9bb124e6"},{"cat":"lg","lv":1,"q":"Zwei Regeln gelten für den Dienstplan: (1) Wenn Max Dienst hat, hat auch Nina Dienst. (2) Wenn Nina Dienst hat, hat Oskar frei. Max hat Dienst. Was gilt dann?","e":"Max hat Dienst, daher hat nach Regel (1) auch Nina Dienst. Weil Nina Dienst hat, hat nach Regel (2) Oskar frei.","tag":"Wenn-dann","c":"Nina hat Dienst und Oskar hat frei.","w":["Nina hat Dienst und Oskar hat auch Dienst.","Nina hat frei und Oskar hat Dienst.","Nina hat frei und Oskar hat frei."],"id":"b519d1c2d"},{"cat":"lg","lv":2,"q":"Ein Schaltjahr hat 366 Tage. Der 1. Jänner eines Schaltjahres ist ein Samstag. Auf welchen Wochentag fällt der 31. Dezember desselben Jahres?","e":"Der 31. Dezember ist der 366. Tag des Jahres, also 365 Tage nach dem 1. Jänner. Wegen 365 = 52 · 7 + 1 ist es der Wochentag nach Samstag: Sonntag.","tag":"Wochentage","c":"Sonntag","w":["Samstag","Montag","Freitag"],"id":"bd837b9a2"},{"cat":"lg","lv":2,"q":"Bei einer Umfrage unter 40 Personen gaben 24 an, Kaffee zu trinken, und 18, Tee zu trinken. Jede befragte Person trinkt mindestens eines der beiden Getränke. Wie viele Personen trinken beides?","e":"Zählt man Kaffeetrinker und Teetrinker zusammen, ergibt das 24 + 18 = 42. Es gibt aber nur 40 Personen, also wurden 42 − 40 = 2 Personen doppelt gezählt: Sie trinken beides.","tag":"Mengenlogik","c":"2","w":["6","16","22"],"id":"b7a7224ca"},{"cat":"lg","lv":2,"q":"Eine Person blickt nach Osten. Sie dreht sich um 90 Grad nach links, dann um 180 Grad und schließlich um 90 Grad nach rechts. In welche Richtung blickt sie danach?","e":"Osten, 90 Grad links: Norden. Dann 180 Grad: Süden. Dann 90 Grad rechts: Westen.","tag":"Richtungen","c":"Westen","w":["Norden","Osten","Süden"],"id":"bf3f953e5"},{"cat":"lg","lv":2,"q":"Vier Beamte – Huber, Gruber, Maier und Steiner – haben von Montag bis Donnerstag an je einem anderen Tag Nachtdienst. Huber hat weder am Montag noch am Donnerstag Dienst. Gruber hat früher in der Woche Dienst als Huber. Maier hat am Tag unmittelbar nach Steiner Dienst. Steiner hat nicht am Montag Dienst. An welchem Tag hat Maier Dienst?","e":"Huber hat Dienst am Dienstag oder Mittwoch. Bei Mittwoch blieben Montag, Dienstag und Donnerstag für die anderen drei; Steiner und Maier müssten aufeinanderfolgende Tage haben, also Montag/Dienstag, doch Steiner darf nicht am Montag Dienst haben. Also hat Huber Dienst am Dienstag, Gruber am Montag, Steiner am Mittwoch und Maier am Donnerstag.","tag":"Zuordnung","c":"Donnerstag","w":["Montag","Dienstag","Mittwoch"],"id":"b8064a11c"},{"cat":"lg","lv":2,"q":"Ein vierstelliger Zahlencode besteht aus den Ziffern 0 bis 9. Ziffern dürfen mehrfach vorkommen. Wie viele solcher Codes beginnen mit einer ungeraden Ziffer?","e":"Die erste Stelle kann 1, 3, 5, 7 oder 9 sein (5 Möglichkeiten), jede der übrigen drei Stellen hat 10 Möglichkeiten: 5 · 10 · 10 · 10 = 5000.","tag":"Kombinatorik","c":"5000","w":["10000","4500","2500"],"id":"b7c984312"},{"cat":"lg","lv":2,"q":"Jedem Buchstaben wird seine Stelle im Alphabet als Wert zugeordnet (A = 1, B = 2, …, Z = 26). Wie groß ist die Summe der Werte aller Buchstaben des Wortes „GRAZ“?","e":"G = 7, R = 18, A = 1, Z = 26. Summe: 7 + 18 + 1 + 26 = 52.","tag":"Alphabetposition","t":"num","ans":52,"id":"b421f0ba4"},{"cat":"lg","lv":2,"q":"Ein Apfel wiegt so viel wie 2 Birnen, und eine Birne wiegt so viel wie 3 Kirschen. Gleiche Früchte wiegen jeweils gleich viel. Wie viele Kirschen wiegen so viel wie 2 Äpfel?","e":"1 Apfel = 2 Birnen = 6 Kirschen. Also entsprechen 2 Äpfel 12 Kirschen.","tag":"Waage","c":"12","w":["6","9","18"],"id":"b354207f5"},{"cat":"lg","lv":2,"q":"Regel: Wenn in der Zentrale ein Alarm ausgelöst wird, leuchtet die rote Lampe. Die rote Lampe leuchtet. Welche Aussage ist richtig?","e":"Die Regel sagt nur: Alarm → Lampe leuchtet. Der Umkehrschluss „Lampe leuchtet → Alarm“ ist nicht zulässig, denn die Regel schließt andere Gründe für das Leuchten nicht aus. Es bleibt also offen, ob ein Alarm ausgelöst wurde.","tag":"Wenn-dann","c":"Aus den Angaben folgt nicht, ob ein Alarm ausgelöst wurde.","w":["Aus den Angaben folgt, dass ein Alarm ausgelöst wurde.","Aus den Angaben folgt, dass kein Alarm ausgelöst wurde.","Aus den Angaben folgt, dass die Lampe nur bei Alarm leuchtet."],"id":"bb2bf6356"},{"cat":"lg","lv":2,"q":"Ein Verein trainiert jeden Dienstag und jeden Donnerstag. Der Monat hat 30 Tage, und der 3. des Monats ist ein Dienstag. Wie viele Trainingseinheiten finden in diesem Monat statt?","e":"Dienstage: 3., 10., 17., 24. (ein 31. existiert nicht). Donnerstage: 5., 12., 19., 26. (ein 33. existiert nicht). Vor dem 3. liegen nur ein Sonntag und ein Montag. Zusammen 4 + 4 = 8 Einheiten.","tag":"Kalender","t":"num","ans":8,"id":"b20f0f1d7"},{"cat":"lg","lv":2,"q":"Acht Personen sitzen gleichmäßig verteilt an einem runden Tisch. Die Plätze sind im Uhrzeigersinn von 1 bis 8 nummeriert. Tina sitzt auf Platz 3. Uwe sitzt Tina direkt gegenüber. Vera sitzt zwei Plätze weiter im Uhrzeigersinn als Uwe. Auf welchem Platz sitzt Vera?","e":"Gegenüber von Platz 3 liegt Platz 7 (bei 8 Plätzen sind es 4 Plätze Abstand). Zwei Plätze weiter im Uhrzeigersinn folgen Platz 8 und dann wieder Platz 1.","tag":"Sitzordnung","t":"num","ans":1,"id":"b193a92f0"},{"cat":"lg","lv":2,"q":"Ein Wort wird verschlüsselt, indem jeder Buchstabe im Alphabet um drei Stellen nach hinten verschoben wird (A wird zu D, B zu E, …, X zu A, Y zu B, Z zu C). Wie lautet die Verschlüsselung des Wortes „ZAUN“?","e":"Z wird zu C (nach Z folgen A, B, C), A wird zu D, U wird zu X, N wird zu Q. Ergebnis: CDXQ. BCWP entsteht bei einer Verschiebung um 2, DEYR bei einer Verschiebung um 4.","tag":"Verschlüsselung","c":"CDXQ","w":["BCWP","DEYR","BDXQ"],"id":"b798f7d65"},{"cat":"lg","lv":2,"q":"Eine Fußstreife geht von der Polizeiinspektion aus 200 m nach Osten, dann 100 m nach Süden und schließlich 300 m nach Westen. In welcher Richtung liegt die Inspektion jetzt von der Streife aus gesehen?","e":"Ost-West: 200 m nach Osten und 300 m nach Westen ergeben 100 m westlich der Inspektion. Nord-Süd: 100 m südlich der Inspektion. Die Streife steht also südwestlich der Inspektion, die Inspektion liegt von ihr aus im Nordosten.","tag":"Richtungen","c":"Nordosten","w":["Nordwesten","Südosten","Südwesten"],"id":"b4702203c"},{"cat":"lg","lv":2,"q":"Wie viele der Zahlen von 1 bis 30 sind durch 2 oder durch 3 teilbar?","e":"Durch 2 teilbar sind 15 Zahlen, durch 3 sind es 10 Zahlen. Die 5 Vielfachen von 6 sind doppelt gezählt: 15 + 10 − 5 = 20.","tag":"Mengenlogik","c":"20","w":["25","15","10"],"id":"bb9058703"},{"cat":"lg","lv":2,"q":"Ines, Jonas, Katrin und Lukas sprechen als Fremdsprache jeweils genau eine der Sprachen Englisch, Französisch, Italienisch oder Spanisch. Jede Sprache wird von genau einer Person gesprochen. Ines spricht weder Englisch noch Französisch. Jonas spricht Italienisch oder Spanisch. Lukas spricht weder Spanisch noch Englisch. Wer spricht Englisch?","e":"Ines und Jonas sprechen je Italienisch oder Spanisch und belegen damit beide Sprachen. Lukas spricht weder Spanisch noch Englisch, und Italienisch ist vergeben, also Französisch. Für Katrin bleibt Englisch.","tag":"Zuordnung","c":"Katrin","w":["Ines","Jonas","Lukas"],"id":"b01910c77"},{"cat":"lg","lv":2,"q":"Bei einer Besprechung begrüßen sich alle 8 Teilnehmer per Handschlag, und zwar jeder mit jedem anderen genau einmal. Wie viele Handschläge gibt es insgesamt?","e":"Jeder der 8 Teilnehmer gibt 7 Handschläge, das sind 8 · 7 = 56. Dabei wird jeder Handschlag von zwei Personen gezählt, also gibt es 56 : 2 = 28 Handschläge.","tag":"Kombinatorik","c":"28","w":["56","64","36"],"id":"b186729cc"},{"cat":"lg","lv":2,"q":"Emil, Fritz und Gabi sind jeweils entweder Wahrsager (sagen immer die Wahrheit) oder Lügner (lügen immer). Emil sagt: „Fritz lügt.“ Fritz sagt: „Gabi lügt.“ Gabi sagt: „Emil und Fritz lügen beide.“ Wer sagt die Wahrheit?","e":"Wäre Emil ein Wahrsager, wäre Fritz ein Lügner, „Gabi lügt“ also falsch, und Gabi ein Wahrsager. Dann müsste „Emil und Fritz lügen beide“ stimmen, Emil ist aber Wahrsager: Widerspruch. Also lügt Emil, Fritz sagt die Wahrheit, und Gabi lügt (ihre Aussage ist tatsächlich falsch).","tag":"Wahrheitsrätsel","c":"Nur Fritz","w":["Nur Emil","Nur Gabi","Emil und Gabi"],"id":"bacbf8ee8"},{"cat":"lg","lv":2,"q":"Der 15. Mai ist ein Freitag. Auf welchen Wochentag fällt der 3. Juli desselben Jahres?","e":"Vom 15. Mai bis zum 31. Mai sind es 16 Tage, dann 30 Tage im Juni und 3 Tage bis zum 3. Juli: 16 + 30 + 3 = 49 Tage. 49 ist ein Vielfaches von 7, der Wochentag bleibt gleich: Freitag.","tag":"Wochentage","c":"Freitag","w":["Donnerstag","Samstag","Sonntag"],"id":"b4be64242"},{"cat":"lg","lv":2,"q":"Vier Pakete P, Q, R und S werden verglichen. Alle haben ein positives Gewicht. P wiegt genauso viel wie Q und R zusammen. S ist schwerer als P. Q ist schwerer als R. Welches Paket ist das leichteste?","e":"P = Q + R ist schwerer als Q und schwerer als R. S ist schwerer als P, und Q ist schwerer als R. Damit gilt R < Q < P < S, das leichteste Paket ist R.","tag":"Waage","c":"R","w":["P","Q","S"],"id":"b524452b2"},{"cat":"lg","lv":2,"q":"Die vier Wörter Streife, Strafe, Strom und Strecke werden alphabetisch geordnet (wie in einem Lexikon). Welches Wort steht an dritter Stelle?","e":"Alle Wörter beginnen mit „Str“. Der vierte Buchstabe entscheidet: a (Strafe) vor e (Streife, Strecke) vor o (Strom). Bei Streife und Strecke entscheidet der fünfte Buchstabe: c vor i. Reihenfolge: Strafe, Strecke, Streife, Strom.","tag":"Alphabet","c":"Streife","w":["Strafe","Strom","Strecke"],"id":"bd4325e5f"},{"cat":"lg","lv":2,"q":"Ein Fußgänger geht zuerst 3 km nach Westen und dann 4 km nach Norden. Wie viele Kilometer beträgt die Luftlinie zwischen seinem Standort und dem Ausgangspunkt?","e":"Die beiden Wegstücke stehen im rechten Winkel zueinander. Nach dem Satz des Pythagoras gilt: √(3² + 4²) = √25 = 5 km.","tag":"Richtungen","t":"num","ans":5,"id":"bc37218ff"},{"cat":"lg","lv":2,"q":"Nora, Otto und Paul haben jeweils einen anderen Beruf (Arzt, Lehrer, Pilot) und jeweils ein anderes Haustier (Hund, Katze, Fisch). Nora hat die Katze. Der Lehrer hat den Fisch. Paul ist nicht Lehrer. Der Pilot hat den Hund. Welche Aussage stimmt?","e":"Der Lehrer hat den Fisch, Nora hat aber die Katze, ist also nicht Lehrerin. Paul ist ebenfalls nicht Lehrer, daher ist Otto Lehrer (mit dem Fisch). Für Nora und Paul bleiben Katze und Hund: Paul hat den Hund und ist damit Pilot, Nora ist Ärztin.","tag":"Zuordnung","c":"Paul ist Pilot und hat den Hund.","w":["Nora ist Lehrerin und hat die Katze.","Otto ist Arzt und hat den Fisch.","Paul ist Arzt und hat den Hund."],"id":"baf74809d"},{"cat":"lg","lv":2,"q":"An einer Fortbildung nehmen 24 Personen teil. 15 besuchen den Erste-Hilfe-Kurs, 11 besuchen den Kurs „Deeskalation“, und genau 5 besuchen beide Kurse. Wie viele Personen besuchen genau einen der beiden Kurse?","e":"Nur Erste Hilfe: 15 − 5 = 10. Nur Deeskalation: 11 − 5 = 6. Genau einen Kurs besuchen 10 + 6 = 16 Personen.","tag":"Mengenlogik","c":"16","w":["21","26","10"],"id":"b0575a792"},{"cat":"lg","lv":1,"q":"Regel in einem Geschäft: Wer für mehr als 20 Euro einkauft, bekommt eine Tasche geschenkt. Sandra kauft für 18 Euro ein, Tobias für 25 Euro, Ute für genau 20 Euro und Wanda für 15 Euro. Wer bekommt eine Tasche geschenkt?","e":"Nötig sind mehr als 20 Euro. Das erfüllt nur Tobias mit 25 Euro. Ute hat genau 20 Euro eingekauft, und das ist nicht mehr als 20 Euro.","tag":"Wenn-dann","c":"Tobias","w":["Sandra","Ute","Wanda"],"id":"ba8019c69"},{"cat":"lg","lv":1,"q":"In einem Behälter liegen 3 rote und 7 blaue Kugeln. Ohne hinzusehen wird eine Kugel gezogen. Wie groß ist die Wahrscheinlichkeit, dass sie rot ist?","e":"Insgesamt liegen 3 + 7 = 10 Kugeln im Behälter, davon sind 3 rot. Die Wahrscheinlichkeit beträgt also 3 von 10 (30 %). „3 von 7“ würde die roten nur mit den blauen Kugeln vergleichen.","tag":"Wahrscheinlichkeit","c":"3 von 10","w":["3 von 7","7 von 10","1 von 3"],"id":"bafe29ac8"},{"cat":"lg","lv":1,"q":"Wie spät ist es 50 Minuten nach 10:35 Uhr?","e":"10:35 Uhr plus 25 Minuten ergibt 11:00 Uhr. Die restlichen 25 der 50 Minuten führen zu 11:25 Uhr.","tag":"Uhrzeiten","c":"11:25 Uhr","w":["11:15 Uhr","11:35 Uhr","11:45 Uhr"],"id":"b859fcce3"},{"cat":"lg","lv":1,"q":"Welches der folgenden Wörter hat die meisten Silben?","e":"Ver-kehrs-schild hat 3 Silben. Kreu-zung, Am-pel und Fahr-rad haben jeweils nur 2 Silben.","tag":"Silben","c":"Verkehrsschild","w":["Kreuzung","Ampel","Fahrrad"],"id":"be1363132"},{"cat":"lg","lv":2,"q":"Im Pausenraum ist eine Tasse zerbrochen. Genau eine der vier Personen Anna, Bernd, Clara und Dieter war es. Genau eine der vier folgenden Aussagen ist wahr. Anna: „Bernd war es.“ Bernd: „Dieter war es.“ Clara: „Ich war es nicht.“ Dieter: „Bernd war es nicht.“ Wer hat die Tasse zerbrochen?","e":"Man zählt für jede Möglichkeit die wahren Aussagen. Anna war es: Clara und Dieter haben recht (2). Bernd war es: Anna und Clara haben recht (2). Dieter war es: Bernd, Clara und Dieter haben recht (3). Clara war es: Nur Dieter hat recht (1). Nur dieser Fall hat genau eine wahre Aussage.","tag":"Wahrheitsrätsel","c":"Clara","w":["Anna","Bernd","Dieter"],"id":"bcacdc676"},{"cat":"lg","lv":2,"q":"Der 20. Februar und der 10. April liegen im selben Jahr, das kein Schaltjahr ist. Wie viele Tage muss man vom 20. Februar an weiterzählen, um den 10. April zu erreichen?","e":"Vom 20. Februar bis zum 28. Februar sind es 8 Tage, dazu kommen die 31 Tage im März und 10 Tage bis zum 10. April: 8 + 31 + 10 = 49 Tage.","tag":"Kalender","c":"49","w":["48","50","51"],"id":"bdd8553d3"},{"cat":"lg","lv":2,"q":"Drei Abteilungen X, Y und Z haben zusammen 38 Beschäftigte. X hat doppelt so viele Beschäftigte wie Y. Z hat 6 Beschäftigte mehr als Y. Wie viele Beschäftigte hat X?","e":"Y habe y Beschäftigte. Dann hat X genau 2y und Z genau y + 6. Zusammen: 2y + y + (y + 6) = 4y + 6 = 38, also y = 8. X hat 2 · 8 = 16 Beschäftigte (Probe: 16 + 8 + 14 = 38).","tag":"Verteilung","t":"num","ans":16,"id":"ba5a89b6e"},{"cat":"lg","lv":2,"q":"Ein Monat mit 31 Tagen beginnt an einem Dienstag. Welche Wochentage kommen in diesem Monat genau fünfmal vor?","e":"31 Tage sind 4 volle Wochen und 3 Tage. Die vollen Wochen enthalten jeden Wochentag genau viermal. Die übrigen Tage (29., 30. und 31.) sind Dienstag, Mittwoch und Donnerstag, diese drei Wochentage kommen daher fünfmal vor.","tag":"Wochentage","c":"Dienstag, Mittwoch und Donnerstag","w":["Montag, Dienstag und Mittwoch","Mittwoch, Donnerstag und Freitag","Dienstag, Donnerstag und Freitag"],"id":"bd5b081bd"},{"cat":"lg","lv":2,"q":"Auf einer Insel sagen Wahrsager immer die Wahrheit und Lügner lügen immer. Carl sagt: „Dora ist eine Lügnerin.“ Dora sagt: „Carl und ich sind vom gleichen Typ.“ Was trifft zu?","e":"Beide Wahrsager: Carls Aussage wäre falsch, Widerspruch. Beide Lügner: Carls Aussage wäre wahr, Widerspruch. Carl Lügner, Dora Wahrsagerin: Doras Aussage wäre falsch, Widerspruch. Carl Wahrsager, Dora Lügnerin: Carls Aussage stimmt, Doras Aussage ist falsch (die Typen sind verschieden): stimmig.","tag":"Wahrheitsrätsel","c":"Carl ist ein Wahrsager, Dora ist eine Lügnerin.","w":["Carl ist ein Lügner, Dora ist eine Wahrsagerin.","Beide sind Wahrsager.","Beide sind Lügner."],"id":"b0f29769c"},{"cat":"lg","lv":2,"q":"In einem Jahr, das kein Schaltjahr ist, fällt der 1. März auf einen Donnerstag. Auf welchen Wochentag fiel der 1. Jänner desselben Jahres?","e":"Zwischen dem 1. Jänner und dem 1. März liegen 31 + 28 = 59 Tage. Wegen 59 = 8 · 7 + 3 liegt der 1. März 3 Wochentage nach dem 1. Jänner. Drei Tage vor Donnerstag: Mittwoch, Dienstag, Montag.","tag":"Wochentage","c":"Montag","w":["Sonntag","Dienstag","Samstag"],"id":"b8606f347"},{"cat":"lg","lv":2,"q":"Eine Uhr geht in jeder tatsächlichen Stunde um 3 Minuten vor. Sie wird um 6:00 Uhr morgens richtig gestellt. Wie viele Minuten zeigt sie um 18:00 Uhr (tatsächliche Zeit) desselben Tages zu viel an?","e":"Von 6:00 Uhr bis 18:00 Uhr vergehen 12 tatsächliche Stunden. In jeder dieser Stunden kommen 3 Minuten dazu: 12 · 3 = 36 Minuten.","tag":"Uhrzeiten","t":"num","ans":36,"id":"b1315cbd1"},{"cat":"lg","lv":2,"q":"30 Bonbons werden im Verhältnis 2 : 3 auf zwei Kinder verteilt. Wie viele Bonbons erhält das Kind mit dem größeren Anteil?","e":"Das Verhältnis 2 : 3 ergibt 2 + 3 = 5 Teile. Ein Teil sind 30 : 5 = 6 Bonbons. Der größere Anteil besteht aus 3 Teilen: 3 · 6 = 18 Bonbons.","tag":"Verteilung","c":"18","w":["20","15","12"],"id":"b3f92e0c7"},{"cat":"lg","lv":2,"q":"Ein Monat mit 30 Tagen hat fünf Samstage und fünf Sonntage. Auf welchen Wochentag fällt der 1. dieses Monats?","e":"30 Tage sind 4 volle Wochen und 2 Tage. Nur die beiden Wochentage des 29. und 30. kommen fünfmal vor, das sind die ersten beiden Wochentage des Monats. Sie müssen Samstag und Sonntag sein, also ist der 1. ein Samstag.","tag":"Kalender","c":"Samstag","w":["Freitag","Sonntag","Montag"],"id":"b90546d30"},{"cat":"lg","lv":2,"q":"Vier Aussagen werden gemacht. Aussage 1: Alle Teilnehmer des Kurses sind älter als 18 Jahre. Aussage 2: Tom nimmt am Kurs teil. Aussage 3: Tom ist 17 Jahre alt. Aussage 4: Mindestens ein Teilnehmer des Kurses ist älter als 30 Jahre. Welche drei Aussagen können nicht zugleich wahr sein?","e":"Nach Aussage 1 und 2 müsste Tom älter als 18 sein, nach Aussage 3 ist er aber 17: Widerspruch. Die anderen Dreiergruppen sind widerspruchsfrei, etwa: Tom ist 17 und nimmt teil, ein anderer Teilnehmer ist 35 (Aussagen 2, 3, 4), oder Tom ist 40 (Aussagen 1, 2, 4), oder Tom nimmt nicht teil (Aussagen 1, 3, 4).","tag":"Widerspruch","c":"Aussage 1, 2 und 3","w":["Aussage 1, 2 und 4","Aussage 1, 3 und 4","Aussage 2, 3 und 4"],"id":"b3c61292f"},{"cat":"lg","lv":2,"q":"In einem Behälter liegen 5 rote, 3 grüne und 2 gelbe Kugeln. Es wird blind eine Kugel gezogen. Wie groß ist die Wahrscheinlichkeit, dass sie nicht gelb ist?","e":"Insgesamt liegen 10 Kugeln im Behälter, davon sind 2 gelb, also 8 nicht gelb. 8 von 10 ergibt gekürzt 4 von 5.","tag":"Wahrscheinlichkeit","c":"4 von 5","w":["1 von 5","3 von 10","1 von 2"],"id":"ba91d0fb3"},{"cat":"lg","lv":2,"q":"Ein Fahrzeug fährt eine Strecke von 60 km. Die erste Hälfte der Strecke legt es mit 60 km/h zurück, die zweite Hälfte mit 30 km/h. Wie lange dauert die gesamte Fahrt?","e":"Jede Hälfte ist 30 km lang. Mit 60 km/h dauert die erste Hälfte 30 Minuten, mit 30 km/h dauert die zweite Hälfte 60 Minuten. Zusammen sind das 90 Minuten, also 1 Stunde 30 Minuten. (Mit dem Mittelwert 45 km/h zu rechnen wäre falsch.)","tag":"Wege und Zeit","c":"1 Stunde 30 Minuten","w":["1 Stunde 20 Minuten","1 Stunde 15 Minuten","1 Stunde"],"id":"b6c7ddf0c"},{"cat":"lg","lv":2,"q":"Eine mit Wasser gefüllte Flasche wiegt 1,2 kg. Ist sie nur halb gefüllt, wiegt sie 0,7 kg. Wie viele Gramm wiegt die leere Flasche?","e":"Die halbe Füllung wiegt 1,2 kg − 0,7 kg = 0,5 kg. Die volle Füllung wiegt also 1,0 kg. Die leere Flasche wiegt 1,2 kg − 1,0 kg = 0,2 kg = 200 g.","tag":"Gewichte","t":"num","ans":200,"id":"b862aafd7"},{"cat":"lg","lv":2,"q":"Zwei Streifenwagen starten gleichzeitig an der Inspektion zu Runden auf einer Rundstrecke. Der eine braucht für eine Runde 8 Minuten, der andere 12 Minuten. Beide fahren ohne Pause mit gleichbleibendem Tempo. Nach wie vielen Minuten sind beide zum ersten Mal wieder gleichzeitig an der Inspektion?","e":"Gesucht ist das kleinste gemeinsame Vielfache von 8 und 12. Vielfache von 8: 8, 16, 24, … Vielfache von 12: 12, 24, … Die erste gemeinsame Zahl ist 24.","tag":"Wege und Zeit","c":"24 Minuten","w":["20 Minuten","4 Minuten","96 Minuten"],"id":"bb41ee8a8"},{"cat":"lg","lv":2,"q":"Zwei Personen starten gleichzeitig an den beiden Enden einer 900 m langen geraden Straße und gehen aufeinander zu. Die eine legt 60 m pro Minute zurück, die andere 90 m pro Minute. Nach wie vielen Minuten begegnen sie sich?","e":"Zusammen verringern sie den Abstand um 60 + 90 = 150 m pro Minute. Für 900 m brauchen sie 900 : 150 = 6 Minuten.","tag":"Wege und Zeit","t":"num","ans":6,"id":"b9513e790"},{"cat":"lg","lv":3,"q":"In drei Jahren ist Lena doppelt so alt, wie sie vor fünf Jahren war. Wie alt ist Lena jetzt?","e":"Lena sei jetzt x Jahre alt. In drei Jahren ist sie x + 3, vor fünf Jahren war sie x − 5. Es gilt x + 3 = 2 · (x − 5) = 2x − 10, also x = 13. Probe: In drei Jahren 16, vor fünf Jahren 8, und 16 = 2 · 8.","tag":"Alter","t":"num","ans":13,"id":"b8b3e4b26"},{"cat":"lg","lv":3,"q":"Wie viele verschiedene Buchstabenfolgen (auch ohne Sinn) lassen sich aus allen Buchstaben des Wortes „RADAR“ bilden?","e":"RADAR hat 5 Buchstaben, R und A kommen je zweimal vor, D einmal. Für 5 verschiedene Buchstaben gäbe es 5! = 120 Anordnungen. Die beiden R und die beiden A sind untereinander vertauschbar, daher teilt man durch 2 · 2: 120 : 4 = 30.","tag":"Kombinatorik","c":"30","w":["120","60","24"],"id":"b372dd9aa"},{"cat":"lg","lv":3,"q":"Im Wort „STRASSENBAHN“ kommen manche Buchstaben mehrfach vor. Wie viele verschiedene Buchstaben kommen genau einmal vor?","e":"S-T-R-A-S-S-E-N-B-A-H-N: S kommt 3-mal vor, A 2-mal und N 2-mal. Genau einmal kommen T, R, E, B und H vor, das sind 5 Buchstaben.","tag":"Buchstaben zählen","t":"num","ans":5,"id":"bb20fe28b"},{"cat":"lg","lv":3,"q":"In einer Gruppe sprechen 18 Personen Englisch, 14 Französisch und 10 Italienisch. 8 Personen sprechen Englisch und Französisch, 5 Englisch und Italienisch, 4 Französisch und Italienisch; diese Zahlen schließen jeweils auch Personen ein, die zusätzlich die dritte Sprache sprechen. Genau 2 Personen sprechen alle drei Sprachen. Jede Person der Gruppe spricht mindestens eine dieser Sprachen. Wie viele Personen hat die Gruppe?","e":"Man addiert die drei Sprachgruppen, zieht die Überschneidungen von je zwei Sprachen ab und addiert die Personen mit allen drei Sprachen wieder dazu: 18 + 14 + 10 − 8 − 5 − 4 + 2 = 27. Probe: nur Englisch 7, nur Französisch 4, nur Italienisch 3, Englisch und Französisch 6, Englisch und Italienisch 3, Französisch und Italienisch 2, alle drei 2; zusammen 27.","tag":"Mengenlogik","t":"num","ans":27,"id":"b4790719f"},{"cat":"lg","lv":3,"q":"Eine Drohne startet im Punkt S und fliegt 4 km nach Norden. Dann biegt sie im rechten Winkel nach rechts ab und fliegt 3 km. Danach biegt sie erneut im rechten Winkel nach rechts ab und fliegt 4 km. Zuletzt biegt sie im rechten Winkel nach links ab und fliegt 1 km. Wo befindet sie sich jetzt in Bezug auf S?","e":"Start (0|0), x nach Osten, y nach Norden. 4 km nach Norden: (0|4). Rechts ab heißt Osten, 3 km: (3|4). Erneut rechts ab heißt Süden, 4 km: (3|0). Wer nach Süden blickt, hat links den Osten: 1 km nach Osten ergibt (4|0). Die Drohne ist 4 km östlich von S.","tag":"Richtungen","c":"4 km östlich von S","w":["3 km östlich von S","2 km östlich von S","4 km westlich von S"],"id":"bf9b6336d"},{"cat":"lg","lv":3,"q":"Vier Kolleginnen und Kollegen – Anton, Bruno, Clara und Dora – wurden gefragt, wer den letzten Kaffee getrunken hat. Es war genau eine der vier Personen. Genau drei der vier Aussagen sind wahr. Anton: „Bruno war es.“ Bruno: „Dora war es.“ Clara: „Ich war es nicht.“ Dora: „Bruno lügt.“ Wer hat den Kaffee getrunken?","e":"Man zählt für jede Person als Täter die wahren Aussagen. Anton: Clara und Dora haben recht (2). Bruno: Anton, Clara und Dora haben recht (3). Clara: nur Dora hat recht (1). Dora: Bruno und Clara haben recht (2). Genau drei wahre Aussagen gibt es nur, wenn Bruno es war.","tag":"Wahrheitsrätsel","c":"Bruno","w":["Anton","Clara","Dora"],"id":"b8b64e767"},{"cat":"lg","lv":3,"q":"Neun äußerlich gleiche Kugeln wiegen gleich viel, nur eine ist etwas schwerer. Mit einer Balkenwaage (ohne Gewichte) kann man zwei Gruppen von Kugeln vergleichen. Wie viele Wägungen genügen mindestens, um die schwerere Kugel mit Sicherheit zu finden?","e":"Erste Wägung: 3 Kugeln gegen 3 Kugeln. Senkt sich eine Seite, ist die schwerere Kugel dort, bei Gleichstand in der Restgruppe von 3. Zweite Wäg
