<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">

<link rel="manifest" href="manifest.webmanifest">

<title>Aufnahmetest Trainer · Polizei Steiermark</title>
<style>
/* ===== Design-Tokens im Apple-Stil (Kontrast geprüft, siehe Bericht) ===== */
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --card2:#F2F2F7; --ink:#000000; --ink2:#3C3C43; --mute:#6C6C70; --sep:#C6C6C8; --track:#E5E5EA;
  --tint:#0A5FC8; --tint-ink:#FFFFFF; --tint-bg:#E7EFFA; --btn:#0A5FC8; --alt-ink:#0A5FC8;
  --ok:#1B7F37; --ok-bg:#E8F5EC; --bad:#C4161C; --bad-bg:#FDECEC; --warn:#8A5A00; --warn-bg:#FFF4D6; --star:#B56B00;
  --flag:#C8102E; --fill:rgba(118,118,128,.12); --bar:rgba(249,249,249,.78); --shadow:0 1px 2px rgba(0,0,0,.04);
  --navy:var(--tint); --navy-ink:var(--tint-ink); --sel:var(--tint-bg); --line:var(--track); --red:var(--bad); --field:var(--sep);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",system-ui,"Segoe UI",Roboto,Arial,sans-serif;
  --font-r:ui-rounded,-apple-system,"SF Pro Rounded",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --card:#1C1C1E; --card2:#2C2C2E; --ink:#FFFFFF; --ink2:#EBEBF5; --mute:#98989F; --sep:#38383A; --track:#3A3A3C;
  --tint:#0A84FF; --tint-ink:#FFFFFF; --tint-bg:#0B2747; --btn:#0A6CE0; --alt-ink:#5AA9FF;
  --ok:#30D158; --ok-bg:#0E2A17; --bad:#FF6961; --bad-bg:#3A1715; --warn:#FFD60A; --warn-bg:#332B00; --star:#FFD60A;
  --fill:rgba(118,118,128,.24); --bar:rgba(22,22,24,.78); --shadow:none; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1C1C1E; --card2:#2C2C2E; --ink:#FFFFFF; --ink2:#EBEBF5; --mute:#98989F; --sep:#38383A; --track:#3A3A3C;
  --tint:#0A84FF; --tint-ink:#FFFFFF; --tint-bg:#0B2747; --btn:#0A6CE0; --alt-ink:#5AA9FF;
  --ok:#30D158; --ok-bg:#0E2A17; --bad:#FF6961; --bad-bg:#3A1715; --warn:#FFD60A; --warn-bg:#332B00; --star:#FFD60A;
  --fill:rgba(118,118,128,.24); --bar:rgba(22,22,24,.78); --shadow:none; color-scheme:dark;}
@media (prefers-contrast: more){:root{--mute:#3C3C43;--sep:#8E8E93;--track:#AEAEB2;--tint:#0040DD}
  :root[data-theme="dark"]{--mute:#C7C7CC;--sep:#8E8E93;--track:#636366;--tint:#409CFF}}
@media (prefers-contrast: more) and (prefers-color-scheme: dark){:root:not([data-theme="light"]){--mute:#C7C7CC;--sep:#8E8E93;--track:#636366;--tint:#409CFF}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.4;letter-spacing:-.01em;-webkit-text-size-adjust:100%;overflow-x:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;letter-spacing:inherit}
h1,h2,h3{font-weight:700;margin:0;letter-spacing:-.02em;text-wrap:balance}
h1.lt{font-size:34px;line-height:1.12;letter-spacing:-.025em;margin:6px 0 2px}
h2{font-size:22px;line-height:1.2} h3{font-size:20px;line-height:1.25}
.kick{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:15px;margin:0 0 6px}
.flag{display:inline-block;width:22px;height:14px;border-radius:3px;background:linear-gradient(var(--flag) 0 33.3%,#fff 33.3% 66.6%,var(--flag) 66.6%);box-shadow:0 0 0 .5px rgba(0,0,0,.25)}
/* Navigationsleiste oben (schwebende Ebene, Material nur hier und in der Tab-Leiste) */
.top{position:sticky;top:0;z-index:6;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);padding:env(safe-area-inset-top) 12px 0;border-bottom:.5px solid transparent;transition:border-color .2s}
.top.scrolled,.top.session{border-bottom-color:var(--sep)}
.top .in{max-width:640px;margin:0 auto;height:44px;display:flex;align-items:center;justify-content:center;position:relative}
.top .tt{font-size:17px;font-weight:600;opacity:0;transition:opacity .2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62%}
.top.scrolled .tt,.top.session .tt{opacity:1}
.clock{position:absolute;right:0;font-family:var(--font-r);font-size:17px;font-weight:600;color:var(--ink);background:var(--fill);border-radius:99px;padding:4px 12px;font-variant-numeric:tabular-nums;min-width:66px;text-align:center}
.clock.low{background:#C4161C;color:#fff}
.clock:empty{display:none}
.wrap{max-width:640px;margin:0 auto;padding:6px 16px calc(110px + env(safe-area-inset-bottom));zoom:var(--z,1)}
.wrap.nonav{padding-bottom:calc(40px + env(safe-area-inset-bottom))}
.sub{color:var(--mute);font-size:15px}
.small{font-size:13px}
.card{background:var(--card);border-radius:14px;padding:16px;margin:14px 0;box-shadow:var(--shadow)}
.card.flat{padding:4px 16px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.btn{font-size:17px;font-weight:600;border-radius:14px;padding:14px 16px;border:0;background:var(--btn);color:var(--tint-ink);cursor:pointer;min-height:50px;flex:1 1 150px;text-align:center;transition:transform .1s,opacity .1s}
.btn:active{transform:scale(.98);opacity:.85}
.btn.alt{background:var(--tint-bg);color:var(--alt-ink)}
.btn.red{background:var(--bad);color:#fff}
.btn.sm{min-height:44px;padding:10px 16px;flex:0 1 auto;max-width:100%;font-size:17px;border-radius:12px}
.btn[disabled]{opacity:.4;cursor:default}
:focus-visible{outline:3px solid var(--tint);outline-offset:2px}
.back{background:none;border:0;color:var(--tint);font-size:17px;padding:10px 0;cursor:pointer;min-height:44px;display:inline-flex;align-items:center;gap:2px;margin-left:-4px}
.back.x::before{display:none}
.back::before{content:"";width:11px;height:11px;border-left:2.6px solid currentColor;border-bottom:2.6px solid currentColor;transform:rotate(45deg);margin:0 4px 0 6px;border-radius:1px}
.bar{height:6px;background:var(--track);border-radius:3px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--tint);border-radius:3px}
.bar.ok>i{background:var(--ok)} .bar.warn>i{background:#FF9F0A} .bar.bad>i{background:var(--bad)}
@media (prefers-reduced-motion:no-preference){.bar>i{transition:width .4s cubic-bezier(.2,.8,.2,1)}}
.chip{display:inline-flex;align-items:center;font-size:13px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--fill);color:var(--ink2);white-space:nowrap}
.chip .dots{letter-spacing:1px;margin-left:5px;color:var(--tint);font-size:11px}
.big{font-family:var(--font-r);font-size:56px;line-height:1;font-weight:700;letter-spacing:-.03em;color:var(--ink);font-variant-numeric:tabular-nums}
.verd{font-size:20px;font-weight:700;margin-top:4px}
.note{font-size:13px;color:var(--mute);margin:20px 4px 0;line-height:1.4}
.warnbox{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:12px 14px;font-size:15px;margin:12px 0}
/* Start */
.area{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:10px 0;border-bottom:.5px solid var(--sep);font-size:15px}
.area:last-child{border-bottom:0}
.area .bar{grid-column:1/-1}
.area b{font-variant-numeric:tabular-nums;font-weight:600}
.hero{display:flex;align-items:center;gap:18px}
.ring{flex:0 0 96px;height:96px;position:relative}
.ring svg{width:96px;height:96px;transform:rotate(-90deg)}
.ring .rv{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--font-r);font-weight:700;font-size:28px;line-height:1;color:var(--ink)}
.ring .rv small{font-family:var(--font);font-size:12px;font-weight:600;color:var(--mute);margin-top:3px}
@media (prefers-reduced-motion:no-preference){.ring .pr{transition:stroke-dasharray .6s cubic-bezier(.2,.8,.2,1)}}
/* Listen (inset grouped) */
.list{background:var(--card);border-radius:14px;margin:14px 0;overflow:hidden;box-shadow:var(--shadow)}
.li{position:relative;display:flex;align-items:center;gap:14px;width:100%;background:none;border:0;padding:11px 16px;min-height:60px;text-align:left;cursor:pointer;color:var(--ink)}
.li+.li::before{content:"";position:absolute;top:0;left:62px;right:0;border-top:.5px solid var(--sep)}
.li:active{background:var(--fill)}
.li .ic{flex:0 0 32px;height:32px;border-radius:8px;background:var(--tint);color:#fff;display:flex;align-items:center;justify-content:center}
.li .ic.c2{background:#FF9500}.li .ic.c3{background:#34C759}.li .ic.c4{background:#AF52DE}.li .ic.c5{background:#FF3B30}.li .ic.c6{background:#8E8E93}.li .ic.c7{background:#30B0C7}.li .ic.c8{background:#5856D6}.li .ic.c9{background:#A2845E}
.li .ic svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.li .tx{flex:1;min-width:0}.li .tx b{display:block;font-size:17px;font-weight:400}.li .tx span{display:block;color:var(--mute);font-size:15px}
.li .chev{flex:0 0 auto;width:8px;height:8px;border-right:2px solid #8A8A8E;border-top:2px solid #8A8A8E;transform:rotate(45deg);margin-right:4px;font-size:0;color:transparent}
.li[disabled]{cursor:default}.li[disabled] .tx b{color:var(--mute)}.li[disabled]:active{background:none}
.catc{display:block;width:100%;text-align:left;background:var(--card);border:0;border-radius:14px;padding:14px 16px;margin:10px 0;cursor:pointer;box-shadow:var(--shadow);color:var(--ink)}
.catc:active{background:var(--card2)}
.catc .l1{display:flex;justify-content:space-between;align-items:center;gap:4px 8px;flex-wrap:wrap}
.catc .t{font-size:17px;font-weight:600}
.catc .d{font-size:15px;color:var(--mute);margin:2px 0 10px}
.catc .st{display:flex;justify-content:space-between;flex-wrap:wrap;gap:0 8px;font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums;margin-top:8px}
.sec{font-size:13px;letter-spacing:.02em;text-transform:uppercase;color:var(--mute);margin:24px 16px 6px;font-weight:400}
/* Frage */
.prog{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums;margin:2px 0 4px}
.prog .bar{flex:1}
.q{font-size:20px;font-weight:600;line-height:1.35;margin:10px 0 16px;white-space:pre-line;overflow-wrap:anywhere}
.q.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:.06em;font-size:18px;font-weight:500}
.fig{margin:6px 0 12px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.fig svg{display:inline-block;vertical-align:middle}
.fgrow{display:flex;flex-wrap:nowrap;gap:4px;align-items:center}
.opts{margin:0}
.opt{position:relative;display:block;width:100%;text-align:left;background:var(--card2);color:var(--ink);border:2px solid transparent;border-radius:12px;padding:14px 16px;margin:10px 0;cursor:pointer;min-height:54px;overflow-wrap:anywhere;font-size:17px;transition:background .15s,border-color .15s}
.opt:active{background:var(--fill)}
.opt.chk{min-height:48px;padding:11px 14px;font-size:16px;background:var(--card)}
.opt.sel{border-color:var(--tint);background:var(--tint-bg)}
.btn.red{background:#C4161C}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt.ok,.opt.bad{padding-right:44px}
.opt .mk{position:absolute;top:50%;right:12px;transform:translateY(-50%);font-weight:700;font-size:19px;line-height:1}
.opt.ok .mk{color:var(--ok)} .opt.bad .mk{color:var(--bad)}
.opts.oh{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts.oh .opt{margin:0;display:flex;align-items:center;justify-content:center;padding:8px;background:var(--card)}
.card .opts.oh .opt{background:var(--card2)}
.opts.oh .opt .mk{top:8px;transform:none}
.opts.oh .opt svg{max-width:100%;height:auto}
.opt .lab{font-weight:700;color:var(--mute);margin-right:8px}
.opt[disabled]{cursor:default}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.exp{padding:12px 14px;margin:14px 0;background:var(--card2);border-radius:12px;font-size:16px;white-space:pre-line;color:var(--ink2)}
.verdict{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;margin-top:12px}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.inrow{display:flex;gap:10px}
input.ans{font:inherit;font-size:22px;flex:1;min-width:0;padding:12px 16px;border:2px solid transparent;border-radius:12px;background:var(--card2);color:var(--ink);font-variant-numeric:tabular-nums;min-height:54px}
input.ans:focus,.ans:focus{border-color:var(--tint);outline:none;background:var(--card)}
input.ans::placeholder{color:var(--mute)}
input.date{width:100%;font:inherit;font-size:17px;padding:12px 14px;border:0;border-radius:12px;background:var(--card2);color:var(--ink);min-height:50px;margin-top:8px}
.star{background:none;border:0;font-size:26px;line-height:1;cursor:pointer;color:var(--mute);padding:6px;min-width:44px;min-height:44px}
.star.on{color:var(--star)}
.textp{background:var(--card);border-radius:14px;padding:12px 16px;font-size:17px;margin:8px 0 12px;box-shadow:var(--shadow)}
.textp summary{cursor:pointer;font-size:17px;font-weight:600;min-height:32px}
.textp .tx{white-space:pre-line;margin-top:8px;line-height:1.5}
.mat{border-collapse:collapse;margin:4px 0}
.mat td{border:1.5px solid var(--sep);width:56px;height:48px;text-align:center;font:600 22px var(--font);font-variant-numeric:tabular-nums}
.mat td.qm{background:var(--tint-bg);color:var(--tint)}
.memo{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px 16px;font-size:20px;margin:12px 0;font-variant-numeric:tabular-nums}
.memo span{color:var(--ink2)}
.memo b{text-align:right;overflow-wrap:anywhere;font-weight:600}
.timer{font-family:var(--font-r);font-size:44px;font-weight:700;color:var(--tint);font-variant-numeric:tabular-nums}
.toast{background:var(--ok-bg);color:var(--ok);border-radius:12px;padding:12px 14px;font-weight:600;margin:12px 0}
.toast.dn{background:var(--warn-bg);color:var(--warn)}
.linkb{background:none;border:0;color:var(--tint);font:inherit;font-weight:600;padding:0;cursor:pointer}
.intro h2{margin-top:8px}
.card.frame-ok{box-shadow:0 0 0 2px var(--ok)}.card.frame-bad{box-shadow:0 0 0 2px var(--bad)}
.chip.re{background:var(--warn-bg);color:var(--warn)}
.row.conf{margin-top:8px}.row.conf .btn{flex:1 1 auto;white-space:nowrap;padding:12px 14px;font-size:16px}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}.kpi .big{font-size:40px}
table.t td.n{white-space:nowrap}
table.t th{overflow-wrap:normal;word-break:normal;-webkit-hyphens:manual;hyphens:manual}
@media (max-width:360px){html.fsbig table.t th{text-transform:none;overflow-wrap:anywhere}html.fsbig table.t td.n{white-space:normal}}
@media (prefers-reduced-motion: no-preference){:root:not(.noanim) .pop{animation:pop .36s cubic-bezier(.34,1.56,.64,1) both}}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.exp,.fcard span{overflow-wrap:anywhere;-webkit-hyphens:auto;hyphens:auto}
.exp .rule{display:block;margin-top:10px;font-size:14px;color:var(--ink2)}.exp .rule a{color:var(--tint)}


.chip{max-width:100%;white-space:normal;overflow-wrap:anywhere}
#notesearch{background:var(--card);margin-top:4px}
.card2{background:var(--card2);border-radius:12px;padding:12px;margin:10px 0}
.btn.tts{float:right;margin:-4px 0 6px 10px}
.fcard{display:block;width:100%;border:0;background:none;padding:0;margin:12px 0;perspective:1200px;cursor:pointer;color:var(--ink);text-align:left}
.fcard .fin{display:grid;transition:transform .38s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.fcard.on .fin{transform:rotateY(180deg)}
.fcard .ff,.fcard .fb{grid-area:1/1;display:flex;flex-direction:column;gap:12px;min-height:240px;background:var(--card);border-radius:18px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.08);backface-visibility:hidden;-webkit-backface-visibility:hidden}
.fcard .fb{transform:rotateY(180deg)}
.fcard .fq{font-size:20px;font-weight:600;line-height:1.35;white-space:pre-line;flex:1}
.fcard .fa{font-size:22px;font-weight:700;color:var(--ok)}
.fcard .fe{font-size:16px;color:var(--ink2)}
@media (prefers-reduced-motion: reduce){.fcard .fin{transition:none}}
:root.noanim .fcard .fin{transition:none}
.stick{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom));z-index:2}
/* Tabellen */
table.t{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
table.t th{text-align:left;font-weight:400;color:var(--mute);font-size:13px;text-transform:uppercase;letter-spacing:.02em;padding:6px 4px}
table.t td{padding:10px 4px;border-top:.5px solid var(--sep);vertical-align:top}
.t.tl td:first-child{white-space:nowrap;padding-right:12px;color:var(--mute)}
.rv{padding:12px 0;border-top:.5px solid var(--sep);font-size:16px}
.rv:first-of-type{border-top:0}
.rv .qq{font-weight:600;white-space:pre-line}
textarea.bk{width:100%;min-height:110px;font:15px ui-monospace,"SF Mono",Menlo,monospace;background:var(--card2);color:var(--ink);border:0;border-radius:12px;padding:10px}
/* Segmentierte Steuerung */
.seg{display:flex;gap:2px;margin:10px 0;background:var(--fill);border-radius:10px;padding:2px}
.seg button{flex:1 1 0;min-width:0;min-height:44px;border:0;background:none;border-radius:8px;font-size:15px;font-weight:500;cursor:pointer;color:var(--ink);padding:4px 6px}
.seg button.on{background:var(--card);font-weight:600;box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04)}
:root[data-theme="dark"] .seg button.on{background:#636366}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg button.on{background:#636366}}
/* Schmale Bildschirme und große Schrift: umbrechen statt abschneiden */
h1,h2,h3,.li .tx b,.catc .t,.sub,td,th{overflow-wrap:anywhere;-webkit-hyphens:auto;hyphens:auto}
.card div[style*="justify-content:space-between"]{flex-wrap:wrap}
.area{grid-template-columns:minmax(0,1fr) auto}
table.t th,table.t td{padding-left:3px;padding-right:3px}
.hero{flex-wrap:wrap}
/* Tab-Leiste */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
.nav button{flex:1;max-width:160px;background:none;border:0;padding:6px 2px 4px;min-height:52px;cursor:pointer;color:var(--mute);font-size:11px;font-weight:500;letter-spacing:0;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--tint)}
@media (prefers-reduced-transparency: reduce){.top,.nav{background:var(--card);-webkit-backdrop-filter:none;backdrop-filter:none}}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
@media (max-width:360px){.big{font-size:48px}h1.lt{font-size:30px}}
.seg{flex-wrap:wrap}
.seg button{flex:1 1 auto;min-width:fit-content;white-space:nowrap;line-height:1.15}

/* ===== Version 7 ===== */

<script>
const BANKRAW=[{"cat":"at","lv":1,"q":"Aus wie vielen Bundesländern besteht die Republik Österreich?","e":"Österreich ist ein Bundesstaat aus neun Ländern: Burgenland, Kärnten, Niederösterreich, Oberösterreich, Salzburg, Steiermark, Tirol, Vorarlberg und Wien.","tag":"Bundesländer","t":"num","ans":9,"id":"b3a92bd97"},{"cat":"at","lv":1,"q":"Welche Stadt ist die Landeshauptstadt von Tirol?","e":"Innsbruck am Inn ist die Landeshauptstadt Tirols. Kufstein, Lienz und Landeck sind Bezirkshauptstädte.","tag":"Landeshauptstädte","c":"Innsbruck","w":["Kufstein","Lienz","Landeck"],"id":"bb561485c"},{"cat":"at","lv":1,"q":"Welcher Strom fließt durch die Bundeshauptstadt Wien?","e":"Die Donau ist der bedeutendste Strom Österreichs und durchfließt Wien. Inn, Mur und Drau fließen nicht durch die Bundeshauptstadt.","tag":"Flüsse","c":"Donau","w":["Inn","Mur","Drau"],"id":"b7d3b2421"},{"cat":"at","lv":2,"q":"Welche Stadt ist die Landeshauptstadt von Vorarlberg?","e":"Bregenz am Bodensee ist die Landeshauptstadt Vorarlbergs. Dornbirn ist die größte Stadt des Landes, Feldkirch und Bludenz sind weitere Bezirkshauptstädte.","tag":"Landeshauptstädte","c":"Bregenz","w":["Dornbirn","Feldkirch","Bludenz"],"id":"b8e0397f8"},{"cat":"at","lv":1,"q":"Welches Gebirge nimmt den größten Teil des österreichischen Staatsgebiets ein?","e":"Der überwiegende Teil Österreichs gehört zu den Alpen. Karpaten, Pyrenäen und Sudeten prägen das Land nicht.","tag":"Gebirge","c":"Die Alpen","w":["Die Karpaten","Die Pyrenäen","Die Sudeten"],"id":"b46894157"},{"cat":"at","lv":1,"q":"Wie heißt der höchste Berg Österreichs?","e":"Der Großglockner in den Hohen Tauern ist mit 3798 Metern der höchste Berg Österreichs. Sein Gipfel liegt an der Grenze zwischen Kärnten und Tirol.","tag":"Berge","c":"Großglockner","w":["Wildspitze","Weißkugel","Hochkönig"],"id":"ba6713015"},{"cat":"at","lv":1,"q":"Mit wie vielen Staaten hat Österreich eine gemeinsame Landesgrenze?","e":"Österreich grenzt an Deutschland, Tschechien, die Slowakei, Ungarn, Slowenien, Italien, die Schweiz und Liechtenstein, das sind acht Staaten.","tag":"Nachbarstaaten","t":"num","ans":8,"id":"bd637294c"},{"cat":"at","lv":1,"q":"Welche Stadt ist die Landeshauptstadt von Kärnten?","e":"Klagenfurt am Wörthersee ist die Landeshauptstadt Kärntens. Villach, Spittal an der Drau und Wolfsberg sind bedeutende Städte des Landes, aber nicht der Sitz der Landesregierung.","tag":"Landeshauptstädte","c":"Klagenfurt am Wörthersee","w":["Villach","Spittal an der Drau","Wolfsberg"],"id":"bbfd9a24d"},{"cat":"at","lv":1,"q":"Welches Bundesland hat die meisten Einwohnerinnen und Einwohner?","e":"Wien ist das einwohnerstärkste Bundesland, gefolgt von Niederösterreich, Oberösterreich und der Steiermark.","tag":"Bundesländer","c":"Wien","w":["Niederösterreich","Oberösterreich","Steiermark"],"id":"bd0528f94"},{"cat":"at","lv":1,"q":"Wie heißt die Landeshauptstadt des Burgenlandes?","e":"Eisenstadt ist die Landeshauptstadt des Burgenlandes. Oberwart, Neusiedl am See und Mattersburg sind Bezirkshauptstädte.","tag":"Landeshauptstädte","c":"Eisenstadt","w":["Oberwart","Neusiedl am See","Mattersburg"],"id":"bb6e2b521"},{"cat":"at","lv":1,"q":"Welcher der folgenden Staaten ist kein Nachbarstaat Österreichs?","e":"Österreich grenzt an acht Staaten, Polen gehört nicht dazu. Ungarn, Slowenien und Liechtenstein sind Nachbarstaaten.","tag":"Nachbarstaaten","c":"Polen","w":["Ungarn","Slowenien","Liechtenstein"],"id":"bc7640da2"},{"cat":"at","lv":1,"q":"Welches Bundesland ist der Fläche nach das kleinste?","e":"Wien ist mit rund 415 Quadratkilometern das flächenmäßig kleinste Bundesland. Unter den übrigen Ländern hat Vorarlberg die kleinste Fläche.","tag":"Bundesländer","c":"Wien","w":["Vorarlberg","Burgenland","Salzburg"],"id":"b9fb6725a"},{"cat":"at","lv":2,"q":"Welches Bundesland hat die größte Fläche?","e":"Niederösterreich ist mit mehr als 19.000 Quadratkilometern das flächengrößte Bundesland, die Steiermark liegt an zweiter Stelle.","tag":"Bundesländer","c":"Niederösterreich","w":["Steiermark","Tirol","Oberösterreich"],"id":"b98dabf20"},{"cat":"at","lv":1,"q":"Der Brennerpass verbindet Österreich mit welchem Nachbarstaat?","e":"Der Brennerpass verbindet Nordtirol mit Südtirol in Italien und ist einer der wichtigsten Alpenübergänge.","tag":"Verkehrswege","c":"Italien","w":["Schweiz","Slowenien","Deutschland"],"id":"ba06b8d09"},{"cat":"at","lv":2,"q":"Welche der folgenden Städte ist keine Landeshauptstadt?","e":"Villach ist eine große Stadt in Kärnten, aber nicht Sitz der Landesregierung. Eisenstadt, Bregenz und St. Pölten sind Landeshauptstädte.","tag":"Landeshauptstädte","c":"Villach","w":["Eisenstadt","Bregenz","St. Pölten"],"id":"b71aacfe1"},{"cat":"at","lv":2,"q":"Welches Bundesland kam erst 1921 von Ungarn zu Österreich?","e":"Nach dem Ersten Weltkrieg wurde das Gebiet des heutigen Burgenlandes Ungarn abgesprochen; die Übernahme durch Österreich erfolgte 1921.","tag":"Bundesländer","c":"Burgenland","w":["Vorarlberg","Kärnten","Salzburg"],"id":"bcfe3f01f"},{"cat":"at","lv":2,"q":"In welcher Gebirgsgruppe liegt der Großglockner?","e":"Der Großglockner gehört zur Glocknergruppe in den Hohen Tauern.","tag":"Gebirge","c":"Hohe Tauern","w":["Ötztaler Alpen","Karnische Alpen","Dachsteingebirge"],"id":"b5735e400"},{"cat":"at","lv":2,"q":"Welche drei Staaten haben Anteil am Bodensee?","e":"An den Bodensee grenzen Deutschland, Österreich (Vorarlberg) und die Schweiz. Liechtenstein hat kein Ufer am Bodensee.","tag":"Seen","c":"Deutschland, Österreich und die Schweiz","w":["Deutschland, Österreich und Liechtenstein","Österreich, die Schweiz und Italien","Deutschland, die Schweiz und Frankreich"],"id":"b84007c42"},{"cat":"at","lv":2,"q":"Welches der folgenden Viertel gehört nicht zu Niederösterreich?","e":"Niederösterreich gliedert sich in Waldviertel, Weinviertel, Mostviertel und Industrieviertel. Das Mühlviertel liegt in Oberösterreich.","tag":"Landschaften","c":"Mühlviertel","w":["Waldviertel","Weinviertel","Industrieviertel"],"id":"b61390122"},{"cat":"at","lv":2,"q":"Wie nennt man den warmen, trockenen Fallwind, der im Alpenraum an der windabgewandten Seite des Gebirges auftritt?","e":"Der Föhn ist ein warmer, trockener Fallwind im Lee eines Gebirges. Mistral, Bora und Tramontana sind kalte Winde anderer Regionen.","tag":"Klima","c":"Föhn","w":["Mistral","Bora","Tramontana"],"id":"b85523400"},{"cat":"at","lv":3,"q":"Durch welche beiden Bundesländer fließt die Drau auf österreichischem Staatsgebiet?","e":"Die Drau durchfließt Osttirol und Kärnten und verlässt Österreich bei Lavamünd in Richtung Slowenien.","tag":"Flüsse","c":"Tirol (Osttirol) und Kärnten","w":["Kärnten und Steiermark","Salzburg und Kärnten","Tirol und Salzburg"],"id":"b563e9d03"},{"cat":"at","lv":3,"q":"Welcher See ist der größte, der zur Gänze auf österreichischem Staatsgebiet liegt?","e":"Der Attersee im Salzkammergut ist mit rund 46 Quadratkilometern der größte See, der ganz in Österreich liegt. Bodensee und Neusiedler See gehören nur teilweise zu Österreich.","tag":"Seen","c":"Attersee","w":["Wörthersee","Traunsee","Mondsee"],"id":"bf8342390"},{"cat":"at","lv":3,"q":"Welcher Berg ist nach dem Großglockner der zweithöchste Österreichs?","e":"Die Wildspitze in den Ötztaler Alpen ist mit 3768 Metern der zweithöchste Berg Österreichs, nur 30 Meter niedriger als der Großglockner.","tag":"Berge","c":"Wildspitze","w":["Weißkugel","Großvenediger","Hochalmspitze"],"id":"b2c0d32b2"},{"cat":"at","lv":1,"q":"Welche Staatsform hat Österreich laut Bundes-Verfassungsgesetz?","e":"Artikel 1 des Bundes-Verfassungsgesetzes lautet: „Österreich ist eine demokratische Republik. Ihr Recht geht vom Volk aus.“","tag":"Bundesverfassung","c":"Demokratische Republik","w":["Konstitutionelle Monarchie","Parlamentarische Monarchie","Absolute Monarchie"],"id":"b0278b25a"},{"cat":"at","lv":1,"q":"Wie heißt das gesetzgebende Organ eines Bundeslandes?","e":"Der Landtag beschließt die Landesgesetze. Nationalrat und Bundesrat sind Organe des Bundes, der Gemeinderat ist die Vertretung der Gemeinde.","tag":"Staatsaufbau","c":"Landtag","w":["Bundesrat","Nationalrat","Gemeinderat"],"id":"b301c1c30"},{"cat":"at","lv":1,"q":"Ab welchem Alter dürfen österreichische Staatsbürgerinnen und Staatsbürger bei der Nationalratswahl wählen?","e":"Das aktive Wahlalter, also das Recht zu wählen, beträgt 16 Jahre.","tag":"Wahlrecht","t":"num","ans":16,"id":"bf781bc97"},{"cat":"at","lv":3,"q":"Welcher Gebirgszug bildet die Grenze zwischen Kärnten und Slowenien?","e":"Entlang des Hauptkamms der Karawanken verläuft die Grenze zwischen Kärnten und Slowenien. Die Karnischen Alpen bilden die Grenze zu Italien, die Gailtaler Alpen liegen im Inneren Kärntens.","tag":"Gebirge","c":"Karawanken","w":["Karnische Alpen","Gailtaler Alpen","Julische Alpen"],"id":"b4b6cbb4f"},{"cat":"at","lv":2,"q":"Wie heißt das Donautal zwischen Melk und Krems, das zum UNESCO-Welterbe zählt?","e":"Die Wachau in Niederösterreich ist eine Kulturlandschaft entlang der Donau und seit dem Jahr 2000 UNESCO-Welterbe.","tag":"Landschaften","c":"Wachau","w":["Nibelungengau","Strudengau","Machland"],"id":"b79677297"},{"cat":"at","lv":2,"q":"Welche beiden Bundesländer verbindet der Arlberg-Straßentunnel?","e":"Der Arlberg-Straßentunnel führt von St. Anton am Arlberg in Tirol nach Langen am Arlberg in Vorarlberg.","tag":"Verkehrswege","c":"Tirol und Vorarlberg","w":["Tirol und Salzburg","Vorarlberg und Salzburg","Tirol und Kärnten"],"id":"bfea4f193"},{"cat":"at","lv":1,"q":"In welchem Jahr wurde in Österreich das Euro-Bargeld eingeführt?","e":"Am 1. Jänner 2002 wurde das Euro-Bargeld eingeführt. Der Schilling blieb noch bis Ende Februar 2002 gesetzliches Zahlungsmittel.","tag":"Währung","t":"num","ans":2002,"id":"b52959596"},{"cat":"at","lv":1,"q":"Welche Währung galt in Österreich unmittelbar vor der Einführung des Euro-Bargelds?","e":"Der Schilling war bis 2002 das gesetzliche Zahlungsmittel. Die Krone wurde schon 1925 durch den Schilling abgelöst.","tag":"Währung","c":"Schilling","w":["Krone","Gulden","Mark"],"id":"b7bda4427"},{"cat":"at","lv":2,"q":"Welche Bundesländer haben Anteil am Nationalpark Hohe Tauern?","e":"Der Nationalpark Hohe Tauern, der größte Nationalpark Österreichs, erstreckt sich über Kärnten, Salzburg und Tirol.","tag":"Nationalparks","c":"Kärnten, Salzburg und Tirol","w":["Kärnten, Steiermark und Tirol","Salzburg, Steiermark und Tirol","Kärnten, Oberösterreich und Salzburg"],"id":"b1c02565e"},{"cat":"at","lv":3,"q":"Zu welchem Gebirgsmassiv gehören geologisch das Waldviertel und das Mühlviertel?","e":"Im Mühlviertel und im Waldviertel reicht die Böhmische Masse mit ihrem Südende nach Österreich. Es handelt sich um altes Granit- und Gneisland.","tag":"Landschaften","c":"Zur Böhmischen Masse","w":["Zu den Karpaten","Zu den Dinariden","Zu den Zentralalpen"],"id":"b445db6f8"},{"cat":"at","lv":3,"q":"Welcher See, der zur Gänze in Österreich liegt, ist mit rund 190 Metern der tiefste?","e":"Der Traunsee in Oberösterreich ist mit einer größten Tiefe von 191 Metern der tiefste See Österreichs. Der Attersee ist der zweittiefste.","tag":"Seen","c":"Traunsee","w":["Attersee","Wolfgangsee","Wörthersee"],"id":"b610b21b1"},{"cat":"at","lv":1,"q":"Welche drei Staatsgewalten unterscheidet man in einem demokratischen Rechtsstaat?","e":"Gesetzgebung (Legislative), Vollziehung (Exekutive) und Gerichtsbarkeit (Judikative) sollen einander gegenseitig kontrollieren.","tag":"Gewaltenteilung","c":"Gesetzgebung, Vollziehung und Gerichtsbarkeit","w":["Gesetzgebung, Verwaltung und Opposition","Regierung, Parlament und Medien","Bund, Länder und Gemeinden"],"id":"bc4b2c2bc"},{"cat":"at","lv":1,"q":"Welcher Staatsgewalt ist die Polizei zuzuordnen?","e":"Die Polizei vollzieht Gesetze und gehört daher zur Vollziehung, auch Exekutive genannt.","tag":"Gewaltenteilung","c":"Der Vollziehung (Exekutive)","w":["Der Gesetzgebung (Legislative)","Der Gerichtsbarkeit (Judikative)","Der Presse (vierte Gewalt)"],"id":"bb527f9b6"},{"cat":"at","lv":1,"q":"Wie lautet die Bezeichnung für die Regierungschefin bzw. den Regierungschef eines Bundeslandes?","e":"An der Spitze der Landesregierung steht die Landeshauptfrau bzw. der Landeshauptmann. Landesräte sind Mitglieder der Landesregierung.","tag":"Staatsaufbau","c":"Landeshauptfrau bzw. Landeshauptmann","w":["Bürgermeisterin bzw. Bürgermeister","Landesrätin bzw. Landesrat","Bezirkshauptfrau bzw. Bezirkshauptmann"],"id":"b5f0dcc60"},{"cat":"at","lv":2,"q":"Welche drei Städte verbindet die Südautobahn (A2) unter anderem?","e":"Die A2 führt von Wien über den Wechsel, Graz und Klagenfurt bis Arnoldstein an der Grenze zu Italien.","tag":"Verkehrswege","c":"Wien, Graz und Klagenfurt","w":["Wien, Linz und Salzburg","Wien, St. Pölten und Innsbruck","Wien, Eisenstadt und Bregenz"],"id":"b8c169a84"},{"cat":"at","lv":2,"q":"Welcher Klimatyp prägt den Osten Österreichs, etwa das Burgenland?","e":"Das pannonische Klima ist warm und trocken mit heißen Sommern; die Winter können durch kontinentale Einflüsse kalt sein.","tag":"Klima","c":"Das pannonische Klima","w":["Das Mittelmeerklima","Das Hochgebirgsklima","Das atlantische Küstenklima"],"id":"b2816f1b8"},{"cat":"at","lv":3,"q":"Welche Stadt wurde 1986 zur Landeshauptstadt von Niederösterreich?","e":"St. Pölten ist seit dem 10. Juli 1986 Landeshauptstadt Niederösterreichs. Zuvor hatte die Landesregierung ihren Sitz in Wien.","tag":"Landeshauptstädte","c":"St. Pölten","w":["Wiener Neustadt","Krems an der Donau","Baden bei Wien"],"id":"b3a32c53b"},{"cat":"at","lv":1,"q":"Welcher Fluss fließt durch die Stadt Salzburg?","e":"Die Salzach fließt mitten durch die Stadt Salzburg und mündet später in den Inn.","tag":"Flüsse","c":"Salzach","w":["Enns","Traun","Mur"],"id":"ba4bae3ee"},{"cat":"at","lv":2,"q":"Wie nennt man einen Staat, der sich wie Österreich aus mehreren Ländern mit eigener Gesetzgebung zusammensetzt?","e":"Österreich ist ein Bundesstaat: Gesetzgebung und Vollziehung sind zwischen dem Bund und den neun Ländern aufgeteilt. Einen Einheitsstaat ohne Länder mit eigener Gesetzgebung gibt es in Österreich nicht.","tag":"Bundesverfassung","c":"Bundesstaat","w":["Einheitsstaat","Staatenbund","Stadtstaat"],"id":"b98aabae6"},{"cat":"at","lv":2,"q":"Welcher Nationalpark liegt im Burgenland und setzt sich auf ungarischem Gebiet fort?","e":"Der Nationalpark Neusiedler See – Seewinkel liegt im Burgenland an der Grenze zu Ungarn. Donau-Auen und Thayatal liegen in Niederösterreich, das Gesäuse in der Steiermark.","tag":"Nationalparks","c":"Neusiedler See – Seewinkel","w":["Donau-Auen","Gesäuse","Thayatal"],"id":"bb4db48f4"},{"cat":"at","lv":1,"q":"Aus welchen beiden Kammern besteht das Parlament des Bundes?","e":"Die Gesetzgebung des Bundes üben Nationalrat und Bundesrat aus. Der Nationalrat ist dabei die gewichtigere Kammer.","tag":"Parlament","c":"Nationalrat und Bundesrat","w":["Nationalrat und Landtag","Bundesrat und Gemeinderat","Landtag und Bundesversammlung"],"id":"b52702c1c"},{"cat":"at","lv":3,"q":"Welches Bundesland grenzt sowohl an Tschechien als auch an die Slowakei?","e":"Niederösterreich grenzt im Norden an Tschechien und im Osten an die Slowakei. Oberösterreich grenzt an Tschechien, das Burgenland an die Slowakei, Wien an keinen der beiden Staaten.","tag":"Nachbarstaaten","c":"Niederösterreich","w":["Oberösterreich","Burgenland","Wien"],"id":"bc79f4789"},{"cat":"at","lv":2,"q":"Welche Behörde nimmt in einem politischen Bezirk, der keine Statutarstadt ist, die Verwaltungsaufgaben des Bezirks wahr?","e":"Die Bezirkshauptmannschaft ist die Bezirksverwaltungsbehörde. In Städten mit eigenem Statut übernimmt der Magistrat diese Aufgabe.","tag":"Staatsaufbau","c":"Die Bezirkshauptmannschaft","w":["Das Bezirksgericht","Das Gemeindeamt","Die Landesregierung"],"id":"b7a05e50c"},{"cat":"at","lv":2,"q":"Durch welche drei Bundesländer fließt die Donau?","e":"Die Donau fließt durch Oberösterreich (zum Beispiel Linz), Niederösterreich (zum Beispiel Wachau und Tulln) und Wien.","tag":"Flüsse","c":"Oberösterreich, Niederösterreich und Wien","w":["Salzburg, Oberösterreich und Niederösterreich","Oberösterreich, Steiermark und Wien","Niederösterreich, Wien und Burgenland"],"id":"b05d63d26"},{"cat":"at","lv":2,"q":"Wie wird das Staatsoberhaupt der Republik Österreich bestimmt?","e":"Die Bundespräsidentin bzw. der Bundespräsident wird vom Bundesvolk in direkter Wahl gewählt.","tag":"Bundespräsident","c":"Es wird vom wahlberechtigten Volk direkt gewählt","w":["Es wird vom Nationalrat gewählt","Es wird von der Bundesregierung ernannt","Es wird vom Bundesrat bestellt"],"id":"be8edd889"},{"cat":"at","lv":1,"q":"In welchem Bundesland liegt das Zillertal?","e":"Das Zillertal ist ein Seitental des Inntals und liegt in Tirol.","tag":"Landschaften","c":"Tirol","w":["Salzburg","Vorarlberg","Kärnten"],"id":"b4c57166b"},{"cat":"at","lv":3,"q":"Was kennzeichnet eine Stadt mit eigenem Statut (Statutarstadt)?","e":"Nach Artikel 116 B-VG hat eine Stadt mit eigenem Statut neben den Aufgaben der Gemeindeverwaltung auch die der Bezirksverwaltung zu besorgen. Beispiele sind Graz, Linz und Villach.","tag":"Staatsaufbau","c":"Sie besorgt neben den Gemeindeaufgaben auch die Bezirksverwaltung","w":["Sie ist immer die Landeshauptstadt ihres Bundeslandes","Sie wird unmittelbar von der Bundesregierung verwaltet","Sie hat eine eigene Gesetzgebung wie ein Bundesland"],"id":"b0e9cb9be"},{"cat":"at","lv":3,"q":"Welcher Berg ist der höchste Niederösterreichs?","e":"Der Schneeberg erreicht im Klosterwappen 2076 Meter und ist der höchste Berg Niederösterreichs. Rax und Ötscher bleiben darunter.","tag":"Berge","c":"Schneeberg","w":["Ötscher","Rax","Hohe Wand"],"id":"b1b4b9790"},{"cat":"at","lv":2,"q":"Welche Interessen vertritt der Bundesrat auf Bundesebene?","e":"Der Bundesrat ist die Länderkammer des Parlaments. Seine Mitglieder werden von den Landtagen entsandt.","tag":"Parlament","c":"Die Interessen der Bundesländer","w":["Die Interessen der Gemeinden","Die Interessen der Bundesregierung","Die Interessen der Sozialpartner"],"id":"be6fcbe46"},{"cat":"at","lv":2,"q":"Für wie viele Jahre wird der Nationalrat in der Regel gewählt?","e":"Die Gesetzgebungsperiode des Nationalrates dauert fünf Jahre, sofern er nicht vorzeitig aufgelöst wird.","tag":"Nationalrat","t":"num","ans":5,"id":"bad3f046c"},{"cat":"at","lv":2,"q":"In welchem Bundesland liegt der Flughafen Wien-Schwechat?","e":"Der Flughafen liegt auf dem Gebiet der niederösterreichischen Stadtgemeinde Schwechat, nicht im Stadtgebiet von Wien.","tag":"Verkehrswege","c":"Niederösterreich","w":["Wien","Burgenland","Oberösterreich"],"id":"bc8906aae"},{"cat":"at","lv":3,"q":"Welche beiden Bundesländer verbindet die Großglockner Hochalpenstraße?","e":"Die Großglockner Hochalpenstraße führt vom Salzburger Pinzgau nach Heiligenblut in Kärnten.","tag":"Verkehrswege","c":"Salzburg und Kärnten","w":["Tirol und Kärnten","Salzburg und Tirol","Salzburg und Steiermark"],"id":"bd5848ee4"},{"cat":"at","lv":2,"q":"Welche Besonderheit hat Wien im Aufbau der Republik Österreich?","e":"Wien ist zugleich Gemeinde, Bundesland und Bundeshauptstadt. Der Gemeinderat tritt zugleich als Landtag zusammen.","tag":"Staatsaufbau","c":"Wien ist Gemeinde und Bundesland zugleich","w":["Wien ist ein Bezirk von Niederösterreich","Wien ist ein Bundesland ohne eigenen Landtag","Wien ist eine Gemeinde ohne Bundeslandstatus"],"id":"bf9678375"},{"cat":"at","lv":2,"q":"Wie viele Jahre dauert eine Amtsperiode der Bundespräsidentin bzw. des Bundespräsidenten?","e":"Die Amtsperiode beträgt sechs Jahre. Eine unmittelbare Wiederwahl ist nur einmal zulässig.","tag":"Bundespräsident","t":"num","ans":6,"id":"bd960c67c"},{"cat":"at","lv":3,"q":"Welches Bundesland grenzt sowohl an Italien als auch an Slowenien?","e":"Kärnten grenzt im Süden an Italien und an Slowenien. Die Steiermark grenzt nicht an Italien, Tirol und Salzburg grenzen nicht an Slowenien.","tag":"Nachbarstaaten","c":"Kärnten","w":["Steiermark","Tirol","Salzburg"],"id":"bd013a5f4"},{"cat":"at","lv":1,"q":"Welche Farbfolge hat die Bundesflagge der Republik Österreich?","e":"Die Bundesflagge besteht aus drei gleich breiten waagrechten Streifen: Rot, Weiß, Rot.","tag":"Staatssymbole","c":"Rot-Weiß-Rot","w":["Weiß-Rot-Weiß","Rot-Gelb-Rot","Rot-Weiß-Grün"],"id":"be701e307"},{"cat":"at","lv":3,"q":"Welche drei Bundesländer haben Anteil am Salzkammergut?","e":"Das Salzkammergut, eine Berg- und Seenlandschaft mit Orten wie Hallstatt und St. Wolfgang, reicht nach Oberösterreich, Salzburg und in die Steiermark.","tag":"Landschaften","c":"Oberösterreich, Salzburg und Steiermark","w":["Oberösterreich, Tirol und Salzburg","Salzburg, Kärnten und Steiermark","Niederösterreich, Oberösterreich und Steiermark"],"id":"bf41ea6c0"},{"cat":"at","lv":2,"q":"Welche Wasserfälle gelten mit rund 385 Metern Fallhöhe als die höchsten Österreichs?","e":"Die Krimmler Wasserfälle im Salzburger Pinzgau stürzen in drei Stufen rund 385 Meter in die Tiefe und sind die höchsten Wasserfälle Österreichs.","tag":"Naturschauplätze","c":"Die Krimmler Wasserfälle","w":["Der Stuibenfall","Der Gollinger Wasserfall","Die Umbalfälle"],"id":"b69e94d4b"},{"cat":"at","lv":2,"q":"Ab welchem Alter kann man bei einer Nationalratswahl als Kandidatin oder Kandidat antreten?","e":"Das passive Wahlrecht, also das Recht, gewählt zu werden, besteht ab 18 Jahren.","tag":"Wahlrecht","t":"num","ans":18,"id":"b49632eaf"},{"cat":"at","lv":3,"q":"Welche österreichische Bahnstrecke wurde 1998 in die UNESCO-Welterbeliste aufgenommen?","e":"Die Semmeringbahn zwischen Gloggnitz und Mürzzuschlag wurde 1998 UNESCO-Welterbe.","tag":"Verkehrswege","c":"Die Semmeringbahn","w":["Die Arlbergbahn","Die Brennerbahn","Die Tauernbahn"],"id":"b46198ed9"},{"cat":"at","lv":2,"q":"Wer ernennt die Bundeskanzlerin bzw. den Bundeskanzler?","e":"Das Staatsoberhaupt ernennt die Bundeskanzlerin bzw. den Bundeskanzler und auf deren Vorschlag die übrigen Mitglieder der Bundesregierung.","tag":"Bundespräsident","c":"Die Bundespräsidentin bzw. der Bundespräsident","w":["Der Nationalrat durch Wahl","Der Bundesrat durch Wahl","Die Landeshauptleutekonferenz"],"id":"b5f3f159d"},{"cat":"at","lv":2,"q":"Welcher Nationalpark erstreckt sich entlang der Donau von Wien bis zur Grenze zur Slowakei?","e":"Der Nationalpark Donau-Auen liegt in Wien und Niederösterreich entlang der Donau.","tag":"Nationalparks","c":"Donau-Auen","w":["Thayatal","Kalkalpen","Hohe Tauern"],"id":"b30cb2405"},{"cat":"at","lv":3,"q":"Wer beurkundet das verfassungsmäßige Zustandekommen der Bundesgesetze?","e":"Nach Artikel 47 B-VG beurkundet das Staatsoberhaupt das verfassungsmäßige Zustandekommen der Bundesgesetze; danach werden sie im Bundesgesetzblatt kundgemacht.","tag":"Bundespräsident","c":"Die Bundespräsidentin bzw. der Bundespräsident","w":["Die Präsidentin bzw. der Präsident des Verfassungsgerichtshofes","Die Bundeskanzlerin bzw. der Bundeskanzler","Die Präsidentin bzw. der Präsident des Nationalrates"],"id":"ba5eb5305"},{"cat":"at","lv":3,"q":"Bei welchem Anlass treten Nationalrat und Bundesrat als Bundesversammlung zusammen?","e":"Die Bundesversammlung besteht aus den Mitgliedern von Nationalrat und Bundesrat und tritt unter anderem zur Angelobung des Staatsoberhauptes zusammen.","tag":"Parlament","c":"Bei der Angelobung der Bundespräsidentin bzw. des Bundespräsidenten","w":["Bei der Beschlussfassung über das Bundesbudget","Bei der Wahl der Bundeskanzlerin bzw. des Bundeskanzlers","Bei der Auflösung des Nationalrates"],"id":"b586dd349"},{"cat":"at","lv":2,"q":"Welches Höchstgericht prüft, ob Gesetze mit der Bundesverfassung vereinbar sind?","e":"Der Verfassungsgerichtshof in Wien kann verfassungswidrige Gesetze aufheben.","tag":"Gerichtsbarkeit","c":"Der Verfassungsgerichtshof","w":["Der Oberste Gerichtshof","Der Verwaltungsgerichtshof","Das Bundesverwaltungsgericht"],"id":"b61548e98"},{"cat":"at","lv":3,"q":"Welcher Nationalpark in Niederösterreich setzt sich auf tschechischer Seite im Nationalpark Podyjí fort?","e":"Der Nationalpark Thayatal liegt an der Grenze zu Tschechien und wird auf der anderen Seite vom Nationalpark Podyjí ergänzt. Gesäuse und Kalkalpen liegen nicht in Niederösterreich.","tag":"Nationalparks","c":"Thayatal","w":["Donau-Auen","Gesäuse","Kalkalpen"],"id":"b7283fdd5"},{"cat":"at","lv":3,"q":"Welches Mindestalter muss man spätestens am Wahltag erreicht haben, um zur Bundespräsidentin bzw. zum Bundespräsidenten gewählt werden zu können?","e":"Wählbar ist, wer zum Nationalrat wahlberechtigt ist und spätestens am Wahltag das 35. Lebensjahr vollendet hat.","tag":"Bundespräsident","t":"num","ans":35,"id":"b49f27065"},{"cat":"at","lv":1,"q":"Mit welcher Zeile beginnt der Text der österreichischen Bundeshymne?","e":"Die Bundeshymne beginnt mit der Zeile „Land der Berge, Land am Strome“. Die beiden anderen echten Zeilen folgen erst danach.","tag":"Staatssymbole","c":"„Land der Berge, Land am Strome“","w":["„Land der Äcker, Land der Dome“","„Land der Alpen, Land am Flusse“","„Land der Hämmer, zukunftsreich“"],"id":"b95ece6f2"},{"cat":"at","lv":2,"q":"Wie heißt der Gletscher am Fuß des Großglockners in Kärnten?","e":"Die Pasterze ist ein Talgletscher in der Glocknergruppe bei Heiligenblut. Gepatschferner, Hintereisferner und Vernagtferner liegen in den Ötztaler Alpen.","tag":"Gebirge","c":"Pasterze","w":["Gepatschferner","Hintereisferner","Vernagtferner"],"id":"b27d716a9"},{"cat":"at","lv":2,"q":"Welche Einrichtung kontrolliert die Gebarung des Bundes und der Länder, also den Umgang mit öffentlichem Geld?","e":"Der Rechnungshof prüft unabhängig, ob öffentliche Mittel sparsam, wirtschaftlich und zweckmäßig verwendet werden.","tag":"Kontrolle","c":"Der Rechnungshof","w":["Die Volksanwaltschaft","Der Verfassungsgerichtshof","Die Oesterreichische Nationalbank"],"id":"b3d3558a6"},{"cat":"at","lv":3,"q":"Ab welcher ungefähren Zahl an Unterstützenden wird ein Volksbegehren dem Nationalrat zur Behandlung vorgelegt?","e":"Ein Volksbegehren, das von rund 100.000 Stimmberechtigten unterstützt wird, muss im Nationalrat behandelt werden.","tag":"Direkte Demokratie","c":"Rund 100.000","w":["Rund 1.000","Rund 500.000","Rund 1.000.000"],"id":"bfd482af7"},{"cat":"at","lv":2,"q":"In welchem Wiener Schloss wurde am 15. Mai 1955 der Staatsvertrag unterzeichnet?","e":"Der Staatsvertrag wurde am 15. Mai 1955 im Oberen Belvedere unterzeichnet und beendete die Besatzungszeit.","tag":"Staatsvertrag","c":"Im Schloss Belvedere","w":["Im Schloss Schönbrunn","In der Hofburg","Im Palais Liechtenstein"],"id":"becb7ae03"},{"cat":"at","lv":3,"q":"Was trägt der Adler im Bundeswappen der Republik Österreich auf dem Kopf?","e":"Der schwarze Adler trägt eine goldene Mauerkrone mit drei sichtbaren Zinnen, die für das Bürgertum steht. In den Fängen hält er Hammer und Sichel, eine gesprengte Kette umschließt beide Fänge.","tag":"Staatssymbole","c":"Eine goldene Mauerkrone","w":["Eine goldene Kaiserkrone","Eine goldene Königskrone","Einen goldenen Lorbeerkranz"],"id":"b6cbb3a4a"},{"cat":"at","lv":2,"q":"Woran erinnert der Nationalfeiertag am 26. Oktober?","e":"Das Nationalfeiertagsgesetz verweist auf den 26. Oktober 1955, an dem das Neutralitätsgesetz beschlossen wurde. Der Staatsvertrag wurde bereits am 15. Mai 1955 unterzeichnet.","tag":"Feiertage","c":"An den Beschluss des Neutralitätsgesetzes im Jahr 1955","w":["An die Unterzeichnung des Staatsvertrags im Jahr 1955","An die Ausrufung der Republik im Jahr 1918","An den Beitritt zur Europäischen Union im Jahr 1995"],"id":"b66e4e3a0"},{"cat":"at","lv":3,"q":"Welche Mehrheit ist im Nationalrat für den Beschluss eines Verfassungsgesetzes erforderlich?","e":"Verfassungsgesetze können nur in Anwesenheit von mindestens der Hälfte der Abgeordneten und mit einer Mehrheit von zwei Dritteln der abgegebenen Stimmen beschlossen werden.","tag":"Nationalrat","c":"Zwei Drittel der abgegebenen Stimmen bei Anwesenheit der Hälfte der Abgeordneten","w":["Einfache Mehrheit der abgegebenen Stimmen bei Anwesenheit eines Drittels der Abgeordneten","Drei Viertel der abgegebenen Stimmen bei Anwesenheit aller Abgeordneten","Absolute Mehrheit aller Abgeordneten bei Anwesenheit von zwei Dritteln"],"id":"bca40988d"},{"cat":"at","lv":2,"q":"Welcher der folgenden Tage ist in Österreich ein gesetzlicher Feiertag?","e":"Der 8. Dezember (Mariä Empfängnis) ist ein gesetzlicher Feiertag. Der 24. und der 31. Dezember sind Werktage, an denen oft kollektivvertraglich früherer Dienstschluss gilt.","tag":"Feiertage","c":"Der 8. Dezember","w":["Der 6. Dezember","Der 24. Dezember","Der 31. Dezember"],"id":"b9cae03df"},{"cat":"at","lv":3,"q":"Wie ging die Volksabstimmung über den EU-Beitritt Österreichs am 12. Juni 1994 aus?","e":"Bei einer Wahlbeteiligung von 82,3 Prozent stimmten 66,58 Prozent mit Ja.","tag":"Europäische Union","c":"Rund zwei Drittel der gültigen Stimmen lauteten auf Ja","w":["Knapp 52 Prozent der gültigen Stimmen lauteten auf Ja","Rund 90 Prozent der gültigen Stimmen lauteten auf Ja","Die Mehrheit der gültigen Stimmen lautete auf Nein"],"id":"b9b6de4aa"},{"cat":"at","lv":3,"q":"In welchem der folgenden Fälle ist eine bundesweite Volksabstimmung zwingend vorgeschrieben?","e":"Jede Gesamtänderung der Bundesverfassung muss nach Artikel 44 B-VG einer Volksabstimmung unterzogen werden. Bei einer Teiländerung ist das nur auf Verlangen von einem Drittel der Mitglieder des Nationalrates oder des Bundesrates nötig.","tag":"Direkte Demokratie","c":"Bei einer Gesamtänderung der Bundesverfassung","w":["Bei jeder Änderung des Bundesfinanzgesetzes","Bei jedem Misstrauensantrag gegen die Bundesregierung","Bei jedem Einspruch des Bundesrates"],"id":"bcb1f4eee"},{"cat":"at","lv":3,"q":"Von welcher Schriftstellerin stammt der ursprüngliche Text der Bundeshymne?","e":"Den Text der Bundeshymne schrieb die Dichterin Paula von Preradović; er ging aus einem Preisausschreiben der Bundesregierung hervor.","tag":"Staatssymbole","c":"Von Paula von Preradović","w":["Von Marie von Ebner-Eschenbach","Von Ingeborg Bachmann","Von Bertha von Suttner"],"id":"b1c9ff027"},{"cat":"at","lv":2,"q":"Nach Art. 18 B-VG darf die gesamte staatliche Verwaltung nur auf Grund der Gesetze ausgeübt werden. Wie heißt dieser Grundsatz?","e":"Das Legalitätsprinzip (Art. 18 Abs. 1 B-VG) bindet jedes Handeln der Verwaltung an ein Gesetz. Es ist ein Kernstück des Rechtsstaates und schützt vor behördlicher Willkür.","tag":"Verfassung","c":"Legalitätsprinzip","w":["Subsidiaritätsprinzip","Territorialitätsprinzip","Föderalismusprinzip"],"id":"b8e2d4afa"},{"cat":"at","lv":3,"q":"Wer beurkundet das verfassungsmäßige Zustandekommen eines Bundesgesetzes, und wer muss diese Beurkundung gegenzeichnen?","e":"Nach Art. 47 B-VG beurkundet der Bundespräsident das verfassungsmäßige Zustandekommen der Bundesgesetze. Die Vorlage erfolgt durch den Bundeskanzler, der die Beurkundung gegenzeichnet. Danach macht der Bundeskanzler das Gesetz im Bundesgesetzblatt kund (Art. 49).","tag":"Gesetzgebung","c":"Der Bundespräsident beurkundet, der Bundeskanzler zeichnet gegen","w":["Der Bundeskanzler beurkundet, der Bundespräsident zeichnet gegen","Der Nationalratspräsident beurkundet, der Bundespräsident zeichnet gegen","Der Bundesratsvorsitzende beurkundet, der Bundeskanzler zeichnet gegen"],"id":"bee64faf3"},{"cat":"at","lv":1,"q":"Wie ist ein Richter laut Bundesverfassung bei der Ausübung seines richterlichen Amtes gestellt?","e":"Art. 87 B-VG: Die Richter sind in Ausübung ihres richterlichen Amtes unabhängig. Das sichert die Gewaltenteilung zwischen Rechtsprechung, Gesetzgebung und Verwaltung.","tag":"Gewaltenteilung","c":"Er ist unabhängig","w":["Er ist an Weisungen der Bundesregierung gebunden","Er ist an Weisungen des Bundespräsidenten gebunden","Er ist an Weisungen des Nationalrates gebunden"],"id":"b90c71903"},{"cat":"at","lv":1,"q":"Für wie viele Jahre wird der Bundespräsident gewählt?","e":"Art. 60 Abs. 5 B-VG: Das Amt des Bundespräsidenten dauert sechs Jahre. Die Gesetzgebungsperiode des Nationalrates dauert dagegen fünf Jahre.","tag":"Bundespräsident","c":"Für sechs Jahre","w":["Für vier Jahre","Für fünf Jahre","Für acht Jahre"],"id":"bc9da8f67"},{"cat":"at","lv":1,"q":"Wer wählt den Bundespräsidenten?","e":"Nach Art. 60 Abs. 1 B-VG wird der Bundespräsident vom Bundesvolk auf Grund des gleichen, unmittelbaren, persönlichen, freien und geheimen Wahlrechts gewählt. Die Bundesversammlung tritt nur zu seiner Angelobung zusammen.","tag":"Bundespräsident","c":"Das wahlberechtigte Bundesvolk direkt","w":["Der Nationalrat","Die Bundesversammlung","Die Landeshauptleute gemeinsam"],"id":"bac18e68e"},{"cat":"at","lv":2,"q":"Wie oft ist eine Wiederwahl des Bundespräsidenten für die unmittelbar folgende Funktionsperiode zulässig?","e":"Art. 60 Abs. 5 B-VG: Eine Wiederwahl für die unmittelbar folgende Funktionsperiode ist nur einmal zulässig. Der Bundespräsident kann also höchstens zwölf Jahre in Folge im Amt sein.","tag":"Bundespräsident","c":"Nur einmal","w":["Zweimal","Beliebig oft","Gar nicht"],"id":"b06a9dec8"},{"cat":"at","lv":2,"q":"Welches Mindestalter muss man am Wahltag erreicht haben, um zum Bundespräsidenten gewählt werden zu können?","e":"Art. 60 Abs. 3 B-VG: Zum Bundespräsidenten kann nur gewählt werden, wer zum Nationalrat wählbar ist und am Wahltag das 35. Lebensjahr vollendet hat.","tag":"Bundespräsident","c":"35 Jahre","w":["18 Jahre","30 Jahre","40 Jahre"],"id":"bd5c730d3"},{"cat":"at","lv":2,"q":"Was geschieht bei einer Bundespräsidentenwahl, wenn im ersten Wahlgang kein Kandidat mehr als die Hälfte aller gültigen Stimmen erhält?","e":"Art. 60 Abs. 2 B-VG: Gewählt ist, wer mehr als die Hälfte aller gültigen Stimmen hat. Sonst gibt es einen zweiten Wahlgang (Stichwahl), bei dem nur die beiden Bestplatzierten des ersten Wahlgangs wählbar sind.","tag":"Bundespräsident","c":"Es findet ein zweiter Wahlgang zwischen den beiden Bestplatzierten statt","w":["Der Kandidat mit den meisten Stimmen ist trotzdem gewählt","Der Nationalrat wählt aus den Kandidaten den Bundespräsidenten","Die gesamte Wahl muss nach sechs Monaten wiederholt werden"],"id":"b81ad615e"},{"cat":"at","lv":2,"q":"Wer ernennt den Bundeskanzler?","e":"Art. 70 Abs. 1 B-VG: Der Bundeskanzler und auf seinen Vorschlag die übrigen Mitglieder der Bundesregierung werden vom Bundespräsidenten ernannt. Der Nationalrat kann der Regierung später das Vertrauen entziehen (Art. 74).","tag":"Bundesregierung","c":"Der Bundespräsident","w":["Der Nationalrat durch Wahl","Der Bundesrat","Die Bundesversammlung"],"id":"bfcbfdde0"},{"cat":"at","lv":3,"q":"Der Bundespräsident ist verhindert. Wer übt seine Funktionen aus, solange die Verhinderung nicht länger als 20 Tage dauert?","e":"Art. 64 B-VG: Bei Verhinderung des Bundespräsidenten gehen seine Funktionen zunächst auf den Bundeskanzler über. Dauert die Verhinderung länger als 20 Tage oder ist das Amt dauernd erledigt, übt ein Kollegium aus den drei Präsidenten des Nationalrates die Funktionen aus.","tag":"Bundespräsident","c":"Der Bundeskanzler","w":["Der Präsident des Nationalrates","Der Präsident des Verfassungsgerichtshofes","Der Vizekanzler"],"id":"b33827bdf"},{"cat":"at","lv":3,"q":"Zu welchen Anlässen treten Nationalrat und Bundesrat laut Art. 38 B-VG als Bundesversammlung zusammen?","e":"Art. 38 B-VG nennt die Angelobung des Bundespräsidenten und die Beschlussfassung über eine Kriegserklärung. Weitere Fälle (etwa bei Verfolgung oder Absetzung des Bundespräsidenten) regeln andere Artikel. Die übrigen genannten Aufgaben liegen nicht bei der Bundesversammlung.","tag":"Parlament","c":"Zur Angelobung des Bundespräsidenten und zur Beschlussfassung über eine Kriegserklärung","w":["Zur Beschlussfassung über das Bundesfinanzgesetz und zur Wahl des Rechnungshofpräsidenten","Zur Wahl des Bundeskanzlers und zur Ernennung der Bundesminister","Zur Einsetzung des Verfassungsgerichtshofes und zur Wahl der Volksanwälte"],"id":"b611982e0"},{"cat":"at","lv":1,"q":"Welches Gericht prüft in Österreich, ob Gesetze verfassungswidrig sind, und kann sie aufheben?","e":"Nach Art. 140 B-VG erkennt der Verfassungsgerichtshof über die Verfassungswidrigkeit von Gesetzen. Er hat seinen Sitz in Wien.","tag":"Verfassungsgerichtshof","c":"Der Verfassungsgerichtshof","w":["Der Oberste Gerichtshof","Der Verwaltungsgerichtshof","Das Bundesfinanzgericht"],"id":"bf7c5190b"},{"cat":"at","lv":3,"q":"Aus wie vielen Mitgliedern besteht der Verfassungsgerichtshof, ohne die Ersatzmitglieder zu zählen?","e":"Art. 147 Abs. 1 B-VG: Der Verfassungsgerichtshof besteht aus einem Präsidenten, einem Vizepräsidenten, zwölf weiteren Mitgliedern und sechs Ersatzmitgliedern. Das ergibt 14 Mitglieder.","tag":"Verfassungsgerichtshof","c":"Aus 14 Mitgliedern","w":["Aus 9 Mitgliedern","Aus 12 Mitgliedern","Aus 20 Mitgliedern"],"id":"bc8932af7"},{"cat":"at","lv":2,"q":"Welche Aufgabe hat der Rechnungshof?","e":"Art. 121 B-VG: Zur Überprüfung der Gebarung des Bundes, der Länder, der Gemeindeverbände, der Gemeinden und anderer durch Gesetz bestimmter Rechtsträger ist der Rechnungshof berufen. Er untersteht dem Nationalrat bzw. den Landtagen.","tag":"Kontrolle","c":"Er überprüft die Gebarung von Bund, Ländern und Gemeinden","w":["Er beschließt das jährliche Bundesfinanzgesetz","Er prüft Gesetze auf ihre Verfassungsmäßigkeit","Er setzt die Höhe der Steuern fest"],"id":"bcebc0492"},{"cat":"at","lv":1,"q":"Ab welchem Alter besitzt man in Österreich das aktive Wahlrecht bei der Nationalratswahl?","e":"Art. 26 Abs. 1 B-VG: Wahlberechtigt sind Männer und Frauen, die am Wahltag das 16. Lebensjahr vollendet haben. Wählbar ist man erst ab 18 Jahren.","tag":"Wahlrecht","c":"Ab 16 Jahren","w":["Ab 14 Jahren","Ab 18 Jahren","Ab 21 Jahren"],"id":"b856c6928"},{"cat":"at","lv":3,"q":"Was bedeutet der Wahlgrundsatz „unmittelbar“?","e":"Art. 26 B-VG nennt die Grundsätze des gleichen, unmittelbaren, persönlichen, freien und geheimen Wahlrechts. „Unmittelbar“ heißt direkt ohne Wahlmänner. Die anderen Antworten beschreiben die Grundsätze „gleich“, „geheim“ und „persönlich“.","tag":"Wahlrecht","c":"Die Wahlberechtigten wählen die Abgeordneten direkt, ohne dazwischengeschaltete Wahlmänner","w":["Jede abgegebene Stimme hat das gleiche Gewicht","Die Stimmabgabe erfolgt unbeobachtet, ohne dass die Wahlentscheidung offengelegt wird","Die Wahlberechtigten müssen ihre Stimme selbst abgeben und nicht durch einen Vertreter"],"id":"b3f810dc4"},{"cat":"at","lv":2,"q":"Wie werden die Mitglieder des Bundesrates bestimmt?","e":"Art. 35 B-VG: Die Mitglieder des Bundesrates werden von den Landtagen für die Dauer ihrer Gesetzgebungsperiode nach dem Grundsatz der Verhältniswahl gewählt. Der Bundesrat ist die Vertretung der Länder bei der Bundesgesetzgebung.","tag":"Bundesrat","c":"Sie werden von den Landtagen gewählt","w":["Sie werden vom Bundesvolk direkt gewählt","Sie werden von den Landeshauptleuten ernannt","Sie werden vom Bundespräsidenten ernannt"],"id":"be1434166"},{"cat":"at","lv":3,"q":"Innerhalb welcher Frist muss der Bundesrat einen Einspruch gegen einen Gesetzesbeschluss des Nationalrates übermitteln?","e":"Art. 42 Abs. 3 B-VG: Der begründete Einspruch muss dem Nationalrat binnen acht Wochen nach Einlangen des Gesetzesbeschlusses beim Bundesrat schriftlich übermittelt werden. Der Nationalrat kann ihn durch einen Beharrungsbeschluss überwinden.","tag":"Gesetzgebung","c":"Innerhalb von acht Wochen","w":["Innerhalb von zwei Wochen","Innerhalb von vier Wochen","Innerhalb von sechs Monaten"],"id":"bab26c512"},{"cat":"at","lv":3,"q":"Welche Voraussetzungen gelten für den Beschluss eines Verfassungsgesetzes im Nationalrat?","e":"Art. 44 Abs. 1 B-VG verlangt für Verfassungsgesetze die Anwesenheit von mindestens der Hälfte der Mitglieder und eine Zweidrittelmehrheit der abgegebenen Stimmen. Für gewöhnliche Beschlüsse genügen nach Art. 31 B-VG ein Drittel der Mitglieder und die Mehrheit der abgegebenen Stimmen.","tag":"Gesetzgebung","c":"Anwesenheit von mindestens der Hälfte der Mitglieder und Zweidrittelmehrheit der abgegebenen Stimmen","w":["Anwesenheit von mindestens einem Drittel der Mitglieder und einfache Mehrheit der abgegebenen Stimmen","Anwesenheit aller Mitglieder und einstimmiger Beschluss","Anwesenheit von mindestens der Hälfte der Mitglieder und Dreiviertelmehrheit aller Mitglieder"],"id":"bf2a03a3a"},{"cat":"at","lv":3,"q":"Wie viele Mitglieder des Nationalrates müssen die Einsetzung eines Untersuchungsausschusses mindestens verlangen, damit dieser eingesetzt werden muss?","e":"Art. 53 Abs. 1 B-VG: Der Nationalrat kann Untersuchungsausschüsse durch Beschluss einsetzen; darüber hinaus ist auf Verlangen eines Viertels seiner Mitglieder ein Untersuchungsausschuss einzusetzen (Minderheitsrecht).","tag":"Parlament","c":"Ein Viertel der Mitglieder","w":["Ein Zehntel der Mitglieder","Die Hälfte der Mitglieder","Zwei Drittel der Mitglieder"],"id":"b7c18b1f3"},{"cat":"at","lv":3,"q":"Wie fasst die Bundesregierung ihre Beschlüsse laut Bundesverfassung?","e":"Art. 69 Abs. 3 B-VG: Die Bundesregierung fasst ihre Beschlüsse einstimmig. Der Bundeskanzler führt den Vorsitz, hat aber kein Recht, die anderen Mitglieder zu überstimmen.","tag":"Bundesregierung","c":"Einstimmig","w":["Mit einfacher Mehrheit","Mit Zweidrittelmehrheit","Durch Entscheidung des Bundeskanzlers allein"],"id":"b130e8464"},{"cat":"at","lv":2,"q":"Welche Angelegenheit ist nach der Kompetenzverteilung der Bundesverfassung grundsätzlich Landessache in Gesetzgebung und Vollziehung?","e":"Was die Bundesverfassung nicht ausdrücklich dem Bund überträgt, bleibt im selbständigen Wirkungsbereich der Länder (Art. 15 Abs. 1 B-VG). Baurecht und Raumordnung sind Landessache; Strafrecht, Zoll- und Waffenwesen sind Bundessache (Art. 10 B-VG).","tag":"Kompetenzverteilung","c":"Das Baurecht","w":["Das Strafrechtswesen","Das Zollwesen","Das Waffenwesen"],"id":"bd6377e5c"},{"cat":"at","lv":2,"q":"Welche Funktion übt in Wien der Bürgermeister zusätzlich aus?","e":"Art. 108 B-VG: Wien ist zugleich Gemeinde und Bundesland. Der Gemeinderat hat auch die Funktion des Landtages, der Stadtsenat die der Landesregierung und der Bürgermeister die des Landeshauptmannes.","tag":"Länder und Gemeinden","c":"Die Funktion des Landeshauptmannes","w":["Die Funktion des Landesamtsdirektors","Die Funktion des Landtagspräsidenten","Die Funktion des Bezirkshauptmannes"],"id":"b4958dc8a"},{"cat":"at","lv":2,"q":"Welche Aufgabe zählt die Bundesverfassung beispielhaft zum eigenen Wirkungsbereich der Gemeinde?","e":"Art. 118 Abs. 3 B-VG zählt zum eigenen Wirkungsbereich der Gemeinde unter anderem die örtliche Baupolizei, die örtliche Feuerpolizei und die örtliche Raumplanung. Heerwesen, Bundessteuern und Gerichtsbarkeit sind keine Gemeindeaufgaben.","tag":"Länder und Gemeinden","c":"Die örtliche Baupolizei und die örtliche Raumplanung","w":["Die Führung des Bundesheeres","Die Festsetzung der Einkommensteuer","Die Rechtsprechung in Zivilsachen"],"id":"b88a4d397"},{"cat":"at","lv":2,"q":"Welche Zahl an Unterstützenden nennt Art. 41 B-VG als Voraussetzung dafür, dass ein Volksbegehren dem Nationalrat zur Behandlung vorzulegen ist?","e":"Jedes von 100.000 Stimmberechtigten oder von je einem Sechstel der Stimmberechtigten dreier Länder unterstütztes Volksbegehren ist von der Bundeswahlbehörde dem Nationalrat zur Behandlung vorzulegen (Art. 41 Abs. 2 B-VG).","tag":"Direkte Demokratie","c":"100.000 Stimmberechtigte","w":["10.000 Stimmberechtigte","50.000 Stimmberechtigte","500.000 Stimmberechtigte"],"id":"bd7145a5a"},{"cat":"at","lv":3,"q":"Wer beschließt, dass eine bundesweite Volksbefragung nach Art. 49b B-VG stattfindet?","e":"Art. 49b B-VG: Eine Volksbefragung über eine Angelegenheit von grundsätzlicher und gesamtösterreichischer Bedeutung findet statt, wenn der Nationalrat dies auf Grund eines Antrags seiner Mitglieder oder der Bundesregierung nach Vorberatung im Hauptausschuss beschließt.","tag":"Direkte Demokratie","c":"Der Nationalrat auf Antrag seiner Mitglieder oder der Bundesregierung","w":["Der Bundespräsident auf Vorschlag des Bundeskanzlers","Der Bundesrat auf Antrag von zwei Ländern","Die Bundeswahlbehörde von Amts wegen"],"id":"bb009cece"},{"cat":"at","lv":3,"q":"In welchem Fall muss laut Bundesverfassung jedenfalls eine Volksabstimmung stattfinden?","e":"Art. 44 Abs. 3 B-VG: Jede Gesamtänderung der Bundesverfassung ist einer Abstimmung des gesamten Bundesvolkes zu unterziehen; eine Teiländerung nur, wenn ein Drittel der Mitglieder des Nationalrates oder des Bundesrates dies verlangt.","tag":"Direkte Demokratie","c":"Bei jeder Gesamtänderung der Bundesverfassung","w":["Bei jeder Änderung eines einfachen Bundesgesetzes","Bei jedem Misstrauensantrag gegen die Bundesregierung","Bei jedem Beschluss über das Bundesfinanzgesetz"],"id":"be637f575"},{"cat":"at","lv":2,"q":"Worüber stimmte die österreichische Bevölkerung am 5. November 1978 bundesweit ab?","e":"Bei der Volksabstimmung vom 5. November 1978 über die friedliche Nutzung der Kernenergie stimmte eine knappe Mehrheit (50,47 %) gegen die Inbetriebnahme des fertig gebauten Kernkraftwerks Zwentendorf.","tag":"Direkte Demokratie","c":"Über die Inbetriebnahme des Kernkraftwerks Zwentendorf","w":["Über den Beitritt zur Europäischen Gemeinschaft","Über die Beibehaltung der allgemeinen Wehrpflicht","Über die Einführung einer gemeinsamen Währung"],"id":"b792663de"},{"cat":"at","lv":3,"q":"Worum ging es bei der bundesweiten Volksbefragung am 20. Jänner 2013?","e":"Die Volksbefragung vom 20. Jänner 2013 stellte die Wahl zwischen einem Berufsheer mit bezahltem freiwilligem Sozialjahr (40,3 %) und der Beibehaltung der allgemeinen Wehrpflicht samt Zivildienst (59,7 %). Die Beteiligung lag bei 52,4 %.","tag":"Direkte Demokratie","c":"Um die Wahl zwischen allgemeiner Wehrpflicht und Berufsheer","w":["Um die Frage eines Austritts aus der Europäischen Union","Um den Ausbau der Kernenergie","Um die Abschaffung des Bundesrates"],"id":"b728721d2"},{"cat":"at","lv":1,"q":"Was bestimmt die Bundesverfassung in Art. 85 über die Todesstrafe?","e":"Art. 85 B-VG lautet: „Die Todesstrafe ist abgeschafft.“ Sie ist in Österreich unter keinen Umständen zulässig.","tag":"Grundrechte","c":"Sie ist abgeschafft","w":["Sie ist nur im Kriegsfall erlaubt","Sie ist nur bei Mord erlaubt","Sie ist nur auf Beschluss des Nationalrates erlaubt"],"id":"bf45ad052"},{"cat":"at","lv":2,"q":"Welche Aussage entspricht dem Gleichheitsgrundsatz des Art. 7 B-VG?","e":"Art. 7 Abs. 1 B-VG: Alle Staatsbürger sind vor dem Gesetz gleich. Vorrechte der Geburt, des Geschlechtes, des Standes, der Klasse und des Bekenntnisses sind ausgeschlossen. Niemand darf wegen seiner Behinderung benachteiligt werden.","tag":"Grundrechte","c":"Vorrechte der Geburt, des Geschlechtes, des Standes, der Klasse und des Bekenntnisses sind ausgeschlossen","w":["Vorrechte des Standes sind erlaubt, wenn der Landtag sie beschließt","Vorrechte des Bekenntnisses sind für Staatsämter ausdrücklich vorgesehen","Staatsbürger sind nur in Strafsachen vor dem Gesetz gleich"],"id":"b8aea3053"},{"cat":"at","lv":2,"q":"Welchen Rang hat die Europäische Menschenrechtskonvention (EMRK) in der österreichischen Rechtsordnung?","e":"Die EMRK steht in Österreich seit dem Bundesverfassungsgesetz BGBl. Nr. 59/1964 im Verfassungsrang. Betroffene können sich daher vor österreichischen Gerichten und dem Verfassungsgerichtshof auf ihre Rechte berufen.","tag":"Grundrechte","c":"Verfassungsrang","w":["Rang eines einfachen Bundesgesetzes","Rang einer Verordnung der Bundesregierung","Rang einer bloßen Empfehlung ohne Rechtswirkung"],"id":"b25367d36"},{"cat":"at","lv":2,"q":"Welche der folgenden Gruppen ist in Österreich als autochthone Volksgruppe gesetzlich anerkannt?","e":"In Österreich sind sechs autochthone Volksgruppen anerkannt: die burgenlandkroatische, slowenische, ungarische, tschechische und slowakische Volksgruppe sowie die Roma. Zugewanderte Gruppen wie Türken, Serben oder Polen zählen nicht dazu.","tag":"Volksgruppen","c":"Die slowenische Volksgruppe","w":["Die türkische Volksgruppe","Die serbische Volksgruppe","Die polnische Volksgruppe"],"id":"bcf20bb0a"},{"cat":"at","lv":2,"q":"Welche Einrichtung vertritt als gesetzliche Interessenvertretung mit Pflichtmitgliedschaft die Arbeitnehmerinnen und Arbeitnehmer?","e":"Die Arbeiterkammer ist die gesetzliche Interessenvertretung der Arbeitnehmer mit Pflichtmitgliedschaft. Der Gewerkschaftsbund ist ein freiwilliger Verein, die Wirtschaftskammer vertritt die Unternehmen und die Landwirtschaftskammer die Land- und Forstwirte.","tag":"Sozialpartnerschaft","c":"Die Arbeiterkammer","w":["Der Österreichische Gewerkschaftsbund","Die Wirtschaftskammer Österreich","Die Landwirtschaftskammer"],"id":"b12a78c90"},{"cat":"at","lv":1,"q":"Wie heißt die von der Belegschaft gewählte Vertretung der Arbeitnehmer in einem Betrieb?","e":"Der Betriebsrat wird von den Arbeitnehmern eines Betriebes gewählt und vertritt deren Interessen gegenüber dem Arbeitgeber. Rechtsgrundlage ist das Arbeitsverfassungsgesetz.","tag":"Sozialpartnerschaft","c":"Betriebsrat","w":["Betriebsleitung","Gesellschafterversammlung","Geschäftsführung"],"id":"be51f084b"},{"cat":"at","lv":2,"q":"Was versteht man in Österreich unter Sozialpartnerschaft?","e":"Die Sozialpartnerschaft ist die institutionalisierte Zusammenarbeit der großen Interessenverbände: Arbeiterkammer, Gewerkschaftsbund, Wirtschaftskammer und Landwirtschaftskammern. Sie verhandelt Lösungen für Wirtschafts- und Sozialfragen auf Konsensbasis.","tag":"Sozialpartnerschaft","c":"Die Zusammenarbeit der Interessenvertretungen von Arbeitnehmern, Arbeitgebern und Landwirten bei wirtschafts- und sozialpolitischen Fragen","w":["Ein Bündnis aller im Nationalrat vertretenen Parteien zur Regierungsbildung","Ein Zusammenschluss der Bundesländer zur gemeinsamen Einhebung von Steuern","Ein Abkommen mit den Nachbarstaaten über grenzüberschreitende Sozialleistungen"],"id":"b2a6ea5a1"},{"cat":"at","lv":1,"q":"Welche Versicherung gehört zur gesetzlichen Sozialversicherung in Österreich?","e":"Die gesetzliche Sozialversicherung umfasst die Kranken-, Unfall- und Pensionsversicherung. Haushalts-, Rechtsschutz- und Kaskoversicherungen sind private Versicherungen.","tag":"Sozialwesen","c":"Die Pensionsversicherung","w":["Die Haushaltsversicherung","Die Rechtsschutzversicherung","Die Kaskoversicherung"],"id":"b3f80a8f1"},{"cat":"at","lv":2,"q":"Wie viele Jahre dauert die allgemeine Schulpflicht in Österreich?","e":"Die Schulpflicht beginnt mit dem 1. September nach dem vollendeten sechsten Lebensjahr und dauert neun Schuljahre.","tag":"Bildung","c":"Neun Schuljahre","w":["Sechs Schuljahre","Acht Schuljahre","Zwölf Schuljahre"],"id":"b217acc86"},{"cat":"at","lv":1,"q":"Wie nennt man die Form der Lehrlingsausbildung, bei der man abwechselnd im Lehrbetrieb und in der Berufsschule lernt?","e":"Die Lehre ist eine duale Ausbildung: Der Großteil der Zeit entfällt auf die praktische Ausbildung im Betrieb, dazu kommt der Unterricht in der Berufsschule. Sie endet mit der Lehrabschlussprüfung.","tag":"Bildung","c":"Duale Ausbildung","w":["Fernstudium","Praktikumsjahr","Abendschule"],"id":"b75fdc933"},{"cat":"at","lv":1,"q":"Wie heißt die Abschlussprüfung an der AHS-Oberstufe, die zum Hochschulzugang berechtigt?","e":"Die AHS-Oberstufe schließt mit der Reifeprüfung, kurz Matura, ab. Sie berechtigt zum Studium an Universitäten und Hochschulen.","tag":"Bildung","c":"Matura (Reifeprüfung)","w":["Lehrabschlussprüfung","Pflichtschulabschlussprüfung","Aufnahmeprüfung"],"id":"b30a5525a"},{"cat":"at","lv":3,"q":"In welchem Jahr wurde die Universität Wien, die älteste Universität Österreichs, gegründet?","e":"Die Universität Wien wurde 1365 von Herzog Rudolf IV. gegründet. Die Universität Graz folgte 1585, die Universität Innsbruck 1669.","tag":"Bildung","c":"1365","w":["1585","1669","1848"],"id":"b3eda55fd"},{"cat":"at","lv":1,"q":"Wie heißt die Zentralbank der Republik Österreich?","e":"Die Oesterreichische Nationalbank (OeNB) mit Sitz in Wien ist die Zentralbank Österreichs und Teil des Eurosystems.","tag":"Wirtschaft","c":"Oesterreichische Nationalbank","w":["Österreichische Kontrollbank","Österreichische Postsparkasse","Österreichische Bundesfinanzierungsagentur"],"id":"b6ebb2640"},{"cat":"at","lv":1,"q":"Welche außenpolitische Grundentscheidung traf der Nationalrat am 26. Oktober 1955 in einem Bundesverfassungsgesetz?","e":"Mit dem Bundesverfassungsgesetz vom 26. Oktober 1955 erklärte Österreich „aus freien Stücken seine immerwährende Neutralität“.","tag":"Neutralität","c":"Er erklärte die immerwährende Neutralität Österreichs","w":["Er beschloss den Beitritt zur NATO","Er beschloss den Beitritt zum Warschauer Pakt","Er beschloss die Abschaffung des Bundesheeres"],"id":"b75b69a70"},{"cat":"at","lv":2,"q":"Wozu verpflichtet sich Österreich im Neutralitätsgesetz von 1955?","e":"Österreich erklärte, keinen militärischen Bündnissen beizutreten und die Errichtung militärischer Stützpunkte fremder Staaten auf seinem Gebiet nicht zuzulassen. Die Neutralität verbietet weder UNO-Mitgliedschaft noch Friedenseinsätze und verpflichtet zur Landesverteidigung.","tag":"Neutralität","c":"Keinen Militärbündnissen beizutreten und keine fremden Militärstützpunkte zuzulassen","w":["Keine Soldaten zu Friedenseinsätzen ins Ausland zu entsenden","Keiner internationalen Organisation wie der UNO beizutreten","Kein eigenes Bundesheer zu unterhalten"],"id":"bd03f373b"},{"cat":"at","lv":1,"q":"In welcher österreichischen Stadt hat die UNO neben New York, Genf und Nairobi einen Amtssitz?","e":"Wien ist neben New York, Genf und Nairobi ein Amtssitz der Vereinten Nationen. Das Vienna International Centre, im Volksmund „UNO-City“, wurde 1973 bis 1979 gebaut.","tag":"UNO","c":"In Wien","w":["In Salzburg","In Innsbruck","In Graz"],"id":"bffaf7009"},{"cat":"at","lv":2,"q":"Welche internationale Organisation, die die friedliche Nutzung der Kernenergie fördert und überwacht, hat ihren Sitz in Wien?","e":"Die IAEO hat ihren Sitz im Vienna International Centre in Wien. WHO, WTO und ILO haben ihre Sitze in Genf.","tag":"UNO","c":"Die Internationale Atomenergie-Organisation (IAEO)","w":["Die Weltgesundheitsorganisation (WHO)","Die Welthandelsorganisation (WTO)","Die Internationale Arbeitsorganisation (ILO)"],"id":"b209a19ec"},{"cat":"at","lv":2,"q":"Gemeinsam mit welchen Staaten trat Österreich am 1. Jänner 1995 der Europäischen Union bei?","e":"Die EU-Erweiterung von 1995 umfasste Österreich, Finnland und Schweden. Die Norweger hatten den Beitritt in einer Volksabstimmung abgelehnt, Dänemark war schon 1973 beigetreten.","tag":"Europäische Union","c":"Mit Finnland und Schweden","w":["Mit Norwegen und Dänemark","Mit der Schweiz und Liechtenstein","Mit Ungarn und Tschechien"],"id":"bcd624453"},{"cat":"at","lv":2,"q":"Seit wann gibt es den Euro in Österreich als Bargeld?","e":"Euro-Münzen und -Banknoten sind seit dem 1. Jänner 2002 in Umlauf und lösten den Schilling ab. Schon 1999 wurde der Euro als Buchgeld eingeführt; der Umrechnungskurs wurde unwiderruflich auf 1 Euro = 13,7603 Schilling festgelegt.","tag":"Europäische Union","c":"Seit dem 1. Jänner 2002","w":["Seit dem 1. Jänner 1995","Seit dem 1. Jänner 1999","Seit dem 1. Jänner 2004"],"id":"b9ca8d542"},{"cat":"at","lv":1,"q":"In welchem Rhythmus wird das Europäische Parlament direkt gewählt?","e":"Seit 1979 wählen die Bürgerinnen und Bürger der Mitgliedstaaten das Europäische Parlament alle fünf Jahre direkt.","tag":"Europäische Union","c":"Alle fünf Jahre","w":["Alle drei Jahre","Alle vier Jahre","Alle sechs Jahre"],"id":"be53e2975"},{"cat":"at","lv":2,"q":"Welche EU-Institution erarbeitet grundsätzlich die Vorschläge für neue EU-Rechtsvorschriften?","e":"Grundsätzlich schlägt die Kommission neue Rechtsvorschriften vor; diese werden anschließend vom Europäischen Parlament und vom Rat der EU verabschiedet.","tag":"Europäische Union","c":"Die Europäische Kommission","w":["Der Gerichtshof der Europäischen Union","Die Europäische Zentralbank","Der Europäische Rechnungshof"],"id":"bf227b731"},{"cat":"at","lv":3,"q":"Wer sind die stimmberechtigten Mitglieder des Europäischen Rates, der die allgemeinen politischen Leitlinien der EU festlegt?","e":"Im Europäischen Rat sitzen die Staats- und Regierungschefs der Mitgliedstaaten; dazu kommen der Präsident des Europäischen Rates und der Kommissionspräsident ohne Stimmrecht. Die Fachminister bilden den Rat der EU, der gemeinsam mit dem Parlament Gesetze beschließt.","tag":"Europäische Union","c":"Die Staats- und Regierungschefs der Mitgliedstaaten","w":["Die Fachminister der Mitgliedstaaten","Die Mitglieder des Europäischen Parlaments","Die Kommissarinnen und Kommissare"],"id":"b6381c722"},{"cat":"at","lv":1,"q":"Wie viele goldene Sterne zeigt die Flagge der Europäischen Union?","e":"Die EU-Flagge zeigt zwölf goldene Sterne im Kreis auf blauem Grund. Die Zahl ist unabhängig von der Zahl der Mitgliedstaaten festgelegt.","tag":"Europäische Union","c":"Zwölf","w":["Neun","Fünfzehn","Siebenundzwanzig"],"id":"bb82d8b11"},{"cat":"at","lv":2,"q":"Was trägt der Adler im Bundeswappen der Republik Österreich in seinen Fängen?","e":"Laut Wappengesetz trägt der einköpfige schwarze Adler eine goldene Mauerkrone, im rechten Fang eine goldene Sichel und im linken Fang einen goldenen Hammer. Beide Fänge umschließt eine gesprengte Eisenkette.","tag":"Staatssymbole","c":"Eine goldene Sichel und einen goldenen Hammer","w":["Ein Schwert und ein Zepter","Einen Reichsapfel und ein Zepter","Einen Lorbeerzweig und ein Schwert"],"id":"b78190bfb"},{"cat":"at","lv":2,"q":"Welche Schriftstellerin verfasste den ursprünglichen Text der österreichischen Bundeshymne?","e":"Der ursprüngliche Text stammt von Paula Preradović und ging aus einem Preisausschreiben der Bundesregierung hervor. Mit Ministerratsbeschluss vom 25. Februar 1947 wurde die Bundeshymne offiziell eingeführt.","tag":"Staatssymbole","c":"Paula Preradović","w":["Ingeborg Bachmann","Christine Nöstlinger","Marlen Haushofer"],"id":"bdb228acb"},{"cat":"at","lv":2,"q":"An welches Ereignis erinnert der Nationalfeiertag am 26. Oktober?","e":"Am 26. Oktober 1955 beschloss der Nationalrat das Bundesverfassungsgesetz über die Neutralität; der Nationalfeiertag erinnert daran. Die Ausrufung der Republik fällt auf den 12. November 1918, die Unabhängigkeitserklärung auf den 27. April 1945.","tag":"Staatssymbole","c":"An den Beschluss des Neutralitätsgesetzes im Jahr 1955","w":["An die Ausrufung der Republik im Jahr 1918","An den Beitritt zur Europäischen Union im Jahr 1995","An die Unabhängigkeitserklärung im Jahr 1945"],"id":"b5198e39b"},{"cat":"at","lv":2,"q":"Welche Reform führte Maria Theresia 1774 mit der Allgemeinen Schulordnung ein?","e":"Die Allgemeine Schulordnung vom 6. Dezember 1774 gilt als Beginn der allgemeinen Schulpflicht in der Habsburgermonarchie. Die Toleranzgesetzgebung und die Aufhebung der Leibeigenschaft folgten erst unter ihrem Sohn Joseph II.","tag":"Habsburger","c":"Die allgemeine Schulpflicht","w":["Die Religionsfreiheit für Protestanten","Die Aufhebung der Leibeigenschaft","Das allgemeine Wahlrecht für Männer"],"id":"bdf242fc4"},{"cat":"at","lv":2,"q":"Welches Gesetz erließ Kaiser Joseph II. im Jahr 1781 zugunsten religiöser Minderheiten?","e":"Das Toleranzpatent vom Oktober 1781 erlaubte Protestanten und Orthodoxen eine eingeschränkte Religionsausübung. Die katholische Kirche blieb aber vorherrschend. Die anderen Gesetze stammen aus den Jahren 1867 bzw. 1919.","tag":"Habsburger","c":"Das Toleranzpatent","w":["Das Habsburgergesetz","Das Staatsgrundgesetz","Das Adelsaufhebungsgesetz"],"id":"b0901744e"},{"cat":"at","lv":1,"q":"In welcher Stadt tagte 1814/15 der Kongress, der Europa nach den Napoleonischen Kriegen neu ordnete?","e":"Der Wiener Kongress 1814/15 unter der Leitung des österreichischen Staatskanzlers Metternich ordnete Europa nach dem Sturz Napoleons neu.","tag":"Geschichte","c":"In Wien","w":["In Paris","In Berlin","In Prag"],"id":"be41de917"},{"cat":"at","lv":2,"q":"In welchem Zeitraum regierte Kaiser Franz Joseph I.?","e":"Franz Joseph bestieg 1848 den Thron und starb am 21. No
