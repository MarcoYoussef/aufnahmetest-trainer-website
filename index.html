","Nur anhalten, wenn ein Mensch verletzt wurde"],"norm":"§ 4 Abs. 1 StVO","nurl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10011336","id":"bcce347a0"},{"cat":"po","lv":1,"q":"Was müssen Lenker tun, wenn sich ein Einsatzfahrzeug mit Blaulicht und Folgetonhorn nähert?","e":"§ 26 StVO: Nähert sich ein Einsatzfahrzeug mit Blaulicht und Folgetonhorn, haben alle Straßenbenützer sofort freie Bahn zu schaffen, damit es ungehindert vorankommt.","tag":"Einsatzfahrzeuge","c":"Sofort freie Bahn schaffen","w":["Mit unveränderter Geschwindigkeit weiterfahren, um den Verkehr nicht zu stören","Das Einsatzfahrzeug ignorieren, weil es sich ebenfalls an alle Verkehrsregeln halten muss","Dem Einsatzfahrzeug ohne Abstand folgen"],"norm":"§ 26 Abs. 5 StVO","nurl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10011336","id":"b13a31de1"},{"cat":"po","lv":1,"q":"Wo ist das Überholen nach der Straßenverkehrsordnung verboten?","e":"§ 16 StVO: Überholen ist unter anderem bei ungenügender Sicht und an unübersichtlichen Stellen verboten. Es besteht auch ein Überholverbot auf und unmittelbar vor Schutzwegen ohne Arm- oder Lichtzeichen.","tag":"Überholen","c":"An unübersichtlichen Stellen, an denen man die Strecke nicht ausreichend einsehen kann","w":["Auf Autobahnen mit mehreren Fahrstreifen","Auf geraden, übersichtlichen Freilandstraßen mit ausreichend Platz","Auf Straßen mit zwei Fahrstreifen je Fahrtrichtung"],"norm":"§ 16 Abs. 2 lit. b StVO","nurl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10011336","id":"bc335a97e"},{"cat":"po","lv":2,"q":"Bei einem Verkehrsunfall wurde eine Person verletzt. Welche Pflicht trifft die Unfallbeteiligten nach der StVO?","e":"§ 4 StVO: Wenn bei einem Verkehrsunfall eine Person verletzt wurde, haben die Beteiligten Hilfe zu leisten oder für fremde Hilfe zu sorgen. Sie müssen die nächste Polizeidienststelle sofort verständigen.","tag":"Verkehrsunfall","c":"Hilfe leisten oder für fremde Hilfe sorgen und die nächste Polizeidienststelle sofort verständigen","w":["Nur ihre Versicherung verständigen und die Unfallstelle verlassen","Nur Name und Anschrift austauschen und weiterfahren","Die Unfallstelle sofort räumen und die Verständigung der Polizei dem Verletzten überlassen"],"norm":"§ 4 Abs. 2 StVO","nurl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10011336","id":"bf54383f0"},{"cat":"po","lv":2,"q":"Wie groß muss der Abstand zum vorderen Fahrzeug nach der Straßenverkehrsordnung sein?","e":"§ 18 Abs. 1 StVO: Der Abstand ist so zu wählen, dass auch bei plötzlichem Bremsen des Vorderfahrzeugs rechtzeitiges Anhalten möglich ist. Eine feste Meterzahl nennt die Bestimmung nicht.","tag":"Abstand","c":"So groß, dass man auch bei plötzlichem Bremsen des Vordermannes rechtzeitig anhalten kann","w":["Mindestens 50 Meter, unabhängig von Geschwindigkeit und Straßenzustand","Genau zwei Fahrzeuglängen auf allen Straßen","So klein wie möglich, damit der Verkehr flüssig bleibt"],"norm":"§ 18 Abs. 1 StVO","nurl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10011336","id":"b08522ac7"},{"cat":"po","lv":2,"q":"Ein Pkw-Lenker fährt aus einer Parkplatzausfahrt auf eine Straße ein. Wer hat Vorrang?","e":"§ 19 StVO: Wer aus einer Parkplatzausfahrt, einem Grundstück oder einer ähnlichen Stelle auf eine Straße einfährt, hat dem fließenden Verkehr den Vorrang zu geben.","tag":"Vorrang","c":"Der fließende Verkehr auf der Straße","w":["Der ausfahrende Pkw, weil er von rechts kommt","Der Lenker, der zuerst blinkt","Das größere der beteiligten Fahrzeuge"],"norm":"§ 19 Abs. 6 StVO","nurl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10011336","id":"bc69ea3c1"},{"cat":"po","lv":2,"q":"Zwei einander entgegenkommende Pkw erreichen eine Kreuzung ohne Vorrangzeichen. Der eine will links abbiegen, der andere geradeaus fahren. Wer hat Vorrang?","e":"§ 19 StVO: Wer links abbiegen will, hat entgegenkommenden Fahrzeugen, die geradeaus fahren oder rechts abbiegen, den Vorrang zu geben.","tag":"Vorrang","c":"Das geradeaus fahrende Fahrzeug","w":["Das links abbiegende Fahrzeug, weil es zuerst blinkt","Das schnellere der beiden Fahrzeuge","Das Fahrzeug, das zuerst die Kreuzungsmitte erreicht hat, in jedem Fall"],"norm":"§ 19 Abs. 5 StVO","nurl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10011336","id":"be31d92c2"},{"cat":"po","lv":2,"q":"Wann dürfen Lenker von Einsatzfahrzeugen nach der StVO Blaulicht und Folgetonhorn einsetzen?","e":"§ 26 StVO: Blaulicht und Folgetonhorn dürfen von Einsatzfahrzeugen nur bei Gefahr im Verzug verwendet werden. Dann haben die übrigen Straßenbenützer Platz zu machen.","tag":"Einsatzfahrzeuge","c":"Nur bei Gefahr im Verzug","w":["Immer, solange sie im Dienst sind","Nur auf Autobahnen und Schnellstraßen","Nur bei Dunkelheit"],"norm":"§ 26 Abs. 1 StVO","nurl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10011336","id":"b8f01f031"},{"cat":"po","lv":2,"q":"Bis zu welchem Alter besteht in Österreich eine Helmpflicht für Kinder auf einem Fahrrad ohne Elektromotor?","e":"Auf einem normalen Fahrrad besteht Helmpflicht für Kinder unter 12 Jahren. Für E-Bikes und E-Scooter gelten eigene Regeln.","tag":"Fahrrad","c":"Für Kinder unter 12 Jahren","w":["Für Kinder unter 8 Jahren","Für Kinder unter 10 Jahren","Für Kinder unter 16 Jahren"],"norm":"§ 68 Abs. 6 StVO","nurl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10011336","id":"ba0f1a47e"},{"cat":"po","lv":2,"q":"Unter welcher Voraussetzung dürfen Radfahrer in einer Einbahnstraße gegen die Fahrtrichtung fahren?","e":"Gegen die Fahrtrichtung dürfen Radfahrer eine Einbahnstraße grundsätzlich nur befahren, wenn eine Zusatztafel das erlaubt (§ 7 Abs. 5 StVO). Eine Ausnahme sind Wohnstraßen.","tag":"Fahrrad","c":"Wenn eine Zusatztafel dies ausdrücklich erlaubt","w":["Wenn die Straße breiter als drei Meter ist","Wenn kein Fußgänger in der Nähe ist","Immer, weil Fahrräder keine Kraftfahrzeuge sind"],"norm":"§ 7 Abs. 5 StVO","nurl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10011336","id":"bbc755d99"},{"cat":"po","lv":2,"q":"Wie ist die Fahrgeschwindigkeit nach der Straßenverkehrsordnung grundsätzlich zu wählen?","e":"§ 20 Abs. 1 StVO: Die Fahrgeschwindigkeit ist den gegebenen oder zu erwartenden Umständen, also Straßen-, Verkehrs- und Sichtverhältnissen sowie den Eigenschaften von Fahrzeug und Ladung, anzupassen. Die erlaubte Höchstgeschwindigkeit ist nur eine Obergrenze.","tag":"Geschwindigkeit","c":"Den Straßen-, Verkehrs- und Sichtverhältnissen sowie den Eigenschaften von Fahrzeug und Ladung angepasst","w":["Immer so, dass die erlaubte Höchstgeschwindigkeit ausgeschöpft wird","Immer an die Geschwindigkeit des schnellsten Fahrzeugs angepasst","Nur an die Motorleistung des Fahrzeugs angepasst"],"norm":"§ 20 Abs. 1 StVO","nurl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10011336","id":"be181af26"},{"cat":"po","lv":3,"q":"Bei einem Verkehrsunfall entsteht nur Sachschaden. Wann darf die Verständigung der Polizei nach der Straßenverkehrsordnung unterbleiben?","e":"§ 4 StVO: Bei reinem Sachschaden kann die Verständigung der Polizei unterbleiben, wenn die Beteiligten einander ihren Namen und ihre Anschrift nachgewiesen haben.","tag":"Verkehrsunfall","c":"Wenn die Beteiligten einander Namen und Anschrift nachgewiesen haben","w":["Wenn der Schaden nach Meinung der Beteiligten gering ist, auch ohne Datenaustausch","Wenn der Unfall in einer Tempo-30-Zone passiert ist","Wenn alle Beteiligten bei derselben Versicherung versichert sind"],"norm":"§ 4 Abs. 5 StVO","nurl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10011336","id":"b81af26c6"},{"cat":"po","lv":3,"q":"Wie darf ein Einsatzfahrzeug bei Rotlicht in eine Kreuzung einfahren?","e":"§ 26 StVO: Lenker von Einsatzfahrzeugen dürfen bei Rotlicht nur nach vorherigem Anhalten in die Kreuzung einfahren. Blaulicht und Folgetonhorn allein genügen dafür nicht.","tag":"Einsatzfahrzeuge","c":"Erst nach vorherigem Anhalten","w":["Ohne Anhalten, wenn Blaulicht und Folgetonhorn eingeschaltet sind","Gar nicht, es muss in jedem Fall auf Grünlicht warten","Nur, wenn alle anderen Lenker per Handzeichen freigeben"],"norm":"§ 26 Abs. 3 StVO","nurl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10011336","id":"b3bd89268"},{"cat":"po","lv":3,"q":"Ein Pkw-Lenker nähert sich einer Kreuzung ohne Vorrangzeichen. Von links kommt eine Straßenbahn. Wer hat Vorrang?","e":"§ 19 StVO: Schienenfahrzeuge haben nicht nur von rechts, sondern auch von links Vorrang. Die Rechtsregel gilt also nicht zu ihren Lasten.","tag":"Vorrang","c":"Die Straßenbahn, denn Schienenfahrzeuge haben auch von links Vorrang","w":["Der Pkw-Lenker, weil die Rechtsregel für Schienenfahrzeuge nicht gilt","Der Lenker, der zuerst die Kreuzung erreicht, unabhängig von der Fahrzeugart","Der Pkw-Lenker, weil Straßenbahnen immer Rücksicht nehmen müssen"],"norm":"§ 19 Abs. 1 StVO","nurl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10011336","id":"bc9b67c15"},{"cat":"po","lv":3,"q":"Welche Blutalkoholgrenze gilt für Radfahrer nach den Informationen von oesterreich.gv.at?","e":"Für Radfahrer gilt die Grenze von 0,8 Promille Blutalkohol (0,4 mg/l Atemalkohol). Die Grenze von 0,5 Promille gilt für Kfz-Lenker.","tag":"Alkohol am Steuer","c":"Ab 0,8 Promille","w":["Ab 0,5 Promille","Ab 0,1 Promille","Ab 1,2 Promille"],"norm":"§ 5 Abs. 1 StVO","nurl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10011336","id":"beee2b852"},{"cat":"po","lv":1,"q":"Eine reglose Person atmet nicht normal. Was ist nach dem Standard des Österreichischen Roten Kreuzes zu tun?","e":"Das Rote Kreuz empfiehlt bei einer reglosen Person ohne normale Atmung den Notruf 144 und den sofortigen Beginn der Herzdruckmassage.","tag":"Wiederbelebung","c":"Notruf 144 absetzen und sofort mit der Herzdruckmassage beginnen","w":["In die stabile Seitenlage bringen und abwarten","Aufsetzen und ihr etwas zu trinken geben","Nichts unternehmen und auf den Rettungsdienst warten"],"id":"b1d54ddfe"},{"cat":"po","lv":1,"q":"In welchem Verhältnis werden bei der Wiederbelebung eines Erwachsenen Herzdruckmassagen und Beatmungen durchgeführt?","e":"Das Rote Kreuz nennt für die Wiederbelebung 30 Herzdruckmassagen im Wechsel mit zwei Beatmungen, wobei die Beatmung nur von geübten Helfern durchgeführt werden soll.","tag":"Wiederbelebung","c":"30 Herzdruckmassagen zu 2 Beatmungen","w":["15 Herzdruckmassagen zu 2 Beatmungen","5 Herzdruckmassagen zu 1 Beatmung","30 Herzdruckmassagen zu 5 Beatmungen"],"id":"be4b13a92"},{"cat":"po","lv":1,"q":"Wann wird eine Person in die stabile Seitenlage gebracht?","e":"Das Rote Kreuz empfiehlt die stabile Seitenlage bei einer reglosen Person mit normaler Atmung. Sie hält die Atemwege frei und verhindert das Ersticken durch Zunge, Erbrochenes oder Blut.","tag":"Stabile Seitenlage","c":"Wenn sie reglos ist, aber normal atmet","w":["Wenn sie nicht normal atmet","Wenn sie stark blutet, aber ansprechbar ist","Wenn sie sich verschluckt hat und nicht mehr husten kann"],"id":"b2c0a5d36"},{"cat":"po","lv":1,"q":"Was ist die Sofortmaßnahme bei einer Verbrennung der Haut?","e":"Das Rote Kreuz empfiehlt, kleinflächige Verbrennungen sofort mit Wasser zu kühlen, nicht eiskalt. Danach folgt ein steriler, lockerer Verband. Großflächige Verbrennungen nicht lange kühlen (Unterkühlung) und Notruf 144.","tag":"Verbrennungen","c":"Die verbrannte Stelle sofort mit Wasser kühlen (nicht eiskalt)","w":["Die Stelle mit Öl oder Butter einreiben","Die Brandblasen aufstechen","Die Stelle mit Eiswürfeln direkt auf der Haut kühlen"],"id":"b4bbe65f1"},{"cat":"po","lv":1,"q":"Eine Person wird plötzlich blass und kaltschweißig und ihr wird schwindlig (Kreislaufkollaps). Was hilft?","e":"Bei einem Kreislaufkollaps empfiehlt das Rote Kreuz, die Person hinzulegen und die Beine hochzulagern, damit das Blut zu Herz und Gehirn zurückfließt.","tag":"Schock und Kreislauf","c":"Sie hinlegen und die Beine hochlagern","w":["Sie aufsetzen und viel trinken lassen","Sie auf den Bauch drehen","Sie zum Umhergehen anregen"],"id":"b18882144"},{"cat":"po","lv":2,"q":"Wo wird bei der Herzdruckmassage eines Erwachsenen gedrückt?","e":"Das Rote Kreuz empfiehlt, den Handballen auf die Mitte des Brustkorbs zu legen, die Arme durchzustrecken und schnell und kräftig zu drücken.","tag":"Wiederbelebung","c":"Mit dem Handballen auf der Mitte des Brustkorbs","w":["Mit dem Handballen auf der linken Brustseite über dem Herzen","Mit den Fingerspitzen im Oberbauch","Mit dem Handballen am unteren Ende des Brustkorbs über dem Magen"],"id":"ba2961b11"},{"cat":"po","lv":2,"q":"Mit welcher Frequenz wird bei der Herzdruckmassage eines Erwachsenen gedrückt?","e":"Die Leitlinien des Europäischen Rates für Wiederbelebung nennen eine Drückfrequenz von 100 bis 120 pro Minute.","tag":"Wiederbelebung","c":"100 bis 120 Mal pro Minute","w":["60 bis 80 Mal pro Minute","80 bis 100 Mal pro Minute","140 bis 160 Mal pro Minute"],"id":"b0e626f0c"},{"cat":"po","lv":2,"q":"Wie lange darf die Atemkontrolle bei einer reglosen Person höchstens dauern?","e":"Das Rote Kreuz empfiehlt, die Atmung durch Überstrecken des Kopfes und Sehen, Hören und Fühlen zu prüfen. Die Kontrolle soll höchstens 10 Sekunden dauern.","tag":"Wiederbelebung","c":"Höchstens 10 Sekunden","w":["Mindestens eine Minute","Etwa 30 Sekunden","Bis der Rettungsdienst eintrifft"],"id":"b844e7f47"},{"cat":"po","lv":2,"q":"Wie ist ein automatisierter externer Defibrillator (AED) einzusetzen?","e":"Das Rote Kreuz empfiehlt, den AED einzuschalten und den Anweisungen des Geräts zu folgen. Ein AED ist auch für Laien vorgesehen.","tag":"Defibrillator","c":"Das Gerät einschalten und seinen Anweisungen folgen","w":["Erst nach dem Eintreffen des Rettungsdienstes","Nur durch Ärztinnen oder Ärzte","Die Stromstärke zuerst manuell am Gerät einstellen"],"id":"b4244cfac"},{"cat":"po","lv":2,"q":"Was ist die erste Maßnahme bei einer stark blutenden Wunde?","e":"Das Rote Kreuz empfiehlt bei starken Blutungen, mit der Hand fest auf die Wunde zu drücken, den Notruf 144 abzusetzen und die Beine hochzulagern.","tag":"Blutungen","c":"Fest auf die Wunde drücken","w":["Die Wunde mit Wasser auswaschen und erst danach drücken","Mehl oder Puder auf die Wunde streuen","Die Wunde offen lassen, damit sie ausbluten kann"],"id":"badc04c1d"},{"cat":"po","lv":2,"q":"Wie wird eine verschmutzte Wunde nach Empfehlung des Roten Kreuzes versorgt?","e":"Das Rote Kreuz empfiehlt, verschmutzte Wunden mit klarem Wasser auszuspülen und keimfrei zu verbinden. Fremdkörper in der Wunde dürfen nicht herausgezogen werden.","tag":"Wundversorgung","c":"Mit klarem Wasser ausspülen und keimfrei verbinden","w":["Mit Puder oder Mehl bestreuen","Mit einer fetthaltigen Salbe einreiben","Unverbunden lassen, damit Luft herankommt"],"id":"b3077ff7b"},{"cat":"po","lv":2,"q":"Wann sollte bei einer Panne die Warnweste angelegt werden?","e":"Das Rote Kreuz rät, die Warnweste schon vor dem Aussteigen anzulegen. Zusätzlich sind die Warnblinkanlage einzuschalten und das Warndreieck aufzustellen.","tag":"Unfallstelle absichern","c":"Vor dem Aussteigen aus dem Fahrzeug","w":["Nach dem Aufstellen des Warndreiecks","Erst wenn die Polizei eintrifft","Nur bei Dunkelheit"],"id":"beba936bd"},{"cat":"po","lv":3,"q":"Welche Drucktiefe wird bei der Herzdruckmassage eines Erwachsenen empfohlen?","e":"Die Leitlinien des Europäischen Rates für Wiederbelebung nennen für Erwachsene eine Drucktiefe von 5 bis 6 Zentimetern bei einer Frequenz von 100 bis 120 pro Minute.","tag":"Wiederbelebung","c":"Etwa 5 bis 6 Zentimeter","w":["Etwa 1 bis 2 Zentimeter","Etwa 3 Zentimeter","Etwa 8 bis 10 Zentimeter"],"id":"b40f0d24f"},{"cat":"po","lv":3,"q":"Eine reglose Person zeigt nur vereinzelte, unregelmäßige Schnappatmung. Wie ist das zu bewerten?","e":"Das Rote Kreuz weist darauf hin, dass Schnappatmung und unregelmäßige Atemzüge nicht als normale Atmung gelten. Im Zweifel ist mit der Wiederbelebung zu beginnen.","tag":"Wiederbelebung","c":"Als nicht normale Atmung, die Wiederbelebung ist zu beginnen","w":["Als normale Atmung, die stabile Seitenlage ist angebracht","Als Zeichen der Besserung, es ist abzuwarten","Als Hinweis auf Verschlucken, der Heimlich-Handgriff ist anzuwenden"],"id":"bd271a108"},{"cat":"po","lv":3,"q":"Um wie viel sinkt bei einem Kreislaufstillstand ohne Hilfeleistung die Überlebenswahrscheinlichkeit ungefähr pro Minute?","e":"Das Rote Kreuz nennt als Richtwert, dass die Überlebenswahrscheinlichkeit bei einem Herz-Kreislauf-Stillstand ohne Wiederbelebung pro Minute um etwa 10 Prozent sinkt. Frühes Handeln ist daher entscheidend.","tag":"Wiederbelebung","c":"Um etwa 10 Prozent","w":["Um etwa 1 Prozent","Um etwa 30 Prozent","Um etwa 50 Prozent"],"id":"b9d95f08b"},{"cat":"po","lv":3,"q":"An welchen Körperteilen wird nach den Empfehlungen des Roten Kreuzes ein Druckverband angelegt?","e":"Das Rote Kreuz weist darauf hin, dass ein Druckverband nur an Armen und Beinen angelegt wird. An anderen Körperstellen wird mit der Hand auf die Wunde gedrückt.","tag":"Blutungen","c":"An Armen und Beinen","w":["Am Hals","Am Bauch","Am Kopf"],"id":"baf23309a"},{"cat":"po","lv":3,"q":"Eine Person hat sich verschluckt und kann nicht mehr husten, sprechen oder atmen. Was ist die erste Maßnahme nach der Empfehlung des Roten Kreuzes?","e":"Das Rote Kreuz empfiehlt bei schwerer Verlegung der Atemwege zuerst bis zu fünf Schläge zwischen die Schulterblätter. Hilft das nicht, folgt der Heimlich-Handgriff im Oberbauch.","tag":"Verschlucken","c":"Bis zu fünf Schläge mit der flachen Hand zwischen die Schulterblätter","w":["Sofort den Heimlich-Handgriff im Oberbauch","Der Person Wasser zu trinken geben","Die Person auf den Rücken legen und beatmen"],"id":"b261a268d"},{"cat":"po","lv":3,"q":"Eine Person mit schwerer Verlegung der Atemwege wird bewusstlos. Was ist zu tun?","e":"Das Rote Kreuz empfiehlt, bei Bewusstlosigkeit infolge einer Verlegung der Atemwege sofort mit der Wiederbelebung zu beginnen.","tag":"Verschlucken","c":"Sofort mit der Wiederbelebung beginnen","w":["Weiter Schläge zwischen die Schulterblätter geben","Die Person in die stabile Seitenlage bringen","Abwarten, ob sie von selbst wieder zu sich kommt"],"id":"b88d0af17"},{"cat":"po","lv":3,"q":"Was gilt für die Beatmung bei der Wiederbelebung durch Ersthelfer nach dem Roten Kreuz?","e":"Das Rote Kreuz nennt 30 Herzdruckmassagen im Wechsel mit zwei Beatmungen. Die Beatmung soll nur von geübten Helfern durchgeführt werden.","tag":"Wiederbelebung","c":"Sie wird nur durchgeführt, wenn der Helfer darin geübt ist, sonst genügt die Herzdruckmassage","w":["Sie muss immer vor der Herzdruckmassage erfolgen","Sie ist für Laien untersagt","Sie beginnt erst nach zehn Minuten Herzdruckmassage"],"id":"b29cb76d1"},{"cat":"po","lv":1,"q":"Welche der folgenden Handlungen ist in der Regel eine Verwaltungsübertretung und keine gerichtlich strafbare Handlung?","e":"Verstöße gegen die Straßenverkehrsordnung wie Parken im Halteverbot sind Verwaltungsübertretungen, die von Verwaltungsbehörden bestraft werden. Diebstahl, Körperverletzung und Sachbeschädigung sind im Strafgesetzbuch geregelte gerichtlich strafbare Handlungen.","tag":"Verwaltungsstrafrecht","c":"Parken im Halteverbot","w":["Diebstahl","Körperverletzung","Sachbeschädigung"],"id":"bfb9170c6"},{"cat":"po","lv":1,"q":"Zu welcher der drei Staatsgewalten (Gesetzgebung, Vollziehung, Gerichtsbarkeit) zählt die Polizei?","e":"Die Polizei vollzieht Gesetze und gehört daher zur Vollziehung (Verwaltung). Gesetze beschließt die Gesetzgebung, über Straftaten entscheiden die Gerichte.","tag":"Staatsgewalten","c":"Zur Vollziehung (Verwaltung)","w":["Zur Gesetzgebung","Zur Gerichtsbarkeit","Zu keiner, sie steht über den Staatsgewalten"],"id":"be5a2ca6c"},{"cat":"po","lv":2,"q":"Wie lautet die offizielle Bezeichnung des umgangssprachlichen „Organmandats“ im Verwaltungsstrafgesetz?","e":"Das Organmandat ist im Verwaltungsstrafgesetz (§ 50 VStG) als Organstrafverfügung geregelt. Es ist ein vereinfachtes Verfahren für bestimmte geringfügige Verwaltungsübertretungen.","tag":"Organstrafverfügung","c":"Organstrafverfügung","w":["Anonymverfügung","Strafverfügung","Verwarnungsbescheid"],"norm":"§ 50 Abs. 1 VStG","nurl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10005770","id":"b63947413"},{"cat":"po","lv":2,"q":"Für welche Verstöße kann eine Organstrafverfügung verhängt werden?","e":"Nach § 50 VStG kann eine Organstrafverfügung nur wegen bestimmter geringfügiger Verwaltungsübertretungen mit einer Geldstrafe verhängt werden. Gerichtlich strafbare Handlungen sind davon nicht umfasst.","tag":"Organstrafverfügung","c":"Für bestimmte geringfügige Verwaltungsübertretungen","w":["Für alle Verwaltungsübertretungen unabhängig von ihrem Gewicht","Für gerichtlich strafbare Vergehen, wenn die Täterin oder der Täter geständig ist","Ausschließlich für Verstöße im Straßenverkehr mit Personenschaden"],"norm":"§ 50 Abs. 1 VStG","nurl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10005770","id":"beba349d3"},{"cat":"po","lv":2,"q":"Was besagt die in Art. 6 EMRK verankerte Unschuldsvermutung?","e":"Art. 6 Abs. 2 EMRK: Bis zum gesetzlichen Nachweis seiner Schuld wird vermutet, dass der wegen einer strafbaren Handlung Angeklagte unschuldig ist.","tag":"Menschenrechte","c":"Wer einer Straftat angeklagt ist, gilt bis zum gesetzlichen Nachweis seiner Schuld als unschuldig","w":["Wer verdächtigt wird, muss seine Unschuld selbst beweisen","Wer festgenommen wurde, darf bis zur Verhandlung nicht befragt werden","Wer ein Geständnis ablegt, darf nicht mehr verteidigt werden"],"norm":"Art. 6 Abs. 2 EMRK","nurl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10000308","id":"b1376f59a"},{"cat":"po","lv":2,"q":"Kann man sich wegen Sachbeschädigung nach § 125 StGB strafbar machen, wenn man seine eigene Sache beschädigt?","e":"§ 125 StGB stellt die Beschädigung einer fremden Sache unter Strafe. Wer eine eigene Sache beschädigt, begeht daher keine Sachbeschädigung, soweit nicht Rechte anderer betroffen sind.","tag":"Sachbeschädigung","c":"Nein, die Bestimmung schützt nur fremde Sachen","w":["Ja, jede Beschädigung einer Sache ist strafbar","Ja, aber nur wenn die Sache versichert ist","Ja, aber nur wenn die Sache mehr als ein Jahr in Besitz war"],"norm":"§ 125 StGB","nurl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10002296","id":"bf0fc8af2"},{"cat":"po","lv":2,"q":"Wie nennt das Jugendgerichtsgesetz Personen, die das 14. Lebensjahr, aber noch nicht das 18. Lebensjahr vollendet haben?","e":"Unmündig ist, wer das 14. Lebensjahr noch nicht vollendet hat. Jugendliche sind Personen ab 14 Jahren bis zur Vollendung des 18. Lebensjahres. Für sie gelten besondere Regeln des Jugendstrafrechts.","tag":"Strafmündigkeit","c":"Jugendliche","w":["Unmündige","Junge Erwachsene","Strafunmündige"],"norm":"§ 1 Abs. 1 Z 2 JGG","nurl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10002825","id":"b8b07bc40"},{"cat":"po","lv":3,"q":"Was geschieht, wenn eine Person die Zahlung einer Organstrafverfügung verweigert?","e":"§ 50 VStG: Verweigert die Person die Zahlung, wird die Organstrafverfügung gegenstandslos. Das Organ hat Anzeige an die Verwaltungsbehörde zu erstatten, die ein ordentliches Verwaltungsstrafverfahren führt.","tag":"Organstrafverfügung","c":"Die Organstrafverfügung wird gegenstandslos und das Organ erstattet Anzeige an die Behörde","w":["Sie wird automatisch in eine Freiheitsstrafe umgewandelt","Sie wird dem Strafgericht zur Verhandlung vorgelegt","Sie verfällt ersatzlos, ohne dass weitere Schritte folgen"],"norm":"§ 50 Abs. 6 VStG","nurl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10005770","id":"ba6232bae"},{"cat":"po","lv":3,"q":"Wer ist nach dem Verwaltungsstrafgesetz zur Verhängung einer Organstrafverfügung ermächtigt?","e":"§ 50 VStG: Zur Verhängung einer Organstrafverfügung sind besonders geschulte Organe der öffentlichen Aufsicht ermächtigt. Dazu zählen auch Organe des öffentlichen Sicherheitsdienstes.","tag":"Organstrafverfügung","c":"Besonders geschulte Organe der öffentlichen Aufsicht, darunter Organe des öffentlichen Sicherheitsdienstes","w":["Ausschließlich Richterinnen und Richter","Jede Person mit gültigem Führerschein","Ausschließlich die Staatsanwaltschaft"],"norm":"§ 50 Abs. 1 VStG","nurl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10005770","id":"b136fbbd2"},{"cat":"po","lv":3,"q":"In welchem Artikel der Europäischen Menschenrechtskonvention ist das Recht auf ein faires Verfahren verankert?","e":"Art. 6 EMRK regelt das Recht auf ein faires Verfahren, in Absatz 2 auch die Unschuldsvermutung. Art. 3 betrifft das Folterverbot, Art. 5 das Recht auf Freiheit und Sicherheit.","tag":"Menschenrechte","c":"Art. 6","w":["Art. 3","Art. 5","Art. 8"],"norm":"Art. 6 EMRK","nurl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10000308","id":"bade04d8b"},{"cat":"po","lv":3,"q":"Welche Merkmale kennzeichnen den Diebstahl nach § 127 StGB?","e":"§ 127 StGB: Diebstahl begeht, wer eine fremde bewegliche Sache einem anderen mit dem Vorsatz wegnimmt, sich oder einen Dritten durch deren Zueignung unrechtmäßig zu bereichern. Mit Gewalt oder Drohung wäre es Raub.","tag":"Raub und Diebstahl","c":"Wegnahme einer fremden beweglichen Sache mit dem Vorsatz, sich oder einen Dritten dadurch unrechtmäßig zu bereichern","w":["Wegnahme einer fremden Sache unter Gewalt gegen eine Person","Beschädigung einer fremden Sache aus Zorn oder Rache","Wegnahme einer eigenen Sache aus der Verwahrung eines anderen"],"norm":"§ 127 StGB","nurl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10002296","id":"b26b9b1f1"},{"cat":"po","lv":3,"q":"Welchem Atemalkoholwert entspricht ein Blutalkoholgehalt von 0,8 Promille?","e":"0,8 Promille Blutalkohol entsprechen 0,4 mg Alkohol pro Liter Atemluft. Nach § 5 StVO gilt man ab diesem Wert jedenfalls als alkoholbeeinträchtigt.","tag":"Alkohol am Steuer","c":"0,4 mg/l","w":["0,08 mg/l","0,25 mg/l","0,8 mg/l"],"norm":"§ 5 Abs. 1 StVO","nurl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10011336","id":"b06210375"},{"cat":"po","lv":3,"q":"Ein Fahrzeug bleibt vor einem Schutzweg ohne Ampel stehen, damit Fußgänger queren können. Darf man es überholen?","e":"§ 16 StVO verbietet das Überholen auf und unmittelbar vor Schutzwegen, wenn der Verkehr dort nicht durch Arm- oder Lichtzeichen geregelt wird.","tag":"Überholen","c":"Nein, unmittelbar vor Schutzwegen ohne Arm- oder Lichtzeichen ist das Überholen verboten","w":["Ja, wenn man langsam genug fährt","Ja, wenn die Fahrbahn breit genug ist","Ja, wenn man vorher hupt"],"norm":"§ 16 Abs. 1 lit. d StVO","nurl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10011336","id":"b25debb1d"},{"cat":"rs","lv":1,"q":"Welches Wort ist in diesem Satz falsch geschrieben? „Wir treffen uns heute abend vor dem Kino.“","e":"Tageszeiten nach „heute“, „gestern“ oder „morgen“ sind Nomen und werden großgeschrieben: heute Abend.","tag":"Tageszeiten","c":"abend","w":["treffen","heute","Kino"],"par":"§ 55","id":"bb6eb6f41"},{"cat":"rs","lv":1,"q":"Setze richtig ein: „Der ___ fließt mitten durch die Stadt.“","e":"Nach kurz gesprochenem Vokal schreibt man „ss“ (Fluss), nicht „ß“. Die Schreibung „Fluß“ gilt seit der Rechtschreibreform nicht mehr.","tag":"ss/ß","c":"Fluss","w":["Fluß","Flus","Flusß"],"par":"§ 2","id":"bda2fb6a1"},{"cat":"rs","lv":1,"q":"Welches Wort ist in diesem Satz falsch geschrieben? „Die Biene summte über die blühende Wise.“","e":"Richtig heißt es „Wiese“: Das lange i wird in diesem Wort als „ie“ geschrieben.","tag":"ie","c":"Wise","w":["Biene","summte","blühende"],"par":"§ 1","id":"be7b98be7"},{"cat":"rs","lv":1,"q":"Welches Wort gehört in die Lücke? „Ich hoffe, ___ du pünktlich bist.“","e":"„dass“ leitet einen Nebensatz ein (Konjunktion) und wird mit „ss“ geschrieben. „das“ lässt sich durch „dieses“ oder „welches“ ersetzen, was hier nicht möglich ist.","tag":"das/dass","c":"dass","w":["das","daß","dasß"],"id":"b6bdb2cc9"},{"cat":"rs","lv":1,"q":"Wie schreibt man nach der österreichischen Rechtschreibung richtig? „Bei schönem Wetter gehe ich gern ___ zur Arbeit.“","e":"„zu Fuß“ schreibt man getrennt, weil „Fuß“ ein Nomen ist und großgeschrieben wird. Nach langem Vokal steht „ß“.","tag":"Getrennt- und Zusammenschreibung","c":"zu Fuß","w":["zufuß","zu-Fuß","zu Fuss"],"par":"§ 39","id":"bed1f8023"},{"cat":"rs","lv":1,"q":"Tippe das eingeklammerte Verb als Nomen ein (Groß-/Kleinschreibung zählt): „Beim ___ (lesen) vergisst er die Zeit.“","e":"Nach „beim“ steht ein substantivierter Infinitiv, den man großschreibt: beim Lesen.","tag":"Substantivierung","t":"text","ans":["Lesen"],"par":"§ 57","id":"b275be8b6"},{"cat":"rs","lv":3,"q":"Welches Wort ist in diesem Satz falsch geschrieben? „Der Reitz des Spiels liegt in den vielen kleinen Überraschungen.“","e":"Nach dem Zwielaut „ei“ steht ein einfaches „z“: Reiz. „tz“ schreibt man nur nach kurzem Vokal, zum Beispiel in „Katze“.","tag":"tz/z","c":"Reitz","w":["Spiels","vielen","Überraschungen"],"id":"bd92bc577"},{"cat":"rs","lv":1,"q":"Wie schreibt man „Hausarbeit und Gartenarbeit“ in verkürzter Form richtig?","e":"Fällt bei einer Aufzählung gleicher Grundwörter das Grundwort weg, ersetzt man es durch einen Ergänzungsstrich: Haus- und Gartenarbeit.","tag":"Bindestrich","c":"Haus- und Gartenarbeit","w":["Haus und Gartenarbeit","Haus-und-Gartenarbeit","Hausarbeit- und Gartenarbeit"],"par":"§ 81","id":"bdbb96a07"},{"cat":"rs","lv":2,"q":"Welches Wort ist in diesem Satz falsch geschrieben? „Die Menner im Dorf trafen sich im Gasthaus.“","e":"„Männer“ gehört zu „Mann“. Weil sich das Wort von einem Wort mit „a“ ableitet, schreibt man „ä“.","tag":"ä/e","c":"Menner","w":["Dorf","trafen","Gasthaus"],"par":"§ 13","id":"baa4f92c2"},{"cat":"rs","lv":1,"q":"Welcher Satz ist in Rechtschreibung und Zeichensetzung richtig?","e":"Vor einem „dass“-Satz steht ein Komma. Außerdem schreibt man die Konjunktion „dass“ mit „ss“, und „weiß“ (von wissen) hat ein „ß“.","tag":"Zeichensetzung","c":"Ich weiß, dass er morgen kommt.","w":["Ich weiß dass er morgen kommt.","Ich weiß, das er morgen kommt.","Ich weiss, dass er morgen kommt."],"id":"b7d54013e"},{"cat":"rs","lv":2,"q":"Tippe das Wort richtig ein: „Er hat den Zug leider verpast.“ (Partizip von „verpassen“)","e":"Der Stamm „pass“ hat einen kurzen Vokal und wird mit „ss“ geschrieben. Dazu kommt die Endung -t: verpasst.","tag":"ss/ß","t":"text","ans":["verpasst"],"par":"§ 2","id":"b5c807e15"},{"cat":"rs","lv":1,"q":"Setze richtig ein: „Im Sommer stechen uns viele ___.“","e":"Nach kurz gesprochenem Vokal schreibt man „ck“ statt „kk“: Mücke, Mücken.","tag":"ck/k","c":"Mücken","w":["Mükken","Müken","Mücen"],"par":"§ 3","id":"be80ca1ed"},{"cat":"rs","lv":2,"q":"Welches Wort passt in die Lücke? „Im Meer schwimmt ein riesiger ___.“","e":"Das große Meerestier heißt „Wal“. „Wahl“ bedeutet Entscheidung, „Wall“ ist eine Erdaufschüttung.","tag":"Dehnung","c":"Wal","w":["Wahl","Wall","Whal"],"id":"b8f7fbb7a"},{"cat":"rs","lv":2,"q":"Welches Wort ist in diesem Satz falsch geschrieben? „Auf der Besprechung gab es leider nichts neues zu berichten.“","e":"Nach unbestimmten Mengenwörtern wie „nichts“, „etwas“ oder „viel“ wird ein Adjektiv großgeschrieben: nichts Neues.","tag":"Substantivierung","c":"neues","w":["Besprechung","leider","berichten"],"par":"§ 57","id":"b9f72af54"},{"cat":"rs","lv":2,"q":"Wie schreibt man richtig? „Die Kinder wollen am Nachmittag ___.“","e":"Verbindungen aus einem Nomen und einem Verb schreibt man getrennt: Fußball spielen. Nur als Nomen schreibt man zusammen: das Fußballspielen.","tag":"Getrennt- und Zusammenschreibung","c":"Fußball spielen","w":["Fußballspielen","Fußball-spielen","Fuß ball spielen"],"id":"b2642ee8f"},{"cat":"rs","lv":3,"q":"Welche Wortfolge ergänzt den Satz richtig? „Sie sagt, ___ das Heft, ___ sie sucht, nicht mehr da ist.“","e":"Das erste Wort leitet den Nebensatz ein (Konjunktion „dass“). Das zweite bezieht sich auf „das Heft“ (Relativpronomen „das“, ersetzbar durch „welches“).","tag":"das/dass","c":"dass – das","w":["das – dass","das – das","dass – dass"],"id":"b279f0246"},{"cat":"rs","lv":3,"q":"Welche Schreibweise ist richtig? „Der Trommler gab den ___ vor.“","e":"Das Fremdwort „Rhythmus“ wird mit „rh“ am Anfang und „th“ in der Mitte geschrieben und endet auf „-us“.","tag":"Fremdwörter","c":"Rhythmus","w":["Rythmus","Rhytmus","Rhythmuss"],"par":"§ 32","id":"b3f414252"},{"cat":"rs","lv":3,"q":"Welches Wort ist in diesem Satz falsch geschrieben? „Auf dem Grazer Hauptplatz gibt es Steirische Spezialitäten und Wiener Würstchen.“","e":"Von Ortsnamen abgeleitete Adjektive auf -isch schreibt man klein: steirische Spezialitäten. Nur Ableitungen auf -er (Grazer, Wiener) schreibt man groß.","tag":"Eigennamen","c":"Steirische","w":["Grazer","Wiener","Würstchen"],"par":"§ 62","id":"bbbe8b2cd"},{"cat":"rs","lv":1,"q":"Welche Schreibweise ist nach der österreichischen Rechtschreibung richtig? „Im Hochsommer ist es hier oft sehr ___.“","e":"Nach dem Zwielaut „ei“ steht für den scharfen s-Laut ein „ß“: heiß. Die Schreibung „heiss“ ist in Österreich falsch.","tag":"ss/ß","c":"heiß","w":["heiss","heis","heißs"],"par":"§ 25","id":"ba6b59c38"},{"cat":"rs","lv":1,"q":"Welches Wort ist in diesem Satz falsch geschrieben? „Das schwimmen im See macht mir Spaß.“","e":"Verben können als Nomen gebraucht werden (Substantivierung) und werden dann großgeschrieben: das Schwimmen.","tag":"Substantivierung","c":"schwimmen","w":["See","macht","Spaß"],"par":"§ 57","id":"b63b78b26"},{"cat":"rs","lv":1,"q":"Welches Wort gehört in die Lücke? „Ich habe heute ___ Hunger als gestern.“","e":"„mehr“ ist das Vergleichswort zu „viel“ und wird mit Dehnungs-h geschrieben. „Meer“ bezeichnet das große Gewässer.","tag":"Dehnung","c":"mehr","w":["Meer","mer","mähr"],"par":"§ 8","id":"b12c8900d"},{"cat":"rs","lv":1,"q":"Welches Wort ist in diesem Satz falsch geschrieben? „Der Hund liegt auf dem Plaz neben dem Kamin.“","e":"Nach kurz gesprochenem Vokal steht „tz“: Platz.","tag":"tz/z","c":"Plaz","w":["Hund","liegt","Kamin"],"par":"§ 3","id":"bc5639507"},{"cat":"rs","lv":3,"q":"Welches Wort ist in diesem Satz falsch geschrieben? „Die Bewerber waren im allgemeinen gut vorbereitet.“","e":"„im Allgemeinen“ ist eine feste Wendung mit einem substantivierten Adjektiv; „Allgemeinen“ schreibt man groß.","tag":"Feste Wendungen","c":"allgemeinen","w":["Bewerber","gut","vorbereitet"],"par":"§ 57","id":"bb295c0a4"},{"cat":"rs","lv":2,"q":"Welche Form ist richtig? „Er ___ gerade zu Mittag.“","e":"Das Verb „essen“ heißt in der 3. Person Einzahl „er isst“: Stamm „iss“ plus Endung -t. „esst“ gehört zu „ihr“.","tag":"ss/ß","c":"isst","w":["ißt","esst","ißst"],"id":"becc4b2c3"},{"cat":"rs","lv":1,"q":"Wie lautet die Mehrzahl von „Hand“?","e":"Die Mehrzahl gehört zum Wort „Hand“; deshalb schreibt man „ä“: Hände.","tag":"ä/e","c":"Hände","w":["Hende","Hänte","Hente"],"par":"§ 13","id":"b149d051a"},{"cat":"rs","lv":1,"q":"Tippe das Nomen richtig ein (ohne Artikel): „Zan“ – damit beißt man in einen Apfel.","e":"„Zahn“ wird mit Dehnungs-h geschrieben.","tag":"Dehnung","t":"text","ans":["Zahn"],"par":"§ 8","id":"bbbef2b4e"},{"cat":"rs","lv":1,"q":"Welche Schreibweise ist richtig? „Ich fahre mit der ___ in die Stadt.“","e":"Verbindungen aus einem einzelnen Buchstaben und einem Nomen schreibt man mit Bindestrich: S-Bahn.","tag":"Bindestrich","c":"S-Bahn","w":["SBahn","S Bahn","S.Bahn"],"par":"§ 40","id":"b0e647240"},{"cat":"rs","lv":1,"q":"Wie schreibt man richtig? „Er hat ___ denselben Fehler gemacht.“","e":"„immer wieder“ schreibt man getrennt. „wieder“ (erneut) wird mit „ie“ geschrieben; „wider“ bedeutet „gegen“.","tag":"Getrennt- und Zusammenschreibung","c":"immer wieder","w":["immerwieder","immer wider","immer-wieder"],"id":"b768d3ec6"},{"cat":"rs","lv":2,"q":"Welcher Satz hat die richtige Zeichensetzung?","e":"Bei einer Aufzählung trennt man die Glieder durch Kommas; vor „und“ steht kein Komma. Nach dem Verb steht kein Komma.","tag":"Zeichensetzung","c":"Wir kaufen Äpfel, Birnen und Trauben.","w":["Wir kaufen Äpfel, Birnen, und Trauben.","Wir kaufen Äpfel Birnen und Trauben.","Wir kaufen, Äpfel, Birnen und Trauben."],"id":"b743fb9ff"},{"cat":"rs","lv":2,"q":"Welches Wort passt in die Lücke? „Sie summte ein fröhliches ___.“","e":"Ein gesungenes Stück heißt „Lied“ (mit „ie“ und d am Ende). „Lid“ ist das Augenlid.","tag":"ie","c":"Lied","w":["Lid","Liet","Lit"],"par":"§ 10","id":"bb072763e"},{"cat":"rs","lv":3,"q":"Welches Wort ist in diesem Satz falsch geschrieben? „Von allen Teilnehmern ist sie am Schnellsten gelaufen.“","e":"Superlative mit „am“ (Frage: Wie?) schreibt man klein: am schnellsten.","tag":"Superlativ","c":"Schnellsten","w":["Teilnehmern","allen","gelaufen"],"par":"§ 58","id":"b90ec3296"},{"cat":"rs","lv":3,"q":"Warum schreibt man „Kreis“ mit einfachem „s“, „heiß“ aber mit „ß“?","e":"Nach Zwielaut oder langem Vokal steht „ß“ nur, wenn der s-Laut auch in verwandten Formen scharf bleibt (heiß – heiße). Bei „Kreis“ wird er in „Kreise“ weich, daher einfaches „s“.","tag":"ss/ß","c":"In „Kreise“ wird das s weich gesprochen, in „heiße“ bleibt es scharf.","w":["Nomen werden grundsätzlich nie mit „ß“ geschrieben.","„Kreis“ hat einen kurzen, „heiß“ einen langen Vokal.","„heiß“ ist ein Fremdwort, „Kreis“ ein Erbwort."],"id":"ba097af8e"},{"cat":"rs","lv":2,"q":"Setze richtig ein: „Die Kleidung hängt im ___.“","e":"Nach einem Konsonanten (n) steht nur „k“, nie „ck“. „ck“ steht nur nach kurzem Vokal.","tag":"ck/k","c":"Schrank","w":["Schranck","Schrankk","Schrak"],"id":"bbeec584f"},{"cat":"rs","lv":2,"q":"Schreibe die Wendung richtig (klein, in der richtigen Zahl von Wörtern): schwimmengehen","e":"Zwei Verben schreibt man getrennt, wenn das erste im Infinitiv steht: schwimmen gehen.","tag":"Getrennt- und Zusammenschreibung","t":"text","ans":["schwimmen gehen"],"par":"§ 34","id":"b5cd1c44f"},{"cat":"rs","lv":2,"q":"Welches Wort ist richtig geschrieben?","e":"„Apotheke“ ist ein Fremdwort aus dem Griechischen und wird mit „th“ und einfachem „p“ geschrieben; ein „ck“ gibt es in diesem Wort nicht.","tag":"Fremdwörter","c":"Apotheke","w":["Apoteke","Appotheke","Apothecke"],"id":"b1edc8e14"},{"cat":"rs","lv":3,"q":"Welcher Satz ist in Bezug auf „Mal“ und „Mahl“ richtig geschrieben?","e":"„Mal“ bezeichnet einen Zeitpunkt (zum ersten Mal), „Mahl“ eine festliche Mahlzeit (das gemeinsame Mahl).","tag":"Dehnung","c":"Zum ersten Mal saßen alle gemeinsam beim Mahl.","w":["Zum ersten Mahl saßen alle gemeinsam beim Mal.","Zum ersten Mahl saßen alle gemeinsam beim Mahl.","Zum ersten Mal saßen alle gemeinsam beim Mal."],"par":"§ 8","id":"b46b10c16"},{"cat":"rs","lv":1,"q":"Tippe das ganze Wort ein (ß oder ss einsetzen): Das Gegenteil von „klein“ ist „gro_“.","e":"Nach langem Vokal (o) steht „ß“: groß.","tag":"ss/ß","t":"text","ans":["groß"],"par":"§ 25","id":"bfd7c0468"},{"cat":"rs","lv":1,"q":"Welches Wort ist in diesem Satz falsch geschrieben? „Der Polizist schrieb einen kurzen bericht über den Vorfall.“","e":"„Bericht“ ist ein Nomen und wird großgeschrieben. „kurzen“ ist ein Adjektiv und bleibt klein.","tag":"Nomen","c":"bericht","w":["Polizist","kurzen","Vorfall"],"par":"§ 55","id":"bb9388206"},{"cat":"rs","lv":1,"q":"Welches Wort gehört in die Lücke? „Das Auto, ___ dort steht, gehört meinem Onkel.“","e":"Hier kann man „welches“ einsetzen (das Auto, welches dort steht). Dann ist es das Relativpronomen „das“ mit nur einem „s“.","tag":"das/dass","c":"das","w":["dass","daß","dasß"],"par":"§ 4","id":"b90b5ecd6"},{"cat":"rs","lv":1,"q":"Welches Wort ist in diesem Satz falsch geschrieben? „Im Somer ist das Wetter oft sehr warm.“","e":"Nach kurz gesprochenem Vokal wird der Konsonant verdoppelt: Sommer.","tag":"Schärfung","c":"Somer","w":["Wetter","oft","warm"],"par":"§ 2","id":"b4db310f7"},{"cat":"rs","lv":2,"q":"Setze richtig ein: „Auf dem Tisch brennt eine ___.“","e":"Nach einem Konsonanten (r) steht nur „z“, nie „tz“: Kerze.","tag":"tz/z","c":"Kerze","w":["Kertze","Kerrze","Kertse"],"id":"b3ecfbfc2"},{"cat":"rs","lv":2,"q":"Welches Wort ist in diesem Satz falsch geschrieben? „Im Sitzen arbeitet es sich bequemer als im stehen.“","e":"Nach „im“ wird ein Verb zum Nomen: im Sitzen, im Stehen. Beide schreibt man groß.","tag":"Substantivierung","c":"stehen","w":["Sitzen","arbeitet","bequemer"],"par":"§ 57","id":"b840a1192"},{"cat":"rs","lv":2,"q":"Welche Schreibweise ist richtig? „Der Sportler hat sehr ___ Beine.“","e":"„kräftig“ gehört zu „Kraft“; deshalb schreibt man „ä“ und kein doppeltes „f“.","tag":"ä/e","c":"kräftige","w":["kreftige","kräfftige","krefftige"],"par":"§ 13","id":"b3f310cd2"},{"cat":"rs","lv":2,"q":"Welche Schreibweise ist richtig? „Im Hochgebirge ist die ___ besonders stark.“","e":"Zusammensetzungen mit Abkürzungen aus Großbuchstaben schreibt man mit Bindestrich; das Grundwort bleibt ein großgeschriebenes Nomen: UV-Strahlung.","tag":"Bindestrich","c":"UV-Strahlung","w":["UVStrahlung","UV Strahlung","U.V.-Strahlung"],"par":"§ 40","id":"baa45d1dc"},{"cat":"rs","lv":2,"q":"Welcher Satz ist richtig mit Kommas gesetzt?","e":"Ein eingeschobener Relativsatz wird auf beiden Seiten durch Kommas abgetrennt.","tag":"Zeichensetzung","c":"Der Mann, der dort steht, ist mein Onkel.","w":["Der Mann der dort steht, ist mein Onkel.","Der Mann, der dort steht ist mein Onkel.","Der Mann der dort steht ist mein Onkel."],"par":"§ 73","id":"ba02b278a"},{"cat":"rs","lv":2,"q":"Tippe das Nomen richtig ein: „Das Ergebniss der Wahl wird morgen veröffentlicht.“","e":"Die Nachsilbe -nis hat nur ein „s“; verdoppelt wird es erst in der Mehrzahl (Ergebnisse).","tag":"s-Laute","t":"text","ans":["Ergebnis"],"par":"§ 5","id":"ba664bce0"},{"cat":"rs","lv":2,"q":"Welches Wort passt in die Lücke? „Das Buch hat mehr als zweihundert ___.“","e":"Die Seiten eines Buches schreibt man mit „ei“. „Saiten“ (mit „ai“) gehören zu Musikinstrumenten.","tag":"Gleichklang","c":"Seiten","w":["Saiten","Seitten","Sieten"],"par":"§ 18","id":"b133989d1"},{"cat":"rs","lv":1,"q":"Wie schreibt man richtig? „Ich habe meinen Schlüssel ___ verloren.“","e":"„irgendwo“ ist ein Adverb und wird in einem Wort geschrieben.","tag":"Getrennt- und Zusammenschreibung","c":"irgendwo","w":["irgend wo","irgend-wo","irgendwoo"],"par":"§ 39","id":"b3bce39fb"},{"cat":"rs","lv":2,"q":"Welche Schreibweise ist richtig? „Ich nehme nur ein ___ Zucker in den Tee.“","e":"Nach dem kurzen „i“ steht „ss“: bisschen. Die Schreibung „bißchen“ ist veraltet.","tag":"ss/ß","c":"bisschen","w":["bißchen","bischen","bisßchen"],"par":"§ 2","id":"b9d8d02fe"},{"cat":"rs","lv":3,"q":"Wie schreibt man den Straßennamen richtig?","e":"Besteht ein Straßenname aus mehreren Wörtern (Vor- und Nachname plus Straße), verbindet man alle Teile durch Bindestriche (Durchkopplung).","tag":"Bindestrich","c":"Peter-Rosegger-Straße","w":["Peter Rosegger Straße","Peter-RoseggerStraße","Peter Rosegger-Straße"],"par":"§ 50","id":"b3773a72a"},{"cat":"rs","lv":3,"q":"In welchem dieser Wörter wird das lange „i“ mit einfachem „i“ geschrieben?","e":"Das lange i in „Tiger“ wird als einfaches „i“ geschrieben. Bei „Biene“, „Wiese“ und „Spiegel“ steht dafür „ie“.","tag":"ie","c":"Tiger","w":["Biene","Wiese","Spiegel"],"par":"§ 10","id":"bb79d1a23"},{"cat":"rs","lv":3,"q":"Wie schreibt man richtig? „Er blieb im Bett liegen, ___ er aufstand.“","e":"„anstatt“ schreibt man zusammen; „dass“ bleibt als eigenes Wort mit „ss“ stehen, weil es einen Nebensatz einleitet: anstatt dass.","tag":"Getrennt- und Zusammenschreibung","c":"anstatt dass","w":["anstattdass","an statt dass","anstatt das"],"par":"§ 39","id":"b3ba78a2a"},{"cat":"rs","lv":3,"q":"Welche Wortreihe ist durchgehend richtig geschrieben?","e":"Streik hat nach dem Zwielaut nur „k“; Trick und Zucker haben „ck“ nach kurzem Vokal; das Fremdwort Tabak wird mit einfachem „k“ geschrieben.","tag":"ck/k","c":"Streik, Trick, Zucker, Tabak","w":["Streick, Trick, Zucker, Tabak","Streik, Trik, Zucker, Tabak","Streik, Trick, Zuker, Tabak"],"id":"b89cdac74"},{"cat":"rs","lv":1,"q":"Wie schreibt man die höfliche Anrede „Sie“ samt „Ihnen“, „Ihr“ und „Ihre“?","e":"Die höfliche Anrede „Sie“ und die zugehörigen Formen (Ihnen, Ihr, Ihre) werden immer großgeschrieben. So unterscheiden sie sich von „sie“ in der dritten Person.","tag":"Anrede","c":"Immer mit großem Anfangsbuchstaben","w":["Immer mit kleinem Anfangsbuchstaben","Nur am Satzanfang mit großem Anfangsbuchstaben","Nur „Sie“ groß, alle anderen Formen klein"],"par":"§ 65","id":"badce588c"},{"cat":"rs","lv":1,"q":"Welches Wort ist in diesem Satz falsch geschrieben? „Der Fuks schlich leise durch den Wald.“","e":"Der Laut [ks] wird in diesem Wort als „chs“ geschrieben: Fuchs.","tag":"s-Laute","c":"Fuks","w":["schlich","leise","Wald"],"par":"§ 31","id":"b992ea108"},{"cat":"rs","lv":1,"q":"Schreibe das Wort richtig mit Bindestrich (Kleidungsstück mit kurzen Ärmeln): TSHIRT","e":"Verbindungen aus einem einzelnen Buchstaben und einem Nomen schreibt man mit Bindestrich: T-Shirt.","tag":"Bindestrich","t":"text","ans":["T-Shirt"],"par":"§ 40","id":"bbf218c28"},{"cat":"rs","lv":1,"q":"Welches Wort ist in diesem Satz falsch geschrieben? „Der Unterricht beginnt Morgens um acht Uhr.“","e":"„morgens“ ist ein Adverb und wird kleingeschrieben. Das Nomen schreibt man groß: am Morgen, des Morgens.","tag":"Tageszeiten","c":"Morgens","w":["Unterricht","beginnt","Uhr"],"par":"§ 56","id":"bcc41c09b"},{"cat":"rs","lv":1,"q":"Welches dieser Wörter ist nach der aktuellen Rechtschreibung falsch geschrieben?","e":"Nach kurzem Vokal steht „ss“: Schloss. Gruß, Fuß und Spaß haben einen langen Vokal und werden mit „ß“ geschrieben.","tag":"ss/ß","c":"Schloß","w":["Gruß","Fuß","Spaß"],"par":"§ 2","id":"b31eb376c"},{"cat":"rs","lv":2,"q":"Welches Wort passt in die Lücke? „Der Apfel hängt an einem kurzen ___.“","e":"Der Teil, an dem eine Frucht oder Blume hängt, heißt „Stiel“ (mit „ie“). „Stil“ meint die Art und Weise.","tag":"Gleichklang","c":"Stiel","w":["Stil","Stihel","Stiehl"],"par":"§ 10","id":"be6ff4385"},{"cat":"rs","lv":3,"q":"Welches Wort ist in diesem Satz falsch geschrieben? „Der Fußgänger ging bei rot über die Straße.“","e":"Farbnamen werden als Nomen großgeschrieben, wenn sie nach einer Präposition stehen: bei Rot.","tag":"Farben","c":"rot","w":["Fußgänger","ging","Straße"],"par":"§ 57","id":"b866829e0"},{"cat":"rs","lv":2,"q":"Tippe das Nomen richtig ein (Einzahl, ohne Artikel): „Reuber“ – jemand, der etwas raubt.","e":"„Räuber“ gehört zu „Raub“ und „rauben“; deshalb schreibt man „äu“.","tag":"äu/eu","t":"text","ans":["Räuber"],"par":"§ 16","id":"b9bf3f272"},{"cat":"rs","lv":2,"q":"Wie schreibt man richtig? „___ wurde es dunkel im Saal.“","e":"„auf einmal“ (plötzlich) schreibt man getrennt und klein; am Satzanfang wird nur das erste Wort großgeschrieben.","tag":"Getrennt- und Zusammenschreibung","c":"Auf einmal","w":["Aufeinmal","Auf-einmal","Auf ein mal"],"id":"b095095dc"},{"cat":"rs","lv":2,"q":"Welcher Satz enthält keinen Rechtschreibfehler?","e":"„mussten“ hat einen kurzen Vokal und damit „ss“. „draußen“ hat den Zwielaut „au“ und damit „ß“.","tag":"ss/ß","c":"Wir mussten bei Regen draußen warten.","w":["Wir mußten bei Regen draußen warten.","Wir mussten bei Regen draussen warten.","Wir musten bei Regen draußen warten."],"id":"b71a56773"},{"cat":"rs","lv":2,"q":"Welche Regel erklärt die Schreibung von „Mitte“ und „Wetter“?","e":"Bei kurz gesprochenem, betontem Vokal folgt meist ein verdoppelter Konsonant (Schärfung): Mitte, Wetter, Sommer.","tag":"Schärfung","c":"Nach einem kurzen, betonten Vokal steht ein Doppelkonsonant.","w":["Nach einem langen Vokal wird der folgende Konsonant immer verdoppelt.","Doppelkonsonanten stehen nur am Wortanfang.","Doppelkonsonanten zeigen an, dass das Wort ein Fremdwort ist."],"par":"§ 2","id":"be1592501"},{"cat":"rs","lv":2,"q":"Welches Wort gehört in die Lücke? „Ihr ___ herzlich zu unserem Fest eingeladen.“","e":"„seid“ ist die Form von „sein“ (ihr seid). „seit“ mit „t“ bezeichnet den Beginn eines Zeitraums (seit gestern).","tag":"Gleichklang","c":"seid","w":["seit","seidt","seitt"],"id":"b38d93b9c"},{"cat":"rs","lv":2,"q":"Tippe das ganze Wort ein (z oder tz einsetzen): Zum Würzen der Suppe nimmt man Sal_.","e":"Nach einem Konsonanten (l) steht nur „z“: Salz.","tag":"tz/z","t":"text","ans":["Salz"],"id":"b9814efe4"},{"cat":"rs","lv":3,"q":"Welche Schreibweise ist richtig? „Im Sommer sitzen wir abends auf der ___.“","e":"Das Fremdwort „Terrasse“ hat ein doppeltes „r“ und ein doppeltes „s“.","tag":"Fremdwörter","c":"Terrasse","w":["Terasse","Terrase","Terraße"],"id":"b7a225bde"},{"cat":"rs","lv":3,"q":"Welches Wort ist in diesem Satz falsch geschrieben? „Nach langem Hin und her einigten sie sich auf einen Termin.“","e":"„das Hin und Her“ ist ein Nomen aus zwei Adverbien; beide Wörter schreibt man groß, „und“ bleibt klein.","tag":"Substantivierung","c":"her","w":["langem","einigten","Termin"],"par":"§ 57","id":"ba023ca3f"},{"cat":"rs","lv":3,"q":"Welche Wortreihe enthält nur richtig geschriebene Wörter?","e":"Schloss und Flüsse haben einen kurzen Vokal und deshalb „ss“. Fuß hat einen langen Vokal und deshalb „ß“.","tag":"ss/ß","c":"Schloss, Fuß, Flüsse","w":["Schloß, Fuß, Flüsse","Schloss, Fuss, Flüsse","Schloss, Fuß, Flüße"],"id":"bd63d019a"},{"cat":"rs","lv":3,"q":"Welcher Satz mit wörtlicher Rede ist richtig geschrieben und gesetzt?","e":"Folgt dem Redesatz ein Begleitsatz, setzt man nach dem schließenden Anführungszeichen ein Komma; der Schlusspunkt des Redesatzes entfällt.","tag":"Zeichensetzung","c":"„Ich komme morgen“, sagte sie.","w":["„Ich komme morgen.“, sagte sie.","„Ich komme morgen“ sagte sie.","„Ich komme morgen“. Sagte sie."],"par":"§ 79","id":"b48ba8d1e"},{"cat":"rs","lv":3,"q":"Welche Reihe von Wörtern mit „ä“ und „äu“ ist durchgehend richtig geschrieben?","e":"Alle vier Wörter lassen sich von Wörtern mit „au“ ableiten (Haus, Baum, Bau, Traum); deshalb schreibt man „äu“.","tag":"äu/eu","c":"Häuser, Bäume, Gebäude, Träume","w":["Heuser, Bäume, Gebäude, Träume","Häuser, Beume, Gebäude, Träume","Häuser, Bäume, Gebeude, Träume"],"par":"§ 16","id":"b333e4c1d"},{"cat":"rs","lv":2,"q":"Tippe das ganze Wort ein (k oder ck einsetzen): Der Mensch hat Kopf, Arme, Beine und einen Rü_en.","e":"Nach kurz gesprochenem Vokal steht „ck“: Rücken.","tag":"ck/k","t":"text","ans":["Rücken"],"par":"§ 3","id":"b6abc118f"},{"cat":"rs","lv":2,"q":"Welches Wort ist in diesem Satz falsch geschrieben? „Am Samstag besuchen wir das grazer Rathaus.“","e":"Von Ortsnamen abgeleitete Wörter auf -er schreibt man immer groß: das Grazer Rathaus.","tag":"Eigennamen","c":"grazer","w":["Samstag","besuchen","Rathaus"],"par":"§ 61","id":"bffbeda0d"},{"cat":"rs","lv":2,"q":"Welches Wort ist falsch geschrieben?","e":"„Kaffee“ endet auf „ee“. Armee, Allee und Fee sind mit dem langen „ee“ richtig geschrieben.","tag":"Doppelvokal","c":"Kaffe","w":["Armee","Allee","Fee"],"par":"§ 9","id":"bcc66cc31"},{"cat":"rs","lv":2,"q":"Welche Schreibweise ist richtig? „Das kann jeder ___ Mitarbeiter erledigen.“","e":"Verbindungen aus einem einzelnen Buchstaben und einem Adjektiv schreibt man mit Bindestrich und klein: x-beliebig.","tag":"Bindestrich","c":"x-beliebige","w":["xbeliebige","x beliebige","X.beliebige"],"par":"§ 40","id":"b780459cd"},{"cat":"rs","lv":2,"q":"Wie schreibt man richtig? „Das Training soll am Freitag ___.“","e":"„stattfinden“ ist ein Verb mit dem festen Bestandteil „statt“ und wird in der Grundform zusammengeschrieben.","tag":"Getrennt- und Zusammenschreibung","c":"stattfinden","w":["statt finden","statt-finden","stadtfinden"],"par":"§ 34","id":"bc7c203ff"},{"cat":"rs","lv":3,"q":"Welche Schreibweise ist richtig? „Der Bericht beschreibt das wirtschaftliche ___.“","e":"Mehrteilige Bestimmungswörter wie „Nord-Süd“ werden mit dem Grundwort durch Bindestriche verbunden (Durchkopplung): Nord-Süd-Gefälle.","tag":"Bindestrich","c":"Nord-Süd-Gefälle","w":["Nord Süd Gefälle","Nord-Südgefälle","Nordsüd-Gefälle"],"par":"§ 44","id":"b65ff3457"},{"cat":"rs","lv":2,"q":"Tippe die Mehrzahl von „Zaun“ ein.","e":"Die Mehrzahl gehört zu „Zaun“; deshalb schreibt man „äu“: Zäune.","tag":"äu/eu","t":"text","ans":["Zäune"],"par":"§ 16","id":"b373a05c1"},{"cat":"rs","lv":3,"q":"Welcher Satz verwendet „wider“ und „wieder“ richtig?","e":"„wider“ bedeutet „gegen“ (wider besseres Wissen). „wieder“ bedeutet „erneut“ und wird mit „ie“ geschrieben.","tag":"Gleichklang","c":"Er hat sich wider besseres Wissen wieder auf den Weg gemacht.","w":["Er hat sich wieder besseres Wissen wider auf den Weg gemacht.","Er hat sich wider besseres Wissen wider auf den Weg gemacht.","Er hat sich wieder besseres Wissen wieder auf den Weg gemacht."],"par":"§ 10","id":"b1510d573"},{"cat":"rs","lv":2,"q":"Tippe das Verb richtig ein (3. Person Einzahl, Grundform: wohnen): „Er wont seit drei Jahren in Graz.“","e":"Das Verb „wohnen“ wird mit Dehnungs-h geschrieben: er wohnt.","tag":"Dehnung","t":"text","ans":["wohnt"],"par":"§ 8","id":"be786192f"},{"cat":"rs","lv":3,"q":"Welches Wort ist in diesem Satz falsch geschrieben? „Das ganze war ihm ein Rätsel, und er sagte nichts Genaues dazu.“","e":"„das Ganze“ ist ein substantiviertes Adjektiv mit Artikel und wird großgeschrieben. „nichts Genaues“ ist bereits richtig geschrieben.","tag":"Substantivierung","c":"ganze","w":["Rätsel","sagte","dazu"],"par":"§ 57","id":"bdd82ffd0"},{"cat":"rs","lv":3,"q":"Tippe das Nomen richtig ein: „Existens“ (das Dasein, das Bestehen)","e":"Das Fremdwort „Existenz“ endet auf „-enz“, nicht auf „-ens“.","tag":"Fremdwörter","t":"text","ans":["Existenz"],"id":"bf57bcc29"},{"cat":"rs","lv":2,"q":"Welches Wort ist in diesem Satz falsch geschrieben? „Zum Geburtstag wünschten wir ihm alles gute und viel Glück.“","e":"Nach „alles“ wird ein Adjektiv großgeschrieben: alles Gute.","tag":"Substantivierung","c":"gute","w":["Geburtstag","wünschten","Glück"],"par":"§ 57","id":"b4f04b771"},{"cat":"rs","lv":3,"q":"Tippe die Mehrzahl von „Kenntnis“ ein.","e":"Die Nachsilbe -nis verdoppelt das „s“ in der Mehrzahl: Kenntnisse.","tag":"s-Laute","t":"text","ans":["Kenntnisse"],"par":"§ 5","id":"b27e28cfa"},{"cat":"rs","lv":3,"q":"Welche Wortreihe ist richtig geschrieben und setzt „tz“ und „z“ an den richtigen Stellen?","e":"„tz“ steht nur nach kurzem Vokal (Katze, Witz). Nach Zwielaut (Kreuz) und nach Konsonant (Pilz) steht „z“.","tag":"tz/z","c":"Katze, Witz, Kreuz, Pilz","w":["Katze, Witz, Kreutz, Pilz","Katze, Wiz, Kreuz, Pilz","Katze, Witz, Kreuz, Piltz"],"par":"§ 3","id":"b12ae3356"},{"cat":"rs","lv":3,"q":"Tippe das fehlende Wort ein (Präteritum von „beißen“): „Der Hund ___ herzhaft in den Knochen.“","e":"Im Präteritum wird der Vokal kurz gesprochen, deshalb schreibt man „ss“: er biss.","tag":"ss/ß","t":"text","ans":["biss"],"id":"bbcd46235"},{"cat":"rs","lv":2,"q":"Wie schreibt man richtig? „Das hat mir ___ gefallen.“","e":"„gar nicht“ schreibt man in zwei Wörtern: „gar“ verstärkt das Wort „nicht“.","tag":"Getrennt- und Zusammenschreibung","c":"gar nicht","w":["garnicht","gar-nicht","gar nichts"],"par":"§ 39","id":"bef8d872a"},{"cat":"rs","lv":3,"q":"Schreibe den Ausdruck richtig (klein, in der richtigen Zahl von Wörtern): ohnedass","e":"„ohne dass“ besteht aus der Präposition „ohne“ und der Konjunktion „dass“ und wird getrennt geschrieben; „dass“ hat zwei „s“.","tag":"Getrennt- und Zusammenschreibung","t":"text","ans":["ohne dass"],"par":"§ 39","id":"b03776a30"},{"cat":"rs","lv":1,"q":"Welche Schreibweise ist richtig? Gemeint ist die Glasfläche, in der man sich betrachtet.","e":"Das lange i wird in „Spiegel“ als „ie“ geschrieben, am Ende steht nur ein „l“.","tag":"Dehnung","c":"Spiegel","w":["Spigel","Spiehgel","Spiegell"],"par":"§ 1","id":"be80cc0ad"},{"cat":"rs","lv":1,"q":"Welche Zeichensetzung ist bei dieser Aufzählung richtig?","e":"Gleichrangige Wörter einer Aufzählung trennt man durch Kommas; vor „und“ steht kein Komma.","tag":"Zeichensetzung","c":"Zum Frühstück gab es Brot, Butter, Honig und Kaffee.","w":["Zum Frühstück gab es Brot Butter Honig und Kaffee.","Zum Frühstück gab es Brot, Butter, Honig, und Kaffee.","Zum Frühstück gab es Brot, Butter Honig und Kaffee."],"id":"b98f6c32c"},{"cat":"rs","lv":1,"q":"In welchem Satz ist „dabei sein“ richtig geschrieben?","e":"Verbindungen mit dem Verb „sein“ werden getrennt geschrieben: dabei sein, da sein, weg sein.","tag":"Getrennt- und Zusammenschreibung","c":"Wir werden bei der Prüfung dabei sein.","w":["Wir werden bei der Prüfung dabeisein.","Wir werden bei der Prüfung dabei-sein.","Wir werden bei der Prüfung da bei sein."],"par":"§ 35","id":"b426d62e7"},{"cat":"rs","lv":1,"q":"Wie schreibt man das Wort für ein Lokal, in dem Speisen serviert werden, richtig?","e":"Das französische Lehnwort wird mit „au“ und der Endung „-ant“ geschrieben: Restaurant.","tag":"Fremdwörter","c":"Restaurant","w":["Restorant","Restaurent","Restaurannt"],"par":"§ 20","id":"bc60f9a3e"},{"cat":"rs","lv":1,"q":"Im folgenden Satz steckt genau ein Rechtschreibfehler. In welchem Wort? „Im Herbst fallen die Blätter von den Beumen.“","e":"Das Wort gehört zu „Baum“, daher schreibt man „Bäumen“ mit ä (Stammprinzip).","tag":"Fehlersuche","c":"Beumen","w":["Herbst","Blätter","fallen"],"par":"§ 16","id":"b4e359019"},{"cat":"rs","lv":1,"q":"Welche Schreibweise des ersten Monats im Jahr ist in Österreich gebräuchlich?","e":"In Österreich heißt der erste Monat des Jahres „Jänner“, mit ä und doppeltem „n“.","tag":"Österreichisches Deutsch","c":"Jänner","w":["Jenner","Jaenner","Jännar"],"id":"b4b63741e"},{"cat":"rs","lv":1,"q":"Welches Wort passt richtig geschrieben in die Lücke? „Im Meer schwamm ein riesiger ___.“","e":"Der Meeressäuger heißt „Wal“ ohne h. „Wahl“ bedeutet Abstimmung oder Entscheidung, „Wall“ ist ein Erdwall.","tag":"Lückentext","c":"Wal","w":["Wahl","Wall","Whal"],"id":"bdaa60b03"},{"cat":"rs","lv":1,"q":"Welche Schreibweise ist richtig? „Bei der Arbeit zählt ___ die Sicherheit.“","e":"„Vor allem“ ist eine feste Wortgruppe und wird getrennt geschrieben.","tag":"Getrennt- und Zusammenschreibung","c":"vor allem","w":["vorallem","vor-allem","voralem"],"par":"§ 39","id":"be07b9a56"},{"cat":"rs","lv":2,"q":"Welche Schreibweise des Wortes für abgleitende Schneemassen im Gebirge ist richtig?","e":"Fremdwörter auf „-ine“ wie Lawine, Maschine oder Kabine schreibt man mit einfachem „i“, nicht mit „ie“ und nicht mit „ih“.","tag":"Dehnung","c":"Lawine","w":["Lawiene","Lavine","Lawihne"],"id":"b6f1570a3"},{"cat":"rs","lv":2,"q":"Welche Schreibweise ist richtig?","e":"Das französische Lehnwort endet auf „-ieur“: Ingenieur.","tag":"Fremdwörter","c":"Ingenieur","w":["Ingeneur","Ingenieuer","Ingenjeur"],"id":"b1a884850"},{"cat":"rs","lv":2,"q":"Welches Wort passt richtig geschrieben in die Lücke? „Der Gitarrist spannte eine neue ___ auf.“","e":"Die Saite eines Instruments schreibt man mit „ai“. „Seite“ mit „ei“ bedeutet Buchseite oder Körperseite.","tag":"Lückentext","c":"Saite","w":["Seite","Saitte","Seithe"],"par":"§ 18","id":"ba4eefb47"},{"cat":"rs","lv":1,"q":"Welche Zeichensetzung ist bei diesem Satz mit „weil“ richtig?","e":"Der Nebensatz mit „weil“ wird durch ein Komma vom Hauptsatz getrennt; das Komma steht vor „weil“.","tag":"Zeichensetzung","c":"Ich bleibe zu Hause, weil ich krank bin.","w":["Ich bleibe zu Hause weil ich krank bin.","Ich bleibe, zu Hause weil ich krank bin.","Ich bleibe zu Hause weil, ich krank bin."],"par":"§ 73","id":"bd4d37128"},{"cat":"rs","lv":2,"q":"Schreibe das Wort richtig: Marile","e":"Die österreichische Bezeichnung für die Aprikose wird „Marille“ geschrieben, mit doppeltem „l“.","tag":"Österreichisches Deutsch","t":"text","ans":["Marille"],"id":"b64d0d08b"},{"cat":"rs","lv":1,"q":"Schreibe das Wort richtig: Maschiene","e":"Fremdwörter auf „-ine“ wie Maschine, Lawine oder Kabine werden mit einfachem „i“ geschrieben, nicht mit „ie“.","tag":"Dehnung","t":"text","ans":["Maschine"],"par":"§ 1","id":"ba6f61a52"},{"cat":"rs","lv":1,"q":"Welche Schreibweise ist richtig? „Das war ___ schwer.“","e":"„Gar nicht“ besteht aus zwei Wörtern und wird getrennt geschrieben.","tag":"Getrennt- und Zusammenschreibung","c":"gar nicht","w":["garnicht","gahr nicht","gar-nicht"],"par":"§ 39","id":"b3452578d"},{"cat":"rs","lv":2,"q":"Welcher Satz mit „aber“ ist richtig gesetzt?","e":"Sätze, die mit „aber“, „sondern“ oder „doch“ verbunden sind, werden durch ein Komma getrennt; es steht vor „aber“.","tag":"Zeichensetzung","c":"Ich wollte ins Kino gehen, aber der Film war schon ausverkauft.","w":["Ich wollte ins Kino gehen aber, der Film war schon ausverkauft.","Ich wollte ins Kino, gehen aber der Film war schon ausverkauft.","Ich wollte ins Kino gehen aber der Film war schon ausverkauft."],"par":"§ 71","id":"b546961d9"},{"cat":"rs","lv":3,"q":"Welche Schreibweise des Wortes für die Stimmung in einem Raum ist richtig?","e":"Das Wort kommt aus dem Griechischen (atmós „Dampf“, sphaira „Kugel“) und wird mit „ph“ und der Endung „-äre“ geschrieben.","tag":"Fremdwörter","c":"Atmosphäre","w":["Atmospäre","Athmosphäre","Atmosphere"],"par":"§ 32","id":"bf903cd9f"},{"cat":"rs","lv":2,"q":"Im folgenden Satz steckt genau ein Rechtschreibfehler. In welchem Wort? „Der Chirurk operierte den Patienten zwei Stunden lang.“","e":"Richtig heißt es „Chirurg“: Das griechische Fremdwort endet auf „-g“ (Mehrzahl: die Chirurgen).","tag":"Fehlersuche","c":"Chirurk","w":["operierte","Patienten","Stunden"],"par":"§ 23","id":"bc0aafb56"},{"cat":"rs","lv":2,"q":"Welche Schreibweise ist richtig? „Alle Schüler sollen an der Übung ___.“","e":"„Teilnehmen“ wird in der Grundform zusammengeschrieben (im Hauptsatz getrennt: „Er nimmt teil.“).","tag":"Getrennt- und Zusammenschreibung","c":"teilnehmen","w":["teil nehmen","teilnemen","teilnehmmen"],"par":"§ 34","id":"bb8df2106"},{"cat":"rs","lv":1,"q":"Welche Schreibweise ist richtig? Gemeint ist ein Sitzmöbel mit Lehne.","e":"Das lange u wird in „Stuhl“ mit einem Dehnungs-h geschrieben.","tag":"Dehnung","c":"Stuhl","w":["Stul","Stuhll","Stuul"],"par":"§ 8","id":"bdcd9541e"},{"cat":"rs","lv":1,"q":"Bei welchem Satz mit vorangestelltem Nebensatz stehen die Kommas richtig?","e":"Ein vorangestellter Nebensatz wird durch ein Komma vom Hauptsatz getrennt.","tag":"Zeichensetzung","c":"Als wir ankamen, regnete es schon.","w":["Als wir ankamen regnete es schon.","Als, wir ankamen regnete es schon.","Als wir ankamen regnete, es schon."],"par":"§ 73","id":"b8d425c71"},{"cat":"rs","lv":2,"q":"Setze „Rat“ oder „Rad“ richtig ein: Bei Problemen suche ich ___ bei meinen Eltern.","e":"Man sucht „Rat“ (Hilfe, Ratschlag) mit „t“. „Rad“ mit „d“ ist das Fahrrad oder Zahnrad.","tag":"Lückentext","t":"text","ans":["Rat"],"par":"§ 23","id":"b29210343"},{"cat":"rs","lv":1,"q":"Welche Schreibweise des österreichischen Wortes für „in diesem Jahr“ ist richtig?","e":"„Heuer“ bedeutet in Österreich „in diesem Jahr“ und wird mit „eu“ geschrieben.","tag":"Österreichisches Deutsch","c":"heuer","w":["heier","heuher","hoyer"],"id":"b803517fd"},{"cat":"rs","lv":2,"q":"Welche Schreibweise ist richtig? Gemeint ist der Bruder von Mutter oder Vater.","e":"Nach einem Konsonanten (hier „n“) steht „k“, nicht „ck“: Onkel.","tag":"Schärfung","c":"Onkel","w":["Onckel","Onkell","Ongkel"],"id":"b5d7947c9"},{"cat":"rs","lv":2,"q":"Welche Schreibweise ist richtig? „Wer ist ___ im Büro gewesen?“","e":"„Zuletzt“ ist ein Adverb und wird in einem Wort geschrieben. Nur die feste Wendung „zu guter Letzt“ schreibt man getrennt.","tag":"Getrennt- und Zusammenschreibung","c":"zuletzt","w":["zu letzt","zu-letzt","zulezt"],"par":"§ 39","id":"b79905a5a"},{"cat":"rs","lv":3,"q":"Welche Schreibung der wörtlichen Rede mit nachgestelltem Begleitsatz ist richtig?","e":"Nach der wörtlichen Rede steht ein Komma nach den Anführungszeichen; ein Punkt am Ende der Rede entfällt.","tag":"Zeichensetzung","c":"„Ich komme morgen“, sagte Anna.","w":["„Ich komme morgen“ sagte Anna.","„Ich komme morgen,“ sagte Anna.","„Ich komme morgen.“, sagte Anna."],"par":"§ 79","id":"bc9595494"},{"cat":"rs","lv":2,"q":"Welche Schreibweise des Wortes für ein großes Musikensemble ist richtig?","e":"Das griechische Lehnwort wird mit „ch“ geschrieben, das wie „k“ gesprochen wird: Orchester.","tag":"Fremdwörter","c":"Orchester","w":["Orkester","Orchesta","Orchestar"],"par":"§ 32","id":"b5545a770"},{"cat":"rs","lv":3,"q":"Welches Wort passt richtig geschrieben in die Lücke? „Vor Müdigkeit fielen ihm fast die ___ zu.“","e":"Gemeint sind die Augenlider: Einzahl „das Lid“, Mehrzahl „die Lider“. „Lieder“ sind Gesänge.","tag":"Lückentext","c":"Lider","w":["Lieder","Liedr","Lidder"],"par":"§ 10","id":"bf8d4c5dc"},{"cat":"rs","lv":3,"q":"Welche Schreibweise ist richtig? Gemeint ist ein Büschel zusammenhängender Haare.","e":"Das Wort wird mit „äh“ geschrieben (Dehnungs-h nach dem langen ä): Strähne.","tag":"Dehnung","c":"Strähne","w":["Sträne","Strehne","Strähhne"],"par":"§ 8","id":"b326d39db"},{"cat":"rs","lv":3,"q":"Welcher Satz mit einem Vergleichssatz („als …“) ist richtig gesetzt?","e":"Ein Vergleichssatz mit eigenem Verb („ich gedacht hatte“) ist ein Nebensatz und wird durch ein Komma abgetrennt.","tag":"Zeichensetzung","c":"Der Weg war länger, als ich gedacht hatte.","w":["Der Weg war länger als, ich gedacht hatte.","Der Weg war länger als ich gedacht hatte.","Der Weg war, länger als ich gedacht hatte."],"par":"§ 73","id":"bc0e40a0f"},{"cat":"rs","lv":3,"q":"Welche Schreibweise des Wortes für ein großes Unglück ist richtig?","e":"Das griechische Fremdwort wird mit „ph“ geschrieben und endet auf „-phe“: Katastrophe.","tag":"Fremdwörter","c":"Katastrophe","w":["Katastrope","Katasthrophe","Katastrohpe"],"par":"§ 32","id":"b70e4306c"},{"cat":"rs","lv":3,"q":"Welche Schreibweise ist richtig? „Die Brücke wird dem Hochwasser ___.“","e":"„Standhalten“ gehört zu den Verben, die in der Grundform zusammengeschrieben werden (im Hauptsatz getrennt: „Sie hält stand.“).","tag":"Getrennt- und Zusammenschreibung","c":"standhalten","w":["stand halten","stand-halten","stanthalten"],"par":"§ 34","id":"bab6bee7c"},{"cat":"rs","lv":2,"q":"Welches Wort ist falsch geschrieben? „Die Polizisten haben den Reuber nach kurzer Verfolgung gefasst.“","e":"Das Wort gehört zu „Raub“, daher schreibt man „Räuber“ mit äu (Stammprinzip).","tag":"Fehlersuche","c":"Reuber","w":["Polizisten","Verfolgung","gefasst"],"par":"§ 16","id":"b42d0d8ed"},{"cat":"rs","lv":2,"q":"Welcher Satz mit einem Einschub ist richtig gesetzt?","e":"Eine nachgestellte Erklärung (Apposition) wird auf beiden Seiten durch Kommas vom Satz abgetrennt.","tag":"Zeichensetzung","c":"Graz, die Hauptstadt der Steiermark, liegt an der Mur.","w":["Graz, die Hauptstadt der Steiermark liegt an der Mur.","Graz die Hauptstadt der Steiermark, liegt an der Mur.","Graz die Hauptstadt der Steiermark liegt an der Mur."],"par":"§ 72","id":"ba796a75b"},{"cat":"rs","lv":1,"q":"Welche Schreibweise ist richtig? Gemeint ist das gemahlene Getreide, aus dem man Brot backt.","e":"Das lange e wird in „Mehl“ mit Dehnungs-h geschrieben.","tag":"Dehnung","c":"Mehl","w":["Mel","Mehll","Meel"],"par":"§ 8","id":"bfb1e50e5"},{"cat":"rs","lv":2,"q":"Welche Wörter gehören der Reihe nach in die Lücken? „Ihr ___ schon ___ einer Stunde hier.“","e":"„Ihr seid“ ist die Form von „sein“; „seit einer Stunde“ ist eine Zeitangabe mit dem Verhältniswort „seit“.","tag":"Lückentext","c":"seid – seit","w":["seit – seid","seid – seid","seit – seit"],"id":"b7b9e5170"},{"cat":"rs","lv":2,"q":"Welche Schreibweise ist richtig? „Die Kollegen arbeiten gut ___.“","e":"„Miteinander“ ist ein Adverb und wird in einem Wort geschrieben.","tag":"Getrennt- und Zusammenschreibung","c":"miteinander","w":["mit einander","mit-einander","miteinnander"],"id":"b65f5ebd0"},{"cat":"rs","lv":2,"q":"Welche Schreibweise der österreichischen Bezeichnung für die Tomate ist richtig?","e":"Die österreichische Bezeichnung „Paradeiser“ wird mit „ei“ und einfachem „s“ geschrieben.","tag":"Österreichisches Deutsch","c":"Paradeiser","w":["Paradaiser","Paradeyser","Paradeisser"],"id":"bc753ad34"},{"cat":"rs","lv":3,"q":"Welcher Satz mit gleichrangigen Eigenschaftswörtern ist richtig gesetzt?","e":"Gleichrangige Eigenschaftswörter trennt man durch Kommas; vor „und“ steht kein Komma.","tag":"Zeichensetzung","c":"Er war ein kluger, freundlicher und hilfsbereiter Kollege.","w":["Er war ein kluger freundlicher und hilfsbereiter Kollege.","Er war ein kluger, freundlicher, und hilfsbereiter Kollege.","Er war ein kluger, freundlicher und, hilfsbereiter Kollege."],"par":"§ 70","id":"b555f99eb"},{"cat":"rs","lv":1,"q":"Schreibe das Wort richtig: Apoteke","e":"Das griechische Lehnwort wird mit „th“ geschrieben: Apotheke.","tag":"Fremdwörter","t":"text","ans":["Apotheke"],"par":"§ 32","id":"bbd06e0af"},{"cat":"rs","lv":2,"q":"Welches Wort ist in diesem Satz falsch geschrieben? „Der Komissar befragte mehrere Zeugen im Büro.“","e":"Richtig heißt es „Kommissar“ mit doppeltem „m“ (französisch commissaire).","tag":"Fehlersuche","c":"Komissar","w":["befragte","mehrere","Büro"],"id":"b7530ad25"},{"cat":"rs","lv":2,"q":"Wie schreibt man das Wort für eine Kopfbedeckung aus Wolle richtig?","e":"Nach kurzem Vokal steht für den Laut „ts“ die Schreibung „tz“: Mütze.","tag":"Schärfung","c":"Mütze","w":["Müze","Mütse","Mützze"],"par":"§ 3","id":"b69d2a50b"},{"cat":"rs","lv":1,"q":"Welcher Satz mit „sondern“ ist richtig gesetzt?","e":"Vor „sondern“ steht immer ein Komma.","tag":"Zeichensetzung","c":"Er kam nicht mit dem Bus, sondern mit dem Fahrrad.","w":["Er kam nicht mit dem Bus sondern mit dem Fahrrad.","Er kam nicht, mit dem Bus sondern mit dem Fahrrad.","Er kam nicht mit dem Bus sondern, mit dem Fahrrad."],"par":"§ 71","id":"bfa71f7c3"},{"cat":"rs","lv":1,"q":"Welches Wort passt richtig geschrieben in die Lücke? „Die Kühe grasen auf der ___.“","e":"Das lange i wird in „Wiese“ als „ie“ geschrieben.","tag":"Lückentext","c":"Wiese","w":["Wise","Wihse","Wiehse"],"par":"§ 1","id":"bfac46c97"},{"cat":"rs","lv":1,"q":"Welche Schreibweise ist richtig? „Wir treffen uns ___ im Park.“","e":"„Heute Abend“ besteht aus zwei Wörtern: Zeitangaben aus „heute“, „gestern“ oder „morgen“ und einer Tageszeit schreibt man getrennt.","tag":"Getrennt- und Zusammenschreibung","c":"heute Abend","w":["heuteabend","heute-Abend","heutabend"],"par":"§ 55","id":"b9e1ae9ce"},{"cat":"rs","lv":3,"q":"Welches Wort im Satz ist falsch geschrieben? „Die Prüfung findet vorraussichtlich im März statt.“","e":"Richtig heißt es „voraussichtlich“: Das Wort gehört zu „voraus“ und „sehen“, nach „vor“ steht nur ein „r“.","tag":"Fehlersuche","c":"vorraussichtlich","w":["Prüfung","März","statt"],"id":"bedb33a59"},{"cat":"rs","lv":3,"q":"Welche Schreibweise des Wortes für die Redekunst ist richtig?","e":"Das griechische Fremdwort beginnt mit „rh“ und hat danach kein weiteres „h“: Rhetorik.","tag":"Fremdwörter","c":"Rhetorik","w":["Rethorik","Rhetorick","Rhethorik"],"par":"§ 32","id":"bee220120"},{"cat":"rs","lv":2,"q":"Wie schreibt man das stachelige Tier, das Winterschlaf hält, richtig?","e":"Das lange i wird in „Igel“ ohne Zusatz geschrieben, also weder „ie“ noch „ih“.","tag":"Dehnung","c":"Igel","w":["Ihgel","Iegel","Igell"],"par":"§ 10","id":"bf8f14b37"},{"cat":"rs","lv":3,"q":"Welche Schreibweise der österreichischen Bezeichnung für Hackfleisch ist richtig?","e":"„Faschiertes“ stammt von französisch „farcir“ (füllen, zerkleinern) und wird mit „sch“ und „ie“ geschrieben.","tag":"Österreichisches Deutsch","c":"Faschiertes","w":["Faschirtes","Fachiertes","Faschiehrtes"],"id":"b759e5db0"},{"cat":"rs","lv":1,"q":"Welche Schreibweise ist richtig? „Es regnet, ___ bleiben wir zu Hause.“","e":"„Deswegen“ ist ein Adverb und wird in einem Wort geschrieben; „wegen“ hat ein „e“.","tag":"Getrennt- und Zusammenschreibung","c":"deswegen","w":["des wegen","deswägen","deswegenn"],"par":"§ 39","id":"b9d56be9e"},{"cat":"rs","lv":2,"q":"Schreibe das Wort richtig: Bibliotek","e":"Das griechische Lehnwort wird mit „th“ geschrieben: Bibliothek.","tag":"Fremdwörter","t":"text","ans":["Bibliothek"],"par":"§ 32","id":"b5edbf87d"},{"cat":"rs","lv":2,"q":"Welcher Satz mit „um … zu“ ist richtig gesetzt?","e":"Eine Infinitivgruppe mit „um“ wird immer durch ein Komma vom Hauptsatz getrennt.","tag":"Zeichensetzung","c":"Er ging zum Bäcker, um frisches Brot zu kaufen.","w":["Er ging zum Bäcker um, frisches Brot zu kaufen.","Er ging, zum Bäcker um frisches Brot zu kaufen.","Er ging zum Bäcker um frisches Brot zu kaufen."],"par":"§ 73","id":"bd594a553"},{"cat":"rs","lv":1,"q":"Wie schreibt man die erhöhte Körpertemperatur bei einer Krankheit richtig?","e":"Das lange i wird in „Fieber“ als „ie“ geschrieben.","tag":"Dehnung","c":"Fieber","w":["Fiber","Fihber","Fiebber"],"par":"§ 1","id":"bd629b28c"},{"cat":"rs","lv":2,"q":"Im folgenden Satz steckt ein Fehler. In welchem Wort? „Der Autofahrer beachtete alle Verkehrzeichen auf der Strecke.“","e":"Richtig heißt es „Verkehrszeichen“: Zwischen „Verkehr“ und „Zeichen“ steht ein Fugen-s.","tag":"Fehlersuche","c":"Verkehrzeichen","w":["Autofahrer","beachtete","Strecke"],"id":"bdf253534"},{"cat":"rs","lv":3,"q":"Welche Wörter gehören der Reihe nach in die Lücken? „Er handelte ___ besseres Wissen und musste deshalb ___ von vorn beginnen.“","e":"„Wider besseres Wissen“ bedeutet „gegen besseres Wissen“; „wieder“ bedeutet „noch einmal“.","tag":"Lückentext","c":"wider – wieder","w":["wieder – wider","wider – wider","wieder – wieder"],"par":"§ 10","id":"b850a2d2b"},{"cat":"rs","lv":3,"q":"Wie schreibt man „Auto fahren“, wenn daraus ein Hauptwort wird, zum Beispiel nach „beim“?","e":"Wird das Verb zum Hauptwort (Nominalisierung), schreibt man es mit dem Hauptwort zusammen und groß: das Autofahren, beim Autofahren.","tag":"Getrennt- und Zusammenschreibung","c":"Zusammen und groß: beim Autofahren","w":["Getrennt, nur das erste Wort groß: beim Auto fahren","Getrennt, beide Wörter groß: beim Auto Fahren","Getrennt, beide Wörter klein: beim auto fahren"],"par":"§ 37","id":"ba5b2e7a0"},{"cat":"rs","lv":3,"q":"Wie viele Kommas fehlen in diesem Satz? „Ich weiß dass du müde bist weil du lange gearbeitet hast.“","e":"Richtig: „Ich weiß, dass du müde bist, weil du lange gearbeitet hast.“ Jeder Nebensatz wird durch ein Komma abgetrennt.","tag":"Zeichensetzung","c":"Zwei","w":["Eines","Drei","Keines"],"par":"§ 73","id":"b4311f9b3"},{"cat":"rs","lv":2,"q":"Welche Schreibweise ist richtig? Gemeint ist der vierte Fall (Wen-Fall).","e":"Das lateinische Fremdwort wird mit „kk“, einem „s“ und der Endung „-iv“ geschrieben: Akkusativ.","tag":"Fremdwörter","c":"Akkusativ","w":["Akusativ","Akkuzativ","Akkusatief"],"id":"b4b666300"},{"cat":"rs","lv":2,"q":"Welche Schreibweise der österreichischen Bezeichnung für Kartoffeln (Mehrzahl) ist richtig?","e":"Das Wort gehört zu „Apfel“ (Mehrzahl „Äpfel“); daher schreibt man „Erdäpfel“ mit ä (Stammprinzip).","tag":"Österreichisches Deutsch","c":"Erdäpfel","w":["Erdepfel","Erdäpfell","Ärdäpfel"],"id":"bc2245517"},{"cat":"rs","lv":2,"q":"Welches Wort passt richtig geschrieben in die Lücke? „Im Herbst verliert die ___ ihre Nadeln.“","e":"Der Nadelbaum, der im Herbst die Nadeln abwirft, heißt „Lärche“ mit ä; die „Lerche“ mit e ist ein Singvogel.","tag":"Lückentext","c":"Lärche","w":["Lerche","Lärsche","Lörche"],"par":"§ 14","id":"b5621e30c"},{"cat":"rs","lv":3,"q":"Finde den Fehler: Welches Wort ist falsch geschrieben? „Die Gemeinde stellte dem Veranstalter eine Lizens für den Markt aus.“","e":"Richtig heißt es „Lizenz“ mit „z“ am Ende (lateinisch licentia).","tag":"Fehlersuche","c":"Lizens","w":["Gemeinde","Veranstalter","Markt"],"id":"b5895c18a"},{"cat":"rs","lv":1,"q":"Schreibe das Wort richtig: Kaze","e":"Nach kurzem Vokal schreibt man den Laut „ts“ als „tz“: Katze.","tag":"Schärfung","t":"text","ans":["Katze"],"par":"§ 3","id":"bad333265"},{"cat":"rs","lv":1,"q":"Welche Schreibweise ist richtig? „___ ist es dunkel geworden.“","e":"„Inzwischen“ ist ein Adverb und wird in einem Wort geschrieben.","tag":"Getrennt- und Zusammenschreibung","c":"Inzwischen","w":["In zwischen","Inzwichen","In-zwischen"],"id":"bbf690f51"},{"cat":"rs","lv":3,"q":"Welcher Satz mit zwei gleichrangigen Nebensätzen ist richtig gesetzt?","e":"Gleichrangige Nebensätze, die mit „und“ verbunden sind, werden nicht durch ein Komma getrennt; der erste Nebensatz wird aber vom Hauptsatz abgetrennt.","tag":"Zeichensetzung","c":"Wir wissen, dass es regnet und dass die Straßen nass sind.","w":["Wir wissen, dass es regnet, und dass die Straßen nass sind.","Wir wissen dass es regnet und dass die Straßen nass sind.","Wir wissen, dass es regnet und, dass die Straßen nass sind."],"id":"b49dd17d7"},{"cat":"rs","lv":3,"q":"Welche Schreibweise der österreichischen Bezeichnung für den dünnen, gefüllten Eierkuchen ist richtig?","e":"Das Wort wird mit „tsch“ und „k“ geschrieben: Palatschinke (Mehrzahl: Palatschinken).","tag":"Österreichisches Deutsch","c":"Palatschinke","w":["Palatschinge","Palaczinke","Palatchinke"],"id":"bcadfea61"},{"cat":"rs","lv":2,"q":"Schreibe das Wort richtig (zusammen und klein): zu mindest","e":"„Zumindest“ ist ein Adverb und wird in einem Wort geschrieben.","tag":"Getrennt- und Zusammenschreibung","t":"text","ans":["zumindest"],"par":"§ 39","id":"bdb39a5a6"},{"cat":"rs","lv":1,"q":"Welcher Satz mit einer direkten Anrede ist richtig gesetzt?","e":"Eine Anrede wird durch ein Komma vom übrigen Satz abgetrennt.","tag":"Zeichensetzung","c":"Anna, kommst du bitte einmal her?","w":["Anna kommst du bitte einmal her?","Anna kommst, du bitte einmal her?","Anna, kommst, du bitte einmal her?"],"par":"§ 72","id":"bc09d7dd9"},{"cat":"rs","lv":3,"q":"Schreibe das Wort richtig: Hirarchie","e":"Das griechische Fremdwort wird „Hierarchie“ geschrieben, mit „ie“ nach dem „H“ und „ch“ vor der Endung.","tag":"Fremdwörter","t":"text","ans":["Hierarchie"],"id":"bcf9b2f6c"},{"cat":"rs","lv":3,"q":"Schreibe das Wort richtig: Zigare","e":"Das Wort wird mit doppeltem „r“ geschrieben: Zigarre.","tag":"Schärfung","t":"text","ans":["Zigarre"],"id":"b2b9c2f05"},{"cat":"rs","lv":3,"q":"Finde das falsch geschriebene Wort: „Er hat die Regel wieder besseres Wissen gebrochen.“","e":"Die feste Wendung heißt „wider besseres Wissen“ (gegen besseres Wissen). „Wieder“ bedeutet „noch einmal“.","tag":"Fehlersuche","c":"wieder","w":["Regel","besseres","gebrochen"],"par":"§ 10","id":"b11bab0b6"},{"cat":"rs","lv":2,"q":"In welchem Satz ist „wegfahren“ richtig geschrieben?","e":"Verben mit dem Verbzusatz „weg“ werden in der Grundform zusammengeschrieben: wegfahren, weggehen.","tag":"Getrennt- und Zusammenschreibung","c":"Wir wollen morgen früh wegfahren.","w":["Wir wollen morgen früh weg fahren.","Wir wollen morgen früh weg-fahren.","Wir wollen morgen früh wek fahren."],"par":"§ 34","id":"bed7b3fdc"},{"cat":"rs","lv":3,"q":"Welcher Satz mit mehreren Nebensätzen ist richtig gesetzt?","e":"Jeder Nebensatz wird abgetrennt: „dass …“ vom Hauptsatz und der eingeschobene Relativsatz „die gestern eingegangen war“ auf beiden Seiten.","tag":"Zeichensetzung","c":"Der Beamte sagte, dass er die Anzeige, die gestern eingegangen war, prüfen werde.","w":["Der Beamte sagte, dass er die Anzeige, die gestern eingegangen war prüfen werde.","Der Beamte sagte, dass er die Anzeige die gestern eingegangen war, prüfen werde.","Der Beamte sagte dass er die Anzeige, die gestern eingegangen war, prüfen werde."],"par":"§ 73","id":"bdffcc1ff"},{"cat":"rs","lv":3,"q":"Schreibe das Wort richtig: Quarantene","e":"Das Wort kommt aus dem Französischen und
