ung: 1 Kugel gegen 1 Kugel aus dieser Dreiergruppe; die dritte Kugel ist die schwere, falls Gleichstand herrscht. Mit nur einer Wägung (3 mögliche Ausgänge) lassen sich 9 Kugeln nicht unterscheiden.","tag":"Waage","c":"2","w":["1","3","4"],"id":"bbd537310"},{"cat":"lg","lv":3,"q":"Ada, Bruno, Cora und Emil arbeiten in vier Büros mit den Nummern 1 bis 4, jede Person in einem anderen Büro. Sie haben vier verschiedene Berufe: Jurist, Informatiker, Buchhalter und Techniker (jeder Beruf kommt einmal vor). Ada sitzt in Büro 1. Bruno ist Techniker. Cora sitzt nicht in Büro 4. Der Buchhalter sitzt in Büro 3. Der Jurist sitzt in einem Büro mit höherer Nummer als der Informatiker. Emil ist kein Jurist. In welchem Büro sitzt Bruno?","e":"Ada (Büro 1) kann nicht Jurist sein, weil der Informatiker eine kleinere Nummer haben müsste, nicht Buchhalter (Büro 3) und nicht Techniker (Bruno): Ada ist Informatikerin. Jurist ist Cora oder Emil, und Emil ist es nicht, also Cora. Emil ist Buchhalter in Büro 3. Cora sitzt nicht in Büro 4, also in Büro 2. Für Bruno bleibt Büro 4.","tag":"Zuordnung","c":"Büro 4","w":["Büro 1","Büro 2","Büro 3"],"id":"b205aca73"},{"cat":"lg","lv":3,"q":"Wie groß ist der kleinere Winkel zwischen Stunden- und Minutenzeiger einer Uhr um 7:30 Uhr?","e":"Der Minutenzeiger steht bei 30 Minuten auf 180° (von der 12 aus gemessen). Der Stundenzeiger dreht sich pro Stunde um 30° und steht um 7:30 Uhr bei 7,5 · 30° = 225°. Der Unterschied beträgt 225° − 180° = 45°.","tag":"Uhrzeiten","c":"45°","w":["30°","60°","90°"],"id":"b6e5eb26e"},{"cat":"lg","lv":3,"q":"Ein Passwort besteht aus zwei verschiedenen Buchstaben, die aus A, B, C, D und E ausgewählt werden, und einer anschließenden Ziffer aus 1, 2 oder 3. Die Reihenfolge der Buchstaben zählt (AB und BA sind verschiedene Passwörter). Wie viele verschiedene Passwörter sind möglich?","e":"Für den ersten Buchstaben gibt es 5 Möglichkeiten, für den zweiten 4 (er muss sich vom ersten unterscheiden) und für die Ziffer 3: 5 · 4 · 3 = 60. Der Wert 75 würde gleiche Buchstaben erlauben, 30 würde die Reihenfolge der Buchstaben ignorieren.","tag":"Kombinatorik","c":"60","w":["75","30","12"],"id":"b51174816"},{"cat":"lg","lv":3,"q":"Ein Wort wird in zwei Schritten verschlüsselt: Zuerst wird jeder Buchstabe im Alphabet um zwei Stellen nach hinten verschoben (A wird zu C, B zu D, …, Y zu A, Z zu B). Danach wird das Ergebnis rückwärts geschrieben. Wie lautet die Verschlüsselung von „KAMEL“?","e":"Schritt 1: K wird zu M, A zu C, M zu O, E zu G und L zu N, das ergibt MCOGN. Schritt 2: rückwärts geschrieben NGOCM. MCOGN wäre das Ergebnis ohne die Umkehrung, LEMAK entsteht, wenn man nur umkehrt.","tag":"Verschlüsselung","c":"NGOCM","w":["MCOGN","LEMAK","JCKYI"],"id":"b0c4c24c0"},{"cat":"lg","lv":3,"q":"Ein Gerät funktioniert genau dann, wenn der Akku geladen ist und der Schalter auf „Ein“ steht. Das Gerät funktioniert nicht, der Akku ist aber geladen. Was folgt daraus?","e":"Das Gerät funktioniert genau dann, wenn beide Bedingungen erfüllt sind. Funktioniert es nicht, ist mindestens eine Bedingung verletzt. Der Akku ist geladen, also muss der Schalter verstellt sein: Er steht nicht auf „Ein“. Ein Defekt lässt sich aus den Angaben nicht ableiten.","tag":"Wenn-dann","c":"Der Schalter steht nicht auf „Ein“.","w":["Der Schalter steht auf „Ein“.","Der Akku ist leer.","Das Gerät ist defekt."],"id":"b55a7e5b2"},{"cat":"lg","lv":3,"q":"Ein Roboter steht auf dem Feld (0|0) und blickt nach Norden. Die erste Zahl eines Feldes ist die Ost-West-Koordinate (sie wächst nach Osten), die zweite die Nord-Süd-Koordinate (sie wächst nach Norden). Befehle: V = ein Feld vorwärts, R = 90 Grad nach rechts drehen, L = 90 Grad nach links drehen. Er führt aus: V V V R V V L V R R V V V L V. Auf welchem Feld steht er am Ende?","e":"Start (0|0), Blick nach Norden. VVV: (0|3). R: Blick nach Osten. VV: (2|3). L: Blick nach Norden. V: (2|4). R, R: Blick nach Süden. VVV: (2|1). L: Blick nach Osten. V: (3|1).","tag":"Richtungen","c":"(3|1)","w":["(1|3)","(3|−1)","(−3|1)"],"id":"bcf72a86c"},{"cat":"lg","lv":3,"q":"Ein Verein hat 60 Mitglieder. 36 Mitglieder laufen regelmäßig, 28 schwimmen regelmäßig. Mindestens wie viele Mitglieder laufen und schwimmen beides regelmäßig?","e":"Zählt man 36 + 28 = 64, ergibt das mehr als die 60 Mitglieder. Mindestens 64 − 60 = 4 Mitglieder sind daher doppelt gezählt, sie machen beides. Mit genau 4 ist es möglich, wenn jedes Mitglied mindestens eine der beiden Sportarten betreibt.","tag":"Mengenlogik","t":"num","ans":4,"id":"b2c3e0770"},{"cat":"lg","lv":3,"q":"Auf einem Zettel stehen fünf Aussagen. Aussage 1: „Genau eine dieser fünf Aussagen ist falsch.“ Aussage 2: „Genau zwei dieser fünf Aussagen sind falsch.“ Aussage 3: „Genau drei dieser fünf Aussagen sind falsch.“ Aussage 4: „Genau vier dieser fünf Aussagen sind falsch.“ Aussage 5: „Genau fünf dieser fünf Aussagen sind falsch.“ Wie viele der fünf Aussagen sind falsch?","e":"Je zwei dieser Aussagen widersprechen einander, also ist höchstens eine wahr und mindestens vier sind falsch. Wären alle fünf falsch, wäre Aussage 5 wahr: Widerspruch. Also sind genau vier falsch, und Aussage 4 ist die wahre.","tag":"Wahrheitsrätsel","t":"num","ans":4,"id":"bc2ad9e2a"},{"cat":"lg","lv":3,"q":"Aus 3 Männern und 2 Frauen soll ein Team aus genau 2 Personen gebildet werden, dem mindestens eine Frau angehört. Wie viele verschiedene Teams sind möglich?","e":"Insgesamt gibt es 5 · 4 : 2 = 10 mögliche Zweierteams. Ohne Frau (zwei Männer) sind es 3 · 2 : 2 = 3 Teams. Mit mindestens einer Frau bleiben 10 − 3 = 7 Teams.","tag":"Kombinatorik","t":"num","ans":7,"id":"b739f9591"},{"cat":"lg","lv":3,"q":"Wie viele Buchstaben des Wortes „POLIZEISTREIFE“ stehen im Alphabet vor dem J oder nach dem R? Jeder Buchstabe wird einzeln gezählt, auch wenn er mehrfach vorkommt.","e":"P-O-L-I-Z-E-I-S-T-R-E-I-F-E hat 14 Buchstaben. Vor dem J (A bis I) stehen: I, E, I, E, I, F, E, das sind 7. Nach dem R (S bis Z) stehen: Z, S, T, das sind 3. Zusammen 10. Die übrigen 4 Buchstaben (P, O, L, R) liegen dazwischen oder sind das R selbst.","tag":"Buchstabenlogik","c":"10","w":["7","11","4"],"id":"b630ee634"},{"cat":"lg","lv":3,"q":"Ein Zeiger zeigt nach Südosten. Er dreht sich um 180 Grad, danach um 135 Grad im Uhrzeigersinn und schließlich um 90 Grad gegen den Uhrzeigersinn. In welche Richtung zeigt er dann?","e":"Südosten, um 180 Grad gedreht: Nordwesten. 135 Grad im Uhrzeigersinn: Nordwesten, Norden, Nordosten, Osten. 90 Grad gegen den Uhrzeigersinn: von Osten nach Norden.","tag":"Richtungen","c":"Norden","w":["Osten","Süden","Westen"],"id":"bf53958d4"},{"cat":"lg","lv":3,"q":"Zwei Personen, A und B, stehen einander gegenüber und blicken sich an. Person A streckt den linken Arm seitlich aus, er zeigt genau nach Norden. In welche Himmelsrichtung zeigt der linke Arm von Person B, wenn auch sie ihn seitlich ausstreckt?","e":"Zeigt der linke Arm von A nach Norden, blickt A nach Osten (wer nach Osten blickt, hat links den Norden). B steht A gegenüber und blickt deshalb nach Westen. Wer nach Westen blickt, hat links den Süden.","tag":"Richtungen","c":"Süden","w":["Norden","Osten","Westen"],"id":"bf9d79d67"},{"cat":"lg","lv":3,"q":"Mit zwei fairen Würfeln wird einmal gewürfelt. Wie groß ist die Wahrscheinlichkeit, dass die Augensumme 7 beträgt?","e":"Es gibt 6 · 6 = 36 gleich wahrscheinliche Ergebnisse. Die Summe 7 ergibt sich bei 1+6, 2+5, 3+4, 4+3, 5+2 und 6+1, also bei 6 Ergebnissen. 6 von 36 ist gekürzt 1 von 6.","tag":"Wahrscheinlichkeit","c":"1 von 6","w":["1 von 12","7 von 36","1 von 7"],"id":"be3b4ee37"},{"cat":"lg","lv":3,"q":"Eine Mutter ist 28 Jahre älter als ihre Tochter. In 7 Jahren ist die Mutter dreimal so alt wie die Tochter. Wie alt ist die Tochter jetzt?","e":"Die Tochter sei t Jahre alt, die Mutter t + 28. In 7 Jahren gilt t + 35 = 3 · (t + 7) = 3t + 21, also 2t = 14 und t = 7. Probe: Die Mutter ist 35, in 7 Jahren 42 und damit dreimal so alt wie die Tochter (14).","tag":"Alter","c":"7","w":["14","9","5"],"id":"ba17a7987"},{"cat":"lg","lv":3,"q":"In einer Gruppe von 20 Personen sind 12 Frauen. Insgesamt tragen 15 Personen der Gruppe eine Brille. Welche Aussage folgt mit Sicherheit?","e":"Es gibt 20 − 15 = 5 Personen ohne Brille, davon höchstens 5 Frauen. Also tragen mindestens 12 − 5 = 7 Frauen eine Brille. Die anderen Aussagen folgen nicht sicher: Es können auch alle 12 Frauen eine Brille tragen (dann nur 3 Männer), und genau 7 Frauen sind ebenfalls möglich.","tag":"Schlussfolgern","c":"Mindestens 7 Frauen tragen eine Brille.","w":["Mindestens 8 Frauen tragen eine Brille.","Höchstens 7 Frauen tragen eine Brille.","Alle Männer tragen eine Brille."],"id":"bb00e5051"},{"cat":"lg","lv":3,"q":"Ein quadratisches Gitter besteht aus 3 mal 3 gleich großen Feldern. Wie viele Quadrate beliebiger Größe, deren Seiten auf den Gitterlinien liegen, lassen sich darin finden?","e":"Quadrate mit der Seitenlänge 1 gibt es 3 · 3 = 9, mit der Seitenlänge 2 gibt es 2 · 2 = 4 und mit der Seitenlänge 3 gibt es 1. Zusammen 9 + 4 + 1 = 14.","tag":"Figuren","t":"num","ans":14,"id":"b48ef2713"},{"cat":"lg","lv":3,"q":"Ein großer Würfel wird außen rot angemalt und danach in 27 gleich große kleine Würfel (3 · 3 · 3) zersägt. Wie viele der kleinen Würfel haben genau zwei rote Flächen?","e":"Genau zwei rote Flächen haben die kleinen Würfel in der Mitte einer Kante (die Eckwürfel haben drei). Ein Würfel hat 12 Kanten, und auf jeder Kante liegt genau ein solcher mittlerer Würfel: 12 Würfel.","tag":"Figuren","t":"num","ans":12,"id":"b101c27d5"},{"cat":"po","lv":1,"q":"Welches Bundesministerium steht an der Spitze der Sicherheitsverwaltung und ist damit oberste Sicherheitsbehörde?","e":"Nach § 4 SPG ist der Bundesminister für Inneres die oberste Sicherheitsbehörde.","tag":"Behördenaufbau","c":"Das Bundesministerium für Inneres","w":["Das Bundesministerium für Justiz","Das Bundesministerium für Landesverteidigung","Das Bundeskanzleramt"],"norm":"§ 4 Abs. 1 SPG","nurl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10005792","id":"b9bde4263"},{"cat":"po","lv":1,"q":"Wie viele Landespolizeidirektionen gibt es in Österreich?","e":"Seit 2012 besteht in jedem der neun Bundesländer genau eine Landespolizeidirektion.","tag":"Behördenaufbau","t":"num","ans":9,"norm":"§ 7 Abs. 1 SPG","nurl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10005792","id":"be3472500"},{"cat":"po","lv":2,"q":"In welchem Jahr nahmen die neun Landespolizeidirektionen ihre Arbeit auf?","e":"Seit 1. September 2012 gibt es die Landespolizeidirektionen. Sie lösten Sicherheitsdirektionen, Bundespolizeidirektionen und Landespolizeikommanden ab.","tag":"Behördenaufbau","c":"2012","w":["2005","2008","2016"],"id":"b0ac4b12a"},{"cat":"po","lv":3,"q":"Welche Behörden wurden durch die Landespolizeidirektionen abgelöst?","e":"Die Sicherheitsbehördenreform ersetzte diese drei Behördentypen ab 1. September 2012 durch je eine Landespolizeidirektion pro Bundesland.","tag":"Behördenaufbau","c":"Sicherheitsdirektionen, Bundespolizeidirektionen und Landespolizeikommanden","w":["Bezirkshauptmannschaften, Gendarmerieposten und Zollämter","Gemeindewachkörper, Bezirksgerichte und Gemeindeämter","Landesregierungen, Landesgerichte und Landesschulräte"],"id":"ba99a56d5"},{"cat":"po","lv":2,"q":"Wem sind die Landespolizeidirektionen laut Sicherheitspolizeigesetz unmittelbar unterstellt?","e":"§ 4 Abs. 2 SPG: Dem Bundesminister für Inneres unmittelbar unterstellt besorgen die Landespolizeidirektionen die Sicherheitsverwaltung in den Ländern.","tag":"Behördenaufbau","c":"Dem Bundesminister für Inneres","w":["Dem jeweiligen Landeshauptmann","Dem Bundeskanzler","Dem Bundespräsidenten"],"norm":"§ 4 Abs. 2 SPG","nurl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10005792","id":"be2de5cca"},{"cat":"po","lv":3,"q":"Welche Behörden sind den Landespolizeidirektionen bei der Sicherheitsverwaltung in den Ländern nachgeordnet?","e":"§ 4 Abs. 2 SPG: Den Landespolizeidirektionen nachgeordnet besorgen die Bezirksverwaltungsbehörden die Sicherheitsverwaltung.","tag":"Behördenaufbau","c":"Die Bezirksverwaltungsbehörden","w":["Die Landesregierungen","Die Landesverwaltungsgerichte","Die Gemeindeämter"],"norm":"§ 4 Abs. 2 SPG","nurl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10005792","id":"b73f8ef2c"},{"cat":"po","lv":2,"q":"Welche Tätigkeit gehört laut Sicherheitspolizeigesetz zum Exekutivdienst der Organe des öffentlichen Sicherheitsdienstes?","e":"§ 5 SPG nennt als Exekutivdienst den Streifen- und Überwachungsdienst, die erste allgemeine Hilfeleistung, die Gefahrenabwehr sowie den Ermittlungs- und Erkennungsdienst.","tag":"Exekutivdienst","c":"Der Streifen- und Überwachungsdienst","w":["Die Ausstellung von Reisepässen","Die Entscheidung über Waffenbesitzkarten","Die Prüfung von Gewerbeberechtigungen"],"norm":"§ 5 Abs. 3 SPG","nurl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10005792","id":"b543c5ded"},{"cat":"po","lv":1,"q":"Wie heißen die örtlichen Dienststellen, die einem Stadt- oder Bezirkspolizeikommando direkt unterstellt sind und vor Ort den Streifendienst versehen?","e":"Polizeiinspektionen sind den Stadt- bzw. Bezirkspolizeikommanden direkt unterstellt und leisten unter anderem Exekutiv-, Verkehrs- und Kriminaldienst.","tag":"Behördenaufbau","c":"Polizeiinspektionen","w":["Landeskriminalämter","Bildungszentren","Einsatzabteilungen"],"norm":"§ 10 Abs. 1 SPG","nurl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10005792","id":"b4e2207f3"},{"cat":"po","lv":2,"q":"Welche Dienststelle ist den Polizeiinspektionen im Stadtgebiet von Graz übergeordnet?","e":"In Städten, in denen die Landespolizeidirektion Sicherheitsbehörde erster Instanz ist, übernehmen Stadtpolizeikommanden die Aufgaben der Bezirkspolizeikommanden. Dem Stadtpolizeikommando Graz gehören die Grazer Polizeiinspektionen an.","tag":"Behördenaufbau","c":"Das Stadtpolizeikommando Graz","w":["Das Bezirkspolizeikommando Graz-Umgebung","Die Landesverkehrsabteilung Steiermark","Das Landeskriminalamt Steiermark"],"id":"be853e246"},{"cat":"po","lv":2,"q":"Wofür ist das Landeskriminalamt einer Landespolizeidirektion in erster Linie zuständig?","e":"Laut Organigramm der Landespolizeidirektion Steiermark führt das Landeskriminalamt kriminalpolizeiliche Ermittlungen, Analysen und Spezialaufgaben durch.","tag":"Landeskriminalamt","c":"Für kriminalpolizeiliche Ermittlungen, Analysen und Spezialaufgaben","w":["Für die Überwachung des Verkehrs auf überregionalen Straßen","Für die Ausstellung von Waffen- und Reisedokumenten","Für Grenzschutz und die Überwachung des Aufenthalts von Fremden"],"id":"b461042bd"},{"cat":"po","lv":1,"q":"Welche Abteilung einer Landespolizeidirektion ist für die Verkehrspolizei und überregionale Verkehrsdienste zuständig?","e":"Die Landesverkehrsabteilung (LVA) ist laut Organigramm der Landespolizeidirektion Steiermark für Verkehrspolizei und überregionale Verkehrsdienste zuständig.","tag":"Verkehrspolizei","c":"Die Landesverkehrsabteilung","w":["Die Personalabteilung","Die Logistikabteilung","Die Einsatzabteilung"],"id":"bd90aee8c"},{"cat":"po","lv":2,"q":"Wofür ist die Fremden- und Grenzpolizeiliche Abteilung der Landespolizeidirektion Steiermark unter anderem zuständig?","e":"Laut Organigramm der Landespolizeidirektion Steiermark umfasst die Fremden- und Grenzpolizeiliche Abteilung Aufenthaltsüberwachung, Grenzschutz und asylrechtliche Verfahren.","tag":"Grenzpolizei","c":"Für Grenzschutz, Aufenthaltsüberwachung und asylrechtliche Verfahren","w":["Für Personalauswahl, Laufbahnbetreuung und Disziplinarangelegenheiten","Für Fahrzeuge, Dienstwaffen und Infrastruktur","Für Öffentlichkeitsarbeit und Controlling"],"id":"bafc7adca"},{"cat":"po","lv":3,"q":"Wie heißt die Organisationseinheit der Landespolizeidirektion Steiermark, die für Staatsschutz und Extremismusbekämpfung zuständig ist?","e":"Im Organigramm der Landespolizeidirektion Steiermark ist das Landesamt Staatsschutz und Extremismusbekämpfung (LSE) für Gefahrenabwehr und Ermittlungen im Bereich Extremismus sowie für Personen- und Objektschutz vorgesehen. Es arbeitet mit der Direktion Staatsschutz und Nachrichtendienst zusammen.","tag":"Staatsschutz","c":"Landesamt Staatsschutz und Extremismusbekämpfung","w":["Landesamt für Verfassungsschutz und Terrorismusbekämpfung","Landeskriminalamt für Terrorabwehr","Landesstelle für Nachrichtendienst und Spionage"],"id":"b1f5d7352"},{"cat":"po","lv":1,"q":"Welche Dienststelle fungiert als österreichweite Zentralstelle der Kriminalitätsbekämpfung und unterstützt alle Landeskriminalämter?","e":"Das Bundeskriminalamt ist Teil des Bundesministeriums für Inneres und unterstützt als Zentralstelle alle Landeskriminalämter sowie die nachgeordneten Dienststellen.","tag":"Bundeskriminalamt","c":"Das Bundeskriminalamt","w":["Die Sicherheitsakademie","Die Direktion für Spezialeinheiten","Das Bundesamt für Fremdenwesen und Asyl"],"id":"b0f609935"},{"cat":"po","lv":1,"q":"In welcher Stadt hat das Bundeskriminalamt seinen Sitz?","e":"Das Bundeskriminalamt hat seinen Sitz in der Bundeshauptstadt Wien.","tag":"Bundeskriminalamt","c":"In Wien","w":["In Graz","In Linz","In Wiener Neustadt"],"id":"b8337f749"},{"cat":"po","lv":3,"q":"Wo ist in Österreich die Nationale Stelle für EUROPOL angesiedelt?","e":"Die österreichische Europol National Unit ist Teil des Bundeskriminalamts. Dort gibt es auch die Büros für INTERPOL und SIRENE.","tag":"Bundeskriminalamt","c":"Im Bundeskriminalamt","w":["In der Sicherheitsakademie","Im Einsatzkommando Cobra","In der Landespolizeidirektion Wien"],"norm":"§ 4 Abs. 1 BKA-G","nurl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=20001745","id":"b19e53c58"},{"cat":"po","lv":1,"q":"Was ist die Hauptaufgabe der Direktion Staatsschutz und Nachrichtendienst (DSN)?","e":"Die DSN ist Österreichs Verfassungsschutzbehörde. Sie befasst sich mit allen Formen des Extremismus und Terrorismus, mit Spionageabwehr und Cyber-Sicherheit.","tag":"Staatsschutz","c":"Der Schutz der Verfassung, etwa vor Extremismus, Terrorismus und Spionage","w":["Die Überwachung des Straßenverkehrs auf Autobahnen und Landesstraßen","Die Aufklärung von Einbruchsdiebstählen und Sachbeschädigungen","Die Ausbildung und Fortbildung der Polizeischüler an den Bildungszentren"],"norm":"§ 1 Abs. 2 SNG","nurl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=20009486","id":"bc2a6af0e"},{"cat":"po","lv":2,"q":"Aus welchen zwei klar getrennten Bereichen besteht die Direktion Staatsschutz und Nachrichtendienst?","e":"Die DSN arbeitet in einem hybriden Modell mit den beiden getrennten Bereichen Staatsschutz (polizeiliche Ermittlungen) und Nachrichtendienst (Informationsgewinnung und Analyse).","tag":"Staatsschutz","c":"Staatsschutz und Nachrichtendienst","w":["Kriminalpolizei und Verkehrspolizei","Grenzschutz und Fremdenpolizei","Personenschutz und Objektschutz"],"norm":"§ 1 Abs. 4 SNG","nurl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=20009486","id":"b3395ef38"},{"cat":"po","lv":3,"q":"Seit welchem Jahr ist die Direktion Staatsschutz und Nachrichtendienst die Verfassungsschutzbehörde Österreichs?","e":"Seit Dezember 2021 ist die Direktion Staatsschutz und Nachrichtendienst (DSN) Österreichs Verfassungsschutzbehörde.","tag":"Staatsschutz","c":"Seit 2021","w":["Seit 2012","Seit 2005","Seit 2018"],"id":"b55f8c001"},{"cat":"po","lv":2,"q":"In welcher Stadt befindet sich das Hauptquartier des Einsatzkommandos Cobra?","e":"Das Einsatzkommando Cobra/Direktion für Spezialeinheiten hat sein Hauptquartier in Wiener Neustadt.","tag":"Spezialeinheiten","c":"In Wiener Neustadt","w":["In Sankt Pölten","In Klosterneuburg","In Eisenstadt"],"id":"babeb45e6"},{"cat":"po","lv":2,"q":"Wofür wird das Einsatzkommando Cobra in erster Linie eingesetzt?","e":"Das Einsatzkommando Cobra ist die Spezialeinheit für besonders gefährliche Einsätze, etwa bei bewaffneten Tätern, und unterstützt österreichweit bei terroristischen Bedrohungen.","tag":"Spezialeinheiten","c":"Für besonders gefährliche Einsätze, zum Beispiel bei bewaffneten Tätern","w":["Für den täglichen Streifendienst in ländlichen Gemeinden","Für die Aufnahme von Verkehrsunfällen auf Freilandstraßen","Für die Beratung von Kriminalitätsopfern in Schulen"],"id":"b1611702d"},{"cat":"po","lv":2,"q":"Wofür steht die Abkürzung DSE in der Bezeichnung „Einsatzkommando Cobra/DSE“?","e":"Die volle Bezeichnung lautet Einsatzkommando Cobra/Direktion für Spezialeinheiten (DSE).","tag":"Spezialeinheiten","c":"Direktion für Spezialeinheiten","w":["Direktion für Sicherheitseinsätze","Dienststelle für Staatliche Ermittlungen","Direktion für Schwerpunkteinsätze"],"id":"b022fe0aa"},{"cat":"po","lv":2,"q":"Wofür steht die Abkürzung WEGA?","e":"WEGA ist die Abkürzung für Wiener Einsatzgruppe Alarmabteilung, die operative Spezialeinheit der Landespolizeidirektion Wien.","tag":"Spezialeinheiten","c":"Wiener Einsatzgruppe Alarmabteilung","w":["Wiener Eingreifgruppe für Alarmaufgaben","Wiener Einsatzgruppe Alarmaufklärung","Wiener Eingreiftruppe Alarmabwehr"],"id":"ba49d0cde"},{"cat":"po","lv":1,"q":"Zu welcher Landespolizeidirektion gehört die Spezialeinheit WEGA?","e":"Die WEGA ist die operative Spezialeinheit der Landespolizeidirektion Wien und gibt es nur in Wien.","tag":"Spezialeinheiten","c":"Zur Landespolizeidirektion Wien","w":["Zur Landespolizeidirektion Niederösterreich","Zur Landespolizeidirektion Steiermark","Zur Landespolizeidirektion Salzburg"],"id":"b55de2741"},{"cat":"po","lv":2,"q":"Welche Aufgabe gehört zur Flugpolizei?","e":"Die Flugpolizei überwacht Verkehr und Großveranstaltungen aus der Luft und hilft bei Such- und Rettungsaktionen.","tag":"Spezialeinheiten","c":"Die Überwachung von Verkehr und Großveranstaltungen aus der Luft sowie die Unterstützung bei Such- und Rettungsaktionen","w":["Die Kontrolle von Schiffen und Booten auf Seen und Flüssen sowie Hilfe bei Schiffsunglücken","Die Suche nach vermissten Personen, Sprengstoff, Waffen und Suchtmitteln mit Spürhunden","Die Absicherung von Staatsbesuchen und der Einsatz gegen bewaffnete Täter am Boden"],"id":"b0fa22847"},{"cat":"po","lv":1,"q":"Welche Aufgabe übernimmt die Polizeidiensthundeeinheit?","e":"Polizeidiensthunde suchen vermisste Menschen, verlorene Gegenstände, Bargeld, Sprengstoff, Waffen und Drogen.","tag":"Spezialeinheiten","c":"Die Suche nach vermissten Menschen, Sprengstoff, Waffen und Drogen","w":["Die Kontrolle von Schiffen auf Seen und Flüssen","Die Überwachung von Verkehr und Großveranstaltungen aus der Luft","Die Aufklärung von Betrug und Wirtschaftskriminalität"],"id":"b549387ed"},{"cat":"po","lv":1,"q":"Welche Polizeieinheit ist für Einsätze im Gebirge und die Hilfe bei Bergunfällen zuständig?","e":"Die Alpinpolizei ist für Einsätze im Gebirge, Hilfe bei Bergunfällen und die Verfolgung von Straftätern im alpinen Gelände zuständig.","tag":"Spezialeinheiten","c":"Die Alpinpolizei","w":["Die Zielfahndung","Der See- und Stromdienst","Die WEGA"],"id":"b3de4340f"},{"cat":"po","lv":1,"q":"Was gehört zur polizeilichen Beratung und Vorbeugung?","e":"Zur polizeilichen Beratung und Vorbeugung zählen zum Beispiel Kurse in Schulen zu richtigem Verhalten im Straßenverkehr und zu gewaltloser Konfliktlösung.","tag":"Prävention","c":"Kurse in Schulen zu richtigem Verhalten im Straßenverkehr und zu gewaltloser Konfliktlösung","w":["Die Eintreibung offener Verwaltungsstrafen bei Unternehmen und Vereinen","Die Prüfung von Baugenehmigungen für Wohnhäuser und Betriebsanlagen","Die Vergabe von Gewerbescheinen an Neugründer und Betriebsnachfolger"],"id":"b1f1bf908"},{"cat":"po","lv":1,"q":"Welche Einrichtung des Innenministeriums ist für die Aus- und Fortbildung der Exekutiv- und Verwaltungsbediensteten zuständig?","e":"Die Sicherheitsakademie ist eine Organisationseinheit des Bundesministeriums für Inneres und übernimmt die Aus- und Fortbildung der Exekutiv- und Verwaltungsbediensteten des Ressorts.","tag":"Ausbildung","c":"Die Sicherheitsakademie (SIAK)","w":["Das Bundeskriminalamt","Die Direktion Staatsschutz und Nachrichtendienst","Das Bundesamt für Fremdenwesen und Asyl"],"norm":"§ 11 Abs. 1 SPG","nurl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10005792","id":"b169ca88a"},{"cat":"po","lv":3,"q":"Wie bezeichnet man spezialisierte Polizeiinspektionen, etwa Verkehrs-, Grenzpolizei- oder Diensthundeinspektionen?","e":"Neben den allgemeinen Polizeiinspektionen gibt es laut Organigramm der Landespolizeidirektion Steiermark ergänzend Fachinspektionen, etwa Verkehrs-, Grenzpolizei- oder Diensthundeinspektionen.","tag":"Behördenaufbau","c":"Fachinspektionen","w":["Sonderkommissariate","Spezialstreifen","Zentralinspektionen"],"id":"bdbe04d9d"},{"cat":"po","lv":2,"q":"Wie heißt die Sektion II des Bundesministeriums für Inneres, zu der unter anderem das Bundeskriminalamt gehört?","e":"Das Bundeskriminalamt ist Teil der Sektion II des Bundesministeriums für Inneres, der Generaldirektion für die öffentliche Sicherheit.","tag":"Behördenaufbau","c":"Generaldirektion für die öffentliche Sicherheit","w":["Generaldirektion für Staatsbürgerschaft und Fremdenwesen","Generaldirektion für Verwaltung und Personal","Generaldirektion für Bevölkerungsschutz und Zivildienst"],"norm":"§ 6 Abs. 1 SPG","nurl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10005792","id":"bf7658ec2"},{"cat":"po","lv":1,"q":"Welcher Dienstgrad steht in der offiziellen Reihenfolge der Exekutivdienstgrade an erster Stelle?","e":"Die offizielle Reihenfolge lautet: Aspirant, Inspektor, Revierinspektor, Gruppeninspektor, Bezirksinspektor, Abteilungsinspektor, Kontrollinspektor, Chefinspektor und danach die Offiziersdienstgrade ab Leutnant.","tag":"Dienstgrade","c":"Aspirant","w":["Inspektor","Revierinspektor","Gruppeninspektor"],"id":"be56d8c08"},{"cat":"po","lv":2,"q":"Welcher Dienstgrad folgt unmittelbar auf den Revierinspektor?","e":"Die Reihenfolge lautet Aspirant, Inspektor, Revierinspektor, Gruppeninspektor, Bezirksinspektor, Abteilungsinspektor, Kontrollinspektor.","tag":"Dienstgrade","c":"Gruppeninspektor","w":["Bezirksinspektor","Inspektor","Abteilungsinspektor"],"id":"b01d519f4"},{"cat":"po","lv":2,"q":"Welcher Dienstgrad liegt zwischen dem Gruppeninspektor und dem Abteilungsinspektor?","e":"Auf den Gruppeninspektor folgt der Bezirksinspektor, danach der Abteilungsinspektor.","tag":"Dienstgrade","c":"Bezirksinspektor","w":["Revierinspektor","Kontrollinspektor","Chefinspektor"],"id":"b5217c95d"},{"cat":"po","lv":1,"q":"Welche der folgenden Bezeichnungen ist ein Dienstgrad im Exekutivdienst?","e":"Der Abteilungsinspektor ist ein Dienstgrad der Beamten des Exekutivdienstes. Hofrat, Regierungsrat und Amtsdirektor sind Amtstitel, keine Exekutivdienstgrade.","tag":"Dienstgrade","c":"Abteilungsinspektor","w":["Hofrat","Regierungsrat","Amtsdirektor"],"id":"beeef76f7"},{"cat":"po","lv":1,"q":"Unter welcher Notrufnummer erreicht man in Österreich die Polizei?","e":"133 ist der Polizeinotruf, 122 die Feuerwehr, 144 die Rettung und 140 die Bergrettung.","tag":"Notruf","c":"133","w":["122","144","140"],"id":"b0caddd47"},{"cat":"po","lv":1,"q":"Unter welcher Notrufnummer erreicht man in Österreich die Rettung?","e":"Die Rettung ist unter 144 erreichbar. Die Feuerwehr hat die 122, die Polizei die 133.","tag":"Notruf","t":"num","ans":144,"id":"b625254b6"},{"cat":"po","lv":1,"q":"Welcher Dienst ist in Österreich unter der Notrufnummer 122 erreichbar?","e":"122 ist die Notrufnummer der Feuerwehr.","tag":"Notruf","c":"Die Feuerwehr","w":["Die Rettung","Die Bergrettung","Die Polizei"],"id":"b5f066f3f"},{"cat":"po","lv":2,"q":"Welche Aussage über den Euro-Notruf 112 trifft zu?","e":"Der Euro-Notruf 112 ist österreichweit und in allen EU-Staaten von jedem Telefon aus kostenlos erreichbar. Er funktioniert auch mit gesperrten Mobiltelefonen ohne PIN-Code.","tag":"Notruf","c":"Er ist in allen EU-Staaten von jedem Telefon aus kostenlos erreichbar","w":["Er funktioniert nur in Österreich und nur vom Festnetz aus","Er ist ausschließlich für Verkehrsunfälle vorgesehen","Er kann nur nach Eingabe des PIN-Codes gewählt werden"],"id":"bcdcfc8a7"},{"cat":"po","lv":2,"q":"Unter welcher Nummer ist in Österreich die Bergrettung (Alpinnotruf) erreichbar?","e":"Die Bergrettung erreicht man unter 140. 141 ist der Ärztenotdienst, 142 die Telefonseelsorge und 147 der Notruf für Kinder und Jugendliche.","tag":"Notruf","c":"140","w":["141","142","147"],"id":"b9e737f0c"},{"cat":"po","lv":2,"q":"Unter welcher Nummer erreicht man in Österreich die Telefonseelsorge?","e":"Die Telefonseelsorge ist unter 142 erreichbar.","tag":"Notruf","c":"142","w":["140","141","144"],"id":"b9c57ef77"},{"cat":"po","lv":2,"q":"Welche Nummer gehört zum Notrufdienst für Kinder und Jugendliche („Rat auf Draht“)?","e":"Rat auf Draht ist unter 147 erreichbar. Der Dienst ist die offizielle Notrufnummer für Kinder, Jugendliche und ihre Bezugspersonen.","tag":"Notruf","c":"147","w":["142","141","128"],"id":"b20435063"},{"cat":"po","lv":3,"q":"Welche Nummer ist laut oesterreich.gv.at die Notrufnummer bei Gasgebrechen?","e":"Bei Gasgebrechen lautet die Notrufnummer 128.","tag":"Notruf","c":"128","w":["140","141","142"],"id":"b51c81cd3"},{"cat":"po","lv":3,"q":"Wie können gehörlose oder hörbeeinträchtigte Personen laut oesterreich.gv.at die Polizei erreichen?","e":"Gehörlose und hörbeeinträchtigte Personen können die Polizei per Fax oder SMS unter 0800 133 133 kontaktieren. Zusätzlich gibt es die barrierefreie App DEC112.","tag":"Notruf","c":"Per SMS oder Fax an 0800 133 133 sowie über die App DEC112","w":["Nur durch persönliches Erscheinen auf einer Polizeiinspektion","Per E-Mail an eine zentrale Notruf-Adresse der Landespolizeidirektion","Per Brief an die zuständige Bezirkshauptmannschaft"],"id":"bb32dcdb6"},{"cat":"po","lv":2,"q":"Welche Nummer ist für gesundheitliche Probleme gedacht, die kein Notfall sind (Gesundheitsberatung)?","e":"Die Gesundheitsberatung 1450 ist für gesundheitliche Probleme da, die kein Notfall sind. Bei lebensbedrohlichen Notfällen ist die Rettung unter 144 zu rufen.","tag":"Notruf","c":"1450","w":["144","133","122"],"id":"b916e903c"},{"cat":"po","lv":2,"q":"Woraus besteht die Sicherheitspolizei laut § 3 SPG?","e":"§ 3 SPG: Die Sicherheitspolizei besteht aus der Aufrechterhaltung der öffentlichen Ruhe, Ordnung und Sicherheit (ausgenommen die örtliche Sicherheitspolizei) und aus der ersten allgemeinen Hilfeleistungspflicht.","tag":"Sicherheitspolizei","c":"Aus der Aufrechterhaltung der öffentlichen Ruhe, Ordnung und Sicherheit (ohne örtliche Sicherheitspolizei) sowie der ersten allgemeinen Hilfeleistungspflicht","w":["Aus der Verfolgung gerichtlich strafbarer Handlungen und dem Vollzug von Freiheitsstrafen in Justizanstalten","Aus der Verwaltung des Melde-, Pass- und Waffenwesens und der Führung des Strafregisters","Aus dem Schutz der Staatsgrenzen und der Abwehr militärischer Angriffe von außen"],"norm":"§ 3 SPG","nurl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10005792","id":"bea55f84c"},{"cat":"po","lv":2,"q":"Wann trifft die Sicherheitsbehörden die erste allgemeine Hilfeleistungspflicht nach § 19 SPG?","e":"§ 19 Abs. 1 SPG: Bei gegenwärtiger oder unmittelbar bevorstehender Gefährdung von Leben, Gesundheit, Freiheit oder Eigentum von Menschen besteht die erste allgemeine Hilfeleistungspflicht.","tag":"Hilfeleistung","c":"Wenn Leben, Gesundheit, Freiheit oder Eigentum von Menschen gegenwärtig gefährdet sind oder eine solche Gefährdung unmittelbar bevorsteht","w":["Nur wenn die gefährdete Person ausdrücklich und schriftlich um polizeiliche Hilfe bittet","Nur wenn bereits eine gerichtlich strafbare Handlung begangen und angezeigt worden ist","Nur wenn ein Vorgesetzter die Hilfeleistung im Einzelfall ausdrücklich angeordnet hat"],"norm":"§ 19 Abs. 1 SPG","nurl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10005792","id":"b887de6fe"},{"cat":"po","lv":3,"q":"In welchem Fall endet die erste allgemeine Hilfeleistungspflicht gegenüber einer gefährdeten Person?","e":"§ 19 Abs. 3 SPG: Die Pflicht endet gegenüber einer gefährdeten Person, die weitere Hilfe ablehnt. Sie endet auch, sobald sich zeigt, dass die Gefahrenabwehr nicht unter Abs. 1 fällt.","tag":"Hilfeleistung","c":"Wenn die gefährdete Person weitere Hilfe ablehnt","w":["Wenn der Dienst des einschreitenden Organs endet","Wenn die Hilfeleistung länger als eine Stunde dauern würde","Wenn die gefährdete Person keine österreichische Staatsbürgerin ist"],"norm":"§ 19 Abs. 3 Z 1 SPG","nurl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10005792","id":"bdf9b0f22"},{"cat":"po","lv":2,"q":"Polizisten treffen als Erste an einem Verkehrsunfall mit Verletzten ein, die Rettung ist noch nicht da. Was verlangt die erste allgemeine Hilfeleistungspflicht?","e":"§ 19 Abs. 2 SPG: Die Behörden sorgen für unaufschiebbare Hilfe und verständigen Rettung oder Feuerwehr, wenn deren Zuständigkeit gegeben ist.","tag":"Hilfeleistung","c":"Unaufschiebbare Hilfe leisten und die Rettung verständigen","w":["Auf das Eintreffen der Rettung warten, ohne selbst tätig zu werden","Zuerst die Schuldfrage klären und danach Hilfe leisten","Die Unfallstelle verlassen und die Rettung nicht informieren"],"norm":"§ 19 Abs. 2 SPG","nurl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10005792","id":"b82d6eac8"},{"cat":"po","lv":1,"q":"Wie müssen die Sicherheitsbehörden laut § 21 SPG mit gefährlichen Angriffen umgehen?","e":"§ 21 Abs. 2 SPG: Die Sicherheitsbehörden haben gefährlichen Angriffen unverzüglich ein Ende zu setzen. Das gilt auch dann, wenn bereits ein bestimmter Mensch einer strafbaren Handlung verdächtigt wird.","tag":"Gefahrenabwehr","c":"Sie müssen ihnen unverzüglich ein Ende setzen","w":["Sie dürfen erst einschreiten, wenn ein Gericht zugestimmt hat","Sie müssen zuerst den Abschluss eines Strafverfahrens abwarten","Sie dürfen nur einschreiten, wenn bereits ein bestimmter Täter bekannt ist"],"norm":"§ 21 Abs. 2 SPG","nurl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10005792","id":"b790850a5"},{"cat":"po","lv":1,"q":"Was hat bei der Aufgabenerfüllung der Sicherheitsbehörden und der Organe des öffentlichen Sicherheitsdienstes laut SPG Vorrang?","e":"§ 28 SPG (Vorrang der Sicherheit von Menschen): Dem Schutz des Lebens und der Gesundheit von Menschen ist vor dem Schutz anderer Güter Vorrang einzuräumen.","tag":"Grundsätze","c":"Der Schutz von Leben und Gesundheit von Menschen vor dem Schutz anderer Güter","w":["Der Schutz von Eigentum vor dem Schutz der Gesundheit","Die rasche Beendigung jedes Einsatzes vor dem Schutz von Personen","Der Schutz öffentlicher Gebäude vor dem Schutz einzelner Personen"],"norm":"§ 28 SPG","nurl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10005792","id":"b72114464"},{"cat":"po","lv":2,"q":"Was verlangt der Grundsatz der Verhältnismäßigkeit nach § 29 SPG bei der Wahl einer polizeilichen Befugnis?","e":"§ 29 Abs. 2 Z 1 SPG: Unter mehreren geeigneten Befugnissen ist jene zu wählen, die die Betroffenen voraussichtlich am wenigsten belastet.","tag":"Verhältnismäßigkeit","c":"Von mehreren geeigneten Befugnissen ist jene zu wählen, die Betroffene am wenigsten belastet","w":["Von mehreren geeigneten Befugnissen ist stets jene zu wählen, die am schnellsten zum Erfolg führt","Von mehreren geeigneten Befugnissen ist stets jene mit der stärksten abschreckenden Wirkung zu wählen","Von mehreren geeigneten Befugnissen ist stets jene zu wählen, die den geringsten Verwaltungsaufwand verursacht"],"norm":"§ 29 Abs. 2 Z 1 SPG","nurl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10005792","id":"ba8c6680d"},{"cat":"po","lv":3,"q":"Wann ist Befehls- und Zwangsgewalt laut § 29 SPG zu beenden?","e":"§ 29 Abs. 2 Z 5 SPG: Befehls- und Zwangsgewalt ist zu beenden, sobald der Erfolg erreicht wurde oder sich zeigt, dass er auf diesem Weg nicht erreichbar ist.","tag":"Verhältnismäßigkeit","c":"Sobald der Erfolg erreicht ist oder sich zeigt, dass er so nicht erreichbar ist","w":["Erst wenn sich der Betroffene schriftlich bei den einschreitenden Organen entschuldigt hat","Erst nach ausdrücklicher Rücksprache mit dem zuständigen Gericht oder der Staatsanwaltschaft","Sobald ein ranghöherer Vorgesetzter am Einsatzort eintrifft und das Kommando übernimmt"],"norm":"§ 29 Abs. 2 Z 5 SPG","nurl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10005792","id":"b50176e24"},{"cat":"po","lv":3,"q":"Was ist nach § 29 SPG bei einer polizeilichen Maßnahme besonders zu berücksichtigen?","e":"§ 29 Abs. 2 Z 2 SPG verlangt zu berücksichtigen, ob sich eine Maßnahme gegen einen Unbeteiligten oder gegen den Gefahrenverursacher richtet.","tag":"Verhältnismäßigkeit","c":"Ob sie sich gegen einen Unbeteiligten oder gegen die Person richtet, von der die Gefahr ausgeht","w":["Ob die Maßnahme voraussichtlich in den Medien größere Aufmerksamkeit finden wird","Ob die betroffene Person bereits früher einmal polizeilich in Erscheinung getreten ist","Ob für die Maßnahme am Einsatzort genügend Einsatzfahrzeuge zur Verfügung stehen"],"norm":"§ 29 Abs. 2 Z 2 SPG","nurl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10005792","id":"b394944de"},{"cat":"po","lv":3,"q":"Worauf sollen die Organe des öffentlichen Sicherheitsdienstes laut den Richtlinien für das Einschreiten (§ 31 SPG) besonders achten?","e":"§ 31 Abs. 2 SPG sieht vor, dass die Organe auf erkennbare Unvoreingenommenheit achten, damit ihr Einschreiten nicht als Diskriminierung (etwa wegen Geschlecht, Hautfarbe, Herkunft, Religion oder politischer Auffassung) empfunden wird.","tag":"Verhaltensregeln","c":"Dass ihre Unvoreingenommenheit erkennbar ist und ihr Einschreiten nicht als Diskriminierung empfunden wird","w":["Dass sie ihre Dienstnummer auch auf ausdrückliches Verlangen niemals bekanntgeben müssen","Dass Betroffene nur auf ausdrücklichen Antrag über Eingriffe in ihre Rechte informiert werden","Dass Personendurchsuchungen grundsätzlich von einer Person des anderen Geschlechts vorgenommen werden"],"norm":"§ 31 Abs. 2 Z 5 SPG","nurl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10005792","id":"ba078375d"},{"cat":"po","lv":2,"q":"Was geben einschreitende Organe des öffentlichen Sicherheitsdienstes den Betroffenen nach den Richtlinien für das Einschreiten in der Regel bekannt?","e":"§ 31 Abs. 2 Z 2 SPG: Einschreitende Organe geben ihre Dienstnummer bekannt, in der Regel mit einer Karte, die Dienstnummer, Dienststelle und Telefonnummer enthält.","tag":"Verhaltensregeln","c":"Ihre Dienstnummer, meist mit einer Karte, die auch Dienststelle und Telefonnummer enthält","w":["Ihre Privatadresse samt Geburtsdatum und Telefonnummer, meist mit einer Visitenkarte","Ihre Sozialversicherungsnummer und ihren Familienstand, meist schriftlich auf Verlangen","Ihren Dienstgrad, aber niemals die Dienststelle oder eine Telefonnummer"],"norm":"§ 31 Abs. 2 Z 2 SPG","nurl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10005792","id":"b4db92a5b"},{"cat":"po","lv":2,"q":"Welche Aussage beschreibt den Unterschied zwischen Sicherheitspolizei und Kriminalpolizei am besten?","e":"Die Sicherheitspolizei (SPG) dient der Aufrechterhaltung der öffentlichen Ruhe, Ordnung und Sicherheit, also vor allem der Gefahrenabwehr. Die Kriminalpolizei (StPO) klärt im Dienste der Strafrechtspflege strafbare Handlungen auf.","tag":"Sicherheitspolizei","c":"Sicherheitspolizei bedeutet vor allem Gefahrenabwehr und Vorbeugung, Kriminalpolizei die Aufklärung und Verfolgung strafbarer Handlungen","w":["Sicherheitspolizei bedeutet vor allem die Aufklärung begangener Straftaten, Kriminalpolizei die Abwehr von Verkehrsgefahren","Sicherheitspolizei ist nur für Verwaltungsübertretungen zuständig, Kriminalpolizei nur für Straftaten gegen Leib und Leben","Sicherheitspolizei ist ausschließlich in Uniform tätig, Kriminalpolizei ausschließlich in Zivil und ohne Befugnisse"],"id":"bf9d30ead"},{"cat":"po","lv":1,"q":"Wer leitet in Österreich das Ermittlungsverfahren in einem Strafverfahren?","e":"Nach § 20 StPO leitet die Staatsanwaltschaft das Ermittlungsverfahren. Sie ist auch Trägerin der Anklagebefugnis.","tag":"Staatsanwaltschaft","c":"Die Staatsanwaltschaft","w":["Die Landespolizeidirektion","Das Bundeskriminalamt","Der Landeshauptmann"],"norm":"§ 20 Abs. 1 StPO","nurl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10002326","id":"b569162fc"},{"cat":"po","lv":2,"q":"Wie arbeitet die Kriminalpolizei im Ermittlungsverfahren mit der Staatsanwaltschaft zusammen?","e":"Die Staatsanwaltschaft leitet das Ermittlungsverfahren und erteilt der Kriminalpolizei Anordnungen, zum Beispiel zu verdeckten Ermittlungen oder Obduktionen.","tag":"Staatsanwaltschaft","c":"Sie führt Ermittlungen durch und befolgt dabei die Anordnungen der Staatsanwaltschaft","w":["Sie entscheidet allein darüber, ob und gegen wen Anklage erhoben wird","Sie leitet das Verfahren und die Staatsanwaltschaft führt nur die Protokolle","Sie arbeitet unabhängig und muss der Staatsanwaltschaft nie darüber berichten"],"norm":"§ 99 Abs. 1 StPO","nurl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10002326","id":"be375dfdc"},{"cat":"po","lv":3,"q":"Bei wem muss die Staatsanwaltschaft grundrechtsrelevante Eingriffe wie eine Telefonüberwachung oder Hausdurchsuchung beantragen?","e":"Grundrechtsrelevante Eingriffe wie Hausdurchsuchungen oder Telefonüberwachung muss die Staatsanwaltschaft bei Gericht beantragen.","tag":"Staatsanwaltschaft","c":"Beim zuständigen Gericht","w":["Beim Landespolizeidirektor","Beim Bundesminister für Inneres","Bei der Datenschutzbehörde"],"norm":"§ 101 Abs. 2 StPO","nurl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10002326","id":"b3cac69d8"},{"cat":"po","lv":1,"q":"Wie lange dauert die Polizeigrundausbildung laut polizeikarriere.gv.at?","e":"Die Polizeigrundausbildung dauert zwei Jahre. Danach folgt der Dienst in einer Polizeiinspektion.","tag":"Aufnahme und Ausbildung","c":"Zwei Jahre","w":["Ein Jahr","Drei Jahre","Vier Jahre"],"id":"bd81343ca"},{"cat":"po","lv":1,"q":"Welches Lebensalter in Jahren muss man bei Beginn der Polizeigrundausbildung mindestens vollendet haben?","e":"Zum Zeitpunkt des Beginns der Polizeigrundausbildung muss man das 18. Lebensjahr vollendet haben. Die Bewerbung ist schon früher möglich.","tag":"Aufnahme und Ausbildung","t":"num","ans":18,"id":"b28ca12fa"},{"cat":"po","lv":2,"q":"Wie viele Jahre muss man nach der Grundausbildung mindestens im Bereich der aufnehmenden Landespolizeidirektion Dienst versehen?","e":"Nach Abschluss der Grundausbildung müssen Absolventinnen und Absolventen mindestens fünf Jahre im Bereich der aufnehmenden Landespolizeidirektion dienen.","tag":"Aufnahme und Ausbildung","t":"num","ans":5,"id":"b6dd154c9"},{"cat":"po","lv":3,"q":"Nach welcher Frist können nicht bestandene Teile der psychologischen Eignungsdiagnostik laut polizeikarriere.gv.at wiederholt werden?","e":"In jedem Teilbereich der Eignungsdiagnostik gibt es Mindestwerte. Nicht bestandene Teile können nach sechs Monaten wiederholt werden.","tag":"Aufnahme und Ausbildung","c":"Nach sechs Monaten","w":["Nach drei Monaten","Nach einem Jahr","Am nächsten Tag"],"id":"b97e721d5"},{"cat":"po","lv":1,"q":"Wozu dient das Betretungs- und Annäherungsverbot nach § 38a SPG?","e":"§ 38a SPG: Wenn bestimmte Tatsachen einen gefährlichen Angriff auf Leben, Gesundheit oder Freiheit annehmen lassen, wird dem Gefährder das Betreten der Wohnung der gefährdeten Person untersagt. Damit ist ein Annäherungsverbot verbunden.","tag":"Opferschutz","c":"Zum Schutz vor Gewalt: Der Gefährder darf die Wohnung der gefährdeten Person nicht betreten und sich ihr nicht nähern","w":["Zur Bestrafung von Ruhestörungen und Lärmbelästigungen in Mehrparteienhäusern durch die Hausverwaltung","Zur Überwachung von Personen, denen die Lenkberechtigung wegen Alkohols am Steuer entzogen wurde","Zur Absicherung von Veranstaltungen gegen Ausschreitungen von Zuschauern durch Zutrittsverbote"],"norm":"§ 38a Abs. 1 SPG","nurl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10005792","id":"ba0de5075"},{"cat":"po","lv":2,"q":"Wer kann ein Betretungs- und Annäherungsverbot zum Schutz vor Gewalt anordnen?","e":"Nach § 38a SPG ordnen die Organe des öffentlichen Sicherheitsdienstes das Betretungs- und Annäherungsverbot an. Die Anordnung wird anschließend von der Sicherheitsbehörde überprüft.","tag":"Opferschutz","c":"Die Organe des öffentlichen Sicherheitsdienstes","w":["Nur ein Richter nach einer mündlichen Verhandlung","Nur die Staatsanwaltschaft nach Anzeige","Nur die Gemeinde, in der die Wohnung liegt"],"norm":"§ 38a Abs. 1 SPG","nurl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10005792","id":"b598f565e"},{"cat":"po","lv":3,"q":"In welchem Umkreis in Metern um die Wohnung der gefährdeten Person gilt das Annäherungsverbot nach § 38a SPG?","e":"§ 38a SPG: Das Annäherungsverbot gilt im Umkreis von hundert Metern um die Wohnung bzw. um den Gefährdeten.","tag":"Opferschutz","t":"num","ans":100,"norm":"§ 38a Abs. 1 SPG","nurl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10005792","id":"becb4bc96"},{"cat":"po","lv":3,"q":"Wie lange gilt ein Betretungs- und Annäherungsverbot, wenn kein Antrag auf einstweilige Verfügung bekannt wird?","e":"§ 38a Abs. 10 SPG: Das Verbot endet zwei Wochen nach der Anordnung. Wird innerhalb dieser Frist ein Antrag auf einstweilige Verfügung bekannt, endet es mit der gerichtlichen Entscheidung, längstens vier Wochen nach der Anordnung.","tag":"Opferschutz","c":"Zwei Wochen ab der Anordnung","w":["Drei Tage ab der Anordnung","Sechs Wochen ab der Anordnung","Drei Monate ab der Anordnung"],"norm":"§ 38a Abs. 10 SPG","nurl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10005792","id":"b6a1f11e6"},{"cat":"po","lv":1,"q":"Was versteht man unter „Phishing“?","e":"Beim Phishing täuschen Betrüger mit gefälschten E-Mails, Nachrichten oder Webseiten vor, vertrauenswürdig zu sein, um an Passwörter oder Bankdaten zu kommen.","tag":"Cyberkriminalität","c":"Den Versuch, mit gefälschten Nachrichten an Zugangs- oder Bankdaten zu gelangen","w":["Das Abhören von Telefongesprächen durch dafür zuständige Behörden","Das rechtmäßige Sichern von Beweisen auf Computern und Handys","Das Verschlüsseln von Dateien zum Schutz vor Datendiebstahl"],"id":"bb89895b2"},{"cat":"po","lv":3,"q":"In welchem Fall darf ein Beamter eine Weisung laut § 44 BDG ablehnen?","e":"§ 44 Abs. 2 BDG: Eine Weisung darf abgelehnt werden, wenn sie von einem unzuständigen Organ erteilt wurde oder ihre Befolgung gegen strafgesetzliche Vorschriften verstoßen würde.","tag":"Dienstpflichten","c":"Wenn sie von einem unzuständigen Organ stammt oder ihre Befolgung gegen Strafgesetze verstoßen würde","w":["Wenn er die Weisung für unbequem hält oder sie mit seiner Freizeitplanung unvereinbar ist","Wenn die Weisung nur mündlich und nicht schriftlich oder per Dienstmail erteilt wurde","Wenn eine Kollegin oder ein Kollege eine andere Rechtsmeinung zur Weisung vertritt"],"norm":"§ 44 Abs. 2 BDG","nurl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10008470","id":"bfb6b027e"},{"cat":"po","lv":3,"q":"Ein Beamter hält die Weisung eines zuständigen Vorgesetzten für rechtswidrig, sie verstößt aber nicht gegen Strafgesetze und es besteht keine Gefahr im Verzug. Was muss er laut § 44 BDG tun?","e":"§ 44 Abs. 3 BDG: Hält der Beamte eine Weisung aus einem anderen Grund für rechtswidrig, muss er dem Vorgesetzten vor der Befolgung seine Bedenken mitteilen. Ausgenommen sind unaufschiebbare Maßnahmen bei Gefahr im Verzug.","tag":"Dienstpflichten","c":"Seine Bedenken dem Vorgesetzten mitteilen, bevor er die Weisung befolgt","w":["Die Weisung stillschweigend nicht ausführen und nichts weiter unternehmen","Die Weisung sofort ausführen und seine Bedenken nie äußern","Zuerst ein Gericht um Entscheidung bitten und die Weisung bis dahin ruhen lassen"],"norm":"§ 44 Abs. 3 BDG","nurl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10008470","id":"bad201e6b"},{"cat":"po","lv":1,"q":"Eine Polizistin erfährt im Dienst vertrauliche Details über einen laufenden Ermittlungsfall. Wie verhält sie sich richtig?","e":"Dienstlich erlangte vertrauliche Informationen, etwa zu laufenden Ermittlungen oder personenbezogenen Daten, dürfen nicht an Unbefugte weitergegeben werden. Geheimhaltung ist dort geboten, wo Geheimhaltungsgründe wie Strafverfolgung, Sicherheit oder Datenschutz bestehen.","tag":"Verschwiegenheit","c":"Sie gibt die Informationen nicht an Unbefugte weiter, auch nicht an Freunde oder in sozialen Medien","w":["Sie erzählt sie engen Freunden, wenn diese Stillschweigen versprechen","Sie teilt die Details in sozialen Medien, wenn keine Namen genannt werden","Sie gibt die Details an Bekannte weiter, die sich für den Fall interessieren"],"norm":"§ 46 Abs. 1 BDG","nurl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10008470","id":"b3820db72"},{"cat":"po","lv":3,"q":"Stand 2026: Was gilt in Österreich seit 1. September 2025 anstelle der früheren verfassungsrechtlichen Amtsverschwiegenheit?","e":"Mit dem Informationsfreiheitsgesetz wurde die verfassungsgesetzliche Amtsverschwiegenheit am 1. September 2025 aufgehoben. Es gilt ein Grundrecht auf Zugang zu Informationen (Art. 22a B-VG), Geheimhaltung ist nur bei bestimmten Geheimhaltungsgründen zulässig.","tag":"Verschwiegenheit","c":"Die Informationsfreiheit: ein Grundrecht auf Zugang zu Informationen, Geheimhaltung nur aus bestimmten Gründen","w":["Eine absolute Auskunftssperre aller Behörden gegenüber den Medien und der Öffentlichkeit insgesamt","Eine zeitlich unbefristete Verschwiegenheit über sämtliche Dienstangelegenheiten ohne jede Ausnahme","Eine Genehmigungspflicht des Bundespräsidenten für jede behördliche Auskunft an Privatpersonen"],"vol":true,"norm":"Art. 22a Abs. 2 B-VG","nurl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10000138","id":"b5de64e9e"},{"cat":"po","lv":2,"q":"Darf ein Polizist aus Neugier dienstliche Datenbanken über seinen Nachbarn abfragen?","e":"Personenbezogene Daten dürfen im Dienst nur zweckgebunden verarbeitet werden, also nur soweit dies zur Erfüllung dienstlicher Aufgaben erforderlich ist. Abfragen aus privater Neugier sind unzulässig und können dienst- und strafrechtliche Folgen haben.","tag":"Datenschutz","c":"Nein, Abfragen sind nur zulässig, soweit sie für die dienstliche Aufgabenerfüllung erforderlich sind","w":["Ja, wenn er die Abfrage erst nach Dienstschluss und außerhalb seiner Dienststelle durchführt","Ja, wenn er die gewonnenen Informationen anschließend nicht weitergibt oder verwendet","Ja, weil Polizisten im Dienst grundsätzlich auf alle gespeicherten Daten freien Zugriff haben"],"id":"b3109f7fa"},{"cat":"po","lv":2,"q":"Welches Recht schützt Art. 3 der Europäischen Menschenrechtskonvention (EMRK)?","e":"Art. 3 EMRK verbietet Folter sowie unmenschliche oder erniedrigende Behandlung oder Strafe. Das Verbot gilt auch für Polizeiorgane.","tag":"Menschenrechte","c":"Das Verbot der Folter und unmenschlicher oder erniedrigender Behandlung oder Strafe","w":["Das Recht auf Achtung des Privat- und Familienlebens sowie der Wohnung","Das Recht auf ein faires Verfahren vor einem unabhängigen Gericht","Die Freiheit der Meinungsäußerung und der Informationsfreiheit"],"norm":"Art. 3 EMRK","nurl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10000308","id":"b72fa0dc5"},{"cat":"po","lv":3,"q":"Welche Garantie räumt Art. 5 EMRK (Recht auf Freiheit und Sicherheit) festgenommenen Personen ein?","e":"Art. 5 EMRK: Festgenommene müssen die Gründe in einer verständlichen Sprache erfahren, unverzüglich einem Richter vorgeführt werden und haben das Recht auf gerichtliche Prüfung der Haft.","tag":"Menschenrechte","c":"Sie müssen die Gründe der Festnahme in einer ihnen verständlichen Sprache erfahren","w":["Sie erfahren die Gründe der Festnahme erst bei der Gerichtsverhandlung","Sie dürfen bis zum Urteil ohne richterliche Kontrolle festgehalten werden","Sie haben keinen Anspruch auf gerichtliche Prüfung der Haft"],"norm":"Art. 5 Abs. 2 EMRK","nurl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10000308","id":"b20e52bcd"},{"cat":"po","lv":1,"q":"Unter welchem Alter gelten Kinder in Österreich als strafunmündig, können also nicht strafrechtlich verurteilt werden?","e":"Unmündig ist, wer das 14. Lebensjahr noch nicht vollendet hat. Unmündige sind nicht strafbar. Ab 14 Jahren sind Jugendliche strafrechtlich verantwortlich, es gelten aber besondere Regeln des Jugendstrafrechts.","tag":"Strafmündigkeit","c":"Unter 14 Jahren","w":["Unter 12 Jahren","Unter 16 Jahren","Unter 18 Jahren"],"norm":"§ 4 Abs. 1 JGG","nurl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10002825","id":"bb86d6aae"},{"cat":"po","lv":1,"q":"Was versteht man im Strafrecht unter Notwehr?","e":"Nach § 3 StGB handelt nicht rechtswidrig, wer sich nur der Verteidigung bedient, die notwendig ist, um einen gegenwärtigen oder unmittelbar drohenden rechtswidrigen Angriff abzuwehren.","tag":"Notwehr","c":"Die notwendige Verteidigung gegen einen gegenwärtigen oder unmittelbar drohenden rechtswidrigen Angriff","w":["Die Vergeltung für einen Angriff, der schon lange zurückliegt und beendet ist","Das Handeln auf ausdrücklichen Befehl einer vorgesetzten Person","Jede Gewaltanwendung gegen Personen, mit denen man im Streit liegt"],"norm":"§ 3 Abs. 1 StGB","nurl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10002296","id":"b76a20246"},{"cat":"po","lv":1,"q":"Ein Jugendlicher besprüht die Fassade eines fremden Hauses mit Farbe. Welcher Straftatbestand ist dadurch typischerweise erfüllt?","e":"Wer eine fremde Sache zerstört, beschädigt, verunstaltet oder unbrauchbar macht, begeht Sachbeschädigung (§ 125 StGB). Eine bemalte fremde Fassade ist verunstaltet.","tag":"Sachbeschädigung","c":"Sachbeschädigung","w":["Diebstahl","Raub","Hausfriedensbruch"],"norm":"§ 125 StGB","nurl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10002296","id":"bc4b26371"},{"cat":"po","lv":1,"q":"Wodurch begeht man den Grundtatbestand der Körperverletzung?","e":"§ 83 StGB: Wer einen anderen am Körper verletzt oder an der Gesundheit schädigt, begeht Körperverletzung.","tag":"Körperverletzung","c":"Indem man einen anderen am Körper verletzt oder an der Gesundheit schädigt","w":["Indem man einem anderen eine Sache mit Gewalt wegnimmt","Indem man eine fremde Sache beschädigt oder verunstaltet","Indem man einen anderen öffentlich beschimpft"],"norm":"§ 83 Abs. 1 StGB","nurl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10002296","id":"bb1ace6aa"},{"cat":"po","lv":2,"q":"Welche Aussage beschreibt den Kern der Fahrlässigkeit im Strafrecht am besten?","e":"Nach § 6 StGB handelt fahrlässig, wer die gebotene und zumutbare Sorgfalt außer Acht lässt und deshalb nicht erkennt, dass er einen strafbaren Sachverhalt verwirklichen könnte.","tag":"Fahrlässigkeit","c":"Der Täter lässt die Sorgfalt außer Acht, zu der er verpflichtet und befähigt ist und die ihm zuzumuten ist","w":["Der Täter will den strafbaren Erfolg unbedingt herbeiführen","Der Täter ist zur Tatzeit nachweislich alkoholisiert","Der Täter handelt ausschließlich auf Anweisung einer anderen Person"],"norm":"§ 6 Abs. 1 StGB","nurl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10002296","id":"bc4b0aee6"},{"cat":"po","lv":2,"q":"Wodurch unterscheidet sich ein Raub von einem einfachen Diebstahl?","e":"Raub (§ 142 StGB) setzt Gewalt gegen eine Person oder Drohung mit gegenwärtiger Gefahr für Leib oder Leben voraus. Beim Diebstahl (§ 127 StGB) wird eine fremde bewegliche Sache ohne solche Nötigungsmittel weggenommen.","tag":"Raub und Diebstahl","c":"Beim Raub wird Gewalt gegen eine Person oder eine Drohung mit gegenwärtiger Gefahr für Leib oder Leben eingesetzt","w":["Beim Raub muss die erbeutete Sache einen besonders hohen Wert haben","Beim Raub wird die Sache immer aus einem verschlossenen Gebäude entwendet","Beim Raub handelt der Täter immer gemeinsam mit mindestens einer weiteren Person"],"norm":"§ 142 Abs. 1 StGB","nurl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10002296","id":"b86075481"},{"cat":"po","lv":2,"q":"Welche der folgenden Straftaten ist in ihrer Grundform ein Verbrechen im Sinn des Strafgesetzbuchs?","e":"Verbrechen sind vorsätzliche Taten, die mit lebenslanger oder mehr als dreijähriger Freiheitsstrafe bedroht sind. Raub (§ 142 StGB) erfüllt diese Voraussetzung. Diebstahl, Sachbeschädigung und einfache Körperverletzung sind in ihrer Grundform Vergehen.","tag":"Verbrechen und Vergehen","c":"Raub","w":["Diebstahl","Sachbeschädigung","Körperverletzung"],"id":"b4bb7bb6c"},{"cat":"po","lv":3,"q":"Wann ist eine strafbare Handlung nach dem Strafgesetzbuch ein Verbrechen?","e":"§ 17 StGB: Verbrechen sind vorsätzliche Handlungen, die mit lebenslanger oder mit mehr als dreijähriger Freiheitsstrafe bedroht sind. Alle anderen strafbaren Handlungen sind Vergehen.","tag":"Verbrechen und Vergehen","c":"Wenn sie vorsätzlich begangen wird und mit lebenslanger oder mehr als dreijähriger Freiheitsstrafe bedroht ist","w":["Wenn sie vorsätzlich begangen wird und mit mehr als einjähriger Freiheitsstrafe bedroht ist","Wenn sie fahrlässig begangen wird und mit mehr als dreijähriger Freiheitsstrafe bedroht ist","Wenn sie von einer bereits vorbestraften Person begangen wird"],"norm":"§ 17 Abs. 1 StGB","nurl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10002296","id":"b271216a3"},{"cat":"po","lv":2,"q":"Wann handelt jemand nach dem Strafgesetzbuch vorsätzlich?","e":"§ 5 StGB: Vorsätzlich handelt, wer einen Sachverhalt verwirklichen will, der einem gesetzlichen Tatbild entspricht. Es genügt, dass er die Verwirklichung ernstlich für möglich hält und sich mit ihr abfindet.","tag":"Vorsatz","c":"Wenn er den Sachverhalt verwirklichen will oder ihn ernstlich für möglich hält und sich damit abfindet","w":["Wenn er die Tat gemeinsam mit mindestens einer weiteren Person geplant hat","Wenn er die Tat aus Habgier begeht","Wenn er bereits früher wegen einer gleichartigen Tat verurteilt wurde"],"norm":"§ 5 Abs. 1 StGB","nurl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10002296","id":"bef147775"},{"cat":"po","lv":2,"q":"Darf man sich auch zur Verteidigung einer anderen Person auf Notwehr (Nothilfe) berufen?","e":"§ 3 StGB nennt ausdrücklich den Angriff auf Rechtsgüter „von sich oder einem anderen“. Die Verteidigung muss aber notwendig sein.","tag":"Notwehr","c":"Ja, die notwendige Abwehr eines rechtswidrigen Angriffs auf einen anderen ist ebenfalls gerechtfertigt","w":["Nein, Notwehr gilt ausschließlich zum Schutz der eigenen Person","Nein, nur Angehörige der Polizei dürfen andere Personen verteidigen","Ja, aber nur zum Schutz von Familienmitgliedern"],"norm":"§ 3 Abs. 1 StGB","nurl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10002296","id":"bea240dfe"},{"cat":"po","lv":2,"q":"Wann ist die Hilfeleistung bei einem Unglücksfall nach dem Strafgesetzbuch insbesondere nicht zuzumuten?","e":"§ 95 StGB (Unterlassung der Hilfeleistung): Die Hilfeleistung ist insbesondere dann nicht zuzumuten, wenn sie nur unter Gefahr für Leib oder Leben oder unter Verletzung anderer ins Gewicht fallender Interessen möglich wäre.","tag":"Hilfeleistungspflicht","c":"Wenn sie nur unter Gefahr für Leib oder Leben oder unter Verletzung anderer ins Gewicht fallender Interessen möglich wäre","w":["Wenn der Helfer keine Erste-Hilfe-Ausbildung besitzt","Wenn der Verunglückte dem Helfer persönlich unbekannt ist","Wenn der Verunglückte den Unfall selbst verschuldet hat"],"norm":"§ 95 Abs. 2 StGB","nurl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10002296","id":"ba74966ce"},{"cat":"po","lv":2,"q":"Welche Aussage zum Anzeigerecht einer Privatperson ist nach der Strafprozessordnung richtig?","e":"§ 80 Abs. 1 StPO: Wer von der Begehung einer strafbaren Handlung Kenntnis erlangt, ist zur Anzeige an Kriminalpolizei oder Staatsanwaltschaft berechtigt. Die Anzeigepflicht nach § 78 StPO trifft Behörden und öffentliche Dienststellen.","tag":"Anzeige","c":"Wer von einer strafbaren Handlung erfährt, ist berechtigt, sie bei Kriminalpolizei oder Staatsanwaltschaft anzuzeigen","w":["Anzeigen sind nur zulässig, wenn man selbst Opfer der Tat geworden ist","Anzeigen sind nur gültig, wenn sie schriftlich über einen Rechtsanwalt eingebracht werden","Anzeigen dürfen ausschließlich bei einem Gericht eingebracht werden"],"norm":"§ 80 Abs. 1 StPO","nurl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10002326","id":"bc8bb64cf"},{"cat":"po","lv":3,"q":"Wer ist nach der Strafprozessordnung zur Anzeige verpflichtet, wenn der Verdacht einer Straftat bekannt wird, die ihren gesetzmäßigen Wirkungsbereich betrifft?","e":"§ 78 StPO: Wird einer Behörde oder öffentlichen Dienststelle der Verdacht einer Straftat bekannt, die ihren gesetzmäßigen Wirkungsbereich betrifft, so ist sie zur Anzeige an Kriminalpolizei oder Staatsanwaltschaft verpflichtet. Privatpersonen sind dazu nach § 80 StPO berechtigt.","tag":"Anzeige","c":"Behörden und öffentliche Dienststellen, deren Wirkungsbereich die Straftat betrifft","w":["Jede Privatperson, die zufällig von der Tat erfährt","Ausschließlich die Opfer der Tat und deren Angehörige","Ausschließlich Rechtsanwälte und Notare"],"norm":"§ 78 Abs. 1 StPO","nurl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10002326","id":"b3f5f6003"},{"cat":"po","lv":3,"q":"Was darf eine Privatperson nach der Strafprozessordnung tun, wenn sie auf Grund bestimmter Tatsachen annehmen kann, dass jemand gerade eine Straftat begeht?","e":"§ 80 Abs. 2 StPO: Wer auf Grund bestimmter Tatsachen annehmen kann, dass jemand eine strafbare Handlung ausführt, ist berechtigt, die Person auf verhältnismäßige Weise anzuhalten. Er ist aber zur unverzüglichen Anzeige an das nächste erreichbare Organ des öffentlichen Sicherheitsdienstes verpflichtet.","tag":"Anhalterecht","c":"Die Person auf verhältnismäßige Weise anhalten und unverzüglich das nächste erreichbare Organ des öffentlichen Sicherheitsdienstes verständigen","w":["Die Person festhalten und so lange befragen, bis sie ein Geständnis ablegt","Die Person ausschließlich beobachten, ein Anhalten ist Privatpersonen untersagt","Die Person mit allen Mitteln so lange festhalten, wie sie es für richtig hält"],"norm":"§ 80 Abs. 2 StPO","nurl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10002326","id":"b988b9dea"},{"cat":"po","lv":3,"q":"Ein Lenker überholt trotz Gegenverkehr, hält einen Unfall ernstlich für möglich und denkt: „Dann passiert es eben.“ Welche Schuldform liegt vor?","e":"Wer die Verwirklichung eines Tatbildes ernstlich für möglich hält und sich mit ihr abfindet, handelt mit (bedingtem) Vorsatz (§ 5 StGB). Bei bewusster Fahrlässigkeit hält der Täter den Erfolg zwar für möglich, will ihn aber nicht herbeiführen.","tag":"Vorsatz","c":"Bedingter Vorsatz","w":["Bewusste Fahrlässigkeit","Unbewusste Fahrlässigkeit","Absichtliches Handeln"],"norm":"§ 5 Abs. 1 StGB","nurl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10002296","id":"b1d01f612"},{"cat":"po","lv":3,"q":"Was kennzeichnet bewusste Fahrlässigkeit?","e":"§ 6 Abs. 2 StGB: Fahrlässig handelt auch, wer es für möglich hält, dass er einen strafbaren Sachverhalt verwirkliche, ihn aber nicht herbeiführen will. Erkennt der Täter die Gefahr nicht, spricht man von unbewusster Fahrlässigkeit.","tag":"Fahrlässigkeit","c":"Der Täter hält den Erfolg für möglich, will ihn aber nicht herbeiführen","w":["Der Täter erkennt die Gefahr gar nicht und handelt deshalb sorglos","Der Täter hält den Erfolg für gewiss und führt ihn dennoch herbei","Der Täter will den Erfolg unbedingt erreichen und plant die Tat im Voraus"],"norm":"§ 6 Abs. 2 StGB","nurl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10002296","id":"b31e2f907"},{"cat":"po","lv":3,"q":"In welchem Fall ist eine Verteidigung trotz eines rechtswidrigen Angriffs nach dem Strafgesetzbuch nicht gerechtfertigt?","e":"§ 3 Abs. 1 StGB: Die Handlung ist nicht gerechtfertigt, wenn es offensichtlich ist, dass dem Angegriffenen bloß ein geringer Nachteil droht und die Verteidigung, insbesondere wegen der Schwere der nötigen Beeinträchtigung des Angreifers, unangemessen ist.","tag":"Notwehr","c":"Wenn dem Angegriffenen offensichtlich nur ein geringer Nachteil droht und die Verteidigung unangemessen ist","w":["Wenn der Angreifer unter Alkoholeinfluss steht","Wenn der Angegriffene vorher die Polizei nicht verständigt hat","Wenn der Angriff ohne Waffe geführt wird"],"norm":"§ 3 Abs. 1 StGB","nurl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10002296","id":"bf744240c"},{"cat":"po","lv":3,"q":"Jemand überschreitet aus Bestürzung, Furcht oder Schrecken das gerechtfertigte Maß der Verteidigung. Wann ist er strafbar?","e":"§ 3 Abs. 2 StGB: Wer das gerechtfertigte Maß der Verteidigung lediglich aus Bestürzung, Furcht oder Schrecken überschreitet, ist nur strafbar, wenn die Überschreitung auf Fahrlässigkeit beruht und die fahrlässige Handlung mit Strafe bedroht ist.","tag":"Notwehr","c":"Nur wenn die Überschreitung auf Fahrlässigkeit beruht und die fahrlässige Handlung mit Strafe bedroht ist","w":["Immer, so wie bei einer vorsätzlich begangenen Tat","Nie, in diesem Fall bleibt er stets straflos","Nur wenn er den Angreifer vorher gekannt hat"],"norm":"§ 3 Abs. 2 StGB","nurl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10002296","id":"b4201c165"},{"cat":"po","lv":1,"q":"Welche Höchstgeschwindigkeit gilt für Pkw im Ortsgebiet, sofern nichts anderes verordnet ist?","e":"§ 20 Abs. 2 StVO: Im Ortsgebiet gilt 50 km/h, auf Freilandstraßen 100 km/h und auf Autobahnen 130 km/h, sofern nicht anderes verordnet ist.","tag":"Geschwindigkeit","c":"50 km/h","w":["30 km/h","40 km/h","60 km/h"],"norm":"§ 20 Abs. 2 StVO","nurl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10011336","id":"be5bbc485"},{"cat":"po","lv":1,"q":"Welche Höchstgeschwindigkeit gilt für Pkw auf Autobahnen, sofern nichts anderes verordnet ist?","e":"§ 20 Abs. 2 StVO: Auf Autobahnen beträgt die Höchstgeschwindigkeit 130 km/h, auf Freilandstraßen 100 km/h. Durch Verordnung oder Verkehrszeichen kann sie abweichend festgelegt sein.","tag":"Geschwindigkeit","c":"130 km/h","w":["110 km/h","120 km/h","140 km/h"],"norm":"§ 20 Abs. 2 StVO","nurl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10011336","id":"b1f564229"},{"cat":"po","lv":1,"q":"Wer muss in einem Pkw den Sicherheitsgurt anlegen, wenn der Sitzplatz damit ausgestattet ist?","e":"Nach § 106 Abs. 2 KFG müssen Lenker und beförderte Personen auf Sitzplätzen, die mit Sicherheitsgurten ausgestattet sind, diese während der Fahrt bestimmungsgemäß gebrauchen.","tag":"Gurtenpflicht","c":"Der Lenker und alle beförderten Personen","w":["Nur der Lenker","Nur die Personen auf den Vordersitzen","Nur Personen über 18 Jahren"],"norm":"§ 106 Abs. 2 KFG","nurl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10011384","id":"b0f58833c"},{"cat":"po","lv":1,"q":"Wie ist der Vorrang an einer Kreuzung geregelt, an der weder Verkehrszeichen noch Ampel noch ein Organ der Straßenaufsicht etwas anderes bestimmen?","e":"§ 19 Abs. 1 StVO: Fahrzeuge, die von rechts kommen, haben grundsätzlich Vorrang. Ausnahmen gelten unter anderem für Einsatzfahrzeuge und für Vorrangstraßen.","tag":"Vorrang","c":"Fahrzeuge, die von rechts kommen, haben Vorrang (Rechtsregel)","w":["Fahrzeuge, die von links kommen, haben Vorrang","Das schnellere Fahrzeug hat Vorrang","Das größere Fahrzeug hat Vorrang"],"norm":"§ 19 Abs. 1 StVO","nurl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10011336","id":"bf3978236"},{"cat":"po","lv":1,"q":"Welche Aussage zum Telefonieren mit dem Mobiltelefon beim Lenken eines Kraftfahrzeugs ist richtig?","e":"§ 102 Abs. 3 KFG: Beim Lenken ist das Telefonieren ohne Freisprecheinrichtung verboten. Auch jede andere Handynutzung in der Hand ist untersagt, ausgenommen fest montierte Navigationsgeräte.","tag":"Handy am Steuer","c":"Telefonieren ist nur mit einer Freisprecheinrichtung erlaubt","w":["Telefonieren in der Hand ist erlaubt, wenn das Gespräch kurz ist","Telefonieren ist nur auf Freilandstraßen verboten","Telefonieren in der Hand ist erlaubt, wenn kein anderes Fahrzeug in der Nähe ist"],"norm":"§ 102 Abs. 3 KFG","nurl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10011384","id":"b16150169"},{"cat":"po","lv":1,"q":"Wie nennt die Straßenverkehrsordnung das Abstellen eines Fahrzeugs für längere Zeit als beim Halten (Halten bis zu etwa zehn Minuten)?","e":"§ 2 StVO unterscheidet das Halten (kurze Unterbrechung der Fahrt, bis zu zehn Minuten oder für die Dauer einer Ladetätigkeit) vom Parken. Parken ist das Stehenlassen eines Fahrzeugs für eine längere Zeitdauer.","tag":"Halten und Parken","c":"Parken","w":["Abstellen im Halteverbot","Stehen im Bereitstellungsraum","Rasten"],"norm":"§ 2 Abs. 1 Z 28 StVO","nurl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10011336","id":"b24fe189f"},{"cat":"po","lv":1,"q":"Welche Form hat das Verkehrszeichen „Vorrang geben“?","e":"Das Zeichen „Vorrang geben“ ist ein gleichseitiges Dreieck mit der Spitze nach unten und rotem Rand. Das Dreieck mit der Spitze nach oben ist die Grundform der Gefahrenzeichen.","tag":"Verkehrszeichen","c":"Gleichseitiges Dreieck mit der Spitze nach unten und rotem Rand","w":["Gleichseitiges Dreieck mit der Spitze nach oben und rotem Rand","Achteck mit rotem Grund","Kreis mit rotem Rand und weißem Grund"],"norm":"§ 52 lit. c Z 23 StVO","nurl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10011336","id":"b7ae52d97"},{"cat":"po","lv":1,"q":"Welche Form hat das Verkehrszeichen „Halt“?","e":"Das Verkehrszeichen „Halt“ (Stoppschild) ist achteckig. Vor ihm muss an der Haltelinie oder vor der Kreuzung angehalten werden.","tag":"Verkehrszeichen","c":"Achteck","w":["Dreieck mit der Spitze nach unten","Kreis","Quadrat"],"norm":"§ 52 lit. c Z 24 StVO","nurl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10011336","id":"be4ae1660"},{"cat":"po","lv":1,"q":"Wann müssen Lenker auf einer Autobahn eine Rettungsgasse bilden?","e":"§ 46 Abs. 6 StVO: Sobald sich der Verkehr auf Autobahnen mit mindestens zwei Fahrstreifen stauungsbedingt mit Schrittgeschwindigkeit bewegt oder zum Stillstand kommt, ist eine Rettungsgasse zu bilden.","tag":"Rettungsgasse","c":"Sobald der Verkehr stockt (Schrittgeschwindigkeit oder Stillstand), damit Einsatzfahrzeuge durchfahren können","w":["Nur wenn ein Einsatzfahrzeug bereits unmittelbar hinter ihnen fährt","Nur bei Nacht oder bei Nebel","Nur wenn der Verkehr vollständig zum Stillstand gekommen ist und eine Tafel dies anzeigt"],"norm":"§ 46 Abs. 6 StVO","nurl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10011336","id":"b410601cf"},{"cat":"po","lv":2,"q":"Wo wird auf einer Autobahn mit mehr als zwei Fahrstreifen je Richtung die Rettungsgasse gebildet?","e":"§ 46 Abs. 6 StVO: Bei mehr als zwei Fahrstreifen wird die Rettungsgasse zwischen dem äußerst linken und dem daneben liegenden Fahrstreifen gebildet. Die übrigen Fahrzeuge weichen nach rechts aus.","tag":"Rettungsgasse","c":"Zwischen dem äußerst linken und dem daneben liegenden Fahrstreifen","w":["Zwischen dem äußerst rechten und dem daneben liegenden Fahrstreifen","Auf dem Pannenstreifen allein","Auf dem äußerst linken Fahrstreifen allein"],"norm":"§ 46 Abs. 6 StVO","nurl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10011336","id":"b3193c716"},{"cat":"po","lv":2,"q":"Ein zehnjähriges Kind ist 130 cm groß und fährt in einem Pkw mit. Wie ist es nach dem Kraftfahrgesetz zu sichern?","e":"§ 106 Abs. 5 KFG: Kinder bis zur Vollendung des 14. Lebensjahres müssen ab 135 cm Körpergröße mit dem Sicherheitsgurt gesichert werden. Unter 135 cm ist eine geeignete Rückhalteeinrichtung vorgeschrieben.","tag":"Gurtenpflicht","c":"Mit einer geeigneten Rückhalteeinrichtung, zum Beispiel einem Kindersitz mit Sitzerhöhung","w":["Mit dem normalen Sicherheitsgurt, weil es älter als sieben Jahre ist","Gar nicht, auf dem Rücksitz besteht keine Sicherungspflicht","Mit dem normalen Sicherheitsgurt, aber nur auf der Autobahn"],"norm":"§ 106 KFG","nurl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10011384","id":"bd88d2248"},{"cat":"po","lv":2,"q":"Ein zwölfjähriges Kind ist 145 cm groß. Wie ist es im Pkw nach dem Kraftfahrgesetz zu sichern?","e":"§ 106 Abs. 5 KFG: Ab einer Körpergröße von 135 cm genügt bei Kindern bis zum vollendeten 14. Lebensjahr der Sicherheitsgurt. Unter 135 cm ist eine Rückhalteeinrichtung vorgeschrieben. Bis 150 cm wird ein Kindersitz empfohlen, ist aber keine Pflicht.","tag":"Gurtenpflicht","c":"Mit dem normalen Sicherheitsgurt, weil es mindestens 135 cm groß ist","w":["Mit einer Rückhalteeinrichtung, weil es unter 14 Jahre alt ist","Mit einer Rückhalteeinrichtung, bis es 150 cm groß ist","Es besteht keine Sicherungspflicht im Fond"],"norm":"§ 106 KFG","nurl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10011384","id":"b8ff1e390"},{"cat":"po","lv":2,"q":"Welche Aussage zum Alkohol am Steuer gilt für Pkw-Lenker mit Führerschein der Klasse B (ohne Probezeit) grundsätzlich?","e":"Nach den Informationen auf oesterreich.gv.at ist das Lenken eines Kfz mit weniger als 0,5 Promille Blutalkohol zulässig. Das entspricht 0,25 mg/l Atemalkohol.","tag":"Alkohol am Steuer","c":"Der Blutalkoholgehalt muss unter 0,5 Promille liegen","w":["Der Blutalkoholgehalt muss unter 0,8 Promille liegen","Der Blutalkoholgehalt muss unter 0,1 Promille liegen","Der Blutalkoholgehalt muss unter 1,2 Promille liegen"],"norm":"§ 14 Abs. 8 FSG","nurl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10012723","id":"bb7cf5660"},{"cat":"po","lv":2,"q":"Welcher Atemalkoholwert entspricht dem Blutalkoholgehalt von 0,5 Promille?","e":"0,5 Promille Blutalkohol entsprechen 0,25 mg Alkohol pro Liter Atemluft. Atemalkohol wird in mg/l, Blutalkohol in Promille angegeben.","tag":"Alkohol am Steuer","c":"0,25 mg/l","w":["0,05 mg/l","0,50 mg/l","0,80 mg/l"],"norm":"§ 14 Abs. 8 FSG","nurl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10012723","id":"b521b975c"},{"cat":"po","lv":2,"q":"Für welche Lenkergruppe gilt in Österreich eine Alkoholgrenze von 0,1 Promille?","e":"Die 0,1-Promille-Grenze gilt unter anderem für Probeführerscheinbesitzer, Lenker bei Übungsfahrten, Fahrschulfahrten, Lenker der Klassen C und D sowie bei Schülertransporten.","tag":"Alkohol am Steuer","c":"Für Lenker mit Probeführerschein","w":["Für alle Lenker über 60 Jahren","Für Lenker von Pkw mit mehr als drei Insassen","Für Lenker, die sich auf der Autobahn befinden"],"norm":"§ 4 Abs. 7 FSG","nurl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10012723","id":"b5de0889f"},{"cat":"po","lv":2,"q":"Wo darf ein Pkw auf einer Autobahn nur bei einer Panne anhalten?","e":"Auf Autobahnen darf bei einer Panne am Pannenstreifen angehalten werden. Das Umkehren und Rückwärtsfahren sind auf Autobahnen verboten.","tag":"Autobahn","c":"Auf dem Pannenstreifen","w":["Auf dem äußerst linken Fahrstreifen","Auf der Zufahrt zur Autobahn","Auf jedem beliebigen Fahrstreifen mit eingeschaltetem Warnblinklicht"],"norm":"§ 46 Abs. 3 StVO","nurl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10011336","id":"b873462fc"},{"cat":"po","lv":2,"q":"Welche Verkehrsteilnehmer dürfen Autobahnen nach der Straßenverkehrsordnung nicht benutzen?","e":"§ 46 Abs. 1 StVO: Auf Autobahnen sind Fußgänger, Fahrräder und Mopeds verboten, ebenso Fahrzeuge, die nicht mindestens 60 km/h Bauartgeschwindigkeit erreichen.","tag":"Autobahn","c":"Fußgänger, Radfahrer und Lenker von Mopeds","w":["Pkw mit mehr als drei Insassen","Lenker mit einem Führerschein, der jünger als zwei Jahre ist","Fahrzeuge mit Anhänger, die nicht schneller als 100 km/h fahren"],"norm":"§ 46 Abs. 1 StVO","nurl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10011336","id":"b4d32fef2"},{"cat":"po","lv":1,"q":"Was muss ein Fahrzeuglenker tun, wenn ein Fußgänger erkennbar einen Schutzweg (Zebrastreifen) benützen will?","e":"§ 9 Abs. 2 StVO: Der Lenker muss sich einem Schutzweg so nähern, dass er anhalten kann, und Fußgängern, die ihn erkennbar benützen wollen, das ungehinderte und ungefährdete Überqueren ermöglichen.","tag":"Schutzweg","c":"Anhalten und ihm das ungehinderte und ungefährdete Überqueren ermöglichen","w":["Hupen und weiterfahren, damit der Fußgänger wartet","Mit unveränderter Geschwindigkeit weiterfahren, solange der Fußgänger noch am Gehsteig steht","Nur bei Rotlicht anhalten, sonst hat der Fahrzeugverkehr Vorrang"],"norm":"§ 9 Abs. 2 StVO","nurl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10011336","id":"b014a8c68"},{"cat":"po","lv":1,"q":"Wer muss auf einem Motorrad nach dem Kraftfahrgesetz einen Sturzhelm tragen?","e":"§ 106 Abs. 7 KFG regelt die Sturzhelmpflicht für Lenker und beförderte Personen auf Krafträdern.","tag":"Sturzhelm","c":"Der Lenker und der Mitfahrer","w":["Nur der Lenker","Nur der Mitfahrer","Nur wer schneller als 60 km/h fährt"],"norm":"§ 106 Abs. 7 KFG","nurl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10011384","id":"b5ac9803e"},{"cat":"po","lv":1,"q":"Wie müssen Radfahrer anzeigen, dass sie abbiegen wollen?","e":"Radfahrer müssen eine beabsichtigte Richtungsänderung durch ein deutliches Handzeichen anzeigen.","tag":"Fahrrad","c":"Durch ein deutliches Handzeichen","w":["Durch Hupen","Durch Blickkontakt mit dem nachfolgenden Verkehr, ein Zeichen ist nicht nötig","Durch Klingeln"],"norm":"§ 11 Abs. 3 StVO","nurl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10011336","id":"b0df5c6e4"},{"cat":"po","lv":1,"q":"Wie müssen sich Personen verhalten, deren Verhalten mit einem Verkehrsunfall in ursächlichem Zusammenhang steht?","e":"§ 4 StVO: Alle Personen, deren Verhalten am Unfallort mit einem Verkehrsunfall in ursächlichem Zusammenhang steht, haben sofort anzuhalten, nötige Maßnahmen zu treffen und an der Feststellung des Sachverhalts mitzuwirken.","tag":"Verkehrsunfall","c":"Sofort anhalten und an der Feststellung des Sachverhalts mitwirken","w":["Weiterfahren und sich am nächsten Tag bei der Polizei melden","Zuerst die Kfz-Versicherung anrufen und dann anhalten
