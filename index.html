 wird mit „qu“ am Anfang und „äne“ am Ende geschrieben: Quarantäne.","tag":"Fremdwörter","t":"text","ans":["Quarantäne"],"id":"b94cbc229"},{"cat":"rs","lv":3,"q":"Wie schreibt man das Wort für ein kleines Stück Gartenland, in dem Blumen oder Gemüse wachsen, richtig?","e":"Das lange e wird in „Beet“ als „ee“ geschrieben. „Bett“ mit „tt“ ist ein Möbelstück zum Schlafen.","tag":"Dehnung","c":"Beet","w":["Bet","Beht","Beeth"],"par":"§ 9","id":"b0434244f"},{"cat":"rs","lv":3,"q":"Welche Regel gilt für Verbindungen mit dem Verb „sein“, zum Beispiel „da sein“ oder „zusammen sein“?","e":"„Sein“ bildet mit anderen Wörtern keine Zusammensetzung: da sein, zusammen sein, weg sein. Als Hauptwort schreibt man zusammen: das Dasein.","tag":"Getrennt- und Zusammenschreibung","c":"Sie werden immer getrennt geschrieben.","w":["Sie werden immer zusammengeschrieben.","Sie werden immer mit Bindestrich verbunden.","Sie werden nur in der Grundform zusammengeschrieben."],"par":"§ 35","id":"bf9072838"},{"cat":"rs","lv":3,"q":"Welche Schreibung der wörtlichen Rede mit einer Frage ist richtig?","e":"Nach einer wörtlichen Rede, die mit Fragezeichen endet, steht bei folgendem Begleitsatz trotzdem ein Komma nach den Anführungszeichen.","tag":"Zeichensetzung","c":"„Wann beginnt der Dienst?“, fragte der Rekrut.","w":["„Wann beginnt der Dienst?“ fragte der Rekrut.","„Wann beginnt der Dienst“?, fragte der Rekrut.","„Wann beginnt der Dienst?“. fragte der Rekrut."],"par":"§ 79","id":"bfa2ee878"},{"cat":"rs","lv":2,"q":"Ein Wort im folgenden Satz ist falsch geschrieben. Welches? „Die Kammera funktioniert nicht, weil der Akku leer ist.“","e":"Richtig heißt es „Kamera“ mit nur einem „m“ (lateinisch camera).","tag":"Fehlersuche","c":"Kammera","w":["funktioniert","Akku","leer"],"par":"§ 4","id":"b88ea997e"},{"cat":"rs","lv":3,"q":"Welcher dieser Sätze ist ohne Komma richtig geschrieben?","e":"Die Verbindung zweier Tätigkeiten mit „und“ braucht kein Komma. In den anderen Sätzen fehlen die Kommas vor dem Nebensatz bzw. um den Relativsatz.","tag":"Zeichensetzung","c":"Wir gingen in den Park und spielten Fußball.","w":["Ich weiß dass er recht hat.","Er blieb daheim weil es regnete.","Das Rad das dort steht ist neu."],"par":"§ 71","id":"b90a8b0bb"},{"cat":"rs","lv":3,"q":"Welche Schreibweise des Wortes mit der Bedeutung „trotzdem“ ist richtig?","e":"„Nichtsdestoweniger“ wird in einem Wort geschrieben und enthält „nichts“ mit „s“.","tag":"Getrennt- und Zusammenschreibung","c":"nichtsdestoweniger","w":["nichts desto weniger","nichts-desto-weniger","nichtsdestowenniger"],"par":"§ 39","id":"b935c921a"},{"cat":"rs","lv":2,"q":"Welche Schreibweise ist richtig? „Meine Schwester kann gut ___.“","e":"Hauptwort und Verb werden getrennt geschrieben: Klavier spielen, Fußball spielen. Nur als Hauptwort schreibt man zusammen: das Klavierspielen.","tag":"Getrennt- und Zusammenschreibung","c":"Klavier spielen","w":["Klavierspielen","Klavier-spielen","Klavier spiehlen"],"id":"b62b9e14b"},{"cat":"rs","lv":1,"q":"Im Satz „Ich glaube dass du recht hast.“ fehlt ein Komma. Wo muss es stehen?","e":"Das Komma trennt den Hauptsatz „Ich glaube“ vom Nebensatz „dass du recht hast“ und steht vor „dass“.","tag":"Zeichensetzung","c":"vor „dass“","w":["nach „Ich“","nach „du“","nach „recht“"],"par":"§ 73","id":"b2e940372"},{"cat":"st","lv":1,"q":"Wie viele politische Bezirke hat die Steiermark, wenn man die Landeshauptstadt Graz als eigenen Bezirk mitzählt?","e":"Die Steiermark gliedert sich in 13 politische Bezirke. Einer davon ist die Statutarstadt Graz, die übrigen zwölf werden von Bezirkshauptmannschaften verwaltet.","tag":"Verwaltung","t":"num","ans":13,"id":"b508a0ee5"},{"cat":"st","lv":1,"q":"Wie heißt die Landeshauptstadt der Steiermark?","e":"Graz ist die Landeshauptstadt der Steiermark und Sitz von Landtag und Landesregierung.","tag":"Geografie","c":"Graz","w":["Leoben","Klagenfurt","Bruck an der Mur"],"id":"bf86abe91"},{"cat":"st","lv":1,"q":"Mit welchem Staat hat die Steiermark eine gemeinsame Staatsgrenze?","e":"Im Süden grenzt die Steiermark an Slowenien. Es ist ihr einziges Nachbarland außerhalb Österreichs.","tag":"Geografie","c":"Slowenien","w":["Ungarn","Italien","Tschechien"],"id":"b0a01a174"},{"cat":"st","lv":1,"q":"Welches dieser Bundesländer grenzt nicht an die Steiermark?","e":"Die Steiermark grenzt an Burgenland, Niederösterreich, Oberösterreich, Salzburg und Kärnten. Tirol, Vorarlberg und Wien haben keine gemeinsame Grenze mit ihr.","tag":"Geografie","c":"Tirol","w":["Salzburg","Oberösterreich","Burgenland"],"id":"bb5e84eb3"},{"cat":"st","lv":2,"q":"Welches Bundesland ist flächenmäßig größer als die Steiermark?","e":"Mit rund 16.400 km² ist die Steiermark das zweitgrößte Bundesland. Nur Niederösterreich mit rund 19.200 km² ist größer.","tag":"Geografie","c":"Niederösterreich","w":["Oberösterreich","Kärnten","Tirol"],"id":"bec355c0c"},{"cat":"st","lv":1,"q":"Welchen Beinamen verwendet die Steiermark für sich?","e":"Wegen ihrer ausgedehnten Wälder und Wiesen nennt sich die Steiermark das „Grüne Herz Österreichs“.","tag":"Geografie","c":"„Grünes Herz Österreichs“","w":["„Sonnenland Österreichs“","„Kornkammer Österreichs“","„Tor zum Süden Österreichs“"],"id":"b5110f50f"},{"cat":"st","lv":1,"q":"Wie groß ist ungefähr der Anteil des Waldes an der Landesfläche der Steiermark?","e":"Etwa drei Fünftel der Landesfläche sind bewaldet. Das passt zum Beinamen „Grünes Herz Österreichs“.","tag":"Geografie","c":"Rund 60 Prozent","w":["Rund 25 Prozent","Rund 40 Prozent","Rund 80 Prozent"],"id":"bca192393"},{"cat":"st","lv":2,"q":"In welcher Stadt hat die Bezirkshauptmannschaft des Bezirks Murtal ihren Sitz?","e":"Der Bezirk Murtal entstand 2012 aus den früheren Bezirken Judenburg und Knittelfeld. Sitz der Bezirkshauptmannschaft ist Judenburg; in Knittelfeld gibt es eine Außenstelle.","tag":"Verwaltung","c":"Judenburg","w":["Knittelfeld","Zeltweg","Leoben"],"id":"b5fb7e12f"},{"cat":"st","lv":2,"q":"Welcher steirische Bezirk ist der flächengrößte Bezirk ganz Österreichs?","e":"Der Bezirk Liezen umfasst rund 3.300 km² und ist damit der größte Bezirk Österreichs. Neben der Bezirkshauptmannschaft in Liezen gibt es eine Außenstelle in Gröbming.","tag":"Verwaltung","c":"Liezen","w":["Murau","Leoben","Hartberg-Fürstenfeld"],"id":"b3a2c7bab"},{"cat":"st","lv":2,"q":"Welche Stadt ist Sitz der Bezirkshauptmannschaft Bruck-Mürzzuschlag?","e":"Der Bezirk Bruck-Mürzzuschlag entstand 2013 aus den Bezirken Bruck an der Mur und Mürzzuschlag. Die Bezirkshauptmannschaft befindet sich in Bruck an der Mur.","tag":"Verwaltung","c":"Bruck an der Mur","w":["Mürzzuschlag","Kapfenberg","Kindberg"],"id":"b6263f0c9"},{"cat":"st","lv":1,"q":"Wie heißt der gebirgige nördliche Teil der Steiermark mit dem Ennstal und der Mur-Mürz-Furche?","e":"Obersteiermark ist die traditionelle Bezeichnung für den Norden des Landes. Dort liegen unter anderem Leoben, Bruck an der Mur, Liezen und Schladming.","tag":"Regionen","c":"Obersteiermark","w":["Oststeiermark","Weststeiermark","Südsteiermark"],"id":"b9d6e4557"},{"cat":"st","lv":2,"q":"Welche Stadt ist Sitz der Bezirkshauptmannschaft Südoststeiermark?","e":"Die Bezirkshauptmannschaft Südoststeiermark hat ihren Sitz in Feldbach.","tag":"Verwaltung","c":"Feldbach","w":["Bad Radkersburg","Fürstenfeld","Gleisdorf"],"id":"b6b0e69a9"},{"cat":"st","lv":1,"q":"Wie heißt das große Tal im Norden der Steiermark, in dem Schladming, Liezen und Admont liegen?","e":"Durch das Ennstal fließt die Enns von Westen nach Osten. Es gehört zur Obersteiermark.","tag":"Regionen","c":"Ennstal","w":["Mürztal","Murtal","Paltental"],"id":"b01aee6a5"},{"cat":"st","lv":3,"q":"Wo befindet sich der Sitz der Bezirkshauptmannschaft Graz-Umgebung?","e":"Graz bildet als Statutarstadt einen eigenen Bezirk. Die Bezirkshauptmannschaft für den umliegenden Bezirk Graz-Umgebung hat ihren Sitz dennoch in der Stadt Graz.","tag":"Verwaltung","c":"Graz","w":["Gratkorn","Frohnleiten","Premstätten"],"id":"bf9e42609"},{"cat":"st","lv":3,"q":"In welchem Bezirk liegt der Wallfahrtsort Mariazell?","e":"Mariazell liegt im Norden der Steiermark und gehört zum Bezirk Bruck-Mürzzuschlag.","tag":"Orte","c":"Bruck-Mürzzuschlag","w":["Liezen","Leoben","Murtal"],"id":"be96b2a5b"},{"cat":"st","lv":3,"q":"Zu welchem Bezirk gehört die Stadt Gleisdorf?","e":"Gleisdorf liegt im Raabtal und gehört zum Bezirk Weiz.","tag":"Orte","c":"Weiz","w":["Hartberg-Fürstenfeld","Südoststeiermark","Graz-Umgebung"],"id":"b6b492b41"},{"cat":"st","lv":2,"q":"Welche steirische Stadt ist eine Statutarstadt, bildet also zugleich einen eigenen Bezirk?","e":"Graz ist die einzige Statutarstadt der Steiermark und führt die Bezirksverwaltung selbst. Alle übrigen Bezirke werden von Bezirkshauptmannschaften verwaltet.","tag":"Verwaltung","c":"Graz","w":["Leoben","Kapfenberg","Bruck an der Mur"],"id":"bc2f05384"},{"cat":"st","lv":3,"q":"Welche slowenische Stadt liegt Bad Radkersburg am Fluss Mur direkt gegenüber?","e":"Bad Radkersburg und Gornja Radgona liegen beiderseits der Mur an der Staatsgrenze.","tag":"Orte","c":"Gornja Radgona","w":["Maribor","Ptuj","Murska Sobota"],"id":"b5f736286"},{"cat":"st","lv":3,"q":"Welche beiden früheren Bezirke wurden 2013 zum Bezirk Südoststeiermark zusammengelegt?","e":"Der Bezirk Südoststeiermark entstand 2013 aus den Bezirken Feldbach und Radkersburg. Hartberg und Fürstenfeld wurden im selben Jahr zum Bezirk Hartberg-Fürstenfeld vereinigt.","tag":"Verwaltung","c":"Feldbach und Radkersburg","w":["Hartberg und Fürstenfeld","Leibnitz und Deutschlandsberg","Weiz und Voitsberg"],"id":"b0adcba3a"},{"cat":"st","lv":1,"q":"Welcher Fluss fließt durch die Stadt Graz?","e":"Die Mur entspringt im Salzburger Lungau und durchquert die Steiermark. Auch die Murinsel in Graz liegt in diesem Fluss.","tag":"Flüsse","c":"Mur","w":["Enns","Mürz","Raab"],"id":"bfba86c68"},{"cat":"st","lv":1,"q":"Wie heißt der höchste Gipfel der Steiermark?","e":"Der Hohe Dachstein erreicht 2.995 m und ist der höchste Berg der Steiermark. Sein Gipfel liegt an der Grenze zu Oberösterreich.","tag":"Berge","c":"Hoher Dachstein","w":["Hochschwab","Grimming","Schöckl"],"id":"bd07a0b05"},{"cat":"st","lv":1,"q":"Wie heißt der einzige Nationalpark der Steiermark?","e":"Der Nationalpark Gesäuse liegt im Ennstal zwischen Admont und Hieflau. Die Hohen Tauern gehören zu Salzburg, Kärnten und Tirol, die Kalkalpen zu Oberösterreich, die Donau-Auen zu Niederösterreich und Wien.","tag":"Natur","c":"Nationalpark Gesäuse","w":["Nationalpark Hohe Tauern","Nationalpark Kalkalpen","Nationalpark Donau-Auen"],"id":"bf041ca91"},{"cat":"st","lv":2,"q":"In welchen größeren Fluss mündet die Enns, die durch den Norden der Steiermark fließt?","e":"Die Enns entspringt in den Radstädter Tauern im Land Salzburg, durchfließt das steirische Ennstal und mündet in Oberösterreich in die Donau.","tag":"Flüsse","c":"Donau","w":["Mur","Drau","Inn"],"id":"bdeb10eea"},{"cat":"st","lv":2,"q":"Welche Stadt wird mit Quellwasser aus dem Hochschwab-Gebiet versorgt?","e":"Seit 1910 liefert die II. Wiener Hochquellenleitung Quellwasser aus dem Hochschwab-Gebiet, unter anderem aus dem Salzatal bei Wildalpen, nach Wien.","tag":"Berge","c":"Wien","w":["Linz","Salzburg","Klagenfurt"],"id":"b33bb3716"},{"cat":"st","lv":2,"q":"Welcher See ist der größte der Steiermark?","e":"Der Grundlsee im steirischen Salzkammergut ist der größte See des Landes.","tag":"Seen","c":"Grundlsee","w":["Altausseer See","Erlaufsee","Stubenbergsee"],"id":"ba8386b61"},{"cat":"st","lv":2,"q":"Welcher Fluss mündet bei Bruck an der Mur in die Mur?","e":"Die Mürz kommt aus dem Mürztal und fließt bei Bruck an der Mur in die Mur. Das Tal der beiden Flüsse heißt Mur-Mürz-Furche.","tag":"Flüsse","c":"Mürz","w":["Enns","Raab","Lafnitz"],"id":"b4a62c75f"},{"cat":"st","lv":3,"q":"Welcher Berg ist der höchste Gipfel, der zur Gänze auf steirischem Gebiet liegt?","e":"Die Hochwildstelle (2.747 m) in den Schladminger Tauern ist der höchste Gipfel, der vollständig in der Steiermark liegt. Höhere Berge wie der Hohe Dachstein oder der Hochgolling liegen auf Landesgrenzen.","tag":"Berge","c":"Hochwildstelle","w":["Hochschwab","Reichenstein","Grimming"],"id":"b6b6f5f78"},{"cat":"st","lv":3,"q":"In welchen Fluss mündet die Mur, nachdem sie die Steiermark verlassen hat?","e":"Die Mur ist rund 450 km lang und mündet bei Legrad in Kroatien in die Drau.","tag":"Flüsse","c":"Drau","w":["Save","Donau","Raab"],"id":"b3648af96"},{"cat":"st","lv":3,"q":"In welcher Gemeinde im Hochschwab-Gebiet liegt der berühmte Grüne See?","e":"Der Grüne See ist ein beliebtes Ausflugsziel in der Gemeinde Tragöß-Sankt Katharein.","tag":"Seen","c":"Tragöß-Sankt Katharein","w":["Eisenerz","Mariazell","Wildalpen"],"id":"b01ac7d73"},{"cat":"st","lv":1,"q":"Welches Bauwerk auf dem Grazer Schloßberg gilt als Wahrzeichen der Stadt?","e":"Der Uhrturm ist das Wahrzeichen von Graz. Er ist ein Überrest der ehemaligen Festung auf dem Schloßberg.","tag":"Graz","c":"Der Uhrturm","w":["Das Landhaus","Das Opernhaus","Das Kunsthaus"],"id":"b03027904"},{"cat":"st","lv":1,"q":"Welche österreichische Stadt ist nach Wien die zweitgrößte?","e":"Gemessen an der Bevölkerung ist Graz nach Wien die zweitgrößte Stadt Österreichs und zugleich die größte Stadt der Steiermark.","tag":"Graz","c":"Graz","w":["Linz","Salzburg","Innsbruck"],"id":"b47c27b90"},{"cat":"st","lv":2,"q":"Der Name „Graz“ geht auf ein slawisches Wort zurück. Was bedeutet „gradec“?","e":"Das slawische „gradec“ bedeutet „kleine Burg“. Der Name weist auf die frühe Befestigung auf dem Schloßberg hin.","tag":"Graz","c":"Kleine Burg","w":["Grüner Hügel","Felsen am Fluss","Weißes Tor"],"id":"b4cd63c4a"},{"cat":"st","lv":3,"q":"Was ist an den Zifferblättern des Grazer Uhrturms ungewöhnlich?","e":"Beim Uhrturm ist es umgekehrt wie bei üblichen Uhren: Der lange Zeiger gibt die Stunden an, der kurze die Minuten.","tag":"Graz","c":"Der große Zeiger zeigt die Stunden, der kleine die Minuten","w":["Er hat nur einen Zeiger für Stunden und Minuten zugleich","Seine Zifferblätter haben 24 statt 12 Ziffern","Alle Zeiger laufen gegen den Uhrzeigersinn"],"id":"b16961747"},{"cat":"st","lv":2,"q":"Welche Form hat die Murinsel, die 2003 vom Künstler Vito Acconci für Graz gestaltet wurde?","e":"Die Murinsel ist eine muschelförmige Plattform im Fluss und verbindet beide Ufer der Mur.","tag":"Graz","c":"Eine Muschel","w":["Ein Segelschiff","Eine Kugel","Ein Halbmond"],"id":"b8ab9a42b"},{"cat":"st","lv":2,"q":"In welchem Jahr war Graz Kulturhauptstadt Europas?","e":"Graz war 2003 Kulturhauptstadt Europas. Aus diesem Anlass entstanden unter anderem das Kunsthaus und die Murinsel.","tag":"Graz","t":"num","ans":2003,"id":"bff002983"},{"cat":"st","lv":3,"q":"Nach der Niederlage der Habsburger verlangte Napoleon 1809 die Schleifung der Festung auf dem Schloßberg. Wie wurde der Uhrturm gerettet?","e":"Die Festung wurde 1809 geschleift, doch die Grazer Bürger kauften den Uhrturm und den Glockenturm frei. Beide prägen bis heute den Schloßberg.","tag":"Graz","c":"Die Grazer Bürger kauften ihn und den Glockenturm frei","w":["Napoleon nahm den Befehl persönlich zurück","Er wurde Stein für Stein abgetragen und neu errichtet","Habsburgische Truppen verteidigten ihn erfolgreich"],"id":"b22efaf22"},{"cat":"st","lv":2,"q":"Welchen Spitznamen trägt das 2003 eröffnete Kunsthaus Graz wegen seiner ungewöhnlichen Form?","e":"Das Kunsthaus am Murufer wurde 2003 zur Kulturhauptstadt eröffnet und wird wegen seiner organischen Form „Friendly Alien“ genannt.","tag":"Graz","c":"„Friendly Alien“","w":["„Blue Whale“","„Glass Pearl“","„Sleeping Giant“"],"id":"bcfd16b8d"},{"cat":"st","lv":1,"q":"An welchem Platz steht das Grazer Rathaus?","e":"Das Rathaus der Landeshauptstadt steht am Hauptplatz im Herzen der Altstadt.","tag":"Graz","c":"Am Hauptplatz","w":["Am Jakominiplatz","Am Karmeliterplatz","Am Tummelplatz"],"id":"b03cabdd8"},{"cat":"st","lv":2,"q":"In welchem Jahr wurde die Altstadt von Graz in die UNESCO-Welterbeliste aufgenommen?","e":"1999 wurde die historische Altstadt von Gra ,"tag":"Universitäten","t":"num","ans":1585,"id":"bf45a73b1"},{"cat":"st","lv":2,"q":"Wer gründete 1811 das Joanneum, aus dem später die Technische Universität Graz hervorging?","e":"Erzherzog Johann stiftete 1811 das Joanneum, die Keimzelle der heutigen Technischen Universität Graz.","tag":"Universitäten","c":"Erzherzog Johann","w":["Erzherzog Karl II.","Kaiser Joseph II.","Kaiser Franz Joseph I."],"id":"b1a31a85e"},{"cat":"st","lv":3,"q":"In welchem Ort wurde die Vorgängerin der Montanuniversität Leoben 1840 gegründet?","e":"Erzherzog Johann gründete 1840 die Montanlehranstalt in Vordernberg. 1849 übersiedelte sie nach Leoben.","tag":"Universitäten","c":"Vordernberg","w":["Eisenerz","Trofaiach","Donawitz"],"id":"b71c2be4c"},{"cat":"st","lv":3,"q":"In welchem Jahr nahm die Grazer Schloßbergbahn, eine Standseilbahn auf den Schloßberg, ihren Betrieb auf?","e":"Die Schloßbergbahn fährt seit 1894 auf den Grazer Schloßberg.","tag":"Graz","t":"num","ans":1894,"id":"b4172061d"},{"cat":"st","lv":1,"q":"Wofür ist der Steirische Erzberg bei Eisenerz bekannt?","e":"Am Erzberg wird im Tagbau Eisenerz abgebaut. Er gilt als größter Erz-Tagbau Mitteleuropas.","tag":"Wirtschaft","c":"Er ist der größte Erz-Tagbau Mitteleuropas","w":["Er ist das größte Salzbergwerk der Alpen","Er ist das höchste Skigebiet der Steiermark","Er ist der älteste Silberbergbau Österreichs"],"id":"bc6885426"},{"cat":"st","lv":3,"q":"In welchem Jahr wurde die Steiermark zum Herzogtum erhoben?","e":"1180 wurde die Steiermark ein eigenes Herzogtum.","tag":"Geschichte","t":"num","ans":1180,"id":"b24986c94"},{"cat":"st","lv":2,"q":"Wen heiratete Erzherzog Johann 1829?","e":"Erzherzog Johann heiratete 1829 die bürgerliche Anna Plochl aus Aussee. Die Verbindung ist bis heute Teil der steirischen Volkserzählung.","tag":"Geschichte","c":"Anna Plochl, die Tochter eines Ausseer Postmeisters","w":["Eine Wiener Hofdame aus altem Adel","Die Tochter eines Grazer Kaufmanns","Die Tochter eines Bergmanns aus Eisenerz"],"id":"b54e7e917"},{"cat":"st","lv":2,"q":"Welches Unternehmen betreibt das große Stahlwerk im Leobener Stadtteil Donawitz?","e":"In Donawitz wird seit über 140 Jahren Stahl erzeugt. Das Werk gehört zur voestalpine.","tag":"Wirtschaft","c":"voestalpine","w":["Magna Steyr","AVL List","Andritz AG"],"id":"bc4d262d4"},{"cat":"st","lv":3,"q":"In welchem Jahr wurde in Leoben der Vorfrieden zwischen Napoleon Bonaparte und Österreich geschlossen?","e":"Am 18. April 1797 wurde in Leoben der Vorfrieden zwischen Napoleon Bonaparte und Österreich unterzeichnet. Er ebnete den Weg zum Frieden von Campo Formio.","tag":"Geschichte","t":"num","ans":1797,"id":"b76d44872"},{"cat":"st","lv":3,"q":"Welches Amt übernahm Erzherzog Johann 1848 in der Frankfurter Nationalversammlung?","e":"Die Frankfurter Nationalversammlung wählte Erzherzog Johann 1848 zum Reichsverweser, einer Art vorläufigem Staatsoberhaupt.","tag":"Geschichte","c":"Reichsverweser","w":["Reichskanzler","Präsident der Nationalversammlung","Statthalter von Tirol"],"id":"b2c346455"},{"cat":"st","lv":1,"q":"Woraus wird das berühmte Steirische Kürbiskernöl gepresst?","e":"Das Steirische Kürbiskernöl wird aus den gerösteten Kernen des Ölkürbisses gepresst und ist ein Aushängeschild der steirischen Küche.","tag":"Kulinarik","c":"Aus den Kernen des Ölkürbisses","w":["Aus Sonnenblumenkernen","Aus Walnusskernen","Aus Rapssamen"],"id":"bb8502e6a"},{"cat":"st","lv":2,"q":"Was bedeutet die Abkürzung „g. g. A.“ beim Steirischen Kürbiskernöl?","e":"Das Steirische Kürbiskernöl ist seit 1996 EU-weit als geschützte geografische Angabe (g. g. A.) eingetragen.","tag":"Kulinarik","c":"Geschützte geografische Angabe","w":["Geprüfte gesunde Ausführung","Garantiert gentechnikfreie Aufzucht","Gesetzlich gesicherte Abfüllung"],"id":"b664b49fa"},{"cat":"st","lv":3,"q":"Welche steirische Hülsenfrucht trägt seit 2016 das EU-Gütezeichen g. U. (geschützte Ursprungsbezeichnung)?","e":"Die Steirische Käferbohne, auch Käferbohne oder Prunkbohne genannt, ist s r Steiermark findet das Narzissenfest statt, das als größtes Blumenfest Österreichs gilt?","e":"Das Narzissenfest im Ausseerland gilt als größtes Blumenfest Österreichs.","tag":"Kultur","c":"Im Ausseerland","w":["Im Vulkanland","Im Murtal","Im Sulmtal"],"id":"be07b73a4"},{"cat":"st","lv":3,"q":"Welche Figur gehört zum traditionellen Ausseer Fasching?","e":"Zum Ausseer Fasching gehören unter anderem die Trommelweiber, die Flinserl und die Pless. Der Brauch ist als immaterielles Kulturerbe anerkannt.","tag":"Kultur","c":"Die Trommelweiber","w":["Die Glöckler","Die Schemenläufer","Die Schnabelperchten"],"id":"b2cbc9c18"},{"cat":"st","lv":1,"q":"Welches Tier ist im steirischen Landeswappen abgebildet?","e":"Der Panther ist das Wappentier der Steiermark.","tag":"Landessymbole","c":"Ein Panther","w":["Ein Steinbock","Ein Adler","Ein Löwe"],"id":"ba84a9530"},{"cat":"st","lv":2,"q":"Wofür ist das Stift Admont besonders berühmt?","e":"Das 1074 gegründete Benediktinerstift Admont besitzt den größten Klosterbibliothekssaal der Welt (Angabe des Stifts).","tag":"Orte","c":"Für seinen Bibliothekssaal, den größten Klosterbibliothekssaal der Welt","w":["Für die älteste Klosterbrauerei der Alpen","Für die größte Klosterorgel Europas","Für das älteste Klostertheater Österreichs"],"id":"b2ba4f59b"},{"cat":"st","lv":1,"q":"In welcher Stadt hat die Landespolizeidirektion Steiermark ihren Sitz?","e":"Die Landespolizeidirektion Steiermark hat ihren Sitz in der Landeshauptstadt Graz.","tag":"Sicherheit","c":"Graz","w":["Leoben","Kapfenberg","Liezen"],"id":"b71e1a5de"},{"cat":"st","lv":1,"q":"Wie heißt die Landeshymne der Steiermark?","e":"Das Dachsteinlied beginnt mit den Worten „Hoch vom Dachstein an“ und ist die Landeshymne der Steiermark.","tag":"Landessymbole","c":"Dachsteinlied","w":["Steirermarsch","Erzherzog-Johann-Jodler","Muraulied"],"id":"b6421ac45"},{"cat":"st","lv":2,"q":"Auf was für einem Felsen steht die Riegersburg, ein Wahrzeichen der Südoststeiermark?","e":"Die Riegersburg des Panthers im steirischen Landeswappen?","e":"Im Landeswappen steht ein silberner, rot gehörnter Panther auf grünem Schild.","tag":"Landessymbole","c":"Rot","w":["Gold","Schwarz","Blau"],"id":"bace3620a"},{"cat":"st","lv":3,"q":"Wer wählt in der Steiermark die Landesregierung?","e":"Nach dem Landes-Verfassungsgesetz 2010 wird die gesamte Landesregierung vom Landtag in einem Wahlgang gewählt.","tag":"Landespolitik","c":"Der Landtag","w":["Das Landesvolk in einer Direktwahl","Die Bürgermeister aller Gemeinden","Der Bundespräsident"],"id":"bbf74ed9b"},{"cat":"st","lv":1,"q":"Welche Autobahn führt von Wien über Graz nach Klagenfurt?","e":"Die A 2, die Südautobahn, verbindet Wien über Graz mit Klagenfurt.","tag":"Verkehr","c":"Die A 2 (Südautobahn)","w":["Die A 1 (Westautobahn)","Die A 9 (Pyhrn Autobahn)","Die A 10 (Tauern Autobahn)"],"id":"b44dcf7bf"},{"cat":"st","lv":3,"q":"Mariazell ist ein berühmter Wallfahrtsort. Welcher lateinische Ehrentitel wird der Basilika zugeschrieben?","e":"Mariazell wird „Magna Mater Austriae“ genannt, was „Große Mutter Österreichs“ bedeutet.","tag":"Orte","c":"„Magna Mater Austriae“","w":["„Mater Dolorosa Alpium“","„Regina Montium“","„Stella Styriae“"],"id":"bffb26b0a"},{"cat":"st","lv":2,"q":"Unter welcher Notrufnummer ist in Österreich die Bergrettung erreichbar?","e":"Die Bergrettung erreicht man unter der Notrufnummer 140. Der europaweite Notruf lautet 112.","tag":"Sicherheit","t":"num","ans":140,"id":"b3694fd75"},{"cat":"st","lv":3,"q":"Aus wie vielen Abgeordneten besteht der Steiermärkische Landtag (Stand 2026)?","e":"Der Landtag besteht (Stand 2026) aus 48 Abgeordneten und tagt im Landhaus in Graz.","tag":"Landespolitik","t":"num","ans":48,"vol":true,"id":"b3e97cfcf"},{"cat":"st","lv":3,"q":"Wie viele Kilometer lang ist der Koralmtunnel ungefähr?","e":"Der Koralmtunnel ist rund 33 km (genau etwa 32,9 km) lang und das Herzstück der Koralmbahn zwischen Graz und Klagenfurt.","tag":"Verkehr","t":"num","ans":33,"id":"b89adba70"},{"cat":"st","lv":2,"q":"In welchem Gebäude tagt der Steiermärkische Landtag?","e":"Der Landtag hat seinen Sitz im Landhaus, Herrengasse 16, in Graz. Das Landhaus zählt zu den bedeutendsten Renaissancebauten Österreichs.","tag":"Landespolitik","c":"Im Landhaus","w":["Im Rathaus","Im Zeughaus","Im Schloss Eggenberg"],"id":"b25c262cd"},{"cat":"tv","id":"tv101","title":"Verkehrskontrolle im Grazer Westen","text":"An einem Donnerstag im November führte die Polizei im Grazer Westen eine Verkehrskontrolle durch. Sie dauerte von 16.00 bis 20.00 Uhr. In dieser Zeit hielten vier Beamte 120 Fahrzeuge an und überprüften deren Lenker. Bei 18 Lenkern gab es etwas zu beanstanden: Neun hatten den Sicherheitsgurt nicht angelegt, sechs fuhren mit defekter Beleuchtung, und drei konnten ihren Führerschein nicht vorweisen. Alle übrigen Lenker durften nach einer kurzen Überprüfung weiterfahren.\nWer defekte Beleuchtung hatte, bekam sieben Tage Zeit, den Schaden zu beheben und das Fahrzeug bei der Polizei vorzuführen. Einsatzleiter Karl Huber betonte, die Kontrolle sei keine Strafaktion gewesen. Man wolle vor allem daran erinnern, dass es im Herbst früh dunkel wird und die Beleuchtung deshalb vor jeder Fahrt geprüft werden sollte. Weitere Kontrollen seien geplant, einen Termin nannte die Polizei jedoch nicht.","qs":[{"lv":1,"q":"Wie viele der kontrollierten Lenker hatten den Sicherheitsgurt nicht angelegt?","c":"9","w":["6","3","18"],"e":"Im Text steht: „Neun hatten den Sicherheitsgurt nicht angelegt“. Sechs hatten Beleuchtungsmängel, drei keinen Führerschein; insgesamt wurden 18 Lenker beanstandet.","tag":"Detail","ev":["Neun hatten den Sicherheitsgurt nicht angelegt"]},{"lv":2,"q":"Bei wie vielen der kontrollierten Lenker gab es nichts zu beanstanden?","c":"102","w":["18","111","114"],"e":"Es wurden 120 Lenker überprüft, bei 18 gab es Beanstandungen: 120 − 18 = 102.","tag":"Rechnen","ev":["hielten vier Beamte 120 Fahrzeuge an","Bei 18 Lenkern gab es etwas zu beanstanden"]},{"lv":2,"q":"Was war laut Einsatzleiter der wichtigste Zweck der Kontrolle?","c":"Die Lenker sollten daran erinnert werden, die Beleuchtung vor jeder Fahrt zu prüfen.","w":["Möglichst viele Lenker sollten für ihre Verstöße bestraft werden.","Die Polizei wollte zählen, wie viele Fahrzeuge im Grazer Westen unterwegs sind.","Fahrzeuge mit defekter Beleuchtung sollten sofort aus dem Verkehr gezogen werden."],"e":"Der Einsatzleiter nannte die Kontrolle keine Strafaktion; man wolle vor allem an die Prüfung der Beleuchtung vor jeder Fahrt erinnern. Wer Lichtmängel hatte, bekam sogar sieben Tage Zeit.","tag":"Hauptgedanke","ev":["Man wolle vor allem daran erinnern, dass es im Herbst früh dunkel wird und die Beleuchtung deshalb vor jeder Fahrt geprüft werden sollte."]},{"lv":3,"q":"Welche der folgenden Aussagen widerspricht dem Text?","c":"Weniger als jeder zehnte kontrollierte Lenker musste beanstandet werden.","w":["Mehr Lenker hatten den Gurt nicht angelegt, als Probleme mit der Beleuchtung hatten.","Die Verkehrskontrolle dauerte von Beginn bis Ende insgesamt vier Stunden.","Die Polizei nannte keinen genauen Termin für weitere Kontrollen."],"e":"18 von 120 Lenkern sind 15 Prozent, also mehr als jeder zehnte (mehr als 12). Die anderen Aussagen stimmen: 9 ist mehr als 6, 16.00 bis 20.00 Uhr sind vier Stunden, ein Termin wurde nicht genannt.","tag":"Widerspruch","ev":["hielten vier Beamte 120 Fahrzeuge an","Bei 18 Lenkern gab es etwas zu beanstanden"]}]},{"cat":"tv","id":"tv102","title":"Hausordnung für das Wohnhaus Rosenweg 8","text":"Damit alle Bewohner gut miteinander auskommen, gilt in unserem Haus Folgendes.\nDie Ruhezeiten sind täglich von 12.00 bis 14.00 Uhr sowie von 20.00 bis 7.00 Uhr. In dieser Zeit sind laute Arbeiten, etwa mit der Bohrmaschine, nicht erlaubt. Die Waschküche im Keller darf täglich von 7.00 bis 20.00 Uhr benützt werden, jedoch nicht in der mittäglichen Ruhezeit. Wer sie zuletzt benützt hat, reinigt sie und trägt sich in die Liste an der Tür ein.\nFahrräder gehören in den Fahrradraum und nicht ins Stiegenhaus, weil dieses als Fluchtweg frei bleiben muss. Der Müll wird getrennt: Papier kommt in die blaue Tonne, Restmüll in die schwarze. Sperrige Gegenstände dürfen nicht im Hof abgestellt werden, sondern müssen zum Altstoffsammelzentrum gebracht werden.\nBei Fragen hilft die Hausverwaltung, die jeden Dienstag von 9.00 bis 11.00 Uhr im Haus erreichbar ist.","qs":[{"lv":1,"q":"Warum dürfen Fahrräder laut Hausordnung nicht im Stiegenhaus stehen?","c":"Weil das Stiegenhaus als Fluchtweg frei bleiben muss.","w":["Weil Fahrräder dort die Wände beschädigen könnten.","Weil im Stiegenhaus die Mülltonnen aufgestellt werden.","Weil Fahrräder dort die Ruhezeiten stören würden."],"e":"Die Hausordnung nennt ausdrücklich den Fluchtweg als Grund: Er muss frei bleiben.","tag":"Detail","ev":["weil dieses als Fluchtweg frei bleiben muss"]},{"lv":2,"q":"Zu welcher der folgenden Uhrzeiten darf die Waschküche benützt werden?","c":"Um 15.30 Uhr","w":["Um 13.15 Uhr","Um 20.30 Uhr","Um 6.45 Uhr"],"e":"Die Waschküche darf täglich von 7.00 bis 20.00 Uhr benützt werden, aber nicht in der mittäglichen Ruhezeit von 12.00 bis 14.00 Uhr. Nur 15.30 Uhr liegt in der erlaubten Zeit.","tag":"Schlussfolgerung","ev":["Die Waschküche im Keller darf täglich von 7.00 bis 20.00 Uhr benützt werden, jedoch nicht in der mittäglichen Ruhezeit","Die Ruhezeiten sind täglich von 12.00 bis 14.00 Uhr"]},{"lv":3,"q":"Wie viele Stunden pro Tag sind insgesamt Ruhezeit?","c":"13 Stunden","w":["9 Stunden","11 Stunden","15 Stunden"],"e":"Mittags gilt die Ruhezeit von 12.00 bis 14.00 Uhr (2 Stunden), nachts von 20.00 bis 7.00 Uhr (4 + 7 = 11 Stunden). Zusammen sind das 13 Stunden.","tag":"Rechnen","ev":["Die Ruhezeiten sind täglich von 12.00 bis 14.00 Uhr sowie von 20.00 bis 7.00 Uhr"]},{"lv":2,"q":"Welche der folgenden Angaben ist dem Text NICHT zu entnehmen?","c":"Wie viele Wohnungen das Haus hat","w":["Wann die Hausverwaltung erreichbar ist","In welche Tonne das Papier gehört","Wer die Waschküche nach der Benützung reinigt"],"e":"Die Anzahl der Wohnungen wird nicht genannt. Die anderen Angaben stehen im Text: Dienstag 9.00 bis 11.00 Uhr, blaue Tonne, der letzte Benützer reinigt die Waschküche.","tag":"Aussage nicht im Text","ev":[]}]},{"cat":"tv","id":"tv103","title":"Gebrauchsanweisung für einen Rauchwarnmelder","text":"So verwenden Sie Ihren Rauchwarnmelder richtig. Befestigen Sie das Gerät mit der beiliegenden Schraube an der Decke, möglichst in der Raummitte und mindestens 50 Zentimeter von der Wand entfernt. In Küche und Badezimmer sollte der Melder nicht angebracht werden, da Dampf und Kochdunst einen Fehlalarm auslösen können. Ziehen Sie vor der ersten Verwendung den Isolierstreifen aus dem Batteriefach; danach ertönt einmalig ein kurzer Piepton.\nPrüfen Sie das Gerät einmal im Monat, indem Sie die Prüftaste drei Sekunden lang drücken. Ertönt ein lauter Alarmton, funktioniert der Melder. Ein kurzer Piepton alle 60 Sekunden bedeutet, dass die Batterie bald leer ist und gewechselt werden muss. Sie hält etwa zehn Jahre. Der Melder darf nicht überstrichen werden. Zur Reinigung genügt es, ihn einmal im Jahr vorsichtig abzusaugen. Bei einem echten Alarm bewahren Sie Ruhe, verlassen die Wohnung und verständigen die Feuerwehr.","qs":[{"lv":1,"q":"Was bedeutet es, wenn der Melder alle 60 Sekunden kurz piepst?","c":"Die Batterie ist bald leer.","w":["Der Melder hat Rauch erkannt.","Der Melder muss gereinigt werden.","Der Melder ist falsch montiert."],"e":"Laut Text bedeutet ein kurzer Piepton alle 60 Sekunden, dass die Batterie bald leer ist und gewechselt werden muss.","tag":"Detail","ev":["Ein kurzer Piepton alle 60 Sekunden bedeutet, dass die Batterie bald leer ist"]},{"lv":2,"q":"Wovon handelt der Text hauptsächlich?","c":"Von Montage, Kontrolle und Pflege eines Rauchwarnmelders","w":["Vom richtigen Verhalten bei einem Brand in der Wohnung","Von den Unterschieden zwischen verschiedenen Rauchwarnmeldern","Von den Kosten für Wartung und Batterie eines Rauchwarnmelders"],"e":"Der Text erklärt, wie man den Melder anbringt, prüft und pflegt. Das Verhalten im Brandfall wird nur im letzten Satz kurz erwähnt; Vergleiche und Kosten kommen nicht vor.","tag":"Hauptgedanke","ev":["Befestigen Sie das Gerät mit der beiliegenden Schraube an der Decke","Prüfen Sie das Gerät einmal im Monat"]},{"lv":2,"q":"Die Gebrauchsanweisung wird genau befolgt. Wie viele Sekunden wird die Prüftaste dann in einem Jahr insgesamt gedrückt?","c":"36 Sekunden","w":["12 Sekunden","15 Sekunden","180 Sekunden"],"e":"Die Prüftaste wird einmal im Monat drei Sekunden lang gedrückt. Ein Jahr hat 12 Monate: 12 · 3 = 36 Sekunden.","tag":"Rechnen","ev":["Prüfen Sie das Gerät einmal im Monat, indem Sie die Prüftaste drei Sekunden lang drücken"]},{"lv":3,"q":"Welcher Anbringungsort entspricht der Gebrauchsanweisung?","c":"An der Decke des Wohnzimmers, etwa einen Meter von der nächsten Wand entfernt","w":["An der Decke von Küche oder Badezimmer, möglichst in der Raummitte","An der Decke des Schlafzimmers, etwa 30 Zentimeter von der Wand entfernt","An der Wand des Vorraums, in etwa zwei Metern Höhe über dem Boden"],"e":"Der Melder gehört an die Decke, mindestens 50 Zentimeter von der Wand entfernt, und nicht in Küche oder Badezimmer. Nur das Wohnzimmer mit einem Meter Wandabstand erfüllt alle Bedingungen.","tag":"Schlussfolgerung","ev":["an der Decke, möglichst in der Raummitte und mindestens 50 Zentimeter von der Wand entfernt","In Küche und Badezimmer sollte der Melder nicht angebracht werden"]}]},{"cat":"tv","id":"tv104","title":"E-Mail des Laufvereins an die Mitglieder","text":"Betreff: Änderungen beim Training und Anmeldung zum Silvesterlauf\nLiebe Mitglieder,\nwegen Bauarbeiten am Vereinsgelände findet das Mittwochstraining bis Ende Oktober nicht wie gewohnt statt. Wir treffen uns in dieser Zeit nicht um 18.30 Uhr am Sportplatz, sondern bereits um 18.00 Uhr beim Parkplatz am Flussufer. Das Training dauert inklusive Aufwärmen und Dehnen 75 Minuten, die Laufstrecke beträgt weiterhin etwa acht Kilometer. Das Samstagstraining ist von den Bauarbeiten nicht betroffen und beginnt wie immer um 9.00 Uhr.\nAußerdem erinnern wir an den Jahresbeitrag von 60 Euro, der bis spätestens 30. November überwiesen werden muss. Wer bis dahin nicht bezahlt hat, wird nicht zum Silvesterlauf angemeldet. Dieser findet heuer am 31. Dezember statt; die Anmeldung ist bis zum 15. Dezember bei Obfrau Maria Gruber möglich.\nMit sportlichen Grüßen\nDer Vorstand der Murfüchse Graz","qs":[{"lv":1,"q":"Um wie viel Uhr beginnt das Mittwochstraining bis Ende Oktober?","c":"Um 18.00 Uhr","w":["Um 18.30 Uhr","Um 19.15 Uhr","Um 9.00 Uhr"],"e":"Bis Ende Oktober treffen sich die Läufer mittwochs bereits um 18.00 Uhr (sonst um 18.30 Uhr).","tag":"Detail","ev":["bereits um 18.00 Uhr beim Parkplatz am Flussufer"]},{"lv":2,"q":"Wann endet das Mittwochstraining in dieser Zeit?","c":"Um 19.15 Uhr","w":["Um 19.45 Uhr","Um 19.00 Uhr","Um 19.30 Uhr"],"e":"Beginn um 18.00 Uhr plus 75 Minuten (1 Stunde 15 Minuten) ergibt 19.15 Uhr. 19.45 Uhr würde sich nur bei einem Beginn um 18.30 Uhr ergeben.","tag":"Rechnen","ev":["bereits um 18.00 Uhr","Das Training dauert inklusive Aufwärmen und Dehnen 75 Minuten"]},{"lv":2,"q":"Welche der folgenden Aussagen widerspricht der E-Mail?","c":"Während der Bauarbeiten treffen sich die Läufer am Mittwoch beim Sportplatz.","w":["Die Laufstrecke am Mittwoch ist weiterhin etwa acht Kilometer lang.","Das Samstagstraining wird von den Bauarbeiten nicht beeinflusst.","Der Jahresbeitrag ist früher fällig als die Anmeldung zum Silvesterlauf."],"e":"Treffpunkt ist in dieser Zeit der Parkplatz am Flussufer, nicht der Sportplatz. Die anderen Aussagen stimmen: Strecke etwa acht Kilometer, Samstag unverändert, Beitrag bis 30. November, Anmeldung bis 15. Dezember.","tag":"Widerspruch","ev":["Wir treffen uns in dieser Zeit nicht um 18.30 Uhr am Sportplatz"]},{"lv":3,"q":"Was muss ein Mitglied tun, um am Silvesterlauf teilnehmen zu können?","c":"Bis 30. November den Beitrag überweisen und sich bis 15. Dezember bei der Obfrau anmelden","w":["Bis 30. November bei der Obfrau anmelden und bis 15. Dezember den Beitrag überweisen","Bis 15. Dezember den Beitrag überweisen; eine Anmeldung ist nicht nötig","Bis 15. Dezember bei der Obfrau anmelden; der Beitrag ist erst nach dem Lauf fällig"],"e":"Der Beitrag muss bis spätestens 30. November bezahlt sein, sonst erfolgt keine Anmeldung zum Lauf. Die Anmeldung selbst ist bis 15. Dezember bei der Obfrau möglich. In den anderen Antworten sind die Fristen vertauscht oder die Pflichten gestrichen.","tag":"Schlussfolgerung","ev":["der bis spätestens 30. November überwiesen werden muss","die Anmeldung ist bis zum 15. Dezember bei Obfrau Maria Gruber möglich"]}]},{"cat":"tv","id":"tv105","title":"Wegbeschreibung zur Polizeiinspektion Lindenplatz","text":"Der Weg vom Bahnhof zur Polizeiinspektion Lindenplatz ist leicht zu finden. Verlassen Sie den Bahnhof durch den Haupteingang und gehen Sie geradeaus über den Bahnhofsplatz bis zur Ampel. Dort überqueren Sie die Straße und biegen links in die Lindengasse ab. Nach etwa 400 Metern sehen Sie auf der rechten Seite eine Bäckerei. Gleich nach der Bäckerei biegen Sie rechts in die Schulgasse ein. Die Polizeiinspektion ist das dritte Gebäude auf der linken Seite, direkt neben der Apotheke. An der blauen Eingangstür erkennen Sie das Haus. Insgesamt brauchen Sie zu Fuß etwa zehn Minuten.\nWer mit dem Auto kommt, sollte die Tiefgarage am Lindenplatz benützen, denn vor der Inspektion gibt es keine Parkplätze. Von der Tiefgarage sind es zu Fuß nur zwei Minuten bis zur Inspektion. Die Inspektion ist von Montag bis Freitag zwischen 8.00 und 16.00 Uhr geöffnet.","qs":[{"lv":1,"q":"Neben welchem Gebäude liegt die Polizeiinspektion?","c":"Neben der Apotheke","w":["Neben der Bäckerei","Neben der Tiefgarage","Neben dem Bahnhof"],"e":"Laut Text liegt die Inspektion in der Schulgasse „direkt neben der Apotheke“. Die Bäckerei steht in der Lindengasse.","tag":"Detail","ev":["direkt neben der Apotheke"]},{"lv":2,"q":"Eine Besucherin verlässt den Bahnhof um 15.30 Uhr und geht den beschriebenen Weg zu Fuß. Wann kommt sie ungefähr bei der Inspektion an?","c":"Gegen 15.40 Uhr","w":["Gegen 15.32 Uhr","Gegen 15.50 Uhr","Gegen 16.10 Uhr"],"e":"Der Fußweg vom Bahnhof dauert etwa zehn Minuten: 15.30 Uhr plus 10 Minuten ergibt 15.40 Uhr. Die zwei Minuten gelten nur für den Weg von der Tiefgarage.","tag":"Rechnen","ev":["Insgesamt brauchen Sie zu Fuß etwa zehn Minuten."]},{"lv":1,"q":"Welche Angabe ist dem Text NICHT zu entnehmen?","c":"Wie viel das Parken in der Tiefgarage kostet","w":["Woran man das Gebäude der Inspektion erkennt","An welchen Tagen die Inspektion geöffnet ist","Wie lange der Fußweg vom Bahnhof ungefähr dauert"],"e":"Ein Preis für die Tiefgarage wird nicht genannt. Im Text stehen dagegen die blaue Eingangstür, die Öffnungstage (Montag bis Freitag) und die Gehzeit von etwa zehn Minuten.","tag":"Aussage nicht im Text","ev":[]},{"lv":3,"q":"Eine Besucherin verlässt die Inspektion und geht in der Schulgasse zurück bis zur Einmündung in die Lindengasse, um zum Bahnhof zurückzukehren. Wie muss sie dort abbiegen, und auf welcher Seite liegt die Bäckerei dann?","c":"Nach links; die Bäckerei liegt dann gleich auf der linken Seite.","w":["Nach links; die Bäckerei liegt dann gleich auf der rechten Seite.","Nach rechts; die Bäckerei liegt dann gleich auf der linken Seite.","Nach rechts; die Bäckerei liegt dann gleich auf der rechten Seite."],"e":"Auf dem Hinweg biegt man nach der Bäckerei rechts in die Schulgasse ein. Auf dem Rückweg ist alles umgekehrt: Man biegt links in die Lindengasse ein, und die Bäckerei, die auf dem Hinweg rechts lag, liegt jetzt links.","tag":"Schlussfolgerung","ev":["Nach etwa 400 Metern sehen Sie auf der rechten Seite eine Bäckerei. Gleich nach der Bäckerei biegen Sie rechts in die Schulgasse ein."]}]},{"cat":"tv","id":"tv106","title":"Fundbericht für den Monat Oktober","text":"Das Fundamt Graz-Mitte veröffentlicht seinen Bericht für den Monat Oktober. Insgesamt wurden 64 Gegenstände abgegeben. Am häufigsten waren Regenschirme (21), gefolgt von Schlüsseln (14) und Brillen (11). Außerdem gaben ehrliche Finder neun Geldbörsen, fünf Mobiltelefone und vier sonstige Gegenstände ab. Von den neun Geldbörsen konnten bereits sechs ihren Besitzern zurückgegeben werden, alle fünf Mobiltelefone wurden innerhalb einer Woche abgeholt.\nGefundene Gegenstände werden drei Monate lang aufbewahrt. Wer etwas vermisst, kann dienstags und donnerstags von 9.00 bis 12.00 Uhr im Fundamt vorsprechen. Dabei muss der Gegenstand möglichst genau beschrieben werden; bei Schlüsseln und Mobiltelefonen ist zusätzlich ein Ausweis vorzuzeigen. Was nach Ablauf der Frist nicht abgeholt wurde, wird an eine soziale Einrichtung gespendet.","qs":[{"lv":1,"q":"Welcher Gegenstand wurde im Oktober am häufigsten abgegeben?","c":"Regenschirm","w":["Schlüssel","Brille","Geldbörse"],"e":"Mit 21 Stück waren Regenschirme am häufigsten, vor Schlüsseln (14), Brillen (11) und Geldbörsen (9).","tag":"Detail","ev":["Am häufigsten waren Regenschirme (21)"]},{"lv":3,"q":"Herr Wagner vermisst eine Brille und möchte sie im Fundamt abholen. Was muss er laut Bericht tun?","c":"Er kommt am Donnerstagvormittag und beschreibt die Brille genau.","w":["Er kommt am Mittwochvormittag und beschreibt die Brille genau.","Er kommt am Dienstagnachmittag und beschreibt die Brille genau.","Er kommt am Donnerstagvormittag und zeigt nur einen Ausweis vor."],"e":"Das Fundamt ist dienstags und donnerstags von 9.00 bis 12.00 Uhr geöffnet, also nicht mittwochs und nicht nachmittags. Der Gegenstand muss immer genau beschrieben werden; ein Ausweis ist nur bei Schlüsseln und Mobiltelefonen zusätzlich nötig.","tag":"Schlussfolgerung","ev":["kann dienstags und donnerstags von 9.00 bis 12.00 Uhr im Fundamt vorsprechen","Dabei muss der Gegenstand möglichst genau beschrieben werden"]},{"lv":3,"q":"Wie viele der im Oktober abgegebenen Geldbörsen und Mobiltelefone liegen laut Bericht noch im Fundamt?","c":"3","w":["6","8","14"],"e":"Von den neun Geldbörsen wurden sechs zurückgegeben, drei liegen noch im Fundamt. Alle fünf Mobiltelefone wurden abgeholt, es bleibt also keines übrig: 3 + 0 = 3.","tag":"Rechnen","ev":["Von den neun Geldbörsen konnten bereits sechs ihren Besitzern zurückgegeben werden, alle fünf Mobiltelefone wurden innerhalb einer Woche abgeholt"]},{"lv":2,"q":"Eine Brille wird am 20. Oktober im Fundamt abgegeben. In welchem Monat läuft die Aufbewahrungsfrist ab?","c":"Im Jänner","w":["Im November","Im Dezember","Im Februar"],"e":"Gefundene Gegenstände werden drei Monate aufbewahrt. Vom 20. Oktober an gerechnet läuft die Frist daher Ende Jänner des nächsten Jahres ab.","tag":"Rechnen","ev":["Gefundene Gegenstände werden drei Monate lang aufbewahrt"]}]},{"cat":"tv","id":"tv107","title":"Merkblatt: Verhalten bei einem Stromausfall","text":"Bleiben Sie ruhig. Prüfen Sie zuerst, ob nur Ihre Wohnung betroffen ist, indem Sie nachsehen, ob bei den Nachbarn oder auf der Straße noch Licht brennt. Ist nur Ihre Wohnung dunkel, kontrollieren Sie die Sicherungen. Ist das ganze Haus betroffen, melden Sie die Störung dem Stromversorger.\nVerwenden Sie zur Beleuchtung Taschenlampen und keine Kerzen, denn offene Flammen können leicht einen Brand auslösen. Ziehen Sie die Stecker empfindlicher Geräte wie Computer oder Fernseher, damit diese beim Wiedereinschalten des Stroms keinen Schaden nehmen. Öffnen Sie Kühlschrank und Tiefkühltruhe so selten wie möglich: Ein geschlossener Kühlschrank hält Lebensmittel bis zu vier Stunden kühl, eine gut gefüllte Tiefkühltruhe bis zu 24 Stunden. Ein batteriebetriebenes Radio hilft, Meldungen der Behörden zu verfolgen. Wählen Sie den Notruf nur bei einem echten Notfall, zum Beispiel wenn eine Person auf ein Gerät mit Strom angewiesen ist, das ihr Leben sichert.","qs":[{"lv":1,"q":"Warum rät das Merkblatt von Kerzen ab?","c":"Offene Flammen können leicht einen Brand auslösen.","w":["Kerzen geben zu wenig Licht zum Prüfen der Sicherungen.","Kerzen können das Radio und andere Geräte stören.","Kerzen halten bei einem Stromausfall nur kurze Zeit."],"e":"Das Merkblatt begründet seinen Rat ausdrücklich: Offene Flammen können leicht einen Brand auslösen. Stattdessen sollen Taschenlampen verwendet werden.","tag":"Detail","ev":["denn offene Flammen können leicht einen Brand auslösen"]},{"lv":2,"q":"Der Strom fällt am Montag um 18.00 Uhr aus. Bis wann hält eine gut gefüllte, geschlossene Tiefkühltruhe die Lebensmittel nach dem Merkblatt höchstens kühl?","c":"Bis Dienstag, 18.00 Uhr","w":["Bis Montag, 22.00 Uhr","Bis Dienstag, 6.00 Uhr","Bis Mittwoch, 18.00 Uhr"],"e":"Eine gut gefüllte Tiefkühltruhe hält bis zu 24 Stunden kühl. 24 Stunden nach Montag, 18.00 Uhr ist Dienstag, 18.00 Uhr. Montag, 22.00 Uhr entspräche dem Kühlschrank (4 Stunden).","tag":"Rechnen","ev":["eine gut gefüllte Tiefkühltruhe bis zu 24 Stunden"]},{"lv":2,"q":"Bei Familie Novak ist es plötzlich dunkel, die Nachbarn haben aber Licht. Was ist laut Merkblatt der nächste Schritt?","c":"Die Sicherungen in der eigenen Wohnung kontrollieren","w":["Die Störung dem Stromversorger melden","Sofort den Notruf wählen","Warten, bis der Strom von selbst zurückkehrt"],"e":"Wenn nur die eigene Wohnung dunkel ist, sollen laut Merkblatt die Sicherungen kontrolliert werden. Die Meldung an den Stromversorger gilt, wenn das ganze Haus betroffen ist; der Notruf nur bei einem echten Notfall.","tag":"Schlussfolgerung","ev":["Ist nur Ihre Wohnung dunkel, kontrollieren Sie die Sicherungen."]},{"lv":3,"q":"Welche Aussage lässt sich aus dem Merkblatt ableiten?","c":"Eine gut gefüllte Tiefkühltruhe hält Lebensmittel länger kühl als ein geschlossener Kühlschrank.","w":["Bei einem Stromausfall im ganzen Haus sind zuerst die Sicherungen zu kontrollieren.","Empfindliche Geräte wie Computer sollten während des Stromausfalls eingesteckt bleiben.","Bei jedem Stromausfall sollte sofort der Notruf gewählt werden."],"e":"Die Tiefkühltruhe hält bis zu 24 Stunden, der Kühlschrank nur bis zu vier Stunden. Die anderen Aussagen widersprechen dem Merkblatt: Sicherungen prüft man nur, wenn allein die Wohnung dunkel ist, Stecker sollen gezogen werden, der Notruf ist nur für echte Notfälle.","tag":"Schlussfolgerung","ev":["Ein geschlossener Kühlschrank hält Lebensmittel bis zu vier Stunden kühl, eine gut gefüllte Tiefkühltruhe bis zu 24 Stunden."]}]},{"cat":"tv","id":"tv108","title":"Polizei sucht Zeugen nach Einbruch in Kellerabteile","text":"In der Nacht auf Dienstag wurde in ein Mehrparteienhaus im Grazer Bezirk Gries eingebrochen. Unbekannte brachen zwischen 22.00 Uhr am Montag und 5.30 Uhr am Dienstag sieben Kellerabteile auf. Gestohlen wurden vier Fahrräder und mehrere Werkzeugkisten. Der Gesamtwert der Beute wird auf rund 4.200 Euro geschätzt, davon entfallen etwa 3.000 Euro auf die Fahrräder. Eine Bewohnerin entdeckte die aufgebrochenen Türen um 5.30 Uhr auf dem Weg zur Arbeit und verständigte die Polizei. Eine Nachbarin gab an, in derselben Nacht gegen 1.30 Uhr einen hellen Kleintransporter vor dem Haus gesehen zu haben. Ob dieses Fahrzeug mit der Tat zu tun hat, ist derzeit nicht bekannt. Die Polizei bittet Personen, die in dieser Nacht etwas Verdächtiges beobachtet haben, sich bei der Polizeiinspektion Gries zu melden. Hinweise werden auf Wunsch auch anonym entgegengenommen. Die Ermittlungen dauern an.","qs":[{"lv":1,"q":"Wie viele Kellerabteile wurden aufgebrochen?","c":"Sieben","w":["Vier","Fünf","Neun"],"e":"Im Text steht, dass sieben Kellerabteile aufgebrochen wurden. Die Zahl vier bezieht sich auf die gestohlenen Fahrräder.","tag":"Detail","ev":["sieben Kellerabteile auf"]},{"lv":2,"q":"Wie hoch ist der geschätzte Wert der gestohlenen Werkzeugkisten?","c":"Rund 1.200 Euro","w":["Rund 750 Euro","Rund 3.000 Euro","Rund 7.200 Euro"],"e":"Gestohlen wurden nur Fahrräder und Werkzeugkisten. Von den rund 4.200 Euro Gesamtwert entfallen etwa 3.000 Euro auf die Fahrräder, für die Werkzeugkisten bleiben 4.200 − 3.000 = 1.200 Euro.","tag":"Rechnen","ev":["Der Gesamtwert der Beute wird auf rund 4.200 Euro geschätzt, davon entfallen etwa 3.000 Euro auf die Fahrräder."]},{"lv":2,"q":"Welche der folgenden Angaben ist dem Text NICHT zu entnehmen?","c":"Wie die Täter aussehen","w":["Wann die aufgebrochenen Türen entdeckt wurden","Wie viele Fahrräder gestohlen wurden","Wo sich Zeugen melden können"],"e":"Eine Beschreibung der Täter fehlt, sie sind laut Text unbekannt. Im Text stehen: Entdeckung um 5.30 Uhr, vier Fahrräder, Meldestelle Polizeiinspektion Gries.","tag":"Aussage nicht im Text","ev":[]},{"lv":3,"q":"Was lässt sich über den hellen Kleintransporter sagen?","c":"Er wurde innerhalb des möglichen Tatzeitraums gesehen, ein Zusammenhang mit der Tat ist aber nicht bestätigt.","w":["Er wurde vor Beginn des möglichen Tatzeitraums gesehen und kann deshalb nichts mit der Tat zu tun haben.","Er wurde innerhalb des möglichen Tatzeitraums gesehen und gehört nach Angaben der Polizei den Tätern.","Er wurde nach Ende des möglichen Tatzeitraums gesehen, ein Zusammenhang mit der Tat ist aber nicht bestätigt."],"e":"Der Tatzeitraum reichte von Montag 22.00 Uhr bis Dienstag 5.30 Uhr. Gesehen wurde das Fahrzeug gegen 1.30 Uhr in derselben Nacht, also mittendrin. Ob es mit der Tat zu tun hat, ist laut Text nicht bekannt.","tag":"Schlussfolgerung","ev":["gegen 1.30 Uhr einen hellen Kleintransporter vor dem Haus gesehen zu haben","Ob dieses Fahrzeug mit der Tat zu tun hat, ist derzeit nicht bekannt."]}]},{"cat":"tv","id":"tv109","title":"Umleitung der Buslinie 58","text":"Hinweis der Verkehrsbetriebe: Umleitung der Buslinie 58\nWegen Bauarbeiten an der Brücke über den Mühlgang wird die Buslinie 58 von Montag, 3. März, bis Freitag, 14. März, umgeleitet. In dieser Zeit fährt der Bus nicht durch die Brückengasse, sondern über die Parkstraße. Die Haltestellen Brückengasse und Mühlweg entfallen. Als Ersatz wird die Haltestelle Parkstraße Nord eingerichtet; sie liegt etwa 300 Meter vom Mühlweg entfernt.\nDurch den Umweg verlängert sich die Fahrzeit vom Hauptbahnhof bis zum Krankenhaus von 18 auf 23 Minuten. Die Abfahrtszeiten am Hauptbahnhof ändern sich nicht: Von Montag bis Freitag fährt der Bus alle 15 Minuten, also zum Beispiel um 7.00, 7.15, 7.30 und 7.45 Uhr. Fahrgäste mit Terminen sollten die längere Fahrzeit einplanen. Wir bitten um Verständnis.","qs":[{"lv":1,"q":"Welche Haltestellen entfallen während der Umleitung?","c":"Brückengasse und Mühlweg","w":["Parkstraße Nord und Mühlweg","Brückengasse und Hauptbahnhof","Krankenhaus und Mühlweg"],"e":"Laut Text entfallen die Haltestellen Brückengasse und Mühlweg. Parkstraße Nord ist die neu eingerichtete Ersatzhaltestelle.","tag":"Detail","ev":["Die Haltestellen Brückengasse und Mühlweg entfallen."]},{"lv":1,"q":"Wie lange dauert die Fahrt vom Hauptbahnhof zum Krankenhaus während der Umleitung?","c":"23 Minuten","w":["18 Minuten","5 Minuten","15 Minuten"],"e":"Die Fahrzeit verlängert sich von 18 auf 23 Minuten. 18 Minuten ist die normale Fahrzeit, 5 Minuten die Verlängerung, 15 Minuten der Abstand zwischen den Bussen.","tag":"Detail","ev":["verlängert sich die Fahrzeit vom Hauptbahnhof bis zum Krankenhaus von 18 auf 23 Minuten"]},{"lv":2,"q":"Was ist die wichtigste Information dieses Hinweises?","c":"Wegen Bauarbeiten wird die Linie 58 umgeleitet, zwei Haltestellen entfallen.","w":["Die Linie 58 wird dauerhaft eingestellt und durch eine Straßenbahn ersetzt.","Die Abfahrtszeiten der Linie 58 am Hauptbahnhof werden dauerhaft geändert.","Die Linie 58 fährt während der Bauarbeiten überhaupt nicht mehr."],"e":"Der Hinweis informiert über eine zeitlich begrenzte Umleitung (3. bis 14. März) wegen Bauarbeiten, bei der zwei Haltestellen entfallen. Die Abfahrtszeiten bleiben gleich, der Bus fährt weiter.","tag":"Hauptgedanke","ev":["Wegen Bauarbeiten an der Brücke über den Mühlgang wird die Buslinie 58 von Montag, 3. März, bis Freitag, 14. März, umgeleitet","Die Haltestellen Brückengasse und Mühlweg entfallen."]},{"lv":3,"q":"Ein Fahrgast muss am Mittwoch, dem 5. März, spätestens um 8.20 Uhr beim Krankenhaus sein. Welche ist die späteste Abfahrt am Hauptbahnhof, mit der er das noch schafft?","c":"Um 7.45 Uhr","w":["Um 7.30 Uhr","Um 8.00 Uhr","Um 8.15 Uhr"],"e":"Der 5. März liegt im Umleitungszeitraum, die Fahrt dauert 23 Minuten. Abfahrt 7.45 Uhr bedeutet Ankunft 8.08 Uhr, rechtzeitig. Abfahrt 8.00 Uhr ergäbe 8.23 Uhr, 8.15 Uhr ergäbe 8.38 Uhr, beides zu spät. 7.30 Uhr wäre zwar rechtzeitig, aber nicht die späteste Möglichkeit.","tag":"Rechnen","ev":["von 18 auf 23 Minuten","Von Montag bis Freitag fährt der Bus alle 15 Minuten, also zum Beispiel um 7.00, 7.15, 7.30 und 7.45 Uhr"]}]},{"cat":"tv","id":"tv110","title":"Bewegung im Büroalltag","text":"Viele Menschen sitzen im Beruf den größten Teil des Tages. Eine Umfrage unter 500 Büroangestellten ergab, dass sie im Durchschnitt acht Stunden täglich am Schreibtisch verbringen. Gesundheitsexperten empfehlen deshalb, das Sitzen regelmäßig zu unterbrechen. Befürworter von Bewegungspausen weisen darauf hin, dass schon fünf Minuten Gehen pro Stunde den Rücken entlasten und die Konzentration verbessern können. Kritiker entgegnen, dass häufige Pausen den Arbeitsfluss stören und manche Aufgaben ungestörte Arbeitszeit erfordern. In der Umfrage gaben 60 Prozent der Befragten an, nach einer Bewegungspause konzentrierter zu arbeiten; 40 Prozent bemerkten keinen Unterschied. Ein Mittelweg besteht darin, Bewegung mit ohnehin nötigen Wegen zu verbinden: Wer Telefonate im Stehen führt, das Mittagessen zu Fuß holt oder Kollegen im Nebenzimmer persönlich aufsucht, statt ihnen eine Nachricht zu schreiben, bewegt sich, ohne dass die Arbeit leidet.","qs":[{"lv":1,"q":"Wie viele Stunden täglich verbringen die befragten Büroangestellten im Durchschnitt am Schreibtisch?","c":"8 Stunden","w":["5 Stunden","6 Stunden","12 Stunden"],"e":"Im Text steht, dass die Befragten im Durchschnitt acht Stunden täglich am Schreibtisch verbringen.","tag":"Detail","ev":["im Durchschnitt acht Stunden täglich am Schreibtisch verbringen"]},{"lv":2,"q":"Wie viele der 500 Befragten gaben an, nach einer Bewegungspause konzentrierter zu arbeiten?","c":"300","w":["200","250","60"],"e":"60 Prozent von 500 sind 300 Personen. 200 Personen (40 Prozent) bemerkten keinen Unterschied.","tag":"Rechnen","ev":["Eine Umfrage unter 500 Büroangestellten","In der Umfrage gaben 60 Prozent der Befragten an, nach einer Bewegungspause konzentrierter zu arbeiten"]},{"lv":2,"q":"Was ist die Kernaussage des Textes?","c":"Bewegung im Arbeitsalltag ist sinnvoll und lässt sich ohne große Störung der Arbeit einbauen.","w":["Langes Sitzen im Büro ist unvermeidlich und muss einfach hingenommen werden.","Bewegungspausen schaden dem Arbeitsfluss und sollten deshalb unterbleiben.","Büroangestellte sollten möglichst den ganzen Arbeitstag im Stehen verbringen."],"e":"Der Text stellt Für und Wider von Bewegungspausen dar und endet mit einem Mittelweg: Bewegung mit ohnehin nötigen Wegen verbinden, ohne dass die Arbeit leidet. Der Einwand der Kritiker ist nur eine Seite der Erörterung.","tag":"Hauptgedanke","ev":["Gesundheitsexperten empfehlen deshalb, das Sitzen regelmäßig zu unterbrechen","bewegt sich, ohne dass die Arbeit leidet"]},{"lv":3,"q":"Welches Verhalten entspricht dem im Text beschriebenen Mittelweg am besten?","c":"Telefonate im Stehen führen und zum Kollegen im Nebenzimmer gehen, statt ihm eine Nachricht zu schreiben","w":["Jede Stunde eine längere Pause einlegen und dafür abends länger arbeiten","Die gesamte Arbeit am Schreibtisch durch Arbeit im Stehen ersetzen","Auf Bewegungspausen verzichten, um ungestört arbeiten zu können"],"e":"Der Mittelweg verbindet Bewegung mit ohnehin nötigen Wegen und Tätigkeiten. Längere Zusatzpausen, ein vollständiger Wechsel zum Stehen und der Verzicht auf Bewegung kommen im Mittelweg nicht vor; der Verzicht entspricht dem Standpunkt der Kritiker.","tag":"Schlussfolgerung","ev":["Wer Telefonate im Stehen führt, das Mittagessen zu Fuß holt oder Kollegen im Nebenzimmer persönlich aufsucht, statt ihnen eine Nachricht zu schreiben"]}]},{"cat":"tv","id":"tv111","title":"Bilanz der Altstoffsammlung in Pichlbach","text":"Die Gemeinde Pichlbach hat die Bilanz ihrer Altstoffsammlung für das vergangene Jahr vorgestellt. Die 2.400 Einwohner brachten insgesamt 180 Tonnen Altstoffe zu den Sammelstellen. Den größten Anteil machte Altpapier mit 96 Tonnen aus, gefolgt von Altglas mit 48 Tonnen und Kunststoffverpackungen mit 30 Tonnen. Metall kam auf 6 Tonnen. Im Vorjahr waren es nur 160 Tonnen gewesen. Umweltgemeinderat Peter Moser führt die Steigerung vor allem auf die neuen, größeren Behälter beim Gemeindeamt und auf die Informationsbriefe an alle Haushalte zurück. Er betonte, dass sauber getrennter Müll leichter wiederverwertet werden kann. Falsch eingeworfene Gegenstände, etwa Keramik im Altglas, stören das Recycling und verursachen zusätzliche Kosten. Im kommenden Jahr soll eine vierte Sammelstelle beim Sportplatz errichtet werden, damit die Wege für die Bewohner kürzer werden.","qs":[{"lv":1,"q":"Welcher Stoff wurde in Pichlbach im vergangenen Jahr am meisten gesammelt?","c":"Altpapier","w":["Altglas","Kunststoffverpackungen","Metall"],"e":"Altpapier lag mit 96 Tonnen klar vor Altglas (48 Tonnen), Kunststoffverpackungen (30 Tonnen) und Metall (6 Tonnen).","tag":"Detail","ev":["Den größten Anteil machte Altpapier mit 96 Tonnen aus"]},{"lv":2,"q":"Welche der folgenden Angaben ist dem Bericht NICHT zu entnehmen?","c":"Wie viel die Gemeinde für die neuen Behälter bezahlt hat","w":["Wie viele Tonnen Altglas gesammelt wurden","Wo die neue Sammelstelle errichtet werden soll","Wie viele Einwohner die Gemeinde hat"],"e":"Die Kosten der Behälter werden nicht genannt. Im Text stehen dagegen 48 Tonnen Altglas, der Sportplatz als Standort der neuen Sammelstelle und 2.400 Einwohner.","tag":"Aussage nicht im Text","ev":[]},{"lv":3,"q":"Wie viele Kilogramm Altstoffe brachte im Durchschnitt jeder Einwohner zu den Sammelstellen?","c":"75 Kilogramm","w":["7,5 Kilogramm","40 Kilogramm","67 Kilogramm"],"e":"180 Tonnen sind 180.000 Kilogramm. 180.000 : 2.400 = 75. (40 Kilogramm ergäben sich nur für das Altpapier, 67 Kilogramm mit der Vorjahresmenge.)","tag":"Rechnen","ev":["Die 2.400 Einwohner brachten insgesamt 180 Tonnen Altstoffe zu den Sammelstellen."]},{"lv":3,"q":"Welche Aussage über die gesammelten Mengen trifft zu?","c":"Altpapier machte mehr als die Hälfte der gesammelten Menge aus.","w":["Altglas und Kunststoffverpackungen zusammen machten mehr als die Hälfte aus.","Metall machte mehr als ein Zehntel der gesammelten Menge aus.","Kunststoffverpackungen machten ein Drittel der gesammelten Menge aus."],"e":"Die Hälfte von 180 Tonnen sind 90 Tonnen, Altpapier hatte 96. Altglas und Kunststoff zusammen: 78 Tonnen, also weniger als die Hälfte. Ein Zehntel wären 18 Tonnen, Metall hatte nur 6. Ein Drittel wären 60 Tonnen, Kunststoff hatte nur 30.","tag":"Schlussfolgerung","ev":["brachten insgesamt 180 Tonnen Altstoffe","Den größten Anteil machte Altpapier mit 96 Tonnen aus"]}]},{"cat":"tv","id":"tv112","title":"Vermisste Wanderin unverletzt gefunden","text":"Eine Wanderin aus Graz meldete sich am Samstag um 9.00 Uhr bei ihrer Schwester ab, bevor sie zu einer Tageswanderung im steirischen Bergland aufbrach. Sie wollte um 15.00 Uhr zurück sein. Als sie am Abend noch nicht zu Hause war und ihr Mobiltelefon nicht erreichbar war, verständigte die Schwester um 18.15 Uhr die Polizei.\nSechs Bergretter und zwei Polizeibeamte rückten um 18.45 Uhr aus. Um 20.30 Uhr fanden sie die Frau unverletzt auf einem Forstweg. Sie hatte sich an einer Weggabelung für den falschen Weg entschieden, und der Akku ihres Mobiltelefons war leer. Die Einsatzkräfte versorgten die Frau mit einer Decke und warmem Tee und brachten sie ins Tal. Sie raten allen Wanderern, vor dem Aufbruch jemanden über Route und Rückkehrzeit zu informieren und das Mobiltelefon voll aufgeladen mitzunehmen.","qs":[{"lv":1,"q":"Um wie viel Uhr wollte die Wanderin ursprünglich zurück sein?","c":"Um 15.00 Uhr","w":["Um 9.00 Uhr","Um 18.15 Uhr","Um 20.30 Uhr"],"e":"Im Text steht: „Sie wollte um 15.00 Uhr zurück sein.“ 9.00 Uhr war der Aufbruch, 18.15 Uhr die Verständigung der Polizei, 20.30 Uhr der Zeitpunkt des Auffindens.","tag":"Detail","ev":["Sie wollte um 15.00 Uhr zurück sein."]},{"lv":2,"q":"Wodurch geriet die Wanderin laut Bericht in Schwierigkeiten?","c":"Sie nahm an einer Weggabelung den falschen Weg, und der Akku ihres Mobiltelefons war leer.","w":["Sie stürzte auf dem Forstweg, und der Akku ihres Mobiltelefons war leer.","Sie nahm an einer Weggabelung den falschen Weg, und ihr Mobiltelefon hatte keinen Empfang.","Sie brach erst am Nachmittag auf, und der Akku ihres Mobiltelefons war leer."],"e":"Laut Bericht entschied sie sich an einer Weggabelung für den falschen Weg, und ihr Akku war leer. Sie war unverletzt (kein Sturz), brach um 9.00 Uhr auf (nicht am Nachmittag), und nicht fehlender Empfang, sondern der leere Akku wird genannt.","tag":"Detail","ev":["Sie hatte sich an einer Weggabelung für den falschen Weg entschieden, und der Akku ihres Mobiltelefons war leer."]},{"lv":1,"q":"Welche Aussage steht NICHT im Text?","c":"Die Wanderin musste mit einem Hubschrauber geborgen werden.","w":["Die Wanderin wurde unverletzt gefunden.","Die Schwester der Wanderin verständigte die Polizei.","Die Einsatzkräfte raten, vor einer Wanderung die Route mitzuteilen."],"e":"Von einem Hubschrauber ist im Text nirgends die Rede; die Frau wurde von den Einsatzkräften ins Tal gebracht. Die anderen Aussagen stehen im Text.","tag":"Aussage nicht im Text","ev":[]},{"lv":3,"q":"Wie viel Zeit lag zwischen der geplanten Rückkehr der Wanderin und ihrem Auffinden?","c":"5 Stunden 30 Minuten","w":["2 Stunden 15 Minuten","1 Stunde 45 Minuten","11 Stunden 30 Minuten"],"e":"Geplant war die Rückkehr um 15.00 Uhr, gefunden wurde die Frau um 20.30 Uhr: 5 Stunden 30 Minuten. 2 Stunden 15 Minuten liegen zwischen Verständigung der Polizei und Auffinden, 1 Stunde 45 Minuten zwischen Ausrücken und Auffinden, 11 Stunden 30 Minuten zwischen Aufbruch und Auffinden.","tag":"Rechnen","ev":["Sie wollte um 15.00 Uhr zurück sein.","Um 20.30 Uhr fanden sie die Frau unverletzt auf einem Forstweg."]}]},{"cat":"tv","id":"tv113","title":"Die alte Brücke von Steinbach","text":"Die alte Brücke von Steinbach steht heute unter Denkmalschutz und gilt als beliebtes Ausflugsziel. Seit 1975 dürfen nur noch Fußgänger und Radfahrer sie benützen, weil flussabwärts eine neue Straßenbrücke aus Beton gebaut wurde. Davor hatte eine Konstruktion aus Eisen den Straßenverkehr 82 Jahre lang getragen. Sie hatte die morschen Holzbalken der ursprünglichen Brücke ersetzt. Diese war als Holzbrücke im Jahr 1784 errichtet worden und hatte eine Furt abgelöst, durch die Fuhrwerke bis dahin den Fluss queren mussten; bei Hochwasser war das oft tagelang unmöglich. Im Jahr 1829 beschädigte ein Hochwasser die Holzbrücke schwer, danach wurde sie wieder aufgebaut. Der Verein „Freunde der alten Brücke“ bietet jeden ersten Sonntag im Monat eine kostenlose Führung an.","qs":[{"lv":1,"q":"In welchem Jahr wurde die erste Brücke von Steinbach errichtet?","c":"1784","w":["1829","1893","1975"],"e":"Die ursprüngliche Holzbrücke wurde laut Text im Jahr 1784 errichtet. 1829 gab es das Hochwasser, 1975 endete der Straßenverkehr.","tag":"Detail","ev":["Diese war als Holzbrücke im Jahr 1784 errichtet worden"]},{"lv":2,"q":"Welche Aussage steht im Text?","c":"Der Verein bietet jeden ersten Sonntag im Monat eine kostenlose Führung an.","w":["Die Holzbrücke wurde 1829 bei einem Hochwasser zerstört und nie wieder aufgebaut.","Die neue Straßenbrücke aus Beton steht flussaufwärts von der alten Brücke.","Die Eisenkonstruktion trug den Straßenverkehr hundert Jahre lang."],"e":"Die Führung am ersten Sonntag im Monat steht im Text. Die anderen Aussagen widersprechen ihm: Die Brücke wurde nach 1829 wieder aufgebaut, die neue Brücke steht flussabwärts, die Eisenkonstruktion trug den Verkehr 82 Jahre.","tag":"Aussage im Text","ev":["bietet jeden ersten Sonntag im Monat eine kostenlose Führung an"]},{"lv":3,"q":"In welchem Jahr begann die Eisenkonstruktion, den Straßenverkehr zu tragen?","c":"1893","w":["1866","1911","1975"],"e":"Der Straßenverkehr endete 1975, nachdem die Eisenkonstruktion ihn 82 Jahre lang getragen hatte: 1975 − 82 = 1893. (1784 + 82 = 1866 und 1829 + 82 = 1911 wären Rechenfehler.)","tag":"Rechnen","ev":["Seit 1975 dürfen nur noch Fußgänger und Radfahrer sie benützen","Davor hatte eine Konstruktion aus Eisen den Straßenverkehr 82 Jahre lang getragen"]},{"lv":3,"q":"Welche Reihenfolge der Ereignisse entspricht dem Text?","c":"Holzbrücke errichtet – Hochwasserschaden – Eisenkonstruktion trägt den Verkehr – Straßenverkehr beendet","w":["Holzbrücke errichtet – Eisenkonstruktion trägt den Verkehr – Hochwasserschaden – Straßenverkehr beendet","Hochwasserschaden – Holzbrücke errichtet – Eisenkonstruktion trägt den Verkehr – Straßenverkehr beendet","Holzbrücke errichtet – Hochwasserschaden – Straßenverkehr beendet – Eisenkonstruktion trägt den Verkehr"],"e":"Holzbrücke 1784, Hochwasserschaden 1829, Eisenkonstruktion trägt den Verkehr ab 1893 (1975 − 82), Ende des Straßenverkehrs 1975. Der Text erzählt die Geschichte rückwärts, die richtige zeitliche Reihenfolge ist daher umgekehrt.","tag":"Schlussfolgerung","ev":["Im Jahr 1829 beschädigte ein Hochwasser die Holzbrücke schwer","Davor hatte eine Konstruktion aus Eisen den Straßenverkehr 82 Jahre lang getragen"]}]},{"cat":"tv","id":"tv114","title":"Dienstplan der Polizeiinspektion Talhof","text":"Die Polizeiinspektion Talhof ist rund um die Uhr besetzt. Der Dienst ist in drei Schichten zu je acht Stunden eingeteilt: Der Frühdienst dauert von 6.00 bis 14.00 Uhr, der Spätdienst von 14.00 bis 22.00 Uhr und der Nachtdienst von 22.00 bis 6.00 Uhr. Im Frühdienst und im Spätdienst sind jeweils fünf Beamte eingeteilt, im Nachtdienst nur drei, weil nachts weniger Anrufe eingehen. Die Schichten wechseln wöchentlich: Wer in einer Woche Frühdienst hat, ist in der folgenden Woche im Spätdienst, danach im Nachtdienst und dann wieder im Frühdienst. Nach einer Woche Nachtdienst hat jeder Beamte zwei Tage dienstfrei. Besucher werden nur im Früh- und im Spätdienst empfangen; im Nachtdienst bleibt die Eingangstür geschlossen, und Bürger können sich nur telefonisch an die Inspektion wenden.","qs":[{"lv":1,"q":"Wie viele Beamte sind im Nachtdienst eingeteilt?","c":"3","w":["5","8","13"],"e":"Im Nachtdienst sind laut Text nur drei Beamte eingeteilt. Fünf sind es im Früh- und im Spätdienst.","tag":"Detail","ev":["im Nachtdienst nur drei"]},{"lv":2,"q":"Welche Aussage steht im Text?","c":"Im Nachtdienst können Besucher nicht in die Inspektion kommen.","w":["Die Schichten wechseln jeden Tag.","Im Nachtdienst arbeiten mehr Beamte als im Spätdienst.","Der Spätdienst endet um 20.00 Uhr."],"e":"Im Nachtdienst bleibt die Eingangstür geschlossen. Die anderen Aussagen widersprechen dem Text: Die Schichten wechseln wöchentlich, im Nachtdienst sind weniger Beamte als im Spätdienst eingeteilt, der Spätdienst endet um 22.00 Uhr.","tag":"Aussage im Text","ev":["im Nachtdienst bleibt die Eingangstür geschlossen"]},{"lv":2,"q":"Wie viele Beamte sind um 14.30 Uhr im Dienst?","c":"5","w":["8","10","13"],"e":"Um 14.30 Uhr ist der Frühdienst (bis 14.00 Uhr) schon beendet, es ist nur der Spätdienst mit fünf Beamten im Dienst.","tag":"Schlussfolgerung","ev":["der Spätdienst von 14.00 bis 22.00 Uhr","Im Frühdienst und im Spätdienst sind jeweils fünf Beamte eingeteilt"]},{"lv":3,"q":"Wie viele Arbeitsstunden werden an einem Tag insgesamt von allen eingeteilten Beamten geleistet?","c":"104","w":["24","80","96"],"e":"An einem Tag sind 5 + 5 + 3 = 13 Beamte eingeteilt, jeder arbeitet acht Stunden: 13 · 8 = 104 Stunden. 24 ist nur die Dauer eines Tages, 80 ergäbe sich mit 10, 96 mit 12 Beamten.","tag":"Rechnen","ev":["Der Dienst ist in drei Schichten zu je acht Stunden eingeteilt","Im Frühdienst und im Spätdienst sind jeweils fünf Beamte eingeteilt, im Nachtdienst nur drei"]}]},{"cat":"tv","id":"tv201","title":"Der Auwald an der Lindach","text":"Der Auwald an der Lindach, einem kleinen Fluss im Voralpenland, zählt zu den artenreichsten Lebensräumen der Region. Bei Hochwasser wird er regelmäßig überflutet, und genau das macht ihn so wertvoll: Das Wasser bringt Nährstoffe mit und hält den Boden feucht. Weiden und Erlen, die nasse Füße vertragen, wachsen hier besonders gut. Eichen und Buchen kommen mit dauerhafter Nässe dagegen schlecht zurecht und stehen deshalb auf den höher gelegenen Flächen.\nSeit der Fluss vor rund sechzig Jahren begradigt wurde, tritt er seltener über die Ufer. Die Folge: Der Grundwasserspiegel sank, und mehrere Pflanzenarten verschwanden. Eine Naturschutzgruppe will nun auf einer Länge von 1,2 Kilometern wieder Flussschlingen anlegen. Die Kosten von 480.000 Euro übernehmen zu zwei Dritteln das Land und zu einem Drittel die Gemeinde. Ob sich die Tierwelt tatsächlich erholt, wird man frühestens in einigen Jahren beurteilen können.","qs":[{"lv":1,"q":"Wodurch nützen die regelmäßigen Überflutungen dem Auwald laut Text?","c":"Das Wasser bringt Nährstoffe und hält den Boden feucht.","w":["Das Wasser trägt abgestorbene Pflanzen aus dem Wald hinaus.","Das Wasser senkt den Grundwasserspiegel im Auwald.","Das Wasser lockt seltene Zugvögel in die Region."],"e":"Im ersten Absatz steht, dass das Wasser Nährstoffe mitbringt und den Boden feucht hält. Ein gesunkener Grundwasserspiegel ist laut Text gerade die Folge seltenerer Überflutungen.","tag":"Detail","ev":["Das Wasser bringt Nährstoffe mit und hält den Boden feucht."]},{"lv":2,"q":"Wie viel Euro der Kosten übernimmt die Gemeinde?","c":"160.000 Euro","w":["120.000 Euro","240.000 Euro","320.000 Euro"],"e":"Die Gemeinde trägt ein Drittel von 480.000 Euro, das sind 160.000 Euro. Die 320.000 Euro (zwei Drittel) zahlt das Land.","tag":"Rechnen","ev":["Die Kosten von 480.000 Euro übernehmen zu zwei Dritteln das Land und zu einem Drittel die Gemeinde"]},{"lv":3,"q":"Welche Schlussfolgerung lässt sich aus dem ersten Absatz ziehen?","c":"Auf den höher gelegenen Flächen ist es weniger nass als dort, wo Weiden und Erlen stehen.","w":["Eichen und Buchen würden von häufigeren Überflutungen des Auwalds am meisten profitieren.","Weiden und Erlen wachsen nur dort gut, wo kein Hochwasser hinkommt, und meiden nasse Flächen.","Der Auwald ist nur deshalb so artenreich, weil dort Eichen und Buchen stehen."],"e":"Eichen und Buchen vertragen dauerhafte Nässe schlecht und stehen deshalb höher. Folglich muss es dort weniger nass sein als im Bereich der Weiden und Erlen, die Nässe gut vertragen.","tag":"Schlussfolgerung","ev":["Weiden und Erlen, die nasse Füße vertragen, wachsen hier besonders gut","Eichen und Buchen kommen mit dauerhafter Nässe dagegen schlecht zurecht und stehen deshalb auf den höher gelegenen Flächen"]},{"lv":3,"q":"Welche Aussage ist mit dem Text nicht vereinbar?","c":"Eichen und Buchen vertragen dauerhafte Nässe besser als Weiden und Erlen.","w":["Das Land trägt doppelt so viel der Kosten wie die Gemeinde.","Die Begradigung des Flusses liegt etwa sechs Jahrzehnte zurück.","Ob sich die Tierwelt erholt, lässt sich nicht sofort beurteilen."],"e":"Laut Text vertragen Weiden und Erlen Nässe gut, Eichen und Buchen dagegen schlecht. Die übrigen Aussagen stimmen: zwei Drittel sind doppelt so viel wie ein Drittel, sechzig Jahre sind sechs Jahrzehnte, und die Wirkung auf die Tierwelt zeigt sich frühestens in einigen Jahren.","tag":"Aussage prüfen","ev":["Eichen und Buchen kommen mit dauerhafter Nässe dagegen schlecht zurecht"]}]},{"cat":"tv","id":"tv202","title":"Der Akku am Elektrofahrrad","text":"Akkus für Elektrofahrräder verlieren mit der Zeit an Kapazität. Das liegt weniger am Alter als an der Zahl der Ladezyklen. Ein Zyklus ist erreicht, wenn insgesamt so viel Energie nachgeladen wurde, wie der Akku fassen kann. Wer den Akku zweimal von 50 auf 100 Prozent lädt, hat also genau einen Zyklus verbraucht. Hersteller geben meist an, dass nach 800 Zyklen noch etwa 70 Prozent der ursprünglichen Kapazität zur Verfügung stehen.\nAuch Temperaturen spielen eine Rolle. Bei Frost sinkt die Reichweite nur vorübergehend, bei dauerhaft hoher Hitze kann die Zelle dagegen bleibend geschädigt werden. Für längere Fahrpausen empfehlen Fachleute einen Ladestand von etwa 60 Prozent und einen kühlen, trockenen Lagerort. Liegt ein Akku monatelang vollständig leer, kann er sich so weit entladen, dass er sich nicht mehr aufladen lässt.","qs":[{"lv":1,"q":"Worum geht es in dem Text hauptsächlich?","c":"Darum, wodurch ein Fahrrad-Akku an Leistung verliert und wie man ihn schont.","w":["Darum, welche Hersteller die haltbarsten Akkus für Fahrräder bauen.","Darum, wie man einen defekten Fahrrad-Akku selbst reparieren kann.","Darum, welche Ladegeräte für Elektrofahrräder in Österreich zugelassen sind."],"e":"Der Text erklärt, was einen Akku an Kapazität verlieren lässt (Ladezyklen, Hitze, Leerstand) und wie man ihn bei Pausen am besten lagert. Von Herstellervergleichen, Reparaturen oder Ladegeräten ist nicht die Rede.","tag":"Hauptgedanke","ev":["Akkus für Elektrofahrräder verlieren mit der Zeit an Kapazität","Für längere Fahrpausen empfehlen Fachleute einen Ladestand von etwa 60 Prozent"]},{"lv":2,"q":"Ein Akku wird jedes Mal von 25 auf 100 Prozent geladen. Nach wie vielen solchen Ladungen hat er insgesamt drei Zyklen verbraucht?","c":"Nach vier Ladungen","w":["Nach drei Ladungen","Nach fünf Ladungen","Nach sechs Ladungen"],"e":"Jede Ladung bringt 75 Prozent der Akkukapazität. Ein Zyklus entspricht 100 Prozent, drei Zyklen also 300 Prozent. 300 : 75 = 4 Ladungen.","tag":"Rechnen","ev":["Ein Zyklus ist erreicht, wenn insgesamt so viel Energie nachgeladen wurde, wie der Akku fassen kann."]},{"lv":3,"q":"Zwei Fahrrad-Akkus sind gleich alt. Der eine wurde fast täglich geladen, der andere nur selten. Was ist nach dem Text am wahrscheinlichsten?","c":"Der selten geladene Akku hat vermutlich noch mehr von seiner ursprünglichen Kapazität.","w":["Der täglich geladene Akku hat vermutlich noch mehr von seiner ursprünglichen Kapazität.","Beide Akkus haben vermutlich gleich viel Kapazität verloren, weil sie gleich alt sind.","Die Kapazität hängt allein von der Temperatur ab, die Ladehäufigkeit spielt keine Rolle."],"e":"Der Kapazitätsverlust liegt laut Text weniger am Alter als an der Zahl der Ladezyklen. Der selten geladene Akku hat weniger Zyklen hinter sich und ist daher vermutlich weniger abgenutzt.","tag":"Schlussfolgerung","ev":["Das liegt weniger am Alter als an der Zahl der Ladezyklen."]},{"lv":3,"q":"Welche Angabe stimmt nicht mit dem Text überein?","c":"Kälte schädigt die Zellen eines Akkus bleibend, Hitze wirkt nur vorübergehend.","w":["Zwei Ladungen von je 50 auf 100 Prozent zählen zusammen als ein Zyklus.","Für längere Fahrpausen gilt ein Ladestand von etwa 60 Prozent als günstig.","Ein monatelang vollständig leerer Akku lässt sich unter Umständen nicht mehr laden."],"e":"Im Text ist es umgekehrt: Bei Frost sinkt die Reichweite nur vorübergehend, dauerhaft hohe Hitze kann die Zelle bleibend schädigen. Die anderen drei Angaben stehen so im Text.","tag":"Aussage prüfen","ev":["Bei Frost sinkt die Reichweite nur vorübergehend, bei dauerhaft hoher Hitze kann die Zelle dagegen bleibend geschädigt werden"]}]},{"cat":"tv","id":"tv203","title":"Hallbrunn und die Furt","text":"Die Stadt Hallbrunn entstand im Mittelalter an einer Furt, an der Händler mit ihren Fuhrwerken den Fluss überquerten. Zunächst lebten dort nur wenige Fischer und Bauern. Als der Landesherr dem Ort das Recht verlieh, einen Wochenmarkt abzuhalten, strömten Kaufleute aus der ganzen Umgebung herbei. Mit dem Markt kamen Handwerker, die ihre Waren direkt am Platz verkauften: Schmiede, Gerber und Weber. Zum Schutz vor Überfällen errichteten die Bürger eine Stadtmauer, für deren Bau jede Familie eine Abgabe zahlen musste.\nIm Lauf der Jahrhunderte verlor die Furt an Bedeutung, denn eine Steinbrücke, die weiter flussaufwärts gebaut wurde, ersetzte sie als Übergang. Der Handel verlagerte sich dorthin, und Hallbrunn schrumpfte. Heute erinnern nur noch Teile der Mauer und der Name Gerbergasse an die einstige Blüte.","qs":[{"lv":1,"q":"Wodurch kamen laut Text Kaufleute aus der ganzen Umgebung nach Hallbrunn?","c":"Der Landesherr verlieh dem Ort das Recht auf einen Wochenmarkt.","w":["Der Landesherr schenkte dem Ort eine Steinbrücke über den Fluss.","Die Bürger vollendeten den Bau der Stadtmauer rund um den Ort.","Die Fischer boten ihren Fang zu besonders niedrigen Preisen an."],"e":"Der Text sagt: Als der Landesherr dem Ort das Recht auf einen Wochenmarkt verlieh, strömten Kaufleute aus der Umgebung herbei. Die Steinbrücke entstand erst viel später und weiter flussaufwärts.","tag":"Detail","ev":["Als der Landesherr dem Ort das Recht verlieh, einen Wochenmarkt abzuhalten, strömten Kaufleute aus der ganzen Umgebung herbei."]},{"lv":2,"q":"Was bedeutet das Wort „Furt“ im Zusammenhang des Textes?","c":"Eine Stelle im Fluss, an der man ihn mit Fuhrwerken überqueren kann.","w":["Ein Hafen am Fluss, in dem Lastschiffe be- und entladen werden.","Ein befestigter Turm, der das Flussufer vor Überfällen bewacht.","Ein Platz am Ufer, auf dem schon früh Märkte abgehalten wurden."],"e":"Händler überquerten an der Furt mit ihren Fuhrwerken den Fluss, und später ersetzte eine Brücke die Furt als Übergang. Eine Furt ist also eine Flussüberquerung.","tag":"Wortbedeutung","ev":["an einer Furt, an der Händler mit ihren Fuhrwerken den Fluss überquerten"]},{"lv":3,"q":"Welche Schlussfolgerung lässt sich aus dem Text ziehen?","c":"Hallbrunns Wohlstand hing wesentlich davon ab, dass der Flussübergang dort lag.","w":["Der Bau der Stadtmauer war der Hauptgrund für den Niedergang der Stadt.","Die Handwerker verließen Hallbrunn, weil sie die Abgabe für die Mauer nicht zahlen wollten.","Die Steinbrücke wurde auf Befehl des Landesherrn mitten in Hallbrunn errichtet."],"e":"Die Stadt entstand an der Furt. Als der Übergang weiter flussaufwärts verlegt wurde, wanderte der Handel ab und Hallbrunn schrumpfte. Für die anderen Aussagen enthält der Text keine Grundlage, die Brücke stand sogar weiter flussaufwärts.","tag":"Schlussfolgerung","ev":["Die Stadt Hallbrunn entstand im Mittelalter an einer Furt","Der Handel verlagerte sich dorthin, und Hallbrunn schrumpfte."]},{"lv":2,"q":"Welche der folgenden Aussagen lässt sich dem Text nicht entnehmen?","c":"Die Weber der Stadt belieferten auch Kaufleute aus Nachbarländern.","w":["Jede Familie musste zum Bau der Stadtmauer eine Abgabe leisten.","Hallbrunn verlor an Bedeutung, nachdem weiter flussaufwärts eine Brücke gebaut worden war.","Zu den Handwerkern am Platz gehörten auch die Gerber."],"e":"Von einer Belieferung auswärtiger Kaufleute durch die Weber steht nichts im Text. Die drei anderen Aussagen finden sich dort ausdrücklich.","tag":"Aussage prüfen","ev":[]}]},{"cat":"tv","id":"tv204","title":"Der Dorfladen als Genossenschaft","text":"Der Dorfladen in Mittersee wird seit drei Jahren als Genossenschaft geführt. Das bedeutet: Die Einwohner können Anteile zu je 100 Euro erwerben und sind damit Miteigentümer. Unabhängig von der Zahl ihrer Anteile hat jedes Mitglied bei Abstimmungen nur eine Stimme. Gewinne werden nicht ausgeschüttet, sondern in den Laden investiert, etwa in neue Kühlregale.\nDie Genossenschaft zählt derzeit 240 Mitglieder, die zusammen 36.000 Euro an Anteilen eingezahlt haben. Der Laden beschäftigt zwei Angestellte in Teilzeit; sein Sortiment besteht zu rund 40 Prozent aus Waren von Höfen der Umgebung. Der Vorstand hält das für wichtig, weil dadurch Geld in der Region bleibt. Kritiker wenden ein, dass die Preise im Laden höher seien als im Supermarkt am Ortsrand. Der Vorstand räumt das ein, verweist aber darauf, dass der Laden auch Menschen ohne Auto versorgt.","qs":[{"lv":1,"q":"Wie viele Stimmen hat ein Mitglie
